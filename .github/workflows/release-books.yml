name: Publish versioned books
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin fonts-noto-cjk fonts-noto-core texlive-xetex texlive-lang-chinese texlive-latex-extra epubcheck poppler-utils qpdf
      - name: Determine changed files for evaluation coverage
        shell: bash
        run: |
          changed_file_list="$RUNNER_TEMP/changed-files.txt"
          HEAD_SHA="$(git rev-parse HEAD)"
          base_sha=""
          previous_tag="$(git describe --tags --abbrev=0 "$HEAD_SHA^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            base_sha="$(git rev-list -n 1 "$previous_tag")"
          fi
          merge_base=""
          if [ -n "$base_sha" ]; then
            merge_base="$(git merge-base "$base_sha" "$HEAD_SHA" 2>/dev/null || true)"
            if [ -z "$merge_base" ]; then
              merge_base="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
            fi
          else
            merge_base="$(git hash-object -t tree /dev/null)"
          fi
          if [ -n "$merge_base" ]; then
            git diff --name-only "$merge_base" "$HEAD_SHA" > "$changed_file_list"
          else
            : > "$changed_file_list"
          fi
      - name: Require evaluation coverage for changed high-risk chapters
        shell: bash
        run: |
          args=()
          while IFS= read -r file; do
            [ -n "$file" ] && args+=(--changed-file "$file")
          done < "$RUNNER_TEMP/changed-files.txt"
          python3 tools/book-kit/validate_eval_coverage.py "${args[@]}"
      - name: Build and validate both editions
        env:
          PDF_MAINFONT: Noto Serif CJK SC
          PDF_CJK_MAINFONT: Noto Serif CJK SC
          PDF_MONOFONT: Noto Sans Mono
        run: |
          python3 tools/book-kit/check_translations.py
          python3 -m unittest discover -s tests -v
          python3 tools/book-kit/validate_book.py --check-learning-index
          python3 tools/book-kit/validate_evals.py
          python3 tools/book-kit/validate_figures.py
          for locale in zh-Hans en; do
            python3 tools/book-kit/validate_book.py --locale "$locale" --check-links
            python3 tools/book-kit/build_print_html.py --locale "$locale"
            python3 tools/book-kit/export_markdown.py --locale "$locale"
            python3 tools/book-kit/export_epub.py --locale "$locale"
            python3 tools/book-kit/audit_epub_accessibility.py --locale "$locale" --epub "book/exported/$locale/Understanding-LLMs.epub" --output "$RUNNER_TEMP/epub-accessibility-$locale.json"
            python3 tools/book-kit/export_book_pdf.py --locale "$locale"
            epubcheck "book/exported/$locale/Understanding-LLMs.epub" > "$RUNNER_TEMP/epubcheck-$locale.txt" 2>&1
            pdffonts "book/exported/$locale/Understanding-LLMs.pdf"
            python3 tools/book-kit/validate_publication_artifacts.py --locale "$locale" --formats markdown,html,epub,pdf
          done
          python3 tools/book-kit/package_release.py --version "$GITHUB_REF_NAME"
          test -f release/release-provenance.json
          python3 tools/book-kit/validate_release_provenance.py --release release --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-formula-audits
          path: book/_build/evaluations/*/pdf-formula-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epubcheck-reports
          path: ${{ runner.temp }}/epubcheck-*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epub-accessibility-reports
          path: ${{ runner.temp }}/epub-accessibility-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-books
          path: release/
  publish:
    if: github.repository == 'kingson4wu/Understanding-LLMs'
    needs: books
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: versioned-books
          path: release
      - name: Create or update the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/book-kit/release_notes.py --tag "$RELEASE_TAG" --output release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
      - name: Verify downloaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir published-release
          python3 tools/book-kit/validate_release_provenance.py --release published-release --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
