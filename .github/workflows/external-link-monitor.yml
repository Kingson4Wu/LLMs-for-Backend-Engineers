name: Monitor external book links

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate advisory external link report
        run: python3 tools/book-kit/audit_external_links.py --output "$RUNNER_TEMP/external-link-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-link-report
          path: ${{ runner.temp }}/external-link-report.json
          if-no-files-found: warn
