name: Monitor provenance sources

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate advisory provenance monitor report
        run: python3 tools/book-kit/monitor_provenance.py --output "$RUNNER_TEMP/provenance-monitor-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-monitor-report
          path: ${{ runner.temp }}/provenance-monitor-report.json
          if-no-files-found: warn
