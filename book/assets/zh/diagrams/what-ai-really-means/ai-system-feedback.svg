<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc"><title id="title">AI 系统从输入与目标到环境反馈的基本链路</title><desc id="desc">输入和目标经模型或规则形成输出，输出进入环境并产生反馈；反馈会影响之后的输入、目标或系统更新。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="620" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">AI 系统是目标与环境反馈中的一个组件</text><text x="60" y="105" font-size="19" fill="#5E7F9C">模型本身并不独立完成价值判断；它的输出进入环境，环境反馈再塑造系统的后续行为。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="55" y="240" width="210" height="88" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="340" y="240" width="210" height="88" rx="23"/></g><g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="625" y="225" width="260" height="118" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="960" y="240" width="200" height="88" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M265 284H330"/><path d="M550 284H615"/><path d="M885 284H950"/></g><path d="M1060 328V433C1060 468 999 483 940 483H205C135 483 116 440 128 368C132 346 147 337 165 331" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a)" data-figure-connector="true"/><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="23" font-weight="700"><text x="160" y="294" fill="#0F4D92">输入与目标</text><text x="445" y="294" fill="#765800">模型或规则</text><text x="755" y="270" fill="#0F4D92">预测、内容、推荐</text><text x="755" y="300" fill="#0F4D92">或行动</text><text x="1060" y="294" fill="#B64342">环境与反馈</text></g><text x="620" y="538" font-size="20" font-weight="700" fill="#765800">反馈影响后续输入、目标与系统改进</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="560.3" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="703.4" height="49.7"/><rect data-figure-safe-zone="text" x="148.0" y="265.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="433.0" y="265.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="743.0" y="241.0" width="138.6" height="47.0"/><rect data-figure-safe-zone="text" x="743.0" y="271.0" width="72.4" height="47.0"/><rect data-figure-safe-zone="text" x="1048.0" y="265.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="608.0" y="506.0" width="319.4" height="51.0"/></g></svg>
