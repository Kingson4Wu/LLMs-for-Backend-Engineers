<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">从真实案例到回归套件</title><desc id="desc">真实案例经过轨迹归因，形成可度量的质量断言和可复用案例，加入回归套件；新的线上证据持续修正规则。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Eval 维护：把一次失败变成可重复运行的防线</text><text x="58" y="105" font-size="18" fill="#5E7F9C">只有将事故从故事提炼为可检查断言和案例，未来改动才能自动发现同类退化。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 275H305"/><path d="M505 275H565"/><path d="M765 275H825"/></g><g stroke-width="3"><rect x="55" y="190" width="190" height="170" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="305" y="190" width="200" height="170" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="565" y="190" width="200" height="170" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="825" y="190" width="250" height="170" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="150" y="242" font-size="22" font-weight="700" fill="#B64342">真实案例</text><text x="150" y="276" font-size="16" fill="#B64342">用户影响、环境状态</text><text x="150" y="302" font-size="16" fill="#B64342">与实际轨迹</text><text x="405" y="242" font-size="22" font-weight="700" fill="#765800">归因失败模式</text><text x="405" y="276" font-size="16" fill="#765800">根因在哪一层？</text><text x="405" y="302" font-size="16" fill="#765800">触发条件是什么？</text><text x="665" y="242" font-size="22" font-weight="700" fill="#17324D">提炼断言</text><text x="665" y="276" font-size="16" fill="#0F4D92">可观察的预期、</text><text x="665" y="302" font-size="16" fill="#0F4D92">证据和阈值</text><text x="950" y="242" font-size="22" font-weight="700" fill="#17324D">回归套件</text><text x="950" y="276" font-size="16" fill="#0F4D92">案例、grader、</text><text x="950" y="302" font-size="16" fill="#0F4D92">版本化基线与持续检查</text></g><path d="M950 360V425H150V370" fill="none" stroke="#FFD700" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="260" y="450" width="680" height="76" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="483" text-anchor="middle" font-size="20" font-weight="700" fill="#765800">新线上证据持续修正案例、质量规则与验收阈值</text><text x="600" y="512" text-anchor="middle" font-size="16" fill="#765800">回归套件不是静态真理，而是受审查、可演化的质量资产。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">好的案例保存问题的机制，而不只是保存一次偶然的答案文本。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="621.4" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="607.0" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="208.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="138.0" y="248.0" width="153.9" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="274.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="208.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="393.0" y="248.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="274.0" width="138.7" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="208.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="653.0" y="248.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="274.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="938.0" y="208.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="938.0" y="248.0" width="121.0" height="45.6"/><rect data-figure-safe-zone="text" x="938.0" y="274.0" width="176.0" height="45.6"/><rect data-figure-safe-zone="text" x="392.8" y="451.0" width="414.4" height="51.0"/><rect data-figure-safe-zone="text" x="400.7" y="484.0" width="398.6" height="45.6"/><rect data-figure-safe-zone="text" x="356.3" y="562.0" width="487.3" height="48.3"/></g></svg>
