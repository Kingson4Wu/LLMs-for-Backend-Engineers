<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">当前 AI 辅助研发与完整递归自我改进的边界</title>
  <desc id="desc">当前 AI 已经参与设计、代码、实验与评估，但人类仍控制训练和发布。完整递归自我改进尚未被证明实现，而且递归改进、自主部署和失去人类控制是三个不同概念。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#89a6bd"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">递归自我改进的边界</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">AI 已进入下一代 AI 的研发链条，但距离完整闭环仍有明显区别</text>

  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="150" width="460" height="278" rx="20" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/>
    <rect x="96" y="176" width="156" height="42" rx="21" fill="#e9f3ee"/>
    <text x="174" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a57">当前已发生</text>
    <text x="104" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#173f63">AI 辅助研发</text>
    <text x="104" y="310" font-size="21" fill="#173f63">AI 参与设计、代码、实验与评估</text>
    <text x="104" y="350" font-size="21" fill="#173f63">人类仍控制训练、验证与发布</text>
    <line x1="104" y1="380" x2="496" y2="380" stroke="#b7d4c5" stroke-width="1.5"/>
    <text x="104" y="407" font-size="18" fill="#6f7f8d">本质：AI 帮助人类制造下一代 AI</text>

    <rect x="670" y="150" width="460" height="278" rx="20" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="696" y="176" width="156" height="42" rx="21" fill="#f3e8e4"/>
    <text x="774" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3b2f">未来假设</text>
    <text x="704" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#9a3b2f">完整递归闭环</text>
    <text x="704" y="310" font-size="21" fill="#173f63">后继系统持续加速下一轮研发</text>
    <text x="704" y="350" font-size="21" fill="#173f63">只需很少的人类参与</text>
    <line x1="704" y1="380" x2="1096" y2="380" stroke="#dfc0ba" stroke-width="1.5"/>
    <text x="704" y="407" font-size="18" fill="#9a3b2f">目前尚未被证明已经实现</text>
  </g>
  <line x1="548" y1="289" x2="652" y2="289" stroke="#89a6bd" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="600" y="268" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#6f7f8d">尚未跨越</text>

  <text x="70" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#173f63">三个概念不能画等号</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="70" y="510" width="280" height="78" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/>
    <text x="210" y="558" font-size="23" font-weight="700" fill="#173f63">递归自我改进</text>
    <text x="400" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#9a3b2f">≠</text>
    <rect x="450" y="510" width="280" height="78" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/>
    <text x="590" y="558" font-size="23" font-weight="700" fill="#173f63">自主部署</text>
    <text x="780" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#9a3b2f">≠</text>
    <rect x="830" y="510" width="300" height="78" rx="14" fill="#fffdf8" stroke="#9a3b2f" stroke-width="1.5"/>
    <text x="980" y="558" font-size="23" font-weight="700" fill="#9a3b2f">失去人类控制</text>
  </g>
  <rect x="196" y="614" width="808" height="46" rx="23" fill="#eef2f4"/>
  <text x="600" y="644" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#173f63">即使递归改进实现，后两项仍取决于监督、行为倾向和部署环境</text>
</svg>
