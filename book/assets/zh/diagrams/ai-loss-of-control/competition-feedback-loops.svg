<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">能力、权限与竞争的反馈循环</title>
  <desc id="desc">上方循环表示能力提高、更多授权、完成更多任务、依赖增加与竞争压力相互强化；下方循环表示能力提高也可能增强发现不安全路径和突破边界的能力。局部合理决策可能累积成整体风险。</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1f7a57"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9a3b2f"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">局部合理，整体仍可能失控</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">效率与竞争会推动更多授权，没有参与者需要刻意追求失控</text>

  <rect x="58" y="136" width="1084" height="470" rx="22" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>

  <text x="90" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1f7a57">效率与依赖循环</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#173f63">
    <rect x="88" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="178" y="270">能力提高</text>
    <rect x="296" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="386" y="258">授予更多</text><text x="386" y="283">权限</text>
    <rect x="504" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="594" y="258">完成更多</text><text x="594" y="283">任务</text>
    <rect x="712" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="802" y="270">依赖增加</text>
    <rect x="920" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="1010" y="270">竞争压力</text>
  </g>
  <g fill="none" stroke="#1f7a57" stroke-width="2.5" marker-end="url(#arrow-green)">
    <path d="M268 263H286"/><path d="M476 263H494"/><path d="M684 263H702"/><path d="M892 263H910"/>
    <path d="M1010 220C995 136 206 136 178 216"/>
  </g>

  <line x1="88" y1="344" x2="1110" y2="344" stroke="#d9e2e8" stroke-width="1.5"/>
  <text x="90" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#9a3b2f">安全边界循环</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#173f63">
    <rect x="88" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="193" y="470">能力提高</text>
    <rect x="356" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="461" y="456">发现更多</text><text x="461" y="482">攻击路径</text>
    <rect x="624" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="729" y="456">突破原有</text><text x="729" y="482">安全边界</text>
    <rect x="892" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="997" y="456">行动空间</text><text x="997" y="482">进一步扩大</text>
  </g>
  <g fill="none" stroke="#9a3b2f" stroke-width="2.5" marker-end="url(#arrow-red)">
    <path d="M298 463H346"/><path d="M566 463H614"/><path d="M834 463H882"/>
  </g>
  <path d="M997 414C960 350 684 344 612 312" fill="none" stroke="#9a3b2f" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="871" y="376" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#9a3b2f">额外行动空间继续强化任务能力</text>

  <rect x="258" y="540" width="684" height="46" rx="23" fill="#f3e8e4"/>
  <text x="600" y="570" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#9a3b2f">每一步都可能局部合理，但风险会在循环中持续累积</text>
  <text x="600" y="644" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#6f7f8d">对长时间执行任务、调用工具并根据反馈反复试错的 Agent，权限边界不是静态配置</text>
</svg>
