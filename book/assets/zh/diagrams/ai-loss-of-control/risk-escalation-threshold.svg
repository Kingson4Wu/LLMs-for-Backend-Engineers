<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">从局部失效到人类灭绝的风险阶梯</title>
  <desc id="desc">局部越权、系统性事故、长期脱离控制和人类灭绝是不同风险层级。越往后门槛越高，现有证据越少；当前系统尚未同时满足主动失控走向灭绝所需的条件。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#173f63"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">从局部失效到人类灭绝</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">这些结果不是同一个风险层级，也不会由一次越界直接跳转</text>

  <line x1="94" y1="164" x2="1098" y2="164" stroke="#173f63" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1090" y="142" text-anchor="end" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#173f63">门槛升高 · 证据减少</text>

  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="272" width="240" height="132" rx="16" fill="#fffdf8" stroke="#173f63" stroke-width="2"/>
    <text x="94" y="310" font-size="20" font-weight="700" fill="#89a6bd">01</text>
    <text x="190" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="#173f63">局部越权或失效</text>
    <text x="190" y="383" text-anchor="middle" font-size="18" fill="#6f7f8d">已有现实案例</text>

    <rect x="342" y="246" width="240" height="158" rx="16" fill="#fffdf8" stroke="#173f63" stroke-width="2"/>
    <text x="366" y="284" font-size="20" font-weight="700" fill="#89a6bd">02</text>
    <text x="462" y="332" text-anchor="middle" font-size="28" font-weight="700" fill="#173f63">系统性事故</text>
    <text x="462" y="368" text-anchor="middle" font-size="18" fill="#6f7f8d">可推演，规模取决于部署</text>

    <rect x="614" y="218" width="240" height="186" rx="16" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/>
    <text x="638" y="256" font-size="20" font-weight="700" fill="#b68178">03</text>
    <text x="734" y="310" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3b2f">长期脱离控制</text>
    <text x="734" y="346" text-anchor="middle" font-size="18" fill="#6f7f8d">当前系统尚不具备</text>
    <text x="734" y="374" text-anchor="middle" font-size="18" fill="#6f7f8d">持续自主运行能力</text>

    <rect x="886" y="190" width="240" height="214" rx="16" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="910" y="228" font-size="20" font-weight="700" fill="#b68178">04</text>
    <text x="1006" y="286" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3b2f">人类灭绝</text>
    <text x="1006" y="324" text-anchor="middle" font-size="18" fill="#6f7f8d">后果极端</text>
    <text x="1006" y="352" text-anchor="middle" font-size="18" fill="#6f7f8d">概率高度不确定</text>
  </g>

  <text x="70" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#173f63">主动失控走向灭绝，需要多个条件同时成立</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#173f63" text-anchor="middle">
    <rect x="70" y="490" width="250" height="82" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>
    <text x="195" y="523">长期规划</text><text x="195" y="551">并持续获取资源</text>
    <rect x="340" y="490" width="250" height="82" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>
    <text x="465" y="523">以违背人类意图的方式</text><text x="465" y="551">使用能力</text>
    <rect x="610" y="490" width="250" height="82" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>
    <text x="735" y="523">接触关键系统</text><text x="735" y="551">与高风险资源</text>
    <rect x="880" y="490" width="250" height="82" rx="12" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>
    <text x="1005" y="523">跨地区持续行动</text><text x="1005" y="551">并阻止人类恢复</text>
  </g>
  <rect x="322" y="606" width="556" height="46" rx="23" fill="#f3e8e4"/>
  <text x="600" y="636" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#9a3b2f">基于现状，当前系统尚未同时满足这些条件</text>
</svg>
