<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">能力组合与权限扩张的两条路径</title>
  <desc id="desc">能力、自主性、现实权限和低可预测性共同放大系统风险。AI 的实际权限既可能来自人类主动授权，也可能通过漏洞和配置缺口进一步扩大。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#89a6bd"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">风险来自能力与行动空间的组合</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">这不是可计算公式，而是一组用于检查风险来源的工程条件</text>

  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="70" y="142" width="230" height="84" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/><text x="185" y="194" font-size="25" font-weight="700" fill="#173f63">强能力</text>
    <rect x="330" y="142" width="230" height="84" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/><text x="445" y="194" font-size="25" font-weight="700" fill="#173f63">高自主性</text>
    <rect x="590" y="142" width="230" height="84" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/><text x="705" y="194" font-size="25" font-weight="700" fill="#173f63">大权限</text>
    <rect x="850" y="142" width="280" height="84" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/><text x="990" y="194" font-size="25" font-weight="700" fill="#173f63">低可预测性</text>
    <line x1="185" y1="226" x2="185" y2="250" stroke="#89a6bd" stroke-width="2"/>
    <line x1="445" y1="226" x2="445" y2="250" stroke="#89a6bd" stroke-width="2"/>
    <line x1="705" y1="226" x2="705" y2="250" stroke="#89a6bd" stroke-width="2"/>
    <line x1="990" y1="226" x2="990" y2="250" stroke="#89a6bd" stroke-width="2"/>
    <line x1="185" y1="250" x2="990" y2="250" stroke="#89a6bd" stroke-width="2"/>
    <line x1="600" y1="250" x2="600" y2="270" stroke="#89a6bd" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <rect x="420" y="278" width="360" height="54" rx="27" fill="#f3e8e4"/><text x="600" y="313" font-size="23" font-weight="700" fill="#9a3b2f">局部错误更容易变成系统性事故</text>
  </g>

  <text x="70" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#173f63">实际权限扩张的两条路径</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="418" width="460" height="144" rx="16" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/>
    <text x="100" y="458" font-size="25" font-weight="700" fill="#1f7a57">人类主动授权</text>
    <text x="100" y="499" font-size="20" fill="#173f63">代码仓库</text><text x="226" y="499" font-size="19" fill="#89a6bd">→</text>
    <text x="260" y="499" font-size="20" fill="#173f63">CI/CD</text><text x="350" y="499" font-size="19" fill="#89a6bd">→</text>
    <text x="385" y="499" font-size="20" fill="#173f63">云与数据库</text>
    <text x="100" y="535" font-size="18" fill="#6f7f8d">每一步都能换来即时效率与商业价值</text>

    <rect x="670" y="418" width="460" height="144" rx="16" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/>
    <text x="700" y="458" font-size="25" font-weight="700" fill="#9a3b2f">漏洞与配置缺口</text>
    <text x="700" y="499" font-size="20" fill="#173f63">发现路径</text><text x="814" y="499" font-size="19" fill="#89a6bd">→</text>
    <text x="850" y="499" font-size="20" fill="#173f63">绕过边界</text><text x="970" y="499" font-size="19" fill="#89a6bd">→</text>
    <text x="1008" y="499" font-size="20" fill="#173f63">额外权限</text>
    <text x="700" y="535" font-size="18" fill="#6f7f8d">系统复杂度让实际边界可能超过配置边界</text>
  </g>
  <path d="M300 562C360 600 448 607 510 607M900 562C840 600 752 607 690 607" fill="none" stroke="#89a6bd" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <rect x="470" y="580" width="260" height="56" rx="28" fill="#173f63"/>
  <text x="600" y="616" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" fill="#fffdf8">实际行动空间扩大</text>
  <text x="600" y="665" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6f7f8d">授予的权限，不一定等于最终可获得的权限</text>
</svg>
