<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">任务完成需要外部终态验证</title><desc id="desc">模型提议依次经结构、策略、执行和外部终态验证，运行时根据可追溯证据决定继续、停止或升级。模型自评不是任务完成证据。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">“调用成功”不等于任务已经完成</text><text x="58" y="105" font-size="18" fill="#5E7F9C">正确性要跨过结构、权限、执行与外部世界的实际终态；每一层解决不同问题。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M215 260H265"/><path d="M455 260H505"/><path d="M695 260H745"/><path d="M935 260H985"/></g><g stroke-width="3"><rect x="45" y="180" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="265" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="505" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="745" y="180" width="190" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="985" y="180" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="130" y="230" font-size="21" font-weight="700" fill="#17324D">模型提议</text><text x="130" y="263" font-size="16" fill="#0F4D92">调用名与参数</text><text x="130" y="289" font-size="16" fill="#0F4D92">只是候选</text><text x="360" y="230" font-size="21" font-weight="700" fill="#765800">Schema 检查</text><text x="360" y="263" font-size="16" fill="#765800">结构可解析？</text><text x="360" y="289" font-size="16" fill="#765800">参数是否完整？</text><text x="600" y="230" font-size="21" font-weight="700" fill="#765800">策略检查</text><text x="600" y="263" font-size="16" fill="#765800">此人此时是否</text><text x="600" y="289" font-size="16" fill="#765800">被允许执行？</text><text x="840" y="230" font-size="21" font-weight="700" fill="#B64342">受控执行</text><text x="840" y="263" font-size="16" fill="#B64342">工具执行动作</text><text x="840" y="289" font-size="16" fill="#B64342">并返回观察结果</text><text x="1070" y="230" font-size="21" font-weight="700" fill="#17324D">外部终态</text><text x="1070" y="263" font-size="16" fill="#0F4D92">目标真的达成？</text><text x="1070" y="289" font-size="16" fill="#0F4D92">状态可否核验？</text></g><rect x="240" y="425" width="720" height="90" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="462" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">记录可追溯轨迹，Runtime 决定继续、停止或升级</text><text x="600" y="494" text-anchor="middle" font-size="17" fill="#765800">模型声称“已完成”可以是信息，但不能替代来自外部系统的终态证据。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">验证层越靠近实际效果，越能回答任务是否真的完成。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="439.1" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="591.5" height="48.3"/><rect data-figure-safe-zone="text" x="118.0" y="197.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="118.0" y="235.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="118.0" y="261.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="348.0" y="197.0" width="140.3" height="52.4"/><rect data-figure-safe-zone="text" x="348.0" y="235.0" width="108.3" height="45.6"/><rect data-figure-safe-zone="text" x="348.0" y="261.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="588.0" y="197.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="588.0" y="235.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="588.0" y="261.0" width="108.3" height="45.6"/><rect data-figure-safe-zone="text" x="828.0" y="197.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="828.0" y="235.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="828.0" y="261.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="1058.0" y="197.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="1058.0" y="235.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="1058.0" y="261.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="373.8" y="429.0" width="452.4" height="52.4"/><rect data-figure-safe-zone="text" x="344.2" y="465.0" width="511.6" height="47.0"/><rect data-figure-safe-zone="text" x="390.5" y="562.0" width="418.9" height="48.3"/></g></svg>
