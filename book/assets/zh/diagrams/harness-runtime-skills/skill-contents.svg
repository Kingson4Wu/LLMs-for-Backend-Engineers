<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">一个 Skill 的可审查内容</title><desc id="desc">Skill 组织目标与停止条件、工具与约束、已验证步骤和参考资源、以及验收恢复升级规则。它提供任务指导而非新增模型权限。</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Skill 是按需加载的任务资产，不是权限包</text><text x="58" y="105" font-size="18" fill="#5E7F9C">好的 Skill 将可审查的任务知识与程序治理衔接起来，但执行权限仍由运行时和外部系统决定。</text><rect x="80" y="170" width="250" height="335" rx="28" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/><text x="205" y="307" text-anchor="middle" font-size="34" font-weight="700" fill="#17324D">Skill</text><text x="205" y="341" text-anchor="middle" font-size="18" fill="#0F4D92">按任务加载的</text><text x="205" y="367" text-anchor="middle" font-size="18" fill="#0F4D92">可复用指导包</text><g stroke-width="3"><rect x="420" y="150" width="680" height="74" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="420" y="245" width="680" height="74" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="420" y="340" width="680" height="74" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="420" y="435" width="680" height="74" rx="20" fill="#F6CFCB" stroke="#B64342"/></g><text x="455" y="195" font-size="21" font-weight="700" fill="#17324D">目标与停止条件</text><text x="790" y="195" font-size="17" fill="#0F4D92">这项任务何时算完成、何时应停</text><text x="455" y="290" font-size="21" font-weight="700" fill="#765800">工具与必要约束</text><text x="790" y="290" font-size="17" fill="#765800">可用能力、数据边界与风险条件</text><text x="455" y="385" font-size="21" font-weight="700" fill="#17324D">已验证步骤与资源</text><text x="790" y="385" font-size="17" fill="#0F4D92">脚本、模板、参考资料和正确做法</text><text x="455" y="480" font-size="21" font-weight="700" fill="#B64342">验收、恢复与升级规则</text><text x="790" y="480" font-size="17" fill="#B64342">如何确认结果、失败如何处理</text><path d="M330 337H380V187H410M380 282H410M380 377H410M380 472H410" fill="none" stroke="#0F4D92" stroke-width="4"/><text x="600" y="590" text-anchor="middle" font-size="18" fill="#5E7F9C">Skill 增加可重复的任务指导，不替代模型判断、授权检查或外部状态验证。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="578.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="740.9" height="48.3"/><rect data-figure-safe-zone="text" x="148.8" y="261.0" width="112.4" height="69.9"/><rect data-figure-safe-zone="text" x="141.7" y="311.0" width="126.6" height="48.3"/><rect data-figure-safe-zone="text" x="141.7" y="337.0" width="126.6" height="48.3"/><rect data-figure-safe-zone="text" x="443.0" y="162.0" width="163.7" height="52.4"/><rect data-figure-safe-zone="text" x="778.0" y="166.0" width="242.8" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="257.0" width="163.7" height="52.4"/><rect data-figure-safe-zone="text" x="778.0" y="261.0" width="242.8" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="352.0" width="183.6" height="52.4"/><rect data-figure-safe-zone="text" x="778.0" y="356.0" width="251.6" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="447.0" width="214.5" height="52.4"/><rect data-figure-safe-zone="text" x="778.0" y="451.0" width="226.6" height="47.0"/><rect data-figure-safe-zone="text" x="306.5" y="560.0" width="587.0" height="48.3"/></g></svg>
