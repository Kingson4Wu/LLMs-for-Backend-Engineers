<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Harness 和运行时控制的任务闭环</title><desc id="desc">任务和显式状态经 Harness 选择本轮上下文，模型提出下一步，程序校验授权后执行，并把观察结果更新为新的状态。运行时控制全程限制。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">模型提出下一步；Harness 与 Runtime 控制整个循环</text><text x="58" y="105" font-size="18" fill="#5E7F9C">多轮行为来自程序编排，不是模型 token 生成本身自动拥有循环、权限或终止权。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 255H275"/><path d="M475 255H525"/><path d="M725 255H775"/><path d="M975 255V385H145V335"/></g><g stroke-width="3"><rect x="55" y="175" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="275" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="775" y="175" width="200" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/></g><g text-anchor="middle"><text x="140" y="226" font-size="22" font-weight="700" fill="#17324D">任务与状态</text><text x="140" y="259" font-size="16" fill="#0F4D92">目标、证据、进度</text><text x="140" y="285" font-size="16" fill="#0F4D92">预算与边界</text><text x="375" y="226" font-size="22" font-weight="700" fill="#765800">Harness</text><text x="375" y="259" font-size="16" fill="#765800">选择本轮上下文</text><text x="375" y="285" font-size="16" fill="#765800">装配工具与约束</text><text x="625" y="226" font-size="22" font-weight="700" fill="#17324D">模型提议</text><text x="625" y="259" font-size="16" fill="#0F4D92">回答、调用或</text><text x="625" y="285" font-size="16" fill="#0F4D92">下一步计划</text><text x="875" y="226" font-size="22" font-weight="700" fill="#B64342">程序执行</text><text x="875" y="259" font-size="16" fill="#B64342">校验、授权、执行</text><text x="875" y="285" font-size="16" fill="#B64342">获取外部结果</text></g><rect x="265" y="415" width="670" height="95" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">观察结果、错误与外部状态 → 更新显式状态</text><text x="600" y="484" text-anchor="middle" font-size="17" fill="#765800">Runtime 决定继续、重试、升级或停止；模型本身不是循环所有者。</text><rect x="180" y="552" width="840" height="46" rx="14" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#B64342">运行时守住回合、时间、成本、权限、重试和终止条件。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="726.5" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="630.6" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="192.0" width="128.5" height="53.7"/><rect data-figure-safe-zone="text" x="128.0" y="231.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="257.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="192.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="363.0" y="231.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="257.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="613.0" y="192.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="613.0" y="231.0" width="108.3" height="45.6"/><rect data-figure-safe-zone="text" x="613.0" y="257.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="863.0" y="192.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="863.0" y="231.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="863.0" y="257.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="396.6" y="419.0" width="406.8" height="52.4"/><rect data-figure-safe-zone="text" x="357.3" y="455.0" width="485.4" height="47.0"/><rect data-figure-safe-zone="text" x="404.4" y="553.0" width="391.2" height="47.0"/></g></svg>
