<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">近乎并列的 logits 可因微差改变贪心 token 选择</title><desc id="desc">两组近乎并列的 logits 只相差百万分之一或更小；最大值的微小翻转会让 argmax 从 token 0 离散地切换到 token 1。</desc><rect width="1100" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="69" font-size="32" font-weight="700" fill="#17324D">argmax 在近乎并列处是一条离散选择边界</text><text x="60" y="104" font-size="19" fill="#5E7F9C">不是所有数值微差都会改变输出；只有越过最高 logit 的边界时，贪心选择才翻转。</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="90" y="157" width="390" height="268" rx="28"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="620" y="157" width="390" height="268" rx="28"/></g><g fill="none" stroke="#D8A919" stroke-width="2"><rect x="95" y="162" width="380" height="258" rx="25"/></g><g fill="none" stroke="#E9A6A1" stroke-width="2"><rect x="625" y="162" width="380" height="258" rx="25"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><text x="285" y="207" font-size="25" font-weight="700" fill="#765800">logits A</text><text x="815" y="207" font-size="25" font-weight="700" fill="#B64342">logits B</text><g font-size="24"><text x="285" y="263" fill="#765800">token 0: 5.000000</text><text x="285" y="304" fill="#765800">token 1: 4.999999</text><text x="815" y="263" fill="#B64342">token 0: 4.999998</text><text x="815" y="304" fill="#B64342">token 1: 4.999999</text></g><g font-size="25" font-weight="700"><text x="285" y="371" fill="#0F4D92">argmax → token 0</text><text x="815" y="371" fill="#B64342">argmax → token 1</text></g></g><path d="M515 290H585" stroke="#B64342" stroke-width="4" stroke-dasharray="10 8"/><path d="M519 294H581" stroke="#E9A6A1" stroke-width="2"/><text x="550" y="270" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18" text-anchor="middle" fill="#B64342">微差跨界</text><path d="M105 481H995" stroke="#FFD700" stroke-width="3"/><path d="M109 484H991" stroke="#D8A919" stroke-width="2"/><text x="550" y="520" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" text-anchor="middle" fill="#765800">最高 logit 的间隔足够大时，同等级别的微小数值扰动不会改变选择。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="25.0" width="596.5" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="73.0" width="682.3" height="49.7"/><rect data-figure-safe-zone="text" x="273.0" y="170.0" width="128.0" height="57.8"/><rect data-figure-safe-zone="text" x="803.0" y="170.0" width="128.0" height="57.8"/><rect data-figure-safe-zone="text" x="273.0" y="234.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="273.0" y="275.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="234.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="275.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="273.0" y="342.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="342.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="503.8" y="240.0" width="92.4" height="48.3"/><rect data-figure-safe-zone="text" x="258.9" y="489.0" width="582.2" height="49.7"/></g></svg>
