<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc"><title id="title">在线批次条件变化可经有限精度和自回归放大为文本分叉</title><desc id="desc">请求负载改变动态批次或切分，有限精度下 logits 出现微小变化。若变化刚好跨越 argmax 边界，选中的 token 不同，并被写入后续上下文，令生成分叉。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="600" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="68" font-size="32" font-weight="700" fill="#17324D">微小数值差异，只有在临界选择处才会放大</text><text x="60" y="103" font-size="19" fill="#5E7F9C">一次 token 翻转会进入下一步上下文，因此自回归解码会逐步走向不同的生成轨迹。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="55" y="230" width="190" height="95" rx="23"/><rect x="530" y="230" width="200" height="95" rx="23"/><rect x="990" y="230" width="190" height="95" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="295" y="230" width="185" height="95" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="775" y="230" width="165" height="95" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 277H285"/><path d="M480 277H520"/><path d="M730 277H765"/><path d="M940 277H980"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="21" font-weight="700"><text x="150" y="269" fill="#0F4D92">请求负载变化</text><text x="388" y="261" fill="#765800">动态批次 / 切分</text><text x="388" y="288" fill="#765800">条件变化</text><text x="630" y="261" fill="#0F4D92">有限精度下的 logits</text><text x="630" y="288" fill="#0F4D92">产生微小差异</text><text x="858" y="261" fill="#B64342">临界 argmax</text><text x="858" y="288" fill="#B64342">选择翻转</text><text x="1085" y="261" fill="#0F4D92">后续上下文</text><text x="1085" y="288" fill="#0F4D92">与生成分叉</text></g></g><path d="M90 398H1150" stroke="#FFD700" stroke-width="3"/><path d="M94 401H1146" stroke="#D8A919" stroke-width="2"/><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="264" y="447" width="712" height="76" rx="24"/></g><path d="M268 451H972" fill="none" stroke="#D8A919" stroke-width="2"/><text x="620" y="478" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="21" font-weight="700" fill="#765800" text-anchor="middle">可复现性的边界：固定完整计算路径，才能稳定复现数值与 token。</text><text x="620" y="505" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="17" fill="#765800" text-anchor="middle">线上动态批处理可能改变单请求的数值路径，但不会让任意微差都变成不同回答。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="24.0" width="587.8" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="72.0" width="690.5" height="49.7"/><rect data-figure-safe-zone="text" x="138.0" y="240.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="376.0" y="232.0" width="147.4" height="47.0"/><rect data-figure-safe-zone="text" x="376.0" y="259.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="618.0" y="232.0" width="182.8" height="47.0"/><rect data-figure-safe-zone="text" x="618.0" y="259.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="846.0" y="232.0" width="118.2" height="47.0"/><rect data-figure-safe-zone="text" x="846.0" y="259.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="1073.0" y="232.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="1073.0" y="259.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="319.5" y="445.0" width="601.1" height="52.4"/><rect data-figure-safe-zone="text" x="324.6" y="476.0" width="590.8" height="47.0"/></g></svg>
