<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">推理时计算的三种分配</title><desc id="desc">三个并列面板分别表示延长一条轨迹、生成多个候选并选择、以及带搜索或验证反馈的继续计算。它们有不同的信息来源和失败边界。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0F4D92"/></marker></defs><rect width="1200" height="610" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">推理时计算可以怎样分配</text>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d"><rect x="45" y="100" width="340" height="440" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="75" y="145" font-size="23" font-weight="700" fill="#0F4D92">1. 延长一条轨迹</text><rect x="90" y="185" width="250" height="50" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="215" y="217" text-anchor="middle" font-size="20">中间状态 1</text><path data-figure-connector="true" d="M215 235V265" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="290" width="250" height="50" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="215" y="322" text-anchor="middle" font-size="20">中间状态 2</text><path data-figure-connector="true" d="M215 340V370" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="395" width="250" height="50" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="215" y="427" text-anchor="middle" font-size="20">答案</text><text x="75" y="495" font-size="17">增加顺序深度；可能沿错误前提继续。</text>
<rect x="430" y="100" width="340" height="440" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="460" y="145" font-size="23" font-weight="700" fill="#0F4D92">2. 多候选后选择</text><rect x="495" y="185" width="210" height="45" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="600" y="214" text-anchor="middle" font-size="20">同一问题</text><path data-figure-connector="true" d="M600 230V260 M600 260H505V280 M600 260V280 M600 260H695V280" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="455" y="305" width="100" height="45" rx="10" fill="#fff" stroke="#3775BA"/><rect x="550" y="305" width="100" height="45" rx="10" fill="#fff" stroke="#3775BA"/><rect x="645" y="305" width="100" height="45" rx="10" fill="#fff" stroke="#3775BA"/><text x="505" y="334" text-anchor="middle" font-size="18">候选 A</text><text x="600" y="334" text-anchor="middle" font-size="18">候选 B</text><text x="695" y="334" text-anchor="middle" font-size="18">候选 C</text><path data-figure-connector="true" d="M505 350V380H600V400" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path data-figure-connector="true" d="M600 350V400 M695 350V380H600" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="495" y="425" width="210" height="50" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="600" y="457" text-anchor="middle" font-size="20">比较或选择</text><text x="460" y="505" font-size="17">选择器不可靠时，只是增加候选数量。</text>
<rect x="815" y="100" width="340" height="440" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="845" y="145" font-size="23" font-weight="700" fill="#0F4D92">3. 搜索或验证反馈</text><rect x="860" y="185" width="250" height="50" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="985" y="217" text-anchor="middle" font-size="20">部分解或候选</text><path data-figure-connector="true" d="M985 235V265" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="290" width="250" height="50" rx="12" fill="#fff4d8" stroke="#c58b23"/><text x="985" y="322" text-anchor="middle" font-size="20">验证器、搜索或工具</text><path data-figure-connector="true" d="M985 340V370" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="395" width="250" height="50" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="985" y="427" text-anchor="middle" font-size="20">反馈后继续或停止</text><text x="845" y="495" font-size="17">反馈只覆盖被明确检查的性质。</text></g><g aria-hidden="true" fill="none" opacity="0"><rect data-figure-safe-zone="text" x="60" y="110" width="300" height="50"/><rect data-figure-safe-zone="text" x="75" y="480" width="300" height="35"/><rect data-figure-safe-zone="text" x="445" y="110" width="300" height="50"/><rect data-figure-safe-zone="text" x="445" y="490" width="310" height="35"/><rect data-figure-safe-zone="text" x="830" y="110" width="300" height="50"/><rect data-figure-safe-zone="text" x="830" y="480" width="300" height="35"/></g></svg>
