<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">推理模型的训练信号与验证边界</title><desc id="desc">SFT、偏好或奖励训练与 RLVR 向同一策略更新提供不同反馈；RLVR 的验证器只检查明确编码的条件。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0F4D92"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">不同训练信号怎样塑造多步求解策略</text><g font-family="Arial, Helvetica, sans-serif" fill="#17324d"><rect x="55" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="85" y="160" font-size="24" font-weight="700" fill="#0F4D92">SFT</text><text x="85" y="200" font-size="20">问题、过程、答案示范</text><path data-figure-connector="true" d="M205 235V270" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="295" width="220" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="205" y="330" text-anchor="middle" font-size="20">学习已有模式</text><text x="85" y="375" font-size="17">不保证发现未示范策略</text><rect x="450" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="480" y="160" font-size="24" font-weight="700" fill="#0F4D92">偏好或奖励训练</text><text x="480" y="200" font-size="20">候选与相对评价</text><path data-figure-connector="true" d="M600 235V270" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="295" width="220" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="600" y="330" text-anchor="middle" font-size="20">调整行为偏好</text><text x="480" y="375" font-size="17">评价目标未必等于完整意图</text><rect x="845" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="875" y="160" font-size="24" font-weight="700" fill="#0F4D92">RLVR</text><text x="875" y="200" font-size="20">候选与可验证结果</text><path data-figure-connector="true" d="M995 235V270" stroke="#0F4D92" stroke-width="3" marker-end="url(#arrow)"/><rect x="885" y="295" width="220" height="55" rx="12" fill="#fff4d8" stroke="#c58b23"/><text x="995" y="330" text-anchor="middle" font-size="20">验证器给出结果</text><text x="875" y="375" font-size="17">只覆盖明确编码的条件</text><path data-figure-connector="true" d="M205 425V465H600 M600 425V465 M995 425V465H600V485" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="495" width="360" height="58" rx="14" fill="#e3f3e8" stroke="#438a62" stroke-width="2"/><text x="600" y="532" text-anchor="middle" font-size="22">参数更新后的推理策略</text></g><g aria-hidden="true" fill="none" opacity="0"><rect data-figure-safe-zone="text" x="70" y="125" width="250" height="55"/><rect data-figure-safe-zone="text" x="70" y="185" width="270" height="35"/><rect data-figure-safe-zone="text" x="70" y="360" width="270" height="35"/><rect data-figure-safe-zone="text" x="465" y="125" width="250" height="55"/><rect data-figure-safe-zone="text" x="465" y="185" width="270" height="35"/><rect data-figure-safe-zone="text" x="465" y="360" width="270" height="35"/><rect data-figure-safe-zone="text" x="860" y="125" width="250" height="55"/><rect data-figure-safe-zone="text" x="860" y="185" width="270" height="35"/><rect data-figure-safe-zone="text" x="860" y="360" width="270" height="35"/><rect data-figure-safe-zone="text" x="435" y="505" width="330" height="38"/></g></svg>
