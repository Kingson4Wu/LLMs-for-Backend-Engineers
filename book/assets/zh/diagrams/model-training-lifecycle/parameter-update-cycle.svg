<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">一次训练参数更新循环</title><desc id="desc">批次使用当前参数进行预测，目标形成损失，反向传播计算梯度，优化器更新参数，下一批使用新的参数。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">一次参数更新：把当前批次的误差变成下一次的参数状态</text><text x="58" y="105" font-size="18" fill="#5E7F9C">样本提供训练信号；能力形成在大量相互叠加或冲突的参数更新中。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 260H305"/><path d="M495 260H555"/><path d="M745 260H805"/><path d="M995 260H1055"/><path d="M1120 337V410H140V337"/></g><g stroke-width="3"><rect x="55" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="305" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="555" y="180" width="190" height="155" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="805" y="180" width="190" height="155" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="1055" y="180" width="120" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="150" y="230" font-size="22" font-weight="700" fill="#17324D">训练批次</text><text x="150" y="264" font-size="16" fill="#0F4D92">输入与真实目标</text><text x="150" y="290" font-size="16" fill="#0F4D92">当前参数 θ</text><text x="400" y="230" font-size="22" font-weight="700" fill="#17324D">前向预测</text><text x="400" y="264" font-size="16" fill="#0F4D92">θ 参与计算</text><text x="400" y="290" font-size="16" fill="#0F4D92">得到词表概率</text><text x="650" y="230" font-size="22" font-weight="700" fill="#B64342">损失 L</text><text x="650" y="264" font-size="16" fill="#B64342">训练目标评价</text><text x="650" y="290" font-size="16" fill="#B64342">这次预测</text><text x="900" y="230" font-size="22" font-weight="700" fill="#765800">反向传播</text><text x="900" y="264" font-size="16" fill="#765800">计算梯度</text><text x="900" y="290" font-size="16" fill="#765800">∂L / ∂θ</text><text x="1115" y="230" font-size="21" font-weight="700" fill="#17324D">优化器</text><text x="1115" y="264" font-size="15" fill="#0F4D92">更新 θ</text><text x="1115" y="290" font-size="15" fill="#0F4D92">→ θ′</text></g><rect x="300" y="430" width="600" height="92" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="467" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">下一批次使用更新后的 θ′，再次检验</text><text x="600" y="499" text-anchor="middle" font-size="17" fill="#765800">优化器还会结合学习率及自身状态；梯度不是参数更新本身。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">推理会让生成 token 回到上下文；训练才会让参数 θ 改变。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="746.9" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="521.5" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="196.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="138.0" y="236.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="262.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="388.0" y="196.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="388.0" y="236.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="388.0" y="262.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="638.0" y="196.0" width="88.7" height="53.7"/><rect data-figure-safe-zone="text" x="638.0" y="236.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="638.0" y="262.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="888.0" y="196.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="888.0" y="236.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="888.0" y="262.0" width="82.2" height="45.6"/><rect data-figure-safe-zone="text" x="1103.0" y="197.0" width="83.8" height="52.4"/><rect data-figure-safe-zone="text" x="1103.0" y="237.0" width="68.1" height="44.2"/><rect data-figure-safe-zone="text" x="1103.0" y="263.0" width="55.2" height="44.2"/><rect data-figure-safe-zone="text" x="426.5" y="434.0" width="347.0" height="52.4"/><rect data-figure-safe-zone="text" x="377.3" y="470.0" width="445.4" height="47.0"/><rect data-figure-safe-zone="text" x="360.8" y="562.0" width="478.3" height="48.3"/></g></svg>
