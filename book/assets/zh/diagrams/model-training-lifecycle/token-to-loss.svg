<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">一次前向计算如何形成交叉熵损失</title><desc id="desc">输入 token 经嵌入、Transformer、logits 和 Softmax 得到目标 token 的概率，交叉熵用该概率评价预测误差。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">前向计算产生预测；训练目标把预测评价为损失</text><text x="58" y="105" font-size="18" fill="#5E7F9C">架构决定如何计算分数，交叉熵决定如何衡量真实下一个 token 没有被给足概率。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M220 255H270"/><path d="M470 255H520"/><path d="M720 255H770"/></g><g stroke-width="3"><rect x="55" y="175" width="165" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="270" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="520" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="770" y="175" width="170" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/></g><g text-anchor="middle"><text x="138" y="226" font-size="22" font-weight="700" fill="#17324D">输入 token</text><text x="138" y="259" font-size="16" fill="#0F4D92">前文作为条件</text><text x="138" y="285" font-size="16" fill="#0F4D92">真实后续 token 是目标</text><text x="370" y="226" font-size="22" font-weight="700" fill="#765800">表示</text><text x="370" y="259" font-size="16" fill="#765800">token ID → embedding</text><text x="370" y="285" font-size="16" fill="#765800">加上位置信息</text><text x="620" y="226" font-size="22" font-weight="700" fill="#17324D">Transformer</text><text x="620" y="259" font-size="16" fill="#0F4D92">上下文化表示</text><text x="620" y="285" font-size="16" fill="#0F4D92">输出整个词表的 logits</text><text x="855" y="226" font-size="22" font-weight="700" fill="#765800">Softmax</text><text x="855" y="259" font-size="16" fill="#765800">把 logits 归一化</text><text x="855" y="285" font-size="16" fill="#765800">为词表概率</text></g><path d="M855 335V390" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="420" y="410" width="700" height="112" rx="22" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="770" y="451" text-anchor="middle" font-size="23" font-weight="700" fill="#B64342">交叉熵：查看真实目标 token 的概率</text><text x="770" y="487" text-anchor="middle" font-size="18" fill="#B64342">给真实目标的概率越低，损失越大；随后反向传播从损失开始。</text><path d="M235 465H405" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><text x="55" y="461" font-size="19" font-weight="700" fill="#17324D">真实目标</text><text x="55" y="490" font-size="16" fill="#5E7F9C">例如下一个 token</text><text x="600" y="590" text-anchor="middle" font-size="18" fill="#5E7F9C">模型不会直接输出“对／错”；它先给词表中每个候选一个分数。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="629.1" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="638.3" height="48.3"/><rect data-figure-safe-zone="text" x="126.0" y="192.0" width="134.4" height="53.7"/><rect data-figure-safe-zone="text" x="126.0" y="231.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="126.0" y="257.0" width="188.6" height="45.6"/><rect data-figure-safe-zone="text" x="358.0" y="192.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="358.0" y="231.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="358.0" y="257.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="192.0" width="149.8" height="53.7"/><rect data-figure-safe-zone="text" x="608.0" y="231.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="257.0" width="188.6" height="45.6"/><rect data-figure-safe-zone="text" x="843.0" y="192.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="843.0" y="231.0" width="151.4" height="45.6"/><rect data-figure-safe-zone="text" x="843.0" y="257.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="579.1" y="416.0" width="381.9" height="55.0"/><rect data-figure-safe-zone="text" x="530.2" y="457.0" width="479.6" height="48.3"/><rect data-figure-safe-zone="text" x="43.0" y="430.0" width="96.2" height="49.7"/><rect data-figure-safe-zone="text" x="43.0" y="462.0" width="149.9" height="45.6"/><rect data-figure-safe-zone="text" x="359.4" y="560.0" width="481.2" height="48.3"/></g></svg>
