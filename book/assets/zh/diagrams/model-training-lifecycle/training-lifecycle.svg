<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
 <title id="title">训练闭环：从资料到独立验证</title><desc id="desc">训练资料被处理为批次，经前向计算和损失获得梯度并更新参数形成 checkpoint；独立验证与数据审查反馈至下一轮选择。</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
 <rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif">
 <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">训练是资料、更新与独立验证共同构成的闭环</text><text x="58" y="105" font-size="18" fill="#5E7F9C">训练的边界在于：这次计算是否根据训练目标改变参数。</text>
 <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 260H278"/><path d="M465 260H518"/><path d="M705 260H758"/><path d="M945 260H998"/><path d="M1068 334V392H170V334"/></g>
 <g stroke-width="3"><rect x="55" y="180" width="170" height="154" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="278" y="180" width="187" height="154" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="518" y="180" width="187" height="154" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="758" y="180" width="187" height="154" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="998" y="180" width="140" height="154" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g>
 <g text-anchor="middle"><text x="140" y="226" font-size="21" font-weight="700" fill="#17324D">资料与任务</text><text x="140" y="258" font-size="16" fill="#0F4D92">文本、示范、反馈</text><text x="140" y="284" font-size="16" fill="#0F4D92">目标与覆盖范围</text><text x="371" y="226" font-size="21" font-weight="700" fill="#765800">数据准备</text><text x="371" y="258" font-size="16" fill="#765800">选择 · 清理 · 去重</text><text x="371" y="284" font-size="16" fill="#765800">混合 · token 化 · 批次</text><text x="611" y="226" font-size="21" font-weight="700" fill="#17324D">前向与损失</text><text x="611" y="258" font-size="16" fill="#0F4D92">Transformer → logits</text><text x="611" y="284" font-size="16" fill="#0F4D92">目标衡量预测误差</text><text x="851" y="226" font-size="21" font-weight="700" fill="#B64342">反向与更新</text><text x="851" y="258" font-size="16" fill="#B64342">梯度 → 优化器</text><text x="851" y="284" font-size="16" fill="#B64342">改变可训练参数</text><text x="1068" y="226" font-size="21" font-weight="700" fill="#17324D">checkpoint</text><text x="1068" y="258" font-size="16" fill="#0F4D92">一个训练时刻的</text><text x="1068" y="284" font-size="16" fill="#0F4D92">完整参数状态</text></g>
 <rect x="250" y="405" width="700" height="112" rx="22" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#765800">独立验证、任务评测、数据审查与训练监控</text><text x="600" y="480" text-anchor="middle" font-size="17" fill="#765800">选择 checkpoint，发现过拟合，并决定继续、调整数据／目标或停止。</text>
 <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">训练损失推动当前目标；独立评测检查这种变化是否真的带来目标能力。</text></g>
