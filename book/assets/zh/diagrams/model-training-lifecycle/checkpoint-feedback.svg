<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">checkpoint 的独立验证反馈环</title><desc id="desc">资料和任务定义经数据准备、批次和参数更新形成 checkpoint；独立验证、任务评测、数据审查与监控反馈到下一轮训练决策。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">checkpoint 要靠独立验证选择，不能只看训练损失</text><text x="58" y="105" font-size="18" fill="#5E7F9C">它是某一训练时刻的完整参数状态；是否保留取决于脱离训练批次的证据。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M250 257H300"/><path d="M500 257H550"/><path d="M750 257H800"/><path d="M1000 257V380H170V337"/></g><g stroke-width="3"><rect x="60" y="180" width="190" height="157" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="300" y="180" width="200" height="157" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="550" y="180" width="200" height="157" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="800" y="180" width="200" height="157" rx="22" fill="#F6CFCB" stroke="#B64342"/></g><g text-anchor="middle"><text x="155" y="229" font-size="22" font-weight="700" fill="#17324D">资料与任务定义</text><text x="155" y="262" font-size="16" fill="#0F4D92">覆盖范围、目标</text><text x="155" y="288" font-size="16" fill="#0F4D92">训练信号与限制</text><text x="400" y="229" font-size="22" font-weight="700" fill="#765800">数据准备</text><text x="400" y="262" font-size="16" fill="#765800">清理、去重、配比</text><text x="400" y="288" font-size="16" fill="#765800">切分与采样</text><text x="650" y="229" font-size="22" font-weight="700" fill="#17324D">训练与保存</text><text x="650" y="262" font-size="16" fill="#0F4D92">批次 → 参数更新</text><text x="650" y="288" font-size="16" fill="#0F4D92">形成 checkpoint</text><text x="900" y="229" font-size="22" font-weight="700" fill="#B64342">独立反馈</text><text x="900" y="262" font-size="16" fill="#B64342">验证、任务评测</text><text x="900" y="288" font-size="16" fill="#B64342">数据审查、监控</text></g><rect x="260" y="415" width="680" height="104" rx="22" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="456" text-anchor="middle" font-size="22" font-weight="700" fill="#765800">根据独立证据，选择 checkpoint 或调整下一轮</text><text x="600" y="490" text-anchor="middle" font-size="17" fill="#765800">发现过拟合、资料泄漏或目标错配时，回到数据与任务定义，而不是掩盖问题。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">训练损失服务于更新；独立评测才有机会检验泛化与真实任务质量。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="688.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="572.8" height="48.3"/><rect data-figure-safe-zone="text" x="143.0" y="195.0" width="170.3" height="53.7"/><rect data-figure-safe-zone="text" x="143.0" y="234.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="143.0" y="260.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="388.0" y="195.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="388.0" y="234.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="388.0" y="260.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="638.0" y="195.0" width="128.5" height="53.7"/><rect data-figure-safe-zone="text" x="638.0" y="234.0" width="140.2" height="45.6"/><rect data-figure-safe-zone="text" x="638.0" y="260.0" width="145.9" height="45.6"/><rect data-figure-safe-zone="text" x="888.0" y="195.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="888.0" y="234.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="888.0" y="260.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="367.3" y="422.0" width="465.3" height="53.7"/><rect data-figure-safe-zone="text" x="320.0" y="461.0" width="560.0" height="47.0"/><rect data-figure-safe-zone="text" x="339.2" y="562.0" width="521.5" height="48.3"/></g></svg>
