<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">LLM 系统的责任链</title><desc id="desc">训练形成长期参数；当前上下文与模型计算产生提议；应用执行外部行动；服务运行时保障交付。</desc>
  <style>.t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183153}.h{font-size:28px;font-weight:700}.s{font-size:15px;fill:#58708e}.k{font-size:18px;font-weight:700}.b{font-size:14px}.tag{font-size:12px;font-weight:700;letter-spacing:.8px}.arr{stroke:#8da5bf;stroke-width:2.5;fill:none;stroke-linecap:round}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="3.8" orient="auto"><path d="M0 0L7.5 3.8L0 7.6Z" fill="#8da5bf"/></marker></defs>
  <rect width="1100" height="610" rx="28" fill="#f8fbff"/><text x="58" y="65" class="t h">LLM 系统的责任链</text><text x="58" y="94" class="t s">参数保存长期学习；上下文决定本次计算；外部程序执行并验证；服务运行时负责交付。</text>
  <g><rect x="58" y="132" width="216" height="158" rx="20" fill="#fff4ea" stroke="#efb47d" stroke-width="1.5"/><text x="84" y="166" class="t tag" fill="#b4651d">TRAINING</text><text x="84" y="201" class="t k">训练资料 + 学习目标</text><text x="84" y="227" class="t b">优化参数，得到已训练模型</text><path d="M84 245H248" stroke="#f2cfad"/><text x="84" y="269" class="t b">长期学到的规律</text></g>
  <g><rect x="318" y="132" width="216" height="158" rx="20" fill="#eaf5ff" stroke="#9ac7ea" stroke-width="1.5"/><text x="344" y="166" class="t tag" fill="#2471a3">CURRENT CONTEXT</text><text x="344" y="201" class="t k">请求 + 指令 + 证据</text><text x="344" y="227" class="t b">组织为当前可见上下文</text><path d="M344 245H508" stroke="#bddbee"/><text x="344" y="269" class="t b">每次请求的条件</text></g>
  <g><rect x="578" y="132" width="216" height="158" rx="20" fill="#eff8f5" stroke="#a8d4c3" stroke-width="1.5"/><text x="604" y="166" class="t tag" fill="#278067">MODEL COMPUTATION</text><text x="604" y="201" class="t k">Token → Transformer</text><text x="604" y="225" class="t b">下一 token 的分布与提议</text><path d="M604 245H768" stroke="#bee2d5"/><text x="604" y="269" class="t b">生成回答或工具调用</text></g>
  <g><rect x="838" y="132" width="204" height="158" rx="20" fill="#f4f1ff" stroke="#b7a8ec" stroke-width="1.5"/><text x="864" y="166" class="t tag" fill="#7256b5">EXTERNAL ACTION</text><text x="864" y="201" class="t k">检查、授权与执行</text><text x="864" y="227" class="t b">工具结果回到上下文</text><path d="M864 245H1016" stroke="#d8cff0"/><text x="864" y="269" class="t b">完成需要外部证据</text></g>
  <path class="arr" marker-end="url(#arrow)" d="M274 183H318M534 183H578M794 183H838"/>
  <path class="arr" marker-end="url(#arrow)" d="M940 290V353H426"/>
  <g><rect x="58" y="369" width="984" height="126" rx="20" fill="#edf2f8" stroke="#b9c7d7" stroke-width="1.5"/><text x="86" y="407" class="t tag" fill="#516a86">SERVING RUNTIME · EVERY MODEL CALL</text><text x="86" y="442" class="t k">安排计算、保留 KV Cache、管理并发并返回输出</text><text x="86" y="468" class="t b">它不决定模型“懂不懂”，却决定请求能否在容量、延迟与成本约束下稳定交付。</text></g>
  <path class="arr" marker-end="url(#arrow)" d="M426 353V369"/><text x="58" y="551" class="t s">把四层分开，才能避免把检索当训练、把工具调用当模型的天然能力，或把模型声明当任务完成。</text>
</svg>
