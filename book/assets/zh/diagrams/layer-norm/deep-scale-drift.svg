<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">层层变换会使数值尺度逐渐漂移</title><desc id="desc">输入经过连续层变换时，表示的数值尺度可能逐步放大或缩小。LayerNorm 对每个 token 的特征维度重新定标，避免漂移继续累积。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1120" height="530" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="66" y="70" font-size="32" font-weight="700" fill="#17324D">深层变换会累积数值尺度的漂移</text><text x="66" y="105" font-size="19" fill="#5E7F9C">每一层的微小放大或缩小，经过深度叠加后都会改变后续计算的条件。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="80" y="205" width="150" height="88" rx="22"/><rect x="335" y="205" width="150" height="88" rx="22"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="590" y="195" width="165" height="108" rx="22"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="860" y="180" width="175" height="138" rx="22"/></g><g fill="none" stroke="#8EB6D8" stroke-width="2"><rect x="84" y="209" width="142" height="80" rx="19"/><rect x="339" y="209" width="142" height="80" rx="19"/></g><g fill="none" stroke="#D8A919" stroke-width="2"><rect x="594" y="199" width="157" height="100" rx="19"/></g><g fill="none" stroke="#E9A6A1" stroke-width="2"><rect x="864" y="184" width="167" height="130" rx="19"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M230 249H325"/><path d="M485 249H580"/><path d="M755 249H850"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="24" font-weight="700" fill="#0F4D92"><text x="155" y="258">输入 x</text><text x="410" y="258">层变换</text></g><text x="672" y="240" font-size="22" font-weight="700" fill="#765800">尺度开始漂移</text><text x="672" y="273" font-size="18" fill="#765800">放大或缩小</text><text x="947" y="231" font-size="23" font-weight="700" fill="#B64342">深层累积</text><text x="947" y="266" font-size="18" fill="#B64342">过大 / 过小</text></g><path d="M115 378H1005" stroke="#FFD700" stroke-width="3"/><path d="M119 381H1001" stroke="#D8A919" stroke-width="2"/><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="316" y="410" width="488" height="72" rx="23"/></g><path d="M320 414H800" fill="none" stroke="#8EB6D8" stroke-width="2"/><text x="560" y="440" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="23" font-weight="700" fill="#0F4D92" text-anchor="middle">LayerNorm：对每个 token 的特征维度重新定标</text><text x="560" y="468" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="17" fill="#5E7F9C" text-anchor="middle">控制尺度后，再交给下一层继续计算</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="54.0" y="26.0" width="449.6" height="67.2"/><rect data-figure-safe-zone="text" x="54.0" y="74.0" width="567.2" height="49.7"/><rect data-figure-safe-zone="text" x="143.0" y="229.0" width="74.0" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="229.0" width="72.4" height="47.0"/><rect data-figure-safe-zone="text" x="660.0" y="206.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="660.0" y="243.0" width="109.5" height="48.3"/><rect data-figure-safe-zone="text" x="935.0" y="196.0" width="111.4" height="55.0"/><rect data-figure-safe-zone="text" x="935.0" y="236.0" width="120.5" height="48.3"/><rect data-figure-safe-zone="text" x="315.2" y="405.0" width="489.5" height="55.0"/><rect data-figure-safe-zone="text" x="422.5" y="439.0" width="275.1" height="47.0"/></g></svg>
