<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">从 SGD 到 Warmup 的优化器设计针对不同更新问题逐层改进</title><desc id="desc">SGD 使用统一步长；Momentum 平滑方向；Adam 提供参数级自适应；AdamW 解耦权重衰减；Warmup 约束训练初期更新。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="640" rx="36" fill="#FFFFFF"/><text x="55" y="68" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="31" font-weight="700" fill="#17324D">优化器演化：逐层处理方向、步长、正则与初期稳定性</text><g font-family="Arial, 'Noto Sans SC', sans-serif"><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="70" y="115" width="1060" height="76" rx="21"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="70" y="215" width="1060" height="76" rx="21"/><rect x="70" y="515" width="1060" height="76" rx="21"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="70" y="315" width="1060" height="76" rx="21"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="70" y="415" width="1060" height="76" rx="21"/></g><g font-size="21"><text x="105" y="160" font-weight="700" fill="#0F4D92">SGD</text><text x="270" y="160" fill="#5E7F9C">统一步长 → 陡峭方向可能震荡</text><text x="105" y="260" font-weight="700" fill="#765800">Momentum</text><text x="300" y="260" fill="#765800">平滑一致方向 → 仍是统一步长</text><text x="105" y="360" font-weight="700" fill="#0F4D92">Adam</text><text x="270" y="360" fill="#5E7F9C">参数级自适应 → decay 与自适应缩放耦合</text><text x="105" y="460" font-weight="700" fill="#B64342">AdamW</text><text x="290" y="460" fill="#B64342">解耦 weight decay → 初期统计仍可能不稳定</text><text x="105" y="560" font-weight="700" fill="#765800">Warmup</text><text x="290" y="560" fill="#765800">渐进式启动 → 限制早期激进更新</text></g></g><g fill="none" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"><path d="M600 191V205M600 291V305M600 391V405M600 491V505"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="25.0" width="690.8" height="65.8"/><rect data-figure-safe-zone="text" x="93.0" y="131.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="258.0" y="131.0" width="244.3" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="231.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="288.0" y="231.0" width="244.3" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="331.0" width="59.4" height="47.0"/><rect data-figure-safe-zone="text" x="258.0" y="331.0" width="329.7" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="431.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="278.0" y="431.0" width="359.2" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="531.0" width="77.0" height="47.0"/><rect data-figure-safe-zone="text" x="278.0" y="531.0" width="260.5" height="47.0"/></g></svg>
