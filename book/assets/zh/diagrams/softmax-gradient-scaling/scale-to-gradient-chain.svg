<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">从高维点积尺度到梯度衰减的因果链</title><desc id="desc">在零均值独立近似下，Q 和 K 的高维点积方差随 d_k 增大，典型尺度随根号 d_k 增大，可能令 Softmax 饱和并削弱局部梯度；除以根号 d_k 用于控制这种风险。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#416985}.s{font-size:16px;fill:#5E7F9C}</style></defs><rect width="1200" height="680" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">为什么注意力点积要除以 √d<tspan baseline-shift="sub" font-size="70%">k</tspan>？</text><text x="65" y="103" class="b">下列链条依赖常见的零均值、近似独立统计假设；它描述风险控制，不是绝对定律。</text><g><rect x="65" y="165" width="233" height="214" rx="20" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="92" y="209" class="h">高维点积</text><text x="92" y="243" class="b">Q · K 汇总 d<tspan baseline-shift="sub" font-size="70%">k</tspan> 项</text><text x="92" y="275" class="s">近似下：</text><text x="92" y="310" font-size="21" font-weight="700" fill="#0F4D92">Var(Q · K) ∝ d<tspan baseline-shift="sub" font-size="70%">k</tspan></text><text x="92" y="342" class="s">典型幅度 ∝ √d<tspan baseline-shift="sub" font-size="70%">k</tspan></text><path d="M298 272h73" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="386" y="165" width="233" height="214" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="413" y="209" class="h">进入 Softmax</text><text x="413" y="243" class="b">分数尺度过大时</text><text x="413" y="282" font-size="20" font-weight="700" fill="#765800">指数放大差距</text><text x="413" y="315" class="s">相对排序不变，分布却变尖</text><path d="M619 272h73" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="707" y="165" width="233" height="214" rx="20" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/><text x="734" y="209" class="h">概率饱和</text><text x="734" y="243" class="b">接近 one-hot</text><path d="M744 285h156" stroke="#B64342" stroke-width="17" stroke-linecap="round"/><path d="M744 321h20m25 0h20m25 0h20m25 0h20" stroke="#E0AAA0" stroke-width="8" stroke-linecap="round"/><text x="734" y="354" class="s">多数位置概率接近零</text><path d="M940 272h73" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="1028" y="165" width="107" height="214" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/><text x="1081" y="220" text-anchor="middle" class="h">局部</text><text x="1081" y="249" text-anchor="middle" class="h">梯度</text><text x="1081" y="288" text-anchor="middle" class="b">变小</text><text x="1081" y="322" text-anchor="middle" class="s">Q、K</text><text x="1081" y="344" text-anchor="middle" class="s">更新弱</text></g><path d="M600 400v60" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/><rect x="320" y="475" width="560" height="110" rx="22" fill="#17324D"/><text x="600" y="519" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">缩放点积：QKᵀ / √d<tspan baseline-shift="sub" font-size="70%">k</tspan></text><text x="600" y="551" text-anchor="middle" font-size="18" fill="#CFCECE">把典型输入尺度拉回较稳定范围，降低过早饱和的风险</text><rect x="65" y="616" width="1070" height="39" rx="12" fill="#F6CFCB"/><text x="92" y="642" font-size="16" fill="#8F3635">“降低风险”不表示保证训练稳定；参数分布、优化器、归一化和数值实现也会影响实际表现。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="441.6" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="592.3" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="175.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="80.0" y="214.0" width="160.8" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="246.0" width="81.3" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="277.0" width="187.8" height="52.4"/><rect data-figure-safe-zone="text" x="80.0" y="313.0" width="141.6" height="47.0"/><rect data-figure-safe-zone="text" x="401.0" y="175.0" width="157.3" height="53.7"/><rect data-figure-safe-zone="text" x="401.0" y="214.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="401.0" y="250.0" width="138.0" height="51.0"/><rect data-figure-safe-zone="text" x="401.0" y="286.0" width="210.5" height="47.0"/><rect data-figure-safe-zone="text" x="722.0" y="175.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="722.0" y="214.0" width="127.0" height="47.0"/><rect data-figure-safe-zone="text" x="722.0" y="325.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="1048.1" y="186.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="1048.1" y="215.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="1052.8" y="259.0" width="56.3" height="47.0"/><rect data-figure-safe-zone="text" x="1055.7" y="293.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="1044.8" y="315.0" width="72.4" height="47.0"/><rect data-figure-safe-zone="text" x="480.0" y="483.0" width="240.0" height="56.4"/><rect data-figure-safe-zone="text" x="386.7" y="521.0" width="426.7" height="48.3"/><rect data-figure-safe-zone="text" x="80.0" y="614.0" width="621.1" height="45.6"/></g></svg>
