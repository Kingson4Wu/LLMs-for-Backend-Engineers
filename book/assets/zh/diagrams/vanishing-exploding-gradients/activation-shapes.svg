<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid、ReLU 与 GELU 的函数形状</title><desc id="desc">三个并排坐标卡片比较 Sigmoid 的两端饱和、ReLU 的零点折角，以及 GELU 在负区间的平滑过渡；这些形状决定局部导数如何影响梯度传播。</desc>
  <rect width="1200" height="590" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">激活函数的形状，决定局部梯度能否顺畅传播</text><text x="65" y="104" font-size="19" fill="#5E7F9C">曲线的饱和、硬截断或平滑过渡，都会在反向传播中留下不同的导数条件。</text></g>
  <g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="55" y="145" width="335" height="360" rx="25"/><rect x="432" y="145" width="335" height="360" rx="25"/><rect x="810" y="145" width="335" height="360" rx="25"/></g><g fill="none" stroke="#86AAA1" stroke-width="2"><rect x="59" y="149" width="327" height="352" rx="23"/><rect x="436" y="149" width="327" height="352" rx="23"/><rect x="814" y="149" width="327" height="352" rx="23"/></g>
  <g stroke="#9AB2AB" stroke-width="2"><path d="M95 365H350M222 205V390"/><path d="M472 365H727M599 205V390"/><path d="M850 365H1105M977 205V390"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M100 347C135 347 145 343 164 326C186 305 189 267 222 259C255 251 258 213 281 195C301 180 320 176 345 176" stroke="#B64342" stroke-width="6"/><path d="M477 365H599L722 190" stroke="#FFD700" stroke-width="6"/><path d="M855 349C890 349 906 346 925 333C948 317 949 286 977 267C1005 248 1012 216 1100 178" stroke="#4E8478" stroke-width="6"/></g><g fill="none" stroke-width="2" opacity=".85"><path d="M104 350C141 350 151 346 169 329C190 308 193 270 226 262C259 254 262 216 285 198C305 183 324 179 349 179" stroke="#E19085"/><path d="M481 368H603L726 193" stroke="#D8A919"/><path d="M859 352C894 352 910 349 929 336C952 320 953 289 981 270C1009 251 1016 219 1104 181" stroke="#8BB4AA"/></g>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="26" font-weight="700"><text x="222" y="190" fill="#B64342">Sigmoid</text><text x="599" y="190" fill="#765800">ReLU</text><text x="977" y="190" fill="#285D53">GELU</text></g><g font-size="18" fill="#486A61"><text x="222" y="438">两端饱和，导数趋近 0</text><text x="599" y="438">正区间线性；负区间为 0</text><text x="977" y="438">平滑门控与平滑过渡</text></g></g>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" font-size="17" fill="#5E7F9C"><text x="335" y="382">x</text><text x="712" y="382">x</text><text x="1090" y="382">x</text><text x="201" y="220">y</text><text x="578" y="220">y</text><text x="956" y="220">y</text></g><path d="M88 548H1112" stroke="#FFD700" stroke-width="3"/><path d="M92 551H1108" stroke="#D8A919" stroke-width="2"/><text x="600" y="572" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18" fill="#765800" text-anchor="middle">关注的不是“曲线好看”，而是导数在深层连乘中会被怎样缩小或保留。</text>
