<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">从预测评价到交叉熵的理解路径</title><desc id="desc">评价模型预测先要求正确答案具有高概率；负对数将低概率转为较大惩罚；在 one-hot 经验标签和一致的求和或平均约定下，这与最大化条件对数似然、最小化负对数似然和最小化交叉熵对应。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3775BA"/></marker></defs><rect width="1100" height="670" rx="30" fill="#FFFFFF"/><text x="58" y="66" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#17324D">从“如何评价预测”到交叉熵</text><text x="58" y="94" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#5E7F9C">把直觉、统计目标与信息论损失放在同一条因果链上</text><g font-family="Arial, 'PingFang SC', sans-serif" font-size="21"><g fill="#EEF0EF" stroke="#3775BA" stroke-width="3"><rect x="116" y="124" width="868" height="66" rx="16"/><rect x="120" y="128" width="860" height="58" rx="15" fill="none" stroke="#A7C4BA" stroke-width="1.5"/></g><text x="158" y="166" fill="#26312E">1 · 问题：如何评价模型预测？</text><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="116" y="220" width="868" height="66" rx="16"/><rect x="120" y="224" width="860" height="58" rx="15" fill="none" stroke="#E4BB86" stroke-width="1.5"/></g><text x="158" y="262" fill="#765800">2 · 直觉：正确答案的概率越高越好</text><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="116" y="316" width="868" height="66" rx="16"/><rect x="120" y="320" width="860" height="58" rx="15" fill="none" stroke="#E4BB86" stroke-width="1.5"/></g><text x="158" y="358" fill="#765800">3 · 函数：−log(p) 把低概率转为更大惩罚</text><g fill="#DDF3DE" stroke="#3775BA" stroke-width="3"><rect x="116" y="412" width="868" height="66" rx="16"/><rect x="120" y="416" width="860" height="58" rx="15" fill="none" stroke="#AADCA9" stroke-width="1.5"/></g><text x="158" y="454" fill="#17324D">4 · 统计：最大化条件对数似然</text><g fill="#DDF3DE" stroke="#3775BA" stroke-width="3"><rect x="116" y="508" width="868" height="66" rx="16"/><rect x="120" y="512" width="860" height="58" rx="15" fill="none" stroke="#AADCA9" stroke-width="1.5"/></g><text x="158" y="550" fill="#17324D">5 · 信息论：以经验标签分布计算交叉熵</text></g><g fill="none" stroke="#3775BA" stroke-width="2.5" marker-end="url(#arrow)"><path d="M550 196V216"/><path d="M550 292V312"/><path d="M550 388V408"/><path d="M550 484V504"/></g><rect x="116" y="603" width="868" height="48" rx="14" fill="#FDE9E7"/><text x="550" y="640" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" fill="#B64342">one-hot 经验标签且归约方式一致时：最小化交叉熵 = 最小化 NLL = 最大化对数似然。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="24.0" width="368.7" height="64.5"/><rect data-figure-safe-zone="text" x="46.0" y="65.0" width="388.1" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="137.0" width="238.5" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="233.0" width="278.1" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="329.0" width="332.7" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="425.0" width="245.8" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="521.0" width="310.4" height="47.0"/><rect data-figure-safe-zone="text" x="205.0" y="610.0" width="690.0" height="48.3"/></g></svg>
