<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Transformer 从输入到词表概率的层叠数据流</title><desc id="desc">输入与位置进入重复 Transformer Block；每个 Block 包含注意力、残差归一化、前馈网络和残差归一化，最后 LM Head 产生词表 logits。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1120" height="760" rx="36" fill="#FFFFFF"/><text x="55" y="64" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="30" font-weight="700" fill="#17324D">Transformer：信息路由、非线性变换与稳定堆叠</text><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="330" y="95" width="460" height="60" rx="20"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="305" y="190" width="510" height="68" rx="21"/></g><rect x="210" y="300" width="700" height="320" rx="28" fill="#F4F8FC" stroke="#0F4D92" stroke-width="4"/><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="310" y="365" width="500" height="52" rx="17"/><rect x="360" y="435" width="400" height="43" rx="15"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="310" y="495" width="500" height="52" rx="17"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="360" y="565" width="400" height="43" rx="15"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="330" y="660" width="460" height="60" rx="20"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="560" y="133" font-size="21" fill="#0F4D92">输入序列 [x₁, x₂, …, xₙ]</text><text x="560" y="233" font-size="21" fill="#765800">Token Embedding + 位置机制</text><text x="560" y="340" font-size="24" fill="#0F4D92">Transformer Block × N</text><text x="560" y="398" font-size="20" fill="#0F4D92">多头自注意力：信息路由</text><text x="560" y="463" font-size="19" fill="#0F4D92">Residual + LayerNorm</text><text x="560" y="528" font-size="20" fill="#765800">FFN：每个位置的非线性变换</text><text x="560" y="593" font-size="19" fill="#0F4D92">Residual + LayerNorm</text><text x="560" y="698" font-size="21" fill="#B64342">LM Head → 词表 logits / 概率</text></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M560 155V180M560 258V290M560 417V425M560 478V485M560 547V555M560 608V650"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="22.0" width="625.8" height="64.5"/><rect data-figure-safe-zone="text" x="548.0" y="100.0" width="278.5" height="52.4"/><rect data-figure-safe-zone="text" x="548.0" y="200.0" width="300.4" height="52.4"/><rect data-figure-safe-zone="text" x="548.0" y="304.0" width="286.1" height="56.4"/><rect data-figure-safe-zone="text" x="548.0" y="366.0" width="224.4" height="51.0"/><rect data-figure-safe-zone="text" x="548.0" y="432.0" width="221.6" height="49.7"/><rect data-figure-safe-zone="text" x="548.0" y="496.0" width="255.6" height="51.0"/><rect data-figure-safe-zone="text" x="548.0" y="562.0" width="221.6" height="49.7"/><rect data-figure-safe-zone="text" x="548.0" y="665.0" width="322.2" height="52.4"/></g></svg>
