<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
 <title id="title">多头注意力</title><desc id="desc">一个输入状态投影到多个可学习的查询、键和值子空间。每个头独立计算注意力，结果拼接后由输出投影混合。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1120" height="720" rx="36" fill="#fff"/><text x="52" y="64" font-family="Arial,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#17324D">多头注意力：并行学习关系子空间</text>
 <g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-weight="700" fill="#17324D"><text x="560" y="128" font-size="22">输入状态 X</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="400" y="150" width="320" height="60" rx="18"/><rect x="105" y="295" width="190" height="70" rx="18"/><rect x="340" y="295" width="190" height="70" rx="18"/><rect x="590" y="295" width="190" height="70" rx="18"/><rect x="825" y="295" width="190" height="70" rx="18"/><rect x="390" y="490" width="340" height="64" rx="18"/></g><g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D"><text x="560" y="188">Q、K、V 投影</text><text x="200" y="337">第 1 头注意力</text><text x="435" y="337">第 2 头注意力</text><text x="685" y="337">第 3 头注意力</text><text x="920" y="337">第 h 头注意力</text><text x="560" y="530">拼接 → 输出投影 Wₒ</text><text x="560" y="646" fill="#B64342">混合后的输出表示</text></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M560 135V142M560 212V250H200V285M560 250H435V285M560 250H685V285M560 250H920V285M200 370V425H560M435 370V425M685 370V425M920 370V425H560M560 440V480M560 560V615"/></g>
</svg>
