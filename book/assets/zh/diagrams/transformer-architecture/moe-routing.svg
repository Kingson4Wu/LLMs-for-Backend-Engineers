<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">MoE 在单层内为 token 路由到少数 FFN 专家</title><desc id="desc">一个 token 表示进入路由器，少数被选 FFN 专家处理它并把输出加权合并；未选专家不参与该 token 的计算。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="600" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">MoE：容量增加，但每个 token 只经过少数专家</text><text x="60" y="105" font-size="19" fill="#5E7F9C">这是 Transformer 单层内的稀疏计算，不是应用层按请求选择整套模型。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="250" width="200" height="85" rx="22"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="325" y="250" width="180" height="85" rx="22"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="605" y="145" width="190" height="60" rx="18"/><rect x="605" y="245" width="190" height="60" rx="18"/></g><rect x="605" y="345" width="190" height="60" rx="18" fill="#F6F8FA" stroke="#9AA49F" stroke-width="3" stroke-dasharray="10 8"/><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="915" y="250" width="220" height="85" rx="22"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 292H315"/><path d="M505 292H555V175H595"/><path d="M505 292H595"/><path d="M795 175H865V270H905"/><path d="M795 275H905"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="145" y="303" font-size="22" fill="#0F4D92">token 表示</text><text x="415" y="303" font-size="22" fill="#765800">路由器</text><text x="700" y="182" font-size="19" fill="#0F4D92">FFN 专家 1</text><text x="700" y="282" font-size="19" fill="#0F4D92">FFN 专家 2</text><text x="700" y="382" font-size="18" fill="#8A928F">未选专家</text><text x="1025" y="303" font-size="21" fill="#B64342">加权合并</text></g><path d="M110 470H1090" stroke="#FFD700" stroke-width="3"/><text x="600" y="520" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" fill="#765800" text-anchor="middle">每个 token 只激活少数专家；其他专家对该 token 不计算。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="649.3" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="605.4" height="49.7"/><rect data-figure-safe-zone="text" x="133.0" y="269.0" width="134.4" height="53.7"/><rect data-figure-safe-zone="text" x="403.0" y="269.0" width="86.7" height="53.7"/><rect data-figure-safe-zone="text" x="688.0" y="151.0" width="119.4" height="49.7"/><rect data-figure-safe-zone="text" x="688.0" y="251.0" width="119.4" height="49.7"/><rect data-figure-safe-zone="text" x="688.0" y="352.0" width="92.4" height="48.3"/><rect data-figure-safe-zone="text" x="1013.0" y="270.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="346.5" y="489.0" width="507.0" height="49.7"/></g></svg>
