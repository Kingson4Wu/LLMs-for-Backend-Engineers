<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="730" viewBox="0 0 1020 730" role="img" aria-labelledby="title desc">
 <title id="title">缩放点积注意力</title><desc id="desc">查询和键形成缩放分数；掩码可以限制分数；Softmax 形成权重，权重再组合值。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1020" height="730" rx="36" fill="#fff"/><text x="50" y="66" font-family="Arial,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#17324D">缩放点积注意力</text>
 <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="390" y="115" width="240" height="64" rx="20"/><rect x="390" y="245" width="240" height="64" rx="20"/><rect x="390" y="375" width="240" height="64" rx="20"/><rect x="390" y="505" width="240" height="64" rx="20"/></g><g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="21" font-weight="700" fill="#17324D"><text x="510" y="155">QKᵀ / √d_k</text><text x="510" y="285">加入掩码（可选）</text><text x="510" y="415">Softmax 权重</text><text x="510" y="545">权重 × V</text></g>
 <g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="20" font-weight="700"><text x="245" y="145" fill="#0F4D92">查询 Q</text><text x="775" y="145" fill="#0F4D92">键 K</text><text x="780" y="545" fill="#0F4D92">值 V</text><text x="510" y="650" fill="#B64342">上下文化输出</text></g><g fill="none" stroke="#0F4D92" stroke-width="3.5" marker-end="url(#a)"><path d="M305 140H380"/><path d="M715 140H640"/><path d="M510 180V235"/><path d="M510 310V365"/><path d="M510 440V495"/><path d="M715 540H640"/><path d="M510 570V615"/></g>
</svg>
