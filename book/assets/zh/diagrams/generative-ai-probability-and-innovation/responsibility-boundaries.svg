<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">提示、结构化输出、验证与工具的职责边界</title><desc id="desc">提示词给出目标和背景；结构化输出约束形状；验证器检查可检验条件；失败处理选择修订、重试、拒绝或交给人。</desc><rect width="1200" height="590" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">不同约束，由不同机制承担</text><text x="60" y="105" font-size="19" fill="#5E7F9C">不要让“更好的提示词”承担本应由结构、验证与外部事实机制承担的任务。</text></g><g stroke-width="3"><rect x="52" y="160" width="255" height="290" rx="25" fill="#EAF3FB" stroke="#0F4D92"/><rect x="332" y="160" width="255" height="290" rx="25" fill="#FFF8D6" stroke="#FFD700"/><rect x="612" y="160" width="255" height="290" rx="25" fill="#F4F8FC" stroke="#0F4D92"/><rect x="892" y="160" width="255" height="290" rx="25" fill="#F6CFCB" stroke="#B64342"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="25" font-weight="700"><text x="180" y="215" fill="#0F4D92">提示词</text><text x="460" y="215" fill="#765800">结构化输出</text><text x="740" y="215" fill="#0F4D92">验证器</text><text x="1020" y="215" fill="#B64342">失败处理</text></g><g font-size="20"><text x="180" y="275" fill="#0F4D92">目标与背景</text><text x="460" y="275" fill="#765800">输出形状</text><text x="740" y="275" fill="#0F4D92">可检验条件</text><text x="1020" y="275" fill="#B64342">下一步动作</text></g><g font-size="17" fill="#5E7F9C"><text x="180" y="330">目的、上下文、示例、偏好</text><text x="460" y="330">Schema / grammar</text><text x="740" y="330">程序、词典、测试、检索</text><text x="1020" y="330">修订、重试、拒绝、交给人</text></g></g><path d="M95 500H1105" stroke="#FFD700" stroke-width="3"/><text x="600" y="543" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" fill="#765800" text-anchor="middle">不同机制负责不同约束，组合后才形成可靠系统。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="375.0" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="605.0" height="49.7"/><rect data-figure-safe-zone="text" x="168.0" y="186.0" width="72.4" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="186.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="186.0" width="72.4" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="186.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="168.0" y="246.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="246.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="246.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="246.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="168.0" y="301.0" width="195.9" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="301.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="301.0" width="179.7" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="301.0" width="195.9" height="47.0"/><rect data-figure-safe-zone="text" x="397.6" y="512.0" width="404.8" height="49.7"/></g></svg>
