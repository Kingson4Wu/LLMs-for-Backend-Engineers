<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">模型解释需要转化为可检验主张并由外部证据验证</title><desc id="desc">模型解释先转化为可检验主张，再由外部证据与工具验证，之后才决定是否采纳。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">模型的自我解释，是待验证的主张</text><text x="60" y="105" font-size="19" fill="#5E7F9C">先把叙述变成可检验问题，再让外部证据和工具决定是否可以依赖。</text></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="55" y="220" width="210" height="90" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="350" y="220" width="210" height="90" rx="23"/></g><g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="645" y="205" width="265" height="120" rx="23"/><rect x="995" y="220" width="180" height="90" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M265 265H340"/><path d="M560 265H635"/><path d="M910 265H985"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="160" y="275" font-size="23" fill="#B64342">模型解释</text><text x="455" y="275" font-size="23" fill="#765800">可检验主张</text><text x="777" y="255" font-size="22" fill="#0F4D92">外部证据与</text><text x="777" y="282" font-size="22" fill="#0F4D92">工具验证</text><text x="1085" y="275" font-size="22" fill="#0F4D92">是否采纳</text></g><path d="M110 405H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="455" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" fill="#765800" text-anchor="middle">语言流畅，不等于它描述了真实的因果过程。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="466.2" height="67.2"/><rect da