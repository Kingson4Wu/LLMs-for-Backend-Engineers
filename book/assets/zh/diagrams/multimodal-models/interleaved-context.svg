<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">交错的多模态表示进入同一上下文</title><desc id="desc">文本 token、图像、音频和视频表示按输入顺序交错组织，连同后续问题进入一个 Transformer 上下文。编码器可以不同，统一的是后续计算上下文。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">不同模态的表示，可以交错构成同一轮上下文</text><text x="58" y="105" font-size="18" fill="#5E7F9C">序列中的位置与相邻关系让模型知道“这段文字、这幅图和这个问题”如何共同参与当前计算。</text><path d="M85 270H1110" stroke="#CFCECE" stroke-width="7"/><g stroke-width="3"><rect x="85" y="210" width="165" height="120" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="285" y="210" width="185" height="120" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="505" y="210" width="185" height="120" rx="20" fill="#F6CFCB" stroke="#B64342"/><rect x="725" y="210" width="185" height="120" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="945" y="210" width="170" height="120" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="167" y="258" font-size="21" font-weight="700" fill="#17324D">文字 token</text><text x="167" y="289" font-size="16" fill="#0F4D92">“请看下面”</text><text x="377" y="258" font-size="21" font-weight="700" fill="#765800">图像表示</text><text x="377" y="289" font-size="16" fill="#765800">多个视觉位置</text><text x="597" y="258" font-size="21" font-weight="700" fill="#B64342">音频表示</text><text x="597" y="289" font-size="16" fill="#B64342">时间片段特征</text><text x="817" y="258" font-size="21" font-weight="700" fill="#765800">视频帧表示</text><text x="817" y="289" font-size="16" fill="#765800">时空位置特征</text><text x="1030" y="258" font-size="21" font-weight="700" fill="#17324D">问题 token</text><text x="1030" y="289" font-size="16" fill="#0F4D92">“发生了什么？”</text></g><path d="M600 330V405" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="310" y="430" width="580" height="100" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><text x="600" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">同一个 Transformer 上下文</text><text x="600" y="503" text-anchor="middle" font-size="17" fill="#0F4D92">自注意力或跨注意力接口让当前表示相互影响</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">统一的是后续计算，不是要求文本、图像、音频和视频一开始使用相同编码器。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="599.7" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="711.2" height="48.3"/><rect data-figure-safe-zone="text" x="155.0" y="225.0" width="129.4" height="52.4"/><rect data-figure-safe-zone="text" x="155.0" y="261.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="365.0" y="225.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="365.0" y="261.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="585.0" y="225.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="585.0" y="261.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="805.0" y="225.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="805.0" y="261.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="1018.0" y="225.0" width="129.4" height="52.4"/><rect data-figure-safe-zone="text" x="1018.0" y="261.0" width="125.0" height="45.6"/><rect data-figure-safe-zone="text" x="444.7" y="435.0" width="310.6" height="55.0"/><rect data-figure-safe-zone="text" x="426.5" y="474.0" width="347.0" height="47.0"/><rect data-figure-safe-zone="text" x="304.2" y="562.0" width="591.5" height="48.3"/></g></svg>
