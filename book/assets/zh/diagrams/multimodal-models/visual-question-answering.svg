<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">视觉问答将图像线索与问题放入同一上下文</title><desc id="desc">截图经视觉编码器形成视觉特征，问题经分词形成文本特征；二者在 Transformer 中共同计算，再逐词输出回答。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#506960}.s{font-size:16px;fill:#687972}</style></defs><rect width="1200" height="650" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">视觉问答：图像线索和问题必须在同一上下文中相遇</text><text x="65" y="103" class="b">模型不是先“看懂图片”再独立回答；它在生成时同时利用视觉特征和文字问题。</text><rect x="65" y="155" width="260" height="160" rx="20" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="93" y="197" class="h">视觉输入</text><rect x="93" y="218" width="84" height="60" rx="8" fill="#17324D"/><path d="M105 263l18-18 13 11 20-24 12 31" fill="none" stroke="#E4B76E" stroke-width="5"/><path d="M198 230h91m-91 18h70m-70 18h81" stroke="#94AA9F" stroke-width="7" stroke-linecap="round"/><text x="93" y="299" class="s">截图 → 图块 → 视觉特征</text><rect x="65" y="375" width="260" height="160" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="93" y="417" class="h">文字问题</text><rect x="93" y="438" width="48" height="35" rx="8" fill="#FFF1B8"/><rect x="150" y="438" width="61" height="35" rx="8" fill="#FFF1B8"/><rect x="220" y="438" width="74" height="35" rx="8" fill="#FFF1B8"/><text x="93" y="519" class="s">问题 → token → 文本特征</text><path d="M325 235h110M325 455h110" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/><rect x="450" y="190" width="395" height="310" rx="25" fill="#17324D"/><text x="647" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Transformer 共享上下文</text><rect x="483" y="273" width="329" height="58" rx="12" fill="#0F4D92"/><text x="647" y="309" text-anchor="middle" font-size="18" fill="#FFFFFF">视觉 token  +  问题 token</text><path d="M647 342v42" stroke="#CFCECE" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="483" y="398" width="329" height="64" rx="12" fill="#2C5149"/><text x="647" y="426" text-anchor="middle" font-size="18" fill="#FFFFFF">按上下文计算注意力</text><text x="647" y="449" text-anchor="middle" font-size="16" fill="#CFCECE">决定哪些图像线索支持当前问题</text><path d="M845 345h112" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/><rect x="972" y="264" width="162" height="162" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/><text x="1053" y="309" text-anchor="middle" class="h">文本输出</text><text x="1053" y="342" text-anchor="middle" class="b">逐 token 生成</text><path d="M1006 370h94" stroke="#E9A6A1" stroke-width="7" stroke-linecap="round"/><path d="M1006 390h63" stroke="#E9A6A1" stroke-width="7" stroke-linecap="round"/><rect x="65" y="570" width="1069" height="48" rx="14" fill="#F6CFCB"/><text x="92" y="601" font-size="17" fill="#8F3635">注意：视觉编码器给的是线索而非事实；小图例、遮挡和时间轴仍可能被误读，关键结论应回到原始证据核验。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="709.4" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="576.2" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="163.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="81.0" y="270.0" width="206.2" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="383.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="81.0" y="490.0" width="218.1" height="47.0"/><rect data-figure-safe-zone="text" x="503.1" y="204.0" width="287.8" height="56.4"/><rect data-figure-safe-zone="text" x="521.2" y="279.0" width="251.5" height="48.3"/><rect data-figure-safe-zone="text" x="558.0" y="396.0" width="177.9" height="48.3"/><rect data-figure-safe-zone="text" x="528.6" y="421.0" width="236.8" height="45.6"/><rect data-figure-safe-zone="text" x="999.2" y="275.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="985.8" y="313.0" width="134.3" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="572.0" width="778.8" height="47.0"/></g></svg>
