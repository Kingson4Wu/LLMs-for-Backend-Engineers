<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">跨模态训练信号的三层作用</title><desc id="desc">配对或交错材料学习模态对应，条件目标学习从输入产生输出，任务行为信号塑造有用且安全的面向用户输出。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.k{font-size:17px;font-weight:700}.h{font-size:23px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#416985}.s{font-size:16px;fill:#687972}</style></defs><rect width="1200" height="650" fill="#FFFFFF"/><text x="68" y="68" font-size="32" font-weight="700" fill="#17324D">跨模态能力来自三类互补的训练信号</text><text x="68" y="103" class="b">它们分别回答：什么彼此对应、如何从输入生成、什么行为对用户有用。</text><path d="M600 157v337" stroke="#B9CBC2" stroke-width="5" stroke-dasharray="9 10"/><rect x="68" y="145" width="464" height="142" rx="20" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><circle cx="110" cy="188" r="21" fill="#0F4D92"/><text x="110" y="195" text-anchor="middle" class="k" fill="#FFFFFF">1</text><text x="150" y="190" class="h">对齐信号</text><text x="150" y="221" class="b">图文、音文、视频文字、混合文档</text><text x="150" y="251" class="s">学习内容、位置与时间上的对应关系</text><path d="M532 216h112" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="668" y="145" width="464" height="142" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><circle cx="710" cy="188" r="21" fill="#FFD700"/><text x="710" y="195" text-anchor="middle" class="k" fill="#FFFFFF">2</text><text x="750" y="190" class="h">条件生成信号</text><text x="750" y="221" class="b">给定若干模态，预测文字或另一模态</text><text x="750" y="251" class="s">学习怎样使用输入线索产生目标输出</text><path d="M600 287v70" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="368" y="373" width="464" height="142" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/><circle cx="410" cy="416" r="21" fill="#B64342"/><text x="410" y="423" text-anchor="middle" class="k" fill="#FFFFFF">3</text><text x="450" y="418" class="h">任务行为信号</text><text x="450" y="449" class="b">指令、偏好、验证与安全反馈</text><text x="450" y="479" class="s">塑造能围绕用户任务组织输出的行为</text><rect x="68" y="563" width="1064" height="48" rx="14" fill="#F6CFCB"/><text x="94" y="594" font-size="17" fill="#8F3635">配对资料本身不会自动教会具体问答；目标、任务和评测都要覆盖希望模型利用的跨模态关系。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="56.0" y="24.0" width="510.4" height="67.2"/><rect data-figure-safe-zone="text" x="56.0" y="74.0" width="511.6" height="47.0"/><rect data-figure-safe-zone="text" x="90.0" y="166.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="138.0" y="156.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="138.0" y="192.0" width="244.3" height="47.0"/><rect data-figure-safe-zone="text" x="138.0" y="222.0" width="275.1" height="47.0"/><rect data-figure-safe-zone="text" x="690.0" y="166.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="738.0" y="156.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="738.0" y="192.0" width="275.1" height="47.0"/><rect data-figure-safe-zone="text" x="738.0" y="222.0" width="282.4" height="47.0"/><rect data-figure-safe-zone="text" x="390.0" y="394.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="438.0" y="384.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="438.0" y="420.0" width="219.3" height="47.0"/><rect data-figure-safe-zone="text" x="438.0" y="450.0" width="282.4" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="565.0" width="680.4" height="47.0"/></g></svg>
