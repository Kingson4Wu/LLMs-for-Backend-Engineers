<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">多模态输入在共享上下文中融合</title><desc id="desc">文本、图像、音频和视频各经适合的编码器或投影进入共享 Transformer 上下文，随后由适用输出头或解码器产生相应模态。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">多模态：各自编码，在同一计算上下文中融合</text><text x="58" y="105" font-size="18" fill="#5E7F9C">不同模态先转为可被模型消费的表示；“支持输入”不自动意味着能生成对应模态或理解现实世界全部细节。</text><g stroke-width="3"><rect x="55" y="165" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="260" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="355" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="450" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="325" y="165" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="260" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="355" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="450" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="610" y="245" width="250" height="190" rx="28" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/></g><g text-anchor="middle"><text x="150" y="210" font-size="21" font-weight="700" fill="#17324D">文本</text><text x="150" y="305" font-size="21" font-weight="700" fill="#17324D">图像</text><text x="150" y="400" font-size="21" font-weight="700" fill="#17324D">音频</text><text x="150" y="495" font-size="21" font-weight="700" fill="#17324D">视频</text><text x="427" y="210" font-size="18" fill="#765800">Tokenizer / Embedding</text><text x="427" y="305" font-size="19" fill="#765800">视觉编码器 + 投影</text><text x="427" y="400" font-size="19" fill="#765800">音频编码器 + 投影</text><text x="427" y="495" font-size="19" fill="#765800">视频编码器 + 投影</text><text x="735" y="310" font-size="25" font-weight="700" fill="#17324D">核心 Transformer</text><text x="735" y="347" font-size="18" fill="#0F4D92">交错的多模态表示</text><text x="735" y="376" font-size="18" fill="#0F4D92">在同一上下文相互影响</text></g><g fill="none" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"><path d="M245 202H315"/><path d="M245 297H315"/><path d="M245 392H315"/><path d="M245 487H315"/><path d="M530 202H570V290H600"/><path d="M530 297H600"/><path d="M530 392H570V390H600"/><path d="M530 487H570V410H600"/><path d="M870 330H890"/></g><g stroke-width="3" fill="#F6CFCB"><rect x="895" y="190" width="245" height="74" rx="18" stroke="#B64342"/><rect x="895" y="290" width="245" height="74" rx="18" stroke="#B64342"/><rect x="895" y="390" width="245" height="74" rx="18" stroke="#B64342"/></g><g text-anchor="middle"><text x="1018" y="236" font-size="19" font-weight="700" fill="#B64342">文本 token → 文字</text><text x="1018" y="326" font-size="18" font-weight="700" fill="#B64342">音频 token／</text><text x="1018" y="350" font-size="18" font-weight="700" fill="#B64342">解码器 → 声音</text><text x="1018" y="426" font-size="18" font-weight="700" fill="#B64342">图像／视频表示</text><text x="1018" y="450" font-size="18" font-weight="700" fill="#B64342">+ 解码器</text></g><text x="600" y="585" text-anchor="middle" font-size="18" fill="#5E7F9C">模块是职责划分：具体产品的模态、编码器、投影器与输出能力可不同。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="586.3" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="813.8" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="177.0" width="63.9" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="272.0" width="63.9" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="367.0" width="63.9" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="462.0" width="63.9" height="52.4"/><rect data-figure-safe-zone="text" x="415.0" y="180.0" width="220.6" height="48.3"/><rect data-figure-safe-zone="text" x="415.0" y="274.0" width="180.0" height="49.7"/><rect data-figure-safe-zone="text" x="415.0" y="369.0" width="180.0" height="49.7"/><rect data-figure-safe-zone="text" x="415.0" y="464.0" width="180.0" height="49.7"/><rect data-figure-safe-zone="text" x="723.0" y="273.0" width="227.5" height="57.8"/><rect data-figure-safe-zone="text" x="723.0" y="317.0" width="160.8" height="48.3"/><rect data-figure-safe-zone="text" x="723.0" y="346.0" width="195.0" height="48.3"/><rect data-figure-safe-zone="text" x="1006.0" y="205.0" width="185.1" height="49.7"/><rect data-figure-safe-zone="text" x="1006.0" y="296.0" width="123.7" height="48.3"/><rect data-figure-safe-zone="text" x="1006.0" y="320.0" width="137.6" height="48.3"/><rect data-figure-safe-zone="text" x="1006.0" y="396.0" width="136.0" height="48.3"/><rect data-figure-safe-zone="text" x="1006.0" y="420.0" width="94.0" height="48.3"/><rect data-figure-safe-zone="text" x="329.9" y="555.0" width="540.2" height="48.3"/></g></svg>
