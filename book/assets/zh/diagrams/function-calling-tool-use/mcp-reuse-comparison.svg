<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">MCP 如何减少重复集成</title><desc id="desc">左侧显示没有共同协议时三个项目各自重复适配文件能力；右侧显示兼容客户端复用一个 MCP server，且每次部署仍要独立审查。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">共同协议减少重复适配，不替代逐次审查</text><text x="58" y="105" font-size="18" fill="#5E7F9C">MCP 让兼容客户端和服务器交换能力定义；它不会替你信任代码或授予数据访问权。</text>
    <rect x="54" y="148" width="510" height="354" rx="25" fill="#FFFFFF" stroke="#B64342" stroke-width="3"/><rect x="636" y="148" width="510" height="354" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/>
    <text x="309" y="193" text-anchor="middle" font-size="23" font-weight="700" fill="#B64342">没有共同接入契约</text><text x="891" y="193" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">有 MCP 兼容契约</text>
    <g stroke="#B64342" stroke-width="3" fill="#F6CFCB"><rect x="95" y="225" width="190" height="65" rx="15"/><rect x="95" y="316" width="190" height="65" rx="15"/><rect x="95" y="407" width="190" height="65" rx="15"/></g>
    <g text-anchor="middle"><text x="190" y="258" font-size="19" font-weight="700" fill="#B64342">项目 A</text><text x="190" y="280" font-size="15" fill="#B64342">自写文件接入</text><text x="190" y="349" font-size="19" font-weight="700" fill="#B64342">项目 B</text><text x="190" y="371" font-size="15" fill="#B64342">再写一套接入</text><text x="190" y="440" font-size="19" font-weight="700" fill="#B64342">项目 C</text><text x="190" y="462" font-size="15" fill="#B64342">继续重复适配</text></g>
    <g fill="none" stroke="#B64342" stroke-width="3" marker-end="url(#a)"><path d="M285 257H425"/><path d="M285 348H425"/><path d="M285 439H425"/></g>
    <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="425" y="225" width="100" height="65" rx="15"/><rect x="425" y="316" width="100" height="65" rx="15"/><rect x="425" y="407" width="100" height="65" rx="15"/></g><g text-anchor="middle" font-size="16" font-weight="700" fill="#765800"><text x="475" y="263">重复实现</text><text x="475" y="354">重复实现</text><text x="475" y="445">重复实现</text></g>
    <rect x="805" y="232" width="175" height="85" rx="18" fill="#FFF8D6" stroke="#FFD700" stroke-width="3"/><text x="892" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#765800">filesystem</text><text x="892" y="294" text-anchor="middle" font-size="17" fill="#765800">MCP server</text>
    <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="676" y="373" width="120" height="65" rx="15"/><rect x="832" y="373" width="120" height="65" rx="15"/><rect x="988" y="373" width="120" height="65" rx="15"/></g><g text-anchor="middle" font-size="18" font-weight="700" fill="#17324D"><text x="736" y="413">项目 A</text><text x="892" y="413">项目 B</text><text x="1048" y="413">项目 C</text></g>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M850 317L756 363"/><path d="M892 317V363"/><path d="M935 317L1028 363"/></g>
    <text x="891" y="472" text-anchor="middle" font-size="16" fill="#5E7F9C">一个已描述的能力，供兼容客户端发现并复用</text>
    <rect x="195" y="544" width="810" height="55" rx="16" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="578" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">每个项目仍须审查：代码来源、身份认证、可访问数据与副作用。</text>
  </g>
