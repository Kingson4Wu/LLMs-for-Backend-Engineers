<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">由观察驱动的 Agent 反馈循环</title><desc id="desc">任务和状态组成上下文，模型提出步骤；程序验证并执行工具，结果和错误更新状态，令下一轮行动发生改变。运行时依据显式停止条件控制循环。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">观察改变下一步行动，运行时控制循环边界</text><text x="58" y="105" font-size="18" fill="#5E7F9C">“Agent”不是固定的模型人格：它是提议、受控行动、外部观察和显式状态更新构成的运行过程。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M235 255H285"/><path d="M485 255H535"/><path d="M735 255H785"/><path d="M985 255V395H150V335"/></g><g stroke-width="3"><rect x="45" y="175" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="285" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="535" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="785" y="175" width="200" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/></g><g text-anchor="middle"><text x="140" y="226" font-size="22" font-weight="700" fill="#17324D">任务与显式状态</text><text x="140" y="259" font-size="16" fill="#0F4D92">目标、证据、进度、</text><text x="140" y="285" font-size="16" fill="#0F4D92">预算、已有观察</text><text x="385" y="226" font-size="22" font-weight="700" fill="#765800">组装上下文</text><text x="385" y="259" font-size="16" fill="#765800">选择本轮相关信息、</text><text x="385" y="285" font-size="16" fill="#765800">能力与约束</text><text x="635" y="226" font-size="22" font-weight="700" fill="#17324D">模型提议下一步</text><text x="635" y="259" font-size="16" fill="#0F4D92">回答、调用、</text><text x="635" y="285" font-size="16" fill="#0F4D92">搜索或停止建议</text><text x="885" y="226" font-size="22" font-weight="700" fill="#B64342">校验与行动</text><text x="885" y="259" font-size="16" fill="#B64342">授权、限额、执行</text><text x="885" y="285" font-size="16" fill="#B64342">并观察外部结果</text></g><rect x="300" y="430" width="600" height="88" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="466" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">结果、错误、环境状态 → 更新下一轮的显式状态</text><text x="600" y="497" text-anchor="middle" font-size="17" fill="#765800">每一轮都可因新观察改变后续输入、计划和是否继续。</text><rect x="170" y="555" width="860" height="45" rx="14" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="584" text-anchor="middle" font-size="17" font-weight="700" fill="#B64342">停止：目标经验证达成、无法继续、预算耗尽，或需要人工审批。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="570.2" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="725.5" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="192.0" width="170.3" height="53.7"/><rect data-figure-safe-zone="text" x="128.0" y="231.0" width="140.2" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="257.0" width="123.5" height="45.6"/><rect data-figure-safe-zone="text" x="373.0" y="192.0" width="128.5" height="53.7"/><rect data-figure-safe-zone="text" x="373.0" y="231.0" width="153.9" height="45.6"/><rect data-figure-safe-zone="text" x="373.0" y="257.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="623.0" y="192.0" width="170.3" height="53.7"/><rect data-figure-safe-zone="text" x="623.0" y="231.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="623.0" y="257.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="873.0" y="192.0" width="128.5" height="53.7"/><rect data-figure-safe-zone="text" x="873.0" y="231.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="873.0" y="257.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="381.2" y="433.0" width="437.7" height="52.4"/><rect data-figure-safe-zone="text" x="401.5" y="468.0" width="397.0" height="47.0"/><rect data-figure-safe-zone="text" x="372.1" y="555.0" width="455.8" height="47.0"/></g></svg>
