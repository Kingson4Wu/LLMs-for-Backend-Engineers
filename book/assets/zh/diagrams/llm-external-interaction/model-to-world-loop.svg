<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">模型生成与外部世界动作的边界</title><desc id="desc">资料和工具契约构成上下文，模型生成文字或结构化提议；只有程序验证、授权和执行才可改变外部状态，结果再回到上下文。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">模型提出下一步；执行环境才会改变外部世界</text><text x="58" y="105" font-size="18" fill="#5E7F9C">生成文本、提出调用和实际动作是三个不同层次，权限与结果必须由程序和外部状态证明。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 260H305"/><path d="M505 260H565"/><path d="M765 260H825"/><path d="M925 340V415H150V335"/></g><g stroke-width="3"><rect x="55" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="305" y="180" width="200" height="155" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="565" y="180" width="200" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="825" y="180" width="200" height="155" rx="22" fill="#F6CFCB" stroke="#B64342"/></g><g text-anchor="middle"><text x="150" y="230" font-size="21" font-weight="700" fill="#17324D">任务与材料</text><text x="150" y="263" font-size="16" fill="#0F4D92">规则、历史、资料</text><text x="150" y="289" font-size="16" fill="#0F4D92">工具契约</text><text x="405" y="230" font-size="21" font-weight="700" fill="#765800">当前上下文</text><text x="405" y="263" font-size="16" fill="#765800">应用选择本轮</text><text x="405" y="289" font-size="16" fill="#765800">可见信息与约束</text><text x="665" y="230" font-size="21" font-weight="700" fill="#17324D">LLM 解码</text><text x="665" y="263" font-size="16" fill="#0F4D92">文字回答或</text><text x="665" y="289" font-size="16" fill="#0F4D92">结构化提议</text><text x="925" y="230" font-size="21" font-weight="700" fill="#B64342">程序执行器</text><text x="925" y="263" font-size="16" fill="#B64342">校验、授权、执行</text><text x="925" y="289" font-size="16" fill="#B64342">观察外部结果</text></g><rect x="330" y="440" width="540" height="88" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="476" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">结果、错误与外部状态回到下一轮上下文</text><text x="600" y="507" text-anchor="middle" font-size="17" fill="#765800">文字可以直接呈现给用户；真正的外部副作用只能经过受控执行器。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">模型输出不等于获得权限，模型自述也不等于外部动作已经完成。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="599.7" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="684.8" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="197.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="235.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="261.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="197.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="393.0" y="235.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="261.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="197.0" width="107.6" height="52.4"/><rect data-figure-safe-zone="text" x="653.0" y="235.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="261.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="197.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="913.0" y="235.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="261.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="413.0" y="443.0" width="374.1" height="52.4"/><rect data-figure-safe-zone="text" x="353.1" y="478.0" width="493.9" height="47.0"/><rect data-figure-safe-zone="text" x="347.8" y="562.0" width="504.4" height="48.3"/></g></svg>
