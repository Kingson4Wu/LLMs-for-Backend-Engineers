<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">工具调用的提议、执行与结果回传</title><desc id="desc">用户问题和工具契约进入模型，模型提议调用；应用验证并以自己的身份访问工具，工具结果返回模型后形成用户可读答案。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">工具调用是“提议—受控执行—结果回传”的协议</text><text x="58" y="105" font-size="18" fill="#5E7F9C">模型可组织请求；认证身份、权限检查、网络调用和结果真实性仍由应用与工具系统负责。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 255H305"/><path d="M505 255H565"/><path d="M765 255H825"/><path d="M925 335V400H765"/><path d="M565 440H505"/><path d="M305 440H245"/></g><g stroke-width="3"><rect x="55" y="175" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="305" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="565" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="825" y="175" width="200" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="565" y="400" width="200" height="85" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="400" width="190" height="85" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="150" y="226" font-size="21" font-weight="700" fill="#17324D">用户问题</text><text x="150" y="259" font-size="16" fill="#0F4D92">例如查询</text><text x="150" y="285" font-size="16" fill="#0F4D92">仓库实际库存</text><text x="405" y="226" font-size="21" font-weight="700" fill="#765800">应用 → 模型</text><text x="405" y="259" font-size="16" fill="#765800">问题 + 工具 Schema</text><text x="405" y="285" font-size="16" fill="#765800">与调用约束</text><text x="665" y="226" font-size="21" font-weight="700" fill="#17324D">模型 → 应用</text><text x="665" y="259" font-size="16" fill="#0F4D92">结构化调用提议</text><text x="665" y="285" font-size="16" fill="#0F4D92">及其参数</text><text x="925" y="226" font-size="21" font-weight="700" fill="#B64342">库存服务</text><text x="925" y="259" font-size="16" fill="#B64342">应用校验、授权后</text><text x="925" y="285" font-size="16" fill="#B64342">以受认证身份访问</text><text x="665" y="436" font-size="21" font-weight="700" fill="#17324D">工具结果</text><text x="665" y="463" font-size="16" fill="#0F4D92">实际可用库存：24</text><text x="150" y="436" font-size="21" font-weight="700" fill="#17324D">用户可读回答</text><text x="150" y="463" font-size="16" fill="#0F4D92">“当前可用 24 件”</text></g><text x="600" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">模型不直接访问服务；应用也不能把模型提议当作已授权、已成功的结果。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="618.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="677.0" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="193.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="231.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="257.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="193.0" width="136.6" height="52.4"/><rect data-figure-safe-zone="text" x="393.0" y="231.0" width="168.0" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="257.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="193.0" width="136.6" height="52.4"/><rect data-figure-safe-zone="text" x="653.0" y="231.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="257.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="193.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="913.0" y="231.0" width="138.7" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="257.0" width="145.6" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="403.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="653.0" y="435.0" width="140.2" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="403.0" width="143.7" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="435.0" width="149.9" height="45.6"/><rect data-figure-safe-zone="text" x="317.5" y="540.0" width="565.1" height="48.3"/></g></svg>
