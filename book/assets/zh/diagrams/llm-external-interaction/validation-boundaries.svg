<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">模型提议到真实业务动作的四层检查</title><desc id="desc">模型提议必须依次通过结构、业务语义、授权策略和执行终态检查。各层不能被其他层替代。</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">结构化提议到真实动作之间，仍有四层独立检查</text><text x="58" y="105" font-size="18" fill="#5E7F9C">“能解析”只说明形式通过；合理、被授权、完成了目标都需要后续不同证据。</text><rect x="70" y="175" width="220" height="330" rx="26" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/><text x="180" y="305" text-anchor="middle" font-size="28" font-weight="700" fill="#17324D">模型提议</text><text x="180" y="341" text-anchor="middle" font-size="17" fill="#0F4D92">调用名、参数、</text><text x="180" y="367" text-anchor="middle" font-size="17" fill="#0F4D92">结构化候选</text><g stroke-width="3"><rect x="375" y="150" width="735" height="78" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="375" y="245" width="735" height="78" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="375" y="340" width="735" height="78" rx="20" fill="#F6CFCB" stroke="#B64342"/><rect x="375" y="435" width="735" height="78" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g><text x="410" y="184" font-size="21" font-weight="700" fill="#765800">1 · 语法与结构</text><text x="650" y="184" font-size="18" fill="#765800">可解析？字段齐全？类型正确？</text><text x="410" y="279" font-size="21" font-weight="700" fill="#17324D">2 · 语义与业务</text><text x="650" y="279" font-size="18" fill="#0F4D92">订单、金额、对象和状态合理吗？</text><text x="410" y="374" font-size="21" font-weight="700" fill="#B64342">3 · 授权与策略</text><text x="650" y="374" font-size="18" fill="#B64342">此主体被允许吗？需要审批或额外条件吗？</text><text x="410" y="469" font-size="21" font-weight="700" fill="#17324D">4 · 执行与终态</text><text x="650" y="469" font-size="18" fill="#0F4D92">下游成功了吗？目标状态实际满足了吗？</text></g><path d="M290 340H360" stroke="#0F4D92" stroke-width="5"/><text x="600" y="584" text-anchor="middle" font-size="19" font-weight="700" fill="#B64342">合法 JSON ≠ 业务正确 ≠ 获得授权 ≠ 外部世界已经完成动作。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="629.1" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="576.1" height="48.3"/><rect data-figure-safe-zone="text" x="114.8" y="265.0" width="130.4" height="61.8"/><rect data-figure-safe-zone="text" x="118.8" y="312.0" width="122.4" height="47.0"/><rect data-figure-safe-zone="text" x="127.6" y="338.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="151.0" width="167.4" height="52.4"/><rect data-figure-safe-zone="text" x="638.0" y="154.0" width="240.2" height="48.3"/><rect data-figure-safe-zone="text" x="398.0" y="246.0" width="167.4" height="52.4"/><rect data-figure-safe-zone="text" x="638.0" y="249.0" width="257.3" height="48.3"/><rect data-figure-safe-zone="text" x="398.0" y="341.0" width="167.4" height="52.4"/><rect data-figure-safe-zone="text" x="638.0" y="344.0" width="333.4" height="48.3"/><rect data-figure-safe-zone="text" x="398.0" y="436.0" width="167.4" height="52.4"/><rect data-figure-safe-zone="text" x="638.0" y="439.0" width="316.3" height="48.3"/><rect data-figure-safe-zone="text" x="333.4" y="553.0" width="533.2" height="49.7"/></g></svg>
