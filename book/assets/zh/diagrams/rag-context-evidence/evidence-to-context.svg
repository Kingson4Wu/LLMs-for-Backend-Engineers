<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc"><title id="title">RAG 将外部证据带入当前上下文</title><desc id="desc">问题经检索和查询选出少量证据，与模型参数共同构成当前上下文来生成答案。外部资料带有版本、来源、权限与业务状态。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="620" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">RAG 的职责：为这一轮选择可用证据</text><text x="60" y="105" font-size="19" fill="#5E7F9C">已训练参数提供规律；外部资料提供当前可查询、可追溯、受权限约束的事实记录。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="40" y="240" width="175" height="88" rx="23"/><rect x="820" y="240" width="180" height="88" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="280" y="240" width="210" height="88" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="555" y="240" width="200" height="88" rx="23"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="1065" y="240" width="110" height="88" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M215 284H270"/><path d="M490 284H545"/><path d="M755 284H810"/><path d="M1000 284H1055"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="127" y="294" font-size="22" fill="#0F4D92">问题</text><text x="385" y="278" font-size="21" fill="#765800">检索与查询</text><text x="385" y="304" font-size="16" fill="#765800">按任务缩小候选</text><text x="655" y="278" font-size="21" fill="#B64342">少量证据</text><text x="655" y="304" font-size="16" fill="#B64342">原文、记录、来源</text><text x="910" y="294" font-size="21" fill="#0F4D92">当前上下文</text><text x="1120" y="294" font-size="21" fill="#0F4D92">生成</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="425" y="440" width="430" height="74" rx="22"/></g><text x="640" y="472" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#765800" text-anchor="middle">外部资料：版本、来源、权限、业务状态</text><text x="640" y="498" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" fill="#765800" text-anchor="middle">它们决定这轮能否作为可用证据进入上下文。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="502.4" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="659.2" height="49.7"/><rect data-figure-safe-zone="text" x="115.0" y="260.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="373.0" y="245.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="373.0" y="276.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="643.0" y="245.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="643.0" y="276.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="898.0" y="261.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="1108.0" y="261.0" width="63.9" height="52.4"/><rect data-figure-safe-zone="text" x="474.2" y="440.0" width="331.6" height="51.0"/><rect data-figure-safe-zone="text" x="479.4" y="470.0" width="321.1" height="45.6"/></g></svg>
