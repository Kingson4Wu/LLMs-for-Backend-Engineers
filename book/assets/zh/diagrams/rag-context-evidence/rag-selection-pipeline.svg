<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RAG 选择链：每一步缩小候选范围</title>
  <desc id="desc">资料被准备和索引后，围绕问题召回候选；随后按访问条件过滤、重排去重，最终将少量带条件的证据组装进上下文，并检查生成结果。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">从资料到回答：RAG 连续缩小候选范围</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">每次选择都要保留来源、版本、访问范围和业务条件。</text>
    <path d="M72 262H1120" fill="none" stroke="#D7DDD6" stroke-width="3"/>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)"><path d="M225 262H280"/><path d="M470 262H525"/><path d="M730 262H785"/><path d="M975 262H1025"/></g>
    <g stroke-width="3"><rect x="72" y="190" width="153" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="280" y="190" width="190" height="145" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="190" width="205" height="145" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="785" y="190" width="190" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1025" y="190" width="110" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g>
    <g text-anchor="middle">
      <text x="148" y="236" font-size="20" font-weight="700" fill="#17324D">资料源</text><text x="148" y="269" font-size="16" fill="#0F4D92">文档、记录、</text><text x="148" y="293" font-size="16" fill="#0F4D92">业务数据</text>
      <text x="375" y="228" font-size="20" font-weight="700" fill="#765800">准备与召回</text><text x="375" y="259" font-size="16" fill="#765800">清理 · 版本化</text><text x="375" y="284" font-size="16" fill="#765800">切分 · 标注 · 索引</text><text x="375" y="310" font-size="16" fill="#765800">按问题取候选</text>
      <text x="627" y="228" font-size="20" font-weight="700" fill="#B64342">筛选与重排</text><text x="627" y="259" font-size="16" fill="#B64342">权限 · 时间 · 版本</text><text x="627" y="284" font-size="16" fill="#B64342">业务条件 · 冲突</text><text x="627" y="310" font-size="16" fill="#B64342">重排 · 去重</text>
      <text x="880" y="236" font-size="20" font-weight="700" fill="#17324D">证据上下文</text><text x="880" y="269" font-size="16" fill="#0F4D92">少量、相关、</text><text x="880" y="293" font-size="16" fill="#0F4D92">可追溯的证据</text>
      <text x="1080" y="236" font-size="20" font-weight="700" fill="#17324D">生成</text><text x="1080" y="269" font-size="16" fill="#0F4D92">与检查</text>
    </g>
    <path d="M375 350V402H627V350" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="275" y="425" width="650" height="120" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="464" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">候选在变少，证据条件不能丢</text><text x="600" y="495" text-anchor="middle" font-size="17" fill="#765800">把前几个结果直接塞给模型，会绕过授权、时效、</text><text x="600" y="520" text-anchor="middle" font-size="17" fill="#765800">冲突和相关性判断。</text>
    <path d="M925 545H1010V350" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)" data-figure-connector="true"/>
    <text x="600" y="596" text-anchor="middle" font-size="18" fill="#5E7F9C">检索负责缩小候选；程序仍须验证引用、权限与外部终态。</text>
  </g>
<g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="516.9" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="411.2" height="48.3"/><rect data-figure-safe-zone="text" x="136.0" y="204.0" width="81.0" height="51.0"/><rect data-figure-safe-zone="text" x="136.0" y="241.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="136.0" y="265.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="196.0" width="119.0" height="51.0"/><rect data-figure-safe-zone="text" x="363.0" y="231.0" width="125.0" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="256.0" width="165.1" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="282.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="196.0" width="119.0" height="51.0"/><rect data-figure-safe-zone="text" x="615.0" y="231.0" width="165.1" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="256.0" width="140.2" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="282.0" width="109.8" height="45.6"/><rect data-figure-safe-zone="text" x="868.0" y="204.0" width="119.0" height="51.0"/><rect data-figure-safe-zone="text" x="868.0" y="241.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="868.0" y="265.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="1068.0" y="204.0" width="62.0" height="51.0"/><rect data-figure-safe-zone="text" x="1068.0" y="241.0" width="69.6" height="45.6"/><rect data-figure-safe-zone="text" x="462.8" y="431.0" width="274.3" height="52.4"/><rect data-figure-safe-zone="text" x="421.3" y="466.0" width="357.4" height="47.0"/><rect data-figure-safe-zone="text" x="519.0" y="491.0" width="162.0" height="47.0"/><rect data-figure-safe-zone="text" x="377.3" y="566.0" width="445.4" height="48.3"/></g></svg>
