<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">模型服务扩容从负载信号到接入流量</title><desc id="desc">控制面依据多种负载信号确认扩容需求，分配设备，加载并预热模型，完成健康检查后才接入流量。扩容有明显的准备时间。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">模型服务扩容不是瞬时启动一个 Web 副本</text><text x="58" y="105" font-size="18" fill="#5E7F9C">加载权重、分配显存和预热带来滞后，因此扩容策略必须在队列已爆满之前预测需求。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 260H280"/><path d="M470 260H525"/><path d="M715 260H770"/><path d="M960 260H1015"/></g><g stroke-width="3"><rect x="55" y="180" width="170" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="280" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="180" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="770" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="1015" y="180" width="130" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="140" y="226" font-size="21" font-weight="700" fill="#B64342">负载信号</text><text x="140" y="259" font-size="16" fill="#B64342">队列、TTFT、显存、</text><text x="140" y="285" font-size="16" fill="#B64342">请求率、上下文长度</text><text x="375" y="226" font-size="21" font-weight="700" fill="#765800">确认窗口</text><text x="375" y="259" font-size="16" fill="#765800">避免短暂尖峰</text><text x="375" y="285" font-size="16" fill="#765800">造成频繁抖动</text><text x="620" y="226" font-size="21" font-weight="700" fill="#17324D">分配设备</text><text x="620" y="259" font-size="16" fill="#0F4D92">GPU、显存、</text><text x="620" y="285" font-size="16" fill="#0F4D92">网络和副本槽位</text><text x="865" y="226" font-size="21" font-weight="700" fill="#765800">加载并预热</text><text x="865" y="259" font-size="16" fill="#765800">权重、运行时、</text><text x="865" y="285" font-size="16" fill="#765800">典型路径预热</text><text x="1080" y="226" font-size="20" font-weight="700" fill="#17324D">健康检查</text><text x="1080" y="259" font-size="15" fill="#0F4D92">通过后</text><text x="1080" y="285" font-size="15" fill="#0F4D92">接入流量</text></g><rect x="205" y="430" width="790" height="90" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="466" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">容量策略必须匹配真实瓶颈，而非只看一个 CPU 或 QPS 指标</text><text x="600" y="498" text-anchor="middle" font-size="17" fill="#765800">不同模型、上下文分布、KV 复用和生成长度会让同样 QPS 对应不同资源压力。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">扩容来得太晚时，排队与超时已经伤害用户；过早或频繁扩容则浪费昂贵容量。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="575.8" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="650.6" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="193.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="128.0" y="231.0" width="143.0" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="257.0" width="153.9" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="193.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="363.0" y="231.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="257.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="193.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="608.0" y="231.0" width="96.0" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="257.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="193.0" width="123.8" height="52.4"/><rect data-figure-safe-zone="text" x="853.0" y="231.0" width="116.6" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="257.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="1068.0" y="194.0" width="100.0" height="51.0"/><rect data-figure-safe-zone="text" x="1068.0" y="232.0" width="66.8" height="44.2"/><rect data-figure-safe-zone="text" x="1068.0" y="258.0" width="81.0" height="44.2"/><rect data-figure-safe-zone="text" x="318.5" y="433.0" width="563.1" height="52.4"/><rect data-figure-safe-zone="text" x="313.3" y="469.0" width="573.4" height="47.0"/><rect data-figure-safe-zone="text" x="300.4" y="562.0" width="599.3" height="48.3"/></g></svg>
