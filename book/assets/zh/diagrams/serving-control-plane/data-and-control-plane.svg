<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">模型服务的数据面与控制面</title><desc id="desc">数据面承接请求、排队和模型推理生成流式响应。控制面跨越数据面组件，维护模型选择、限额、扩缩容、发布和可观测性。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">数据面执行请求；控制面维护长期服务承诺</text><text x="58" y="105" font-size="18" fill="#5E7F9C">两种职责可部署在同一进程或不同系统；概念边界在于它们解决的时间尺度和决策类型。</text><rect x="100" y="155" width="1000" height="122" rx="24" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="135" y="195" font-size="22" font-weight="700" fill="#765800">控制面</text><text x="310" y="195" font-size="18" fill="#765800">模型／版本选择</text><text x="535" y="195" font-size="18" fill="#765800">配额与限额</text><text x="710" y="195" font-size="18" fill="#765800">扩缩容与容量</text><text x="910" y="195" font-size="18" fill="#765800">发布、观测与治理</text><path d="M220 235H1000" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="255" text-anchor="middle" font-size="16" fill="#765800">跨越各数据面节点的长期决策与状态</text><rect x="55" y="330" width="1090" height="155" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/><text x="90" y="370" font-size="22" font-weight="700" fill="#17324D">数据面</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 420H300"/><path d="M480 420H535"/><path d="M715 420H770"/><path d="M950 420H1005"/></g><g stroke-width="3"><rect x="105" y="390" width="140" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/><rect x="300" y="390" width="180" height="65" rx="16" fill="#FFF8D6" stroke="#FFD700"/><rect x="535" y="390" width="180" height="65" rx="16" fill="#F6CFCB" stroke="#B64342"/><rect x="770" y="390" width="180" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1005" y="390" width="100" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="175" y="430" font-size="18" font-weight="700" fill="#17324D">请求</text><text x="390" y="430" font-size="18" font-weight="700" fill="#765800">网关／路由</text><text x="625" y="430" font-size="18" font-weight="700" fill="#B64342">队列与策略</text><text x="860" y="430" font-size="18" font-weight="700" fill="#17324D">推理引擎／副本</text><text x="1055" y="430" font-size="18" font-weight="700" fill="#17324D">流式响应</text></g><text x="600" y="535" text-anchor="middle" font-size="18" fill="#5E7F9C">数据面负责 token 化、Prefill、Decode、KV Cache 和输出；控制面决定如何持续可靠地提供这些能力。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="570.2" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="675.4" height="48.3"/><rect data-figure-safe-zone="text" x="123.0" y="161.0" width="86.7" height="53.7"/><rect data-figure-safe-zone="text" x="298.0" y="165.0" width="136.0" height="48.3"/><rect data-figure-safe-zone="text" x="523.0" y="165.0" width="109.5" height="48.3"/><rect data-figure-safe-zone="text" x="698.0" y="165.0" width="126.6" height="48.3"/><rect data-figure-safe-zone="text" x="898.0" y="165.0" width="153.1" height="48.3"/><rect data-figure-safe-zone="text" x="466.4" y="227.0" width="267.2" height="45.6"/><rect data-figure-safe-zone="text" x="78.0" y="336.0" width="86.7" height="53.7"/><rect data-figure-safe-zone="text" x="163.0" y="400.0" width="58.2" height="48.3"/><rect data-figure-safe-zone="text" x="378.0" y="400.0" width="101.8" height="48.3"/><rect data-figure-safe-zone="text" x="613.0" y="400.0" width="109.5" height="48.3"/><rect data-figure-safe-zone="text" x="848.0" y="400.0" width="136.0" height="48.3"/><rect data-figure-safe-zone="text" x="1043.0" y="400.0" width="92.4" height="48.3"/><rect data-figure-safe-zone="text" x="198.0" y="505.0" width="803.9" height="48.3"/></g></svg>
