<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">带回退条件的渐进发布</title><desc id="desc">候选配置先经离线评测，再接受小流量和逐步扩大的线上观察。质量、错误、TTFT 或成本超出阈值时，控制面回退至完整旧配置。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">发布只在停止条件持续满足时逐步扩大</text><text x="58" y="105" font-size="18" fill="#5E7F9C">渐进发布不是“祈祷新版本没问题”；它用可比较的指标缩小爆炸半径，并保留可逆路径。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 270H280"/><path d="M470 270H525"/><path d="M715 270H770"/><path d="M960 270H1015"/></g><g stroke-width="3"><rect x="55" y="190" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="280" y="190" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="190" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="770" y="190" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1015" y="190" width="130" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="140" y="241" font-size="21" font-weight="700" fill="#17324D">候选配置</text><text x="140" y="274" font-size="16" fill="#0F4D92">模型、提示、</text><text x="140" y="300" font-size="16" fill="#0F4D92">路由或策略改动</text><text x="375" y="241" font-size="21" font-weight="700" fill="#765800">离线评测</text><text x="375" y="274" font-size="16" fill="#765800">回归、质量、</text><text x="375" y="300" font-size="16" fill="#765800">安全与成本门槛</text><text x="620" y="241" font-size="21" font-weight="700" fill="#17324D">小流量</text><text x="620" y="274" font-size="16" fill="#0F4D92">观察真实请求的</text><text x="620" y="300" font-size="16" fill="#0F4D92">错误与体验</text><text x="865" y="241" font-size="21" font-weight="700" fill="#17324D">逐步扩大</text><text x="865" y="274" font-size="16" fill="#0F4D92">在观察窗口中</text><text x="865" y="300" font-size="16" fill="#0F4D92">增加流量比例</text><text x="1080" y="241" font-size="20" font-weight="700" fill="#17324D">全量</text><text x="1080" y="274" font-size="15" fill="#0F4D92">持续</text><text x="1080" y="300" font-size="15" fill="#0F4D92">监控</text></g><path d="M865 350V430H315V360" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="310" y="450" width="580" height="78" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="483" text-anchor="middle" font-size="21" font-weight="700" fill="#B64342">越界即回退到完整旧配置</text><text x="600" y="512" text-anchor="middle" font-size="17" fill="#B64342">质量、错误率、TTFT、成本、政策或安全指标触发预先定义的停止条件。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">回退必须在设计中可执行，而不是依赖事故发生时临场手工拼凑。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="524.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="669.3" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="208.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="128.0" y="246.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="272.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="208.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="363.0" y="246.0" width="101.4" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="272.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="208.0" width="83.8" height="52.4"/><rect data-figure-safe-zone="text" x="608.0" y="246.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="272.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="208.0" width="103.8" height="52.4"/><rect data-figure-safe-zone="text" x="853.0" y="246.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="272.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="1068.0" y="209.0" width="62.0" height="51.0"/><rect data-figure-safe-zone="text" x="1068.0" y="247.0" width="52.5" height="44.2"/><rect data-figure-safe-zone="text" x="1068.0" y="273.0" width="52.5" height="44.2"/><rect data-figure-safe-zone="text" x="478.3" y="450.0" width="243.4" height="52.4"/><rect data-figure-safe-zone="text" x="346.3" y="483.0" width="507.3" height="47.0"/><rect data-figure-safe-zone="text" x="347.8" y="562.0" width="504.4" height="48.3"/></g></svg>
