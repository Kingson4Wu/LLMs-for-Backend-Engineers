<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Prefill 和 Decode 的资源池解耦</title><desc id="desc">请求在 Prefill 池构建键值状态，随后将状态交给 Decode 池输出 token。池化可单独调整资源，但状态传输和协调是额外成本。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">按阶段拆资源池：用状态交接换取独立容量调优</text><text x="58" y="105" font-size="18" fill="#5E7F9C">长输入处理与逐 token 生成的计算、显存和调度形状不同，因此可以拆到不同的服务池。</text><rect x="85" y="190" width="230" height="170" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><rect x="410" y="165" width="270" height="220" rx="24" fill="#FFF8D6" stroke="#FFD700" stroke-width="3"/><rect x="795" y="165" width="270" height="220" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><g fill="none" stroke="#0F4D92" stroke-width="5" marker-end="url(#a)"><path d="M315 275H395"/><path d="M680 275H780"/></g><g text-anchor="middle"><text x="200" y="250" font-size="23" font-weight="700" fill="#17324D">请求路由</text><text x="200" y="285" font-size="17" fill="#0F4D92">长上下文输入</text><text x="200" y="311" font-size="17" fill="#0F4D92">由入口选择合适池</text><text x="545" y="231" font-size="25" font-weight="700" fill="#765800">Prefill 池</text><text x="545" y="269" font-size="18" fill="#765800">读取输入、计算前缀</text><text x="545" y="298" font-size="18" fill="#765800">构建 K/V 推理状态</text><text x="930" y="231" font-size="25" font-weight="700" fill="#17324D">Decode 池</text><text x="930" y="269" font-size="18" fill="#0F4D92">接收 K/V 状态</text><text x="930" y="298" font-size="18" fill="#0F4D92">逐 token 流式生成</text></g><rect x="695" y="235" width="85" height="80" rx="15" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="737" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#B64342">K/V</text><text x="737" y="290" text-anchor="middle" font-size="15" fill="#B64342">交接</text><rect x="210" y="450" width="780" height="92" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="486" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">获得：Prefill 与 Decode 可按各自瓶颈独立扩缩</text><text x="600" y="518" text-anchor="middle" font-size="17" fill="#765800">代价：路由、K/V 传输、数据一致性、故障恢复与端到端延迟都需要管理。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">解耦是系统设计选择，不会绕过 Attention 读取状态或减少所有推理成本。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="629.1" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="681.9" height="48.3"/><rect data-figure-safe-zone="text" x="188.0" y="215.0" width="111.4" height="55.0"/><rect data-figure-safe-zone="text" x="188.0" y="256.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="188.0" y="282.0" width="153.2" height="47.0"/><rect data-figure-safe-zone="text" x="533.0" y="194.0" width="151.8" height="57.8"/><rect data-figure-safe-zone="text" x="533.0" y="239.0" width="170.2" height="48.3"/><rect data-figure-safe-zone="text" x="533.0" y="268.0" width="173.4" height="48.3"/><rect data-figure-safe-zone="text" x="918.0" y="194.0" width="138.8" height="57.8"/><rect data-figure-safe-zone="text" x="918.0" y="239.0" width="139.2" height="48.3"/><rect data-figure-safe-zone="text" x="918.0" y="268.0" width="175.0" height="48.3"/><rect data-figure-safe-zone="text" x="711.7" y="237.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="710.8" y="263.0" width="52.5" height="44.2"/><rect data-figure-safe-zone="text" x="365.5" y="453.0" width="469.0" height="52.4"/><rect data-figure-safe-zone="text" x="338.3" y="489.0" width="523.5" height="47.0"/><rect data-figure-safe-zone="text" x="304.9" y="562.0" width="590.3" height="48.3"/></g></svg>
