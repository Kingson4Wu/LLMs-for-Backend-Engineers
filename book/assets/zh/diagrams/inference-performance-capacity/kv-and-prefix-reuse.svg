<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">KV Cache 与前缀复用的边界</title><desc id="desc">同一请求复用已处理 token 的键值状态；多个请求只有前缀及相关状态实际一致时，才能共享前缀缓存并跳过重复 Prefill。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">K/V 复用节省重复计算，但不等于免费读取或应用记忆</text><text x="58" y="105" font-size="18" fill="#5E7F9C">缓存保存的是模型推理的中间状态；它占显存，且命中要求相关状态可以安全地匹配。</text><rect x="55" y="155" width="520" height="330" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/><rect x="625" y="155" width="520" height="330" rx="25" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="315" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">同一请求内的 K/V Cache</text><text x="885" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#765800">多个请求间的前缀缓存</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M160 300H260"/><path d="M390 300H470"/><path d="M730 300H830"/><path d="M960 300H1050"/></g><g stroke-width="3"><rect x="90" y="250" width="150" height="100" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="260" y="250" width="130" height="100" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="410" y="250" width="130" height="100" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="660" y="250" width="150" height="100" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="830" y="250" width="130" height="100" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="980" y="250" width="130" height="100" rx="18" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="165" y="290" font-size="19" font-weight="700" fill="#17324D">已处理 token</text><text x="165" y="320" font-size="16" fill="#0F4D92">本轮的前缀</text><text x="325" y="290" font-size="19" font-weight="700" fill="#765800">K/V 状态</text><text x="325" y="320" font-size="16" fill="#765800">保留在显存</text><text x="475" y="290" font-size="19" font-weight="700" fill="#17324D">下一步注意力</text><text x="475" y="320" font-size="16" fill="#0F4D92">直接读取既有 K/V</text><text x="735" y="290" font-size="19" font-weight="700" fill="#17324D">相同前缀</text><text x="735" y="320" font-size="16" fill="#0F4D92">请求 A / B</text><text x="895" y="290" font-size="19" font-weight="700" fill="#765800">共享 K/V</text><text x="895" y="320" font-size="16" fill="#765800">前缀缓存命中</text><text x="1045" y="290" font-size="19" font-weight="700" fill="#17324D">跳过 Prefill</text><text x="1045" y="320" font-size="16" fill="#0F4D92">只计算新后缀</text></g><text x="315" y="415" text-anchor="middle" font-size="17" fill="#5E7F9C">新 token 仍要对可见 K/V 做注意力读取。</text><text x="885" y="415" text-anchor="middle" font-size="17" fill="#765800">相似文本不保证命中；权限和租户边界也不能混用。</text><rect x="220" y="535" width="760" height="58" rx="16" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="572" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">KV Cache 是推理计算复用，不是应用层长期记忆或事实库。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="723.0" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="650.6" height="48.3"/><rect data-figure-safe-zone="text" x="177.7" y="169.0" width="274.7" height="55.0"/><rect data-figure-safe-zone="text" x="763.8" y="169.0" width="242.5" height="55.0"/><rect data-figure-safe-zone="text" x="153.0" y="259.0" width="137.4" height="49.7"/><rect data-figure-safe-zone="text" x="153.0" y="292.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="313.0" y="259.0" width="99.6" height="49.7"/><rect data-figure-safe-zone="text" x="313.0" y="292.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="463.0" y="259.0" width="132.3" height="49.7"/><rect data-figure-safe-zone="text" x="463.0" y="292.0" width="148.5" height="45.6"/><rect data-figure-safe-zone="text" x="723.0" y="259.0" width="96.2" height="49.7"/><rect data-figure-safe-zone="text" x="723.0" y="292.0" width="104.3" height="45.6"/><rect data-figure-safe-zone="text" x="883.0" y="259.0" width="99.6" height="49.7"/><rect data-figure-safe-zone="text" x="883.0" y="292.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="1033.0" y="259.0" width="139.1" height="49.7"/><rect data-figure-safe-zone="text" x="1033.0" y="292.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="148.6" y="386.0" width="332.7" height="47.0"/><rect data-figure-safe-zone="text" x="694.6" y="386.0" width="380.8" height="47.0"/><rect data-figure-safe-zone="text" x="365.5" y="542.0" width="469.0" height="48.3"/></g></svg>
