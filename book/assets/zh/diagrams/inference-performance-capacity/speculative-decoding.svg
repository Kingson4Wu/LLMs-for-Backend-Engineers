<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">推测解码的草稿和验证</title><desc id="desc">草稿模型提出多个 token，目标模型对这些位置验证，接受一致的连续前缀并从第一个不一致位置继续决定输出。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">推测解码：草稿并行提议，目标模型保留最终决定权</text><text x="58" y="105" font-size="18" fill="#5E7F9C">收益取决于草稿质量、目标验证成本和可接受前缀长度；它不是无条件加速。</text><text x="75" y="213" font-size="22" font-weight="700" fill="#765800">草稿模型</text><text x="75" y="246" font-size="17" fill="#765800">一次提出候选块</text><text x="75" y="393" font-size="22" font-weight="700" fill="#17324D">目标模型</text><text x="75" y="426" font-size="17" fill="#0F4D92">验证候选位置</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="700"><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="280" y="165" width="110" height="85" rx="18"/><rect x="430" y="165" width="110" height="85" rx="18"/><rect x="580" y="165" width="110" height="85" rx="18"/><rect x="730" y="165" width="110" height="85" rx="18"/></g><text x="335" y="219" fill="#765800">a</text><text x="485" y="219" fill="#765800">b</text><text x="635" y="219" fill="#765800">c</text><text x="785" y="219" fill="#765800">d</text><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="280" y="345" width="110" height="85" rx="18"/><rect x="430" y="345" width="110" height="85" rx="18"/><rect x="580" y="345" width="110" height="85" rx="18"/></g><rect x="730" y="345" width="110" height="85" rx="18" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="335" y="399" fill="#17324D">✓ a</text><text x="485" y="399" fill="#17324D">✓ b</text><text x="635" y="399" fill="#17324D">✓ c</text><text x="785" y="399" fill="#B64342">× d</text></g><g stroke="#0F4D92" stroke-width="3" stroke-dasharray="7 7"><path d="M335 250V335"/><path d="M485 250V335"/><path d="M635 250V335"/><path d="M785 250V335"/></g><path d="M850 387H925" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="945" y="330" width="185" height="115" rx="20" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><text x="1037" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">接受前缀</text><text x="1037" y="401" text-anchor="middle" font-size="17" fill="#0F4D92">a · b · c</text><text x="1037" y="425" text-anchor="middle" font-size="15" fill="#0F4D92">从 d 处继续</text><rect x="215" y="520" width="770" height="58" rx="16" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="557" text-anchor="middle" font-size="18" fill="#765800">目标模型可一次验证多个位置；低接受率会抵消甚至超过节省的顺序步数。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="674.7" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="582.2" height="48.3"/><rect data-figure-safe-zone="text" x="63.0" y="179.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="63.0" y="217.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="63.0" y="359.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="63.0" y="397.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="323.0" y="190.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="473.0" y="190.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="623.0" y="190.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="773.0" y="190.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="323.0" y="370.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="473.0" y="370.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="623.0" y="370.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="773.0" y="370.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="987.0" y="338.0" width="100.0" height="51.0"/><rect data-figure-safe-zone="text" x="985.2" y="372.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="984.8" y="398.0" width="104.4" height="44.2"/><rect data-figure-safe-zone="text" x="313.6" y="527.0" width="572.8" height="48.3"/></g></svg>
