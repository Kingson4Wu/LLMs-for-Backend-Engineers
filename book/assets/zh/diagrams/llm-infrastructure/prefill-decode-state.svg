<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">请求中的 Prefill、Decode 与 KV Cache 状态</title><desc id="desc">上下文 token 在 Prefill 中并行处理并建立 KV Cache。Decode 之后每一步只生成一个 token，复用并追加缓存状态，形成自回归循环。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:16px}</style></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">请求先建上下文状态，再逐 token 延长它</text><text x="65" y="103" class="b" fill="#416985">Prefill 和 decode 的工作形态不同：前者处理已有上下文，后者受自回归依赖约束。</text><rect x="65" y="165" width="210" height="142" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="97" y="211" class="h" fill="#17324D">上下文 token</text><g fill="#0F4D92"><rect x="97" y="238" width="27" height="30" rx="6"/><rect x="133" y="238" width="27" height="30" rx="6"/><rect x="169" y="238" width="27" height="30" rx="6"/><rect x="205" y="238" width="27" height="30" rx="6"/></g><text x="97" y="291" class="s" fill="#5E7F9C">提示词与历史消息</text><path d="M275 236h76" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="366" y="145" width="312" height="182" rx="22" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="398" y="194" class="h" fill="#765800">Prefill</text><text x="398" y="229" class="b" fill="#765800">并行处理已有输入 token</text><text x="398" y="260" class="b" fill="#765800">为每层建立 K / V 状态</text><rect x="398" y="281" width="248" height="26" rx="8" fill="#FFF1B8"/><text x="522" y="301" text-anchor="middle" font-size="14" fill="#765800">首 token 前的主要计算阶段</text><path d="M678 236h76" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="769" y="145" width="366" height="182" rx="22" fill="#F6CFCB" stroke="#E9A6A1" stroke-width="2"/><text x="801" y="194" class="h" fill="#8F3635">Decode</text><text x="801" y="229" class="b" fill="#8F3635">生成 1 个 token → 追加状态</text><text x="801" y="260" class="b" fill="#8F3635">再生成下一个 token</text><g fill="#B64342"><rect x="801" y="281" width="25" height="22" rx="5"/><rect x="835" y="281" width="25" height="22" rx="5"/><rect x="869" y="281" width="25" height="22" rx="5"/></g><text x="908" y="299" class="s" fill="#8D625A">自回归循环</text><path d="M952 327v56H703" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="405" y="400" width="395" height="110" rx="20" fill="#17324D"/><text x="438" y="442" class="h" fill="#FFFFFF">KV Cache：累积的注意力状态</text><text x="438" y="472" class="b" fill="#CFCECE">每步复用已有 K / V，只为新 token 追加条目</text><text x="438" y="495" class="s" fill="#CFCECE">减少重复计算，也持续占用显存</text><rect x="65" y="556" width="1070" height="43" rx="13" fill="#F6CFCB"/><text x="92" y="584" font-size="17" fill="#8F3635">因此，长上下文会显著影响 Prefill 的工作量和 KV Cache 容量；decode 延迟又由逐步依赖决定。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="582.7" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="628.0" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="177.0" width="155.3" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="262.0" width="153.2" height="47.0"/><rect data-figure-safe-zone="text" x="386.0" y="160.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="386.0" y="200.0" width="206.2" height="47.0"/><rect data-figure-safe-zone="text" x="386.0" y="231.0" width="198.9" height="47.0"/><rect data-figure-safe-zone="text" x="424.7" y="275.0" width="194.7" height="42.9"/><rect data-figure-safe-zone="text" x="789.0" y="160.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="789.0" y="200.0" width="243.1" height="47.0"/><rect data-figure-safe-zone="text" x="789.0" y="231.0" width="173.9" height="47.0"/><rect data-figure-safe-zone="text" x="896.0" y="270.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="426.0" y="408.0" width="294.2" height="53.7"/><rect data-figure-safe-zone="text" x="426.0" y="443.0" width="357.7" height="47.0"/><rect data-figure-safe-zone="text" x="426.0" y="466.0" width="242.8" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="555.0" width="732.6" height="47.0"/></g></svg>
