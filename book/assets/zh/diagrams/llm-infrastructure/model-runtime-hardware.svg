<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">模型、推理运行时与硬件的职责边界</title><desc id="desc">Transformer 决定计算图和数据依赖，推理运行时组织请求状态及执行策略，硬件和互联提供计算、存储与数据搬移能力；生成性能由三层共同决定。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:16px}</style></defs><rect width="1200" height="620" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">生成一个 token，需要三层共同兑现</text><text x="65" y="103" class="b" fill="#416985">把职责分开，才能定位是模型结构、调度执行，还是设备资源限制了服务。</text><rect x="65" y="155" width="315" height="280" rx="23" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><circle cx="111" cy="202" r="20" fill="#0F4D92"/><text x="111" y="209" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text><text x="145" y="210" class="h" fill="#17324D">模型</text><text x="97" y="260" class="b" fill="#416985">Transformer / 计算图</text><text x="97" y="296" class="b" fill="#416985">数据依赖与表示变换</text><text x="97" y="332" class="b" fill="#416985">权重、激活和值的语义</text><text x="97" y="389" class="s" fill="#5E7F9C">决定“需要计算什么”</text><path d="M380 295h70" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="465" y="155" width="315" height="280" rx="23" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><circle cx="511" cy="202" r="20" fill="#FFD700"/><text x="511" y="209" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text><text x="545" y="210" class="h" fill="#765800">推理运行时</text><text x="497" y="260" class="b" fill="#765800">请求与 KV Cache 状态</text><text x="497" y="296" class="b" fill="#765800">批处理、队列与调度</text><text x="497" y="332" class="b" fill="#765800">内核选择与执行策略</text><text x="497" y="389" class="s" fill="#765800">决定“如何组织计算”</text><path d="M780 295h70" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="865" y="155" width="270" height="280" rx="23" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/><circle cx="911" cy="202" r="20" fill="#B64342"/><text x="911" y="209" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text><text x="945" y="210" class="h" fill="#8F3635">硬件 / 互联</text><text x="897" y="260" class="b" fill="#8F3635">计算单元与显存</text><text x="897" y="296" class="b" fill="#8F3635">节点、网络和互联</text><text x="897" y="332" class="b" fill="#8F3635">数据搬移能力</text><text x="897" y="389" class="s" fill="#8D625A">决定“能以何种代价执行”</text><rect x="65" y="490" width="1070" height="73" rx="18" fill="#17324D"/><text x="98" y="525" font-size="20" font-weight="700" fill="#FFFFFF">共同结果：延迟、吞吐、容量与数值行为</text><text x="98" y="551" font-size="17" fill="#CFCECE">没有单独一层能完全决定它们；优化应先确认瓶颈所在的层和层间接口。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="505.3" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="527.7" height="47.0"/><rect data-figure-safe-zone="text" x="91.0" y="180.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="133.0" y="176.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="231.0" width="196.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="267.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="303.0" width="178.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="360.0" width="170.9" height="47.0"/><rect data-figure-safe-zone="text" x="491.0" y="180.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="533.0" y="176.0" width="128.5" height="53.7"/><rect data-figure-safe-zone="text" x="485.0" y="231.0" width="193.1" height="47.0"/><rect data-figure-safe-zone="text" x="485.0" y="267.0" width="162.0" height="47.0"/><rect data-figure-safe-zone="text" x="485.0" y="303.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="485.0" y="360.0" width="170.9" height="47.0"/><rect data-figure-safe-zone="text" x="891.0" y="180.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="933.0" y="176.0" width="141.9" height="53.7"/><rect data-figure-safe-zone="text" x="885.0" y="231.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="885.0" y="267.0" width="145.9" height="47.0"/><rect data-figure-safe-zone="text" x="885.0" y="303.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="885.0" y="360.0" width="203.2" height="47.0"/><rect data-figure-safe-zone="text" x="86.0" y="493.0" width="340.2" height="51.0"/><rect data-figure-safe-zone="text" x="86.0" y="522.0" width="526.2" height="47.0"/></g></svg>
