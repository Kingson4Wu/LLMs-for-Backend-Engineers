<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">配置、权重和推理引擎是不同的模型工件</title><desc id="desc">配置定义模型结构，权重保存训练后的数值张量，推理引擎以架构适配层和通用运行时构建并执行计算；三者需相互兼容。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:16px}</style></defs><rect width="1200" height="620" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">一个可运行的模型，不是一个不可分割的文件</text><text x="65" y="103" class="b" fill="#416985">结构描述、参数数值和执行能力各自独立，却必须在同一个运行契约中匹配。</text><rect x="65" y="165" width="300" height="260" rx="22" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="96" y="214" class="h" fill="#17324D">模型配置</text><text x="96" y="255" class="b" fill="#416985">层数、维度、注意力头</text><text x="96" y="287" class="b" fill="#416985">词表、位置编码、架构类型</text><rect x="96" y="329" width="238" height="51" rx="12" fill="#DDF3DE"/><text x="215" y="361" text-anchor="middle" class="s" fill="#0F4D92">描述“计算应长什么样”</text><path d="M365 295h94" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="474" y="165" width="300" height="260" rx="22" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="505" y="214" class="h" fill="#765800">模型权重</text><text x="505" y="255" class="b" fill="#765800">训练得到的参数张量</text><text x="505" y="287" class="b" fill="#765800">每层的具体数值</text><rect x="505" y="329" width="238" height="51" rx="12" fill="#FFF1B8"/><text x="624" y="361" text-anchor="middle" class="s" fill="#765800">提供“计算用哪些数”</text><path d="M774 295h94" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="883" y="165" width="252" height="260" rx="22" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/><text x="914" y="214" class="h" fill="#8F3635">推理引擎</text><text x="914" y="255" class="b" fill="#8F3635">架构适配：构建计算</text><text x="914" y="287" class="b" fill="#8F3635">通用运行时：调度和执行</text><rect x="914" y="329" width="190" height="51" rx="12" fill="#F6CFCB"/><text x="1009" y="361" text-anchor="middle" class="s" fill="#8F3635">兑现“如何运行”</text><rect x="65" y="490" width="1070" height="73" rx="18" fill="#17324D"/><text x="98" y="525" font-size="20" font-weight="700" fill="#FFFFFF">兼容性是三者的交集</text><text x="98" y="551" font-size="17" fill="#CFCECE">看似正确的权重文件，若结构不匹配或引擎不支持，也不能可靠运行。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="618.2" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="551.2" height="47.0"/><rect data-figure-safe-zone="text" x="84.0" y="180.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="84.0" y="226.0" width="170.9" height="47.0"/><rect data-figure-safe-zone="text" x="84.0" y="258.0" width="203.2" height="47.0"/><rect data-figure-safe-zone="text" x="121.5" y="332.0" width="187.0" height="47.0"/><rect data-figure-safe-zone="text" x="493.0" y="180.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="493.0" y="226.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="493.0" y="258.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="538.6" y="332.0" width="170.9" height="47.0"/><rect data-figure-safe-zone="text" x="902.0" y="180.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="902.0" y="226.0" width="162.0" height="47.0"/><rect data-figure-safe-zone="text" x="902.0" y="258.0" width="194.3" height="47.0"/><rect data-figure-safe-zone="text" x="939.7" y="332.0" width="138.6" height="47.0"/><rect data-figure-safe-zone="text" x="86.0" y="493.0" width="195.0" height="51.0"/><rect data-figure-safe-zone="text" x="86.0" y="522.0" width="502.7" height="47.0"/></g></svg>
