<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">余弦定理中的两个向量与夹角</title><desc id="desc">向量 a 和 b 从同一原点 O 出发，分别指向 A 和 B。端点连接边的长度是 |a−b|，夹角 θ 位于 O。</desc><rect width="1080" height="620" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="32" font-weight="700" fill="#17324D">余弦定理：两个向量构成一个三角形</text><path d="M160 485L470 165L850 485Z" fill="#EDF5F1" stroke="#0F4D92" stroke-width="4"/><path d="M164 481L474 161M164 489L854 489" fill="none" stroke="#8EB6D8" stroke-width="2"/><path d="M160 485L470 165" stroke="#FFD700" stroke-width="7"/><path d="M160 485L850 485" stroke="#0F4D92" stroke-width="7"/><path d="M470 165L850 485" stroke="#B64342" stroke-width="6" stroke-dasharray="12 9"/><path d="M277 485A118 118 0 0 1 243 396" fill="none" stroke="#5E7F9C" stroke-width="3"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><g font-size="25" font-weight="700" fill="#0F4D92"><text x="136" y="522">O</text><text x="458" y="145">A</text><text x="860" y="522">B</text></g><text x="295" y="290" font-size="21" fill="#765800">a，长度 |a|</text><text x="465" y="520" font-size="21" fill="#0F4D92">b，长度 |b|</text><text x="650" y="305" font-size="20" fill="#B64342">a − b，长度 |a − b|</text><text x="255" y="420" font-size="25" fill="#0F4D92">θ</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="180" y="545" width="670" height="51" rx="18"/></g><text x="515" y="578" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" fill="#765800" text-anchor="middle">|a − b|² = |a|² + |b|² − 2|a||b|cos(θ)</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="496.6" height="67.2"/><rect data-figure-safe-zone="text" x="124.0" y="493.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="446.0" y="116.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="848.0" y="493.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="283.0" y="257.0" width="129.4" height="52.4"/><rect data-figure-safe-zone="text" x="453.0" y="487.0" width="129.4" height="52.4"/><rect data-figure-safe-zone="text" x="638.0" y="273.0" width="207.6" height="51.0"/><rect data-figure-safe-zone="text" x="243.0" y="383.0" width="40.0" height="57.8"/><rect data-figure-safe-zone="text" x="315.3" y="547.0" width="399.4" height="49.7"/></g></svg>
