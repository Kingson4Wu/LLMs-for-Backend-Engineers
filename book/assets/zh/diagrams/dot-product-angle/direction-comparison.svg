<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">同向、垂直和反向向量的投影比较</title><desc id="desc">同向向量的余弦为一且投影最大；垂直向量的余弦为零；反向向量的余弦为负一，投影方向相反。</desc><defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B64342"/></marker></defs><rect width="1200" height="560" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="32" font-weight="700" fill="#17324D">余弦把“方向关系”压缩成一个有符号的数</text><g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="52" y="125" width="330" height="340" rx="25"/><rect x="435" y="125" width="330" height="340" rx="25"/><rect x="818" y="125" width="330" height="340" rx="25"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle"><g font-size="24" font-weight="700" fill="#0F4D92"><text x="217" y="175">同向 · θ = 0°</text><text x="600" y="175">垂直 · θ = 90°</text><text x="983" y="175">反向 · θ = 180°</text></g><g fill="none" stroke-width="7"><path d="M110 275H320" stroke="#0F4D92" marker-end="url(#g)" data-figure-connector="true"/><path d="M110 230H320" stroke="#B64342" marker-end="url(#r)" data-figure-connector="true"/><path d="M495 315V215" stroke="#B64342" marker-end="url(#r)" data-figure-connector="true"/><path d="M495 315H705" stroke="#0F4D92" marker-end="url(#g)" data-figure-connector="true"/><path d="M1090 275H880" stroke="#0F4D92" marker-end="url(#g)" data-figure-connector="true"/><path d="M880 230H1090" stroke="#B64342" marker-end="url(#r)" data-figure-connector="true"/></g><g font-size="21"><text x="217" y="365" fill="#765800">cos(θ) = 1</text><text x="600" y="365" fill="#765800">cos(θ) = 0</text><text x="983" y="365" fill="#B64342">cos(θ) = −1</text></g><g font-size="18" fill="#5E7F9C"><text x="217" y="405">投影最大且为正</text><text x="600" y="405">在另一方向投影为 0</text><text x="983" y="405">投影最大但为负</text></g></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="574.1" height="67.2"/><rect data-figure-safe-zone="text" x="205.0" y="146.0" width="135.9" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="146.0" width="144.7" height="47.0"/><rect data-figure-safe-zone="text" x="971.0" y="146.0" width="153.5" height="47.0"/><rect data-figure-safe-zone="text" x="205.0" y="336.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="336.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="971.0" y="336.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="205.0" y="376.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="376.0" width="170.9" height="47.0"/><rect data-figure-safe-zone="text" x="971.0" y="376.0" width="137.1" height="47.0"/></g></svg>
