<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">文本经 Tokenizer、编号和 Embedding 形成上下文表示</title><desc id="desc">文本切分为 token 并映射到词表编号，编号查表得到 embedding 向量，模型层再结合位置和上下文形成表示。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Token、编号与向量，是三个不同层次</text><text x="60" y="105" font-size="19" fill="#5E7F9C">编号只是索引；可计算的语义来自向量以及后续位置与上下文计算。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="230" width="190" height="88" rx="23"/><rect x="620" y="230" width="210" height="88" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="315" y="230" width="225" height="88" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="910" y="230" width="260" height="88" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M235 274H305"/><path d="M540 274H610"/><path d="M830 274H900"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="140" y="285" font-size="22" fill="#0F4D92">文本：查订单</text><text x="427" y="270" font-size="21" fill="#765800">Token：[查] [订单]</text><text x="427" y="296" font-size="16" fill="#765800">Tokenizer</text><text x="725" y="270" font-size="21" fill="#0F4D92">词表编号：[31, 208]</text><text x="725" y="296" font-size="16" fill="#0F4D92">Embedding 查表</text><text x="1040" y="270" font-size="21" fill="#B64342">位置 + 模型层</text><text x="1040" y="296" font-size="16" fill="#B64342">上下文表示</text></g><path d="M110 395H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="445" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="20" fill="#765800" text-anchor="middle">编号只是索引；语义可计算性来自向量和后续上下文计算。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="505.3" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="549.2" height="49.7"/><rect data-figure-safe-zone="text" x="128.0" y="251.0" width="139.9" height="53.7"/><rect data-figure-safe-zone="text" x="415.0" y="237.0" width="204.0" height="52.4"/><rect data-figure-safe-zone="text" x="415.0" y="268.0" width="98.9" height="45.6"/><rect data-figure-safe-zone="text" x="713.0" y="237.0" width="213.0" height="52.4"/><rect data-figure-safe-zone="text" x="713.0" y="268.0" width="137.6" height="45.6"/><rect data-figure-safe-zone="text" x="1028.0" y="237.0" width="156.5" height="52.4"/><rect data-figure-safe-zone="text" x="1028.0" y="268.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="369.6" y="413.0" width="500.8" height="51.0"/></g></svg>
