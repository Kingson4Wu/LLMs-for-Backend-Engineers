<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc"><title id="title">Prefill 处理已知输入，Decode 逐步继续序列</title><desc id="desc">Prefill 处理已知 A、B、C 来预测 D。D 被选出后才写回输入，下一步 Decode 用它预测 E 并重复。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="590" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Prefill 处理已知输入；Decode 逐步继续序列</text><text x="60" y="105" font-size="19" fill="#5E7F9C">被选出的 token 才能成为下一步输入，因此 Decode 沿时间串行推进。</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="55" y="230" width="285" height="100" rx="23"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="440" y="230" width="245" height="100" rx="23"/><rect x="785" y="230" width="330" height="100" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M340 280H430"/><path d="M685 280H775"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="197" y="267" font-size="22" fill="#765800">Prefill：A、B、C</text><text x="197" y="295" font-size="16" fill="#765800">已知上下文</text><text x="562" y="267" font-size="21" fill="#0F4D92">用 C 的输出预测 D</text><text x="562" y="295" font-size="16" fill="#0F4D92">选出并追加 D</text><text x="950" y="267" font-size="21" fill="#0F4D92">Decode：送入 D，预测 E</text><text x="950" y="295" font-size="16" fill="#0F4D92">再送入 E，继续下一项</text></g><path d="M110 400H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="455" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19" fill="#765800" text-anchor="middle">D 未被选出前没有自己的表示；选出后才成为下一次 Decode 的输入。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="655.0" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="589.1" height="49.7"/><rect data-figure-safe-zone="text" x="185.0" y="233.0" width="172.7" height="53.7"/><rect data-figure-safe-zone="text" x="185.0" y="267.0" width="100.0" height="45.6"/><rect data-figure-safe-zone="text" x="550.0" y="234.0" width="198.3" height="52.4"/><rect data-figure-safe-zone="text" x="550.0" y="267.0" width="116.6" height="45.6"/><rect data-figure-safe-zone="text" x="938.0" y="234.0" width="234.8" height="52.4"/><rect data-figure-safe-zone="text" x="938.0" y="267.0" width="170.6" height="45.6"/><rect data-figure-safe-zone="text" x="332.1" y="424.0" width="575.8" height="49.7"/></g></svg>
