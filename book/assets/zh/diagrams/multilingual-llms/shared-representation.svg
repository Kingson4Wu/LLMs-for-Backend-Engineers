<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">多语言输入经共享参数产生词表上的下一个 token 分布</title><desc id="desc">不同书写系统经 tokenizer 转成 token 向量，由共享 Transformer 计算下一个 token 分布；模型不必先翻译为英语。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="590" rx="36" fill="#FFFFFF"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">多语言共享的是参数与计算，不是一条固定中转语言</text><text x="60" y="105" font-size="19" fill="#5E7F9C">各语言沿同一连续计算路径产生下一个 token 分布；语言能力仍受数据覆盖和 token 效率影响。</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="235" width="215" height="88" rx="23"/><rect x="610" y="235" width="200" height="88" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="335" y="235" width="190" height="88" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="885" y="220" width="250" height="118" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M260 279H325"/><path d="M525 279H600"/><path d="M810 279H875"/></g><g font-family="Arial, 'Noto Sans SC', sans-serif" text-anchor="middle" font-weight="700"><text x="152" y="289" font-size="22" fill="#0F4D92">不同书写系统</text><text x="430" y="289" font-size="22" fill="#765800">Tokenizer</text><text x="710" y="289" font-size="22" fill="#0F4D92">token 向量</text><text x="1010" y="268" font-size="21" fill="#B64342">共享 Transformer 层</text><text x="1010" y="296" font-size="17" fill="#B64342">下一个 token 的分布</text></g><path d="M110 420H1090" stroke="#FFD700" stroke-width="3"/><text x="600" y="470" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18" fill="#765800" text-anchor="middle">共享不等于能力天然等价：训练覆盖、token 效率、后训练和外部资料都会造成差异。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="709.4" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="795.8" height="49.7"/><rect data-figure-safe-zone="text" x="140.0" y="255.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="418.0" y="255.0" width="127.0" height="53.7"/><rect data-figure-safe-zone="text" x="698.0" y="255.0" width="134.4" height="53.7"/><rect data-figure-safe-zone="text" x="998.0" y="235.0" width="225.8" height="52.4"/><rect data-figure-safe-zone="text" x="998.0" y="267.0" width="182.8" height="47.0"/><rect data-figure-safe-zone="text" x="276.2" y="440.0" width="647.7" height="48.3"/></g></svg>
