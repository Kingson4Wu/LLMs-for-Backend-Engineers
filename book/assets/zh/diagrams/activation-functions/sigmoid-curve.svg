<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Sigmoid 的 S 形饱和曲线</title><desc id="desc">Sigmoid 把实数映射到零和一之间，在两端饱和，在零附近变化最快。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style><rect width="1000" height="560" fill="#FFFFFF"/><text x="55" y="62" font-size="31" font-weight="700" fill="#17324D">Sigmoid：把任意分数压进 (0, 1)</text><rect x="55" y="112" width="610" height="370" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><path d="M125 402H615M205 440V155M125 183H615" stroke="#5E7F9C" stroke-width="3"/><path d="M128 397C225 397 272 390 320 348C360 313 375 259 405 251C435 243 450 195 490 161C528 127 568 120 612 120" fill="none" stroke="#0F4D92" stroke-width="8" stroke-linecap="round"/><path d="M125 120H615" stroke="#FFD700" stroke-width="2" stroke-dasharray="8 8"/><text x="592" y="427" class="b" fill="#416985">x</text><text x="177" y="172" class="b" fill="#416985">y</text><text x="172" y="130" class="b" fill="#765800">1</text><text x="172" y="410" class="b" fill="#765800">0</text><text x="414" y="430" class="b" fill="#765800">0</text><rect x="710" y="112" width="235" height="170" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="738" y="158" class="h" fill="#765800">两端饱和</text><text x="738" y="193" class="b" fill="#765800">输出靠近 0 或 1</text><text x="738" y="224" class="b" fill="#765800">局部变化变慢</text><rect x="710" y="312" width="235" height="170" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="738" y="358" class="h" fill="#17324D">零点附近</text><text x="738" y="393" class="b" fill="#416985">曲线最陡</text><text x="738" y="424" class="b" fill="#416985">对输入最敏感</text><text x="55" y="525" font-size="17" fill="#8F3635">范围受限适合表达概率式门控；饱和也意味着导数会变小。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="19.0" width="471.9" height="65.8"/><rect data-figure-safe-zone="text" x="580.0" y="398.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="165.0" y="143.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="160.0" y="101.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="160.0" y="381.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="402.0" y="401.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="124.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="164.0" width="148.9" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="195.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="324.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="364.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="395.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="43.0" y="496.0" width="429.3" height="47.0"/></g></svg>
