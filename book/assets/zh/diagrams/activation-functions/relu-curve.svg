<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">ReLU 的分段线性门控</title><desc id="desc">ReLU 在负输入区间输出零，在正输入区间线性通过，零点是两个门控区域的边界。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style><rect width="1000" height="560" fill="#FFFFFF"/><text x="55" y="62" font-size="31" font-weight="700" fill="#17324D">ReLU：负侧关门，正侧线性通过</text><rect x="55" y="112" width="610" height="370" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><path d="M125 402H615M205 440V155" stroke="#5E7F9C" stroke-width="3"/><path d="M125 402H365L590 184" fill="none" stroke="#0F4D92" stroke-width="8" stroke-linecap="round"/><circle cx="365" cy="402" r="8" fill="#FFD700"/><text x="594" y="427" class="b" fill="#416985">x</text><text x="177" y="172" class="b" fill="#416985">y</text><text x="374" y="430" class="b" fill="#765800">0</text><text x="450" y="217" class="h" fill="#0F4D92">y = x</text><text x="145" y="374" class="h" fill="#0F4D92">y = 0</text><rect x="710" y="112" width="235" height="170" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="738" y="158" class="h" fill="#765800">x ≤ 0</text><text x="738" y="193" class="b" fill="#765800">输出 0</text><text x="738" y="224" class="b" fill="#765800">该通道关闭</text><rect x="710" y="312" width="235" height="170" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="738" y="358" class="h" fill="#17324D">x &gt; 0</text><text x="738" y="393" class="b" fill="#416985">输出 x</text><text x="738" y="424" class="b" fill="#416985">该通道线性通过</text><text x="55" y="525" font-size="17" fill="#8F3635">零点处的分段切换，使 ReLU 能在网络中形成输入相关的线性区域。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="19.0" width="415.2" height="65.8"/><rect data-figure-safe-zone="text" x="582.0" y="398.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="165.0" y="143.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="362.0" y="401.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="438.0" y="183.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="133.0" y="340.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="124.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="164.0" width="74.0" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="195.0" width="104.8" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="324.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="364.0" width="74.0" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="395.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="43.0" y="496.0" width="498.5" height="47.0"/></g></svg>
