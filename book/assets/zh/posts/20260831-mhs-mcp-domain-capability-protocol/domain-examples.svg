<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">能力模型模式并不限于硬件</title><desc id="desc">支付、游戏平台和智能家居都可将多种底层实现隐藏在稳定的对象、能力和约束模型后。领域规则和风险边界仍需保留。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:15px}</style><rect width="1200" height="680" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">能力模型的模式，并不限于硬件集成</text><text x="65" y="103" class="b" fill="#526D73">稳定对象、可调用能力与显式约束，可以让上层工作流跨实现复用，但不会抹平领域风险。</text><rect x="65" y="155" width="330" height="345" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="97" y="205" class="h" fill="#665F57">支付</text><text x="97" y="251" class="b" fill="#526D73">对象：支付单 · 退款 · 结算 · 争议</text><text x="97" y="291" class="b" fill="#526D73">能力：支付 · 退款 · 查状态 · 对账</text><text x="97" y="331" class="b" fill="#526D73">约束：币种 · 区域 · 风控 · 合规</text><text x="97" y="389" class="s" fill="#7A8F93">支付宝 / 微信 / Stripe / Apple Pay</text><rect x="435" y="155" width="330" height="345" rx="22" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="467" y="205" class="h" fill="#586653">游戏平台服务</text><text x="467" y="251" class="b" fill="#586653">对象：玩家 · 权益 · 库存 · 订阅</text><text x="467" y="291" class="b" fill="#586653">能力：登录 · 发放 · 验单 · 退款</text><text x="467" y="331" class="b" fill="#586653">约束：平台政策 · 区域 · 年龄 · 反欺诈</text><text x="467" y="389" class="s" fill="#586653">Steam / PlayStation / Xbox / App Store</text><rect x="805" y="155" width="330" height="345" rx="22" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="837" y="205" class="h" fill="#806560">智能家居</text><text x="837" y="251" class="b" fill="#806560">对象：房间 · 人员 · 设备 · 传感器</text><text x="837" y="291" class="b" fill="#806560">能力：开关 · 锁门 · 调温 · 检测</text><text x="837" y="331" class="b" fill="#806560">约束：权限 · 安全 · 占用 · 隐私</text><text x="837" y="382" class="s" fill="#806560">HomeKit / 米家 / Google Home</text><text x="837" y="410" class="s" fill="#806560">Home Assistant</text><rect x="65" y="555" width="1070" height="58" rx="16" fill="#E7E2D8"/><text x="94" y="590" font-size="18" fill="#665F57">共同点：将稳定对象、能力与约束标准化，把供应商或平台差异留在 Adapter 中；领域规则不能被抽象掉。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="496.6" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="640.8" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="171.0" width="65.8" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="222.0" width="290.0" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="262.0" width="290.0" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="302.0" width="273.9" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="360.0" width="316.9" height="47.0"/><rect data-figure-safe-zone="text" x="455.0" y="171.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="455.0" y="222.0" width="273.9" height="47.0"/><rect data-figure-safe-zone="text" x="455.0" y="262.0" width="273.9" height="47.0"/><rect data-figure-safe-zone="text" x="455.0" y="302.0" width="322.3" height="47.0"/><rect data-figure-safe-zone="text" x="455.0" y="360.0" width="359.9" height="47.0"/><rect data-figure-safe-zone="text" x="825.0" y="171.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="825.0" y="222.0" width="290.0" height="47.0"/><rect data-figure-safe-zone="text" x="825.0" y="262.0" width="273.9" height="47.0"/><rect data-figure-safe-zone="text" x="825.0" y="302.0" width="273.9" height="47.0"/><rect data-figure-safe-zone="text" x="825.0" y="353.0" width="268.5" height="47.0"/><rect data-figure-safe-zone="text" x="825.0" y="381.0" width="147.8" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="560.0" width="804.8" height="48.3"/></g></svg>
