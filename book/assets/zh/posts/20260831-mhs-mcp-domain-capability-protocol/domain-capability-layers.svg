<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">从硬件能力到领域能力</title>
  <desc id="desc">现实世界业务领域经过领域模型、能力模型和标准化 Adapter 或 Driver，连接到软件、硬件、服务和人。</desc>
  <rect width="760" height="500" fill="#fbf7ef"/>
  <style>
    .title{font:700 28px Georgia,"Times New Roman","Noto Serif CJK SC",serif;fill:#173f63}
    .box{fill:#fffdf8;stroke:#173f63;stroke-width:1.5;rx:8}
    .mhs{fill:#f2f8f4;stroke:#1f7a57;stroke-width:1.5;rx:8}
    .last{fill:#fff8f2;stroke:#9a3b2f;stroke-width:1.5;rx:8}
    .label{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#173f63}
    .small{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#425a6d}
    .line{stroke:#173f63;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#173f63"/></marker></defs>
  <text x="380" y="48" text-anchor="middle" class="title">同一套抽象可以往其他领域看</text>
  <rect x="150" y="84" width="460" height="54" class="box"/><text x="380" y="118" text-anchor="middle" class="label">现实世界业务领域</text>
  <path d="M380 138L380 166" class="line"/>
  <rect x="150" y="172" width="460" height="54" class="box"/><text x="380" y="206" text-anchor="middle" class="label">领域模型 Domain Model</text>
  <path d="M380 226L380 254" class="line"/>
  <rect x="150" y="260" width="460" height="54" class="mhs"/><text x="380" y="294" text-anchor="middle" class="label">能力模型 Capability Model</text>
  <path d="M380 314L380 342" class="line"/>
  <rect x="150" y="348" width="460" height="54" class="mhs"/><text x="380" y="382" text-anchor="middle" class="label">标准化 Adapter / Driver</text>
  <path d="M380 402L380 430" class="line"/>
  <rect x="150" y="436" width="460" height="42" class="last"/>
  <text x="380" y="463" text-anchor="middle" class="small">具体实现：软件、硬件、服务、人</text>
</svg>
