<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">从具体实现到领域能力的稳定分层</title><desc id="desc">现实业务通过领域模型和能力模型建立稳定语义，再由适配器和驱动连接多样化的软件、硬件、服务和人。抽象应保留领域的不变量和约束。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">稳定的领域语义，连接多样化的具体实现</text><text x="65" y="103" class="b" fill="#526D73">能力模型不是通用名词清单；它要表达领域对象、可做的事、状态、不变量与约束。</text><g text-anchor="middle"><rect x="150" y="145" width="800" height="65" rx="17" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="550" y="187" class="h" fill="#665F57">现实业务领域：目标、工作流、约束</text><path d="M550 210v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="255" width="800" height="85" rx="20" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="550" y="291" class="h" fill="#586653">领域模型 Domain Model</text><text x="550" y="319" class="b" fill="#586653">对象 · 关系 · 规则 · 不变量</text><path d="M550 340v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="385" width="800" height="85" rx="20" fill="#E7E2D8"/><text x="550" y="421" class="h" fill="#665F57">能力模型 Capability Model</text><text x="550" y="449" class="b" fill="#665F57">状态 · 操作 · 单位 · 限制 · 确认与恢复</text><path d="M550 470v30" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="515" width="800" height="51" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="550" y="548" class="b" fill="#806560">标准 Adapter / Driver → 软件 · 硬件 · 服务 · 人</text></g><text x="550" y="615" text-anchor="middle" font-size="16" fill="#806560">实现可以替换；若领域语义、约束或审计记录丢失，抽象就没有真正降低集成风险。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="557.4" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="585.0" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="153.0" width="330.0" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="257.0" width="256.3" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="290.0" width="248.9" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="387.0" width="302.1" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="420.0" width="340.0" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="519.0" width="425.7" height="47.0"/><rect data-figure-safe-zone="text" x="270.6" y="587.0" width="558.9" height="45.6"/></g></svg>
