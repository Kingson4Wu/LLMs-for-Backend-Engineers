<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">MHS Driver 的 read 和 write primitive</title>
  <desc id="desc">read 用于读取设备状态，例如获取温度；write 用于写入设备控制参数，例如设置温度。</desc>
  <rect width="760" height="300" fill="#fbf7ef"/>
  <style>
    .title{font:700 28px Georgia,"Times New Roman","Noto Serif CJK SC",serif;fill:#173f63}
    .card{fill:#fffdf8;stroke:#173f63;stroke-width:1.5;rx:8}
    .green{fill:#f2f8f4;stroke:#1f7a57;stroke-width:1.5;rx:8}
    .label{font:700 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#173f63}
    .small{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#425a6d}
    .line{stroke:#1f7a57;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1f7a57"/>
    </marker>
  </defs>
  <text x="380" y="48" text-anchor="middle" class="title">最小 primitive：read / write</text>
  <rect x="80" y="92" width="250" height="118" class="card"/>
  <text x="205" y="130" text-anchor="middle" class="label">read</text>
  <path d="M205 145L205 166" class="line"/>
  <rect x="114" y="174" width="182" height="28" class="green"/>
  <text x="205" y="195" text-anchor="middle" class="small">get temperature</text>
  <rect x="430" y="92" width="250" height="118" class="card"/>
  <text x="555" y="130" text-anchor="middle" class="label">write</text>
  <path d="M555 145L555 166" class="line"/>
  <rect x="464" y="174" width="182" height="28" class="green"/>
  <text x="555" y="195" text-anchor="middle" class="small">set temperature</text>
  <text x="380" y="254" text-anchor="middle" class="small">primitive 很简单，关键仍然是背后的设备语义和安全约束</text>
</svg>
