<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">读操作观察状态，写操作请求受控变更</title><desc id="desc">read 返回设备当前观察状态，write 请求一个受限且可确认的状态变更。原语名称简单，但正确行为依赖单位、能力、限制和恢复语义。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="620" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">read 观察状态；write 请求受控状态变更</text><text x="65" y="103" class="b" fill="#526D73">两类原语都需要共同的设备语义，尤其是单位、能力范围、安全限制和恢复策略。</text><rect x="65" y="165" width="430" height="280" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="97" y="219" class="h" fill="#665F57">read</text><text x="97" y="256" class="b" fill="#526D73">读取设备已经观察到的状态</text><rect x="97" y="294" width="366" height="56" rx="12" fill="#F2F7EC"/><text x="120" y="329" class="b" fill="#9CBFC4">temperature → 21.4 °C</text><text x="97" y="395" class="b" fill="#7A8F93">不改变物理世界</text><path d="M495 305h105" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="615" y="165" width="420" height="280" rx="22" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="647" y="219" class="h" fill="#806560">write</text><text x="647" y="256" class="b" fill="#806560">请求设备尝试一个状态变更</text><rect x="647" y="294" width="356" height="56" rx="12" fill="#FDF0ED"/><text x="670" y="329" class="b" fill="#806560">target_temperature = 25 °C</text><text x="647" y="395" class="b" fill="#806560">须校验限制、权限、确认与结果</text><rect x="65" y="510" width="970" height="49" rx="14" fill="#E7E2D8"/><text x="94" y="542" font-size="18" fill="#665F57">write 并不是“保证完成”：系统还要报告实际状态、失败原因和必要的恢复路径。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="588.5" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="576.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="185.0" width="69.8" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="227.0" width="217.8" height="47.0"/><rect data-figure-safe-zone="text" x="108.0" y="300.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="366.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="635.0" y="185.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="635.0" y="227.0" width="217.8" height="47.0"/><rect data-figure-safe-zone="text" x="658.0" y="300.0" width="253.8" height="47.0"/><rect data-figure-safe-zone="text" x="635.0" y="366.0" width="235.5" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="512.0" width="622.9" height="48.3"/></g></svg>
