<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">MCP 的基本结构</title><desc id="desc">MCP 客户端连接 MCP 服务端，服务端向客户端暴露提示、资源和工具，并将其接到外部数据和工作流。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:23px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="620" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">MCP：把客户端连接到外部可用能力</text><text x="65" y="103" class="b" fill="#526D73">协议定义通信与暴露边界；服务端仍要负责它所连接系统的权限、语义和执行治理。</text><rect x="65" y="185" width="250" height="190" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="97" y="237" class="h" fill="#665F57">MCP Client</text><text x="97" y="275" class="b" fill="#526D73">Agent 或应用</text><text x="97" y="310" class="b" fill="#526D73">发现并调用能力</text><path d="M315 280h120" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="450" y="150" width="260" height="260" rx="24" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="482" y="205" class="h" fill="#586653">MCP Server</text><text x="482" y="251" class="b" fill="#586653">prompts</text><text x="482" y="286" class="b" fill="#586653">resources</text><text x="482" y="321" class="b" fill="#586653">tools</text><text x="482" y="366" class="b" fill="#586653">负责连接与暴露边界</text><path d="M710 280h120" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="845" y="185" width="190" height="190" rx="22" fill="#FDF0ED" stroke="#F4D5CE" stroke-width="2"/><text x="877" y="237" class="h" fill="#806560">外部系统</text><text x="877" y="275" class="b" fill="#806560">数据</text><text x="877" y="310" class="b" fill="#806560">工具与工作流</text><rect x="65" y="485" width="970" height="46" rx="13" fill="#E7E2D8"/><text x="94" y="515" font-size="18" fill="#665F57">MCP 解决“如何连接和暴露”；被暴露能力本身的可靠性、安全性和业务语义仍必须另行建模。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="485.8" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="599.6" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="203.0" width="138.4" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="246.0" width="125.5" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="281.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="470.0" y="171.0" width="138.4" height="53.7"/><rect data-figure-safe-zone="text" x="470.0" y="222.0" width="85.9" height="47.0"/><rect data-figure-safe-zone="text" x="470.0" y="257.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="470.0" y="292.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="470.0" y="337.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="203.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="865.0" y="246.0" width="56.3" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="281.0" width="120.9" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="485.0" width="706.7" height="48.3"/></g></svg>
