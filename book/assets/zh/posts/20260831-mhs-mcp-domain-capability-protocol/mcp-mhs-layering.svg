<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">MCP 与 MHS 的互补分层</title><desc id="desc">Agent 经 MCP 等业务接入层调用能力。MHS 在其下提供标准设备语义和驱动适配，最终连接厂商 SDK 与物理硬件。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.t{font-size:31px;font-weight:700;fill:#665F57}.s{font-size:17px;fill:#6F8486}.h{font-size:22px;font-weight:700;fill:#665F57}.b{font-size:17px;fill:#526D73}.n{font-size:16px;fill:#806560}</style></defs><rect width="1100" height="650" fill="#FFF"/><text x="65" y="66" class="t">MCP 是接入协议；MHS 是硬件能力语义层</text><text x="65" y="101" class="s">连接、发现与调用是一层；跨设备的对象、状态、限制及操作语义是另一层。</text><g text-anchor="middle"><rect x="150" y="140" width="800" height="70" rx="18" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><circle cx="194" cy="175" r="18" fill="#6287A0"/><text x="194" y="181" font-size="16" font-weight="700" fill="#FFF">A</text><text x="565" y="182" class="h">Agent / Application</text><path d="M550 210v30" fill="none" stroke="#9CBFC4" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="255" width="800" height="90" rx="20" fill="#F0ECFA" stroke="#BBAFE2" stroke-width="2"/><rect x="174" y="275" width="8" height="50" rx="4" fill="#8E7CAE"/><text x="565" y="291" class="h">业务接入层</text><text x="565" y="321" class="b">MCP Tools · CLI · code/API · 业务 API · 审批流程</text><path d="M550 345v30" fill="none" stroke="#8E7CAE" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="390" width="800" height="95" rx="20" fill="#E4F5F6" stroke="#79C6CA" stroke-width="2.5"/><rect x="174" y="411" width="8" height="53" rx="4" fill="#6E9FA3"/><text x="565" y="428" class="h">MHS 标准设备能力与 Driver</text><text x="565" y="460" class="b">对象 · 能力 · 状态 · 单位 · 限制 · 安全规则 · 设备适配</text><path d="M550 485v28" fill="none" stroke="#6E9FA3" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="528" width="800" height="52" rx="16" fill="#FFF3DE" stroke="#E3BF78" stroke-width="2"/><text x="565" y="562" class="b">Vendor SDKs / device interfaces / physical hardware</text></g><rect x="150" y="604" width="800" height="28" rx="14" fill="#FCE8E6"/><text x="550" y="624" text-anchor="middle" class="n">任何一层都不自动授予权限，也不能取代领域安全、授权、幂等与审计控制。</text></svg>
