<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">MCP 与 MHS 的分层关系</title>
  <desc id="desc">AI Agent 通过 MCP、CLI、code files 或业务 API 访问上层业务工具，业务工具再基于 MHS 标准设备表示和 Driver 连接具体硬件。</desc>
  <rect width="760" height="620" fill="#fbf7ef"/>

  <style>
    .title { font: 700 28px Georgia, "Times New Roman", "Noto Serif CJK SC", serif; fill: #173f63; }
    .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #173f63; }
    .small { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #425a6d; }
    .tiny { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #5f7180; }
    .box { fill: #fffdf8; stroke: #173f63; stroke-width: 1.5; rx: 8; }
    .access { fill: #eff6fb; stroke: #173f63; stroke-width: 1.5; rx: 8; }
    .mhs { fill: #f2f8f4; stroke: #1f7a57; stroke-width: 1.5; rx: 8; }
    .warn { fill: #fff8f2; stroke: #9a3b2f; stroke-width: 1.5; rx: 8; }
    .line { stroke: #173f63; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .green-line { stroke: #1f7a57; stroke-width: 1.8; fill: none; marker-end: url(#green-arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#173f63"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a57"/>
    </marker>
  </defs>

  <text x="380" y="48" text-anchor="middle" class="title">MCP 和 MHS 的位置</text>
  <text x="380" y="78" text-anchor="middle" class="small">MCP 是接入入口，MHS 是硬件能力的标准化层</text>

  <rect x="190" y="112" width="380" height="68" class="box"/>
  <text x="380" y="142" text-anchor="middle" class="label">AI Agent</text>
  <text x="380" y="166" text-anchor="middle" class="small">规划任务、选择能力、读取约束</text>

  <path d="M380 180 L380 216" class="line"/>

  <rect x="110" y="222" width="540" height="86" class="access"/>
  <text x="380" y="253" text-anchor="middle" class="label">业务接入层</text>
  <text x="380" y="279" text-anchor="middle" class="small">MCP Tools / CLI / code files（APIs）/ 业务 API</text>
  <text x="380" y="300" text-anchor="middle" class="tiny">工具名、参数、审批和流程由业务方设计</text>

  <path d="M380 308 L380 346" class="green-line"/>

  <rect x="110" y="352" width="540" height="88" class="mhs"/>
  <text x="380" y="383" text-anchor="middle" class="label">MHS 标准设备表示</text>
  <text x="380" y="410" text-anchor="middle" class="small">对象、能力、状态、单位、限制、安全规则</text>
  <text x="380" y="431" text-anchor="middle" class="tiny">这些稳定语义不必反复写进 MCP Tool 描述里</text>

  <path d="M380 440 L380 476" class="green-line"/>

  <rect x="190" y="482" width="380" height="62" class="mhs"/>
  <text x="380" y="510" text-anchor="middle" class="label">MHS Driver</text>
  <text x="380" y="533" text-anchor="middle" class="small">适配厂商 SDK / 设备接口</text>

  <path d="M380 544 L380 574" class="green-line"/>

  <rect x="150" y="580" width="460" height="28" class="warn"/>
  <text x="380" y="600" text-anchor="middle" class="tiny">显微镜、机械臂、移液工作站、传感器、激光系统</text>
</svg>
