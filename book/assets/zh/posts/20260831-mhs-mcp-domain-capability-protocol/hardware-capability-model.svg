<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">从厂商接口到稳定的硬件能力模型</title><desc id="desc">驱动将不同机械臂接口映射为包含对象、状态、操作和约束的标准 RobotArm 能力模型。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1200" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">不要把上层工作流绑死在厂商函数名上</text><text x="65" y="103" class="b" fill="#526D73">驱动映射不同 API，保留状态、限制和安全语义，形成稳定的能力边界。</text><g><rect x="65" y="170" width="230" height="75" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="97" y="215" class="h" fill="#806560">ABB</text><text x="97" y="238" class="b" fill="#806560">moveJoint()</text><rect x="65" y="275" width="230" height="75" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="97" y="320" class="h" fill="#806560">Fanuc</text><text x="97" y="343" class="b" fill="#806560">jointMove()</text><rect x="65" y="380" width="230" height="75" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="97" y="425" class="h" fill="#806560">KUKA</text><text x="97" y="448" class="b" fill="#806560">PTP()</text><path d="M295 208h105m-105 104h105m-105 105h105" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/></g><rect x="415" y="150" width="430" height="330" rx="24" fill="#E7E2D8"/><text x="447" y="197" class="h" fill="#665F57">RobotArm 标准能力模型</text><text x="447" y="247" class="b" fill="#665F57">对象与状态：位姿 · 载荷 · 健康</text><text x="447" y="292" class="b" fill="#665F57">操作：move · grasp · stop · calibrate</text><text x="447" y="337" class="b" fill="#665F57">约束：工作空间 · 单位 · 最大载荷 · 安全限制</text><text x="447" y="382" class="b" fill="#665F57">治理：确认要求 · 结果状态 · 恢复语义</text><text x="447" y="434" class="b" fill="#665F57">上层调用稳定能力，而非厂商 API</text><path d="M845 315h100" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="960" y="245" width="175" height="140" rx="20" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="992" y="292" class="h" fill="#665F57">Agent / App</text><text x="992" y="326" class="b" fill="#526D73">发现能力</text><text x="992" y="354" class="b" fill="#526D73">检查约束后调用</text><rect x="65" y="540" width="1070" height="45" rx="13" fill="#FDF0ED"/><text x="93" y="569" font-size="17" fill="#806560">抽象的价值是可复用完整语义，而不是粗暴地把不同厂商的函数改成同一个字符串。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="540.8" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="514.6" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="181.0" width="58.3" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="209.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="286.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="314.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="391.0" width="69.8" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="419.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="435.0" y="163.0" width="252.4" height="53.7"/><rect data-figure-safe-zone="text" x="435.0" y="218.0" width="263.5" height="47.0"/><rect data-figure-safe-zone="text" x="435.0" y="263.0" width="339.2" height="47.0"/><rect data-figure-safe-zone="text" x="435.0" y="308.0" width="370.8" height="47.0"/><rect data-figure-safe-zone="text" x="435.0" y="353.0" width="312.0" height="47.0"/><rect data-figure-safe-zone="text" x="435.0" y="405.0" width="262.0" height="47.0"/><rect data-figure-safe-zone="text" x="980.0" y="258.0" width="149.8" height="53.7"/><rect data-figure-safe-zone="text" x="980.0" y="297.0" width="88.6" height="47.0"/><rect data-figure-safe-zone="text" x="980.0" y="325.0" width="137.1" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="540.0" width="606.9" height="47.0"/></g></svg>
