<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">业务方如何基于 MHS 接入</title>
  <desc id="desc">业务目标和流程通过业务方自己的 MCP Tools、CLI、code files 或 APIs 接入 MHS 标准设备表示，再连接不同厂商设备 Driver 和具体硬件。</desc>
  <rect width="760" height="460" fill="#fbf7ef"/>
  <style>
    .title{font:700 28px Georgia,"Times New Roman","Noto Serif CJK SC",serif;fill:#173f63}
    .box{fill:#fffdf8;stroke:#173f63;stroke-width:1.5;rx:8}
    .mhs{fill:#f2f8f4;stroke:#1f7a57;stroke-width:1.5;rx:8}
    .device{fill:#fff8f2;stroke:#9a3b2f;stroke-width:1.5;rx:8}
    .label{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#173f63}
    .small{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#425a6d}
    .line{stroke:#173f63;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    .green{stroke:#1f7a57;stroke-width:1.8;fill:none;marker-end:url(#greenArrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#173f63"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f7a57"/></marker>
  </defs>
  <text x="380" y="48" text-anchor="middle" class="title">MHS 不替业务方设计工具</text>
  <rect x="130" y="84" width="500" height="58" class="box"/>
  <text x="380" y="120" text-anchor="middle" class="label">业务目标 / 实验流程 / 生产流程</text>
  <path d="M380 142L380 174" class="line"/>
  <rect x="130" y="180" width="500" height="62" class="box"/>
  <text x="380" y="207" text-anchor="middle" class="label">业务方自己的接入层</text>
  <text x="380" y="231" text-anchor="middle" class="small">MCP Tools / CLI / code files / APIs</text>
  <path d="M380 242L380 274" class="green"/>
  <rect x="130" y="280" width="500" height="58" class="mhs"/>
  <text x="380" y="316" text-anchor="middle" class="label">MHS 标准设备表示</text>
  <path d="M380 338L380 370" class="green"/>
  <rect x="130" y="376" width="500" height="42" class="mhs"/>
  <text x="380" y="403" text-anchor="middle" class="small">不同厂商设备 Driver</text>
  <path d="M380 418L380 438" class="green"/>
  <rect x="130" y="440" width="500" height="14" class="device"/>
</svg>
