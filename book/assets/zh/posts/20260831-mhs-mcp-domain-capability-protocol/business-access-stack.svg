<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">业务访问栈建立在共享设备语义之上</title><desc id="desc">业务目标通过业务方定义的工具和流程接入 MHS 标准设备能力与驱动，最终操作物理硬件。MHS 不替业务方决定工具、授权或流程。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">业务工具在共享设备语义之上，而不是绕过它</text><text x="65" y="103" class="b" fill="#526D73">MHS 提供设备互操作边界；业务方仍须定义目标、工作流、授权、审批和审计。</text><g text-anchor="middle"><rect x="150" y="145" width="800" height="70" rx="17" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="550" y="189" class="h" fill="#665F57">业务目标 / 实验流程 / 生产流程</text><path d="M550 215v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="260" width="800" height="90" rx="20" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="550" y="297" class="h" fill="#586653">业务方自己的接入层</text><text x="550" y="326" class="b" fill="#586653">MCP tools · CLI · code/API · 权限、审批、审计与流程</text><path d="M550 350v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="395" width="800" height="90" rx="20" fill="#E7E2D8"/><text x="550" y="432" class="h" fill="#665F57">MHS 标准设备表示与驱动</text><text x="550" y="461" class="b" fill="#665F57">对象 · 能力 · 状态 · 限制 · 单位 · 厂商设备适配</text><path d="M550 485v30" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="530" width="800" height="51" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="550" y="563" class="b" fill="#806560">具体硬件：显微镜 · 机械臂 · 移液工作站 · 传感器</text></g><text x="550" y="620" text-anchor="middle" font-size="16" fill="#806560">统一的设备语义减少重复集成，不会自动产生正确的业务流程或安全决策。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="618.2" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="555.8" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="155.0" width="343.4" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="263.0" width="212.1" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="297.0" width="443.4" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="398.0" width="257.9" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="432.0" width="415.0" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="534.0" width="403.1" height="47.0"/><rect data-figure-safe-zone="text" x="294.1" y="592.0" width="511.8" height="45.6"/></g></svg>
