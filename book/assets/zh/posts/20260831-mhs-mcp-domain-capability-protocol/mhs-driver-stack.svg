<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">MHS Driver 在设备与上层能力模型之间翻译</title><desc id="desc">MHS Driver 将厂商 SDK 或设备协议映射为包含对象、状态、能力和限制的标准设备表示，供 Agent 或程序调用。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">MHS Driver 是设备接口与共享语义之间的翻译层</text><text x="65" y="103" class="b" fill="#526D73">它不替代设备，而是把供应商差异封装为上层可发现、可组合的标准能力。</text><g text-anchor="middle"><rect x="150" y="155" width="800" height="72" rx="18" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="550" y="200" class="h" fill="#665F57">Agent / Program</text><path d="M550 227v43" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="285" width="800" height="96" rx="20" fill="#E7E2D8"/><text x="550" y="326" class="h" fill="#665F57">标准设备能力模型</text><text x="550" y="356" class="b" fill="#665F57">对象 · 状态 · 操作 · 单位 · 约束 · 恢复语义</text><path d="M550 381v43" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="439" width="800" height="72" rx="18" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="550" y="484" class="h" fill="#586653">MHS Driver / Adapter</text><path d="M550 511v43" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="569" width="800" height="45" rx="14" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="550" y="599" class="b" fill="#806560">Vendor SDK · device protocol · physical device</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="693.4" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="535.0" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="166.0" width="195.6" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="292.0" width="191.2" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="327.0" width="382.7" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="450.0" width="252.8" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="570.0" width="430.6" height="47.0"/></g></svg>
