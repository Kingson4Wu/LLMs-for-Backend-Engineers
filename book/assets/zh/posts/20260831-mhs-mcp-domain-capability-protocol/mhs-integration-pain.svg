<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">MHS 要解决的硬件集成复杂性</title><desc id="desc">多供应商设备把相似能力暴露为不同接口和分散语义，造成每条工作流的重复适配。驱动和共享能力模型将供应商差异封装在统一边界之后。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1200" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">硬件集成的难点，不只是“能不能调用”</text><text x="65" y="103" class="b" fill="#526D73">相同意图背后往往有不同供应商、单位、状态机、限制条件和故障恢复语义。</text><rect x="65" y="155" width="280" height="290" rx="22" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="97" y="204" class="h" fill="#806560">设备现实</text><text x="97" y="251" class="b" fill="#806560">多供应商与 SDK</text><text x="97" y="289" class="b" fill="#806560">相似能力，不同接口</text><text x="97" y="327" class="b" fill="#806560">说明书和限制分散</text><text x="97" y="390" class="b" fill="#806560">很多语义不在函数签名中</text><path d="M345 300h95" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="455" y="155" width="280" height="290" rx="22" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="487" y="204" class="h" fill="#586653">逐条手工适配</text><text x="487" y="251" class="b" fill="#586653">每个工作流重新理解</text><text x="487" y="289" class="b" fill="#586653">对象、单位与状态</text><text x="487" y="327" class="b" fill="#586653">安全约束和恢复规则</text><text x="487" y="390" class="b" fill="#586653">重复成本随集成扩张</text><path d="M735 300h95" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="845" y="155" width="290" height="290" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="877" y="204" class="h" fill="#665F57">MHS 的目标边界</text><text x="877" y="251" class="b" fill="#526D73">驱动隐藏供应商差异</text><text x="877" y="289" class="b" fill="#526D73">共享能力模型暴露对象</text><text x="877" y="327" class="b" fill="#526D73">状态、单位、限制和恢复</text><text x="877" y="390" class="b" fill="#9CBFC4">让 Agent 可发现、理解、组合</text><rect x="65" y="510" width="1070" height="49" rx="14" fill="#E7E2D8"/><text x="94" y="542" font-size="18" fill="#665F57">目标不是统一一个函数名，而是复用完整的能力语义，使跨设备工作流能可靠地组合和治理。</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="529.9" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="543.9" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="170.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="222.0" width="140.1" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="260.0" width="162.0" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="298.0" width="153.2" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="361.0" width="201.6" height="47.0"/><rect data-figure-safe-zone="text" x="475.0" y="170.0" width="149.4" height="53.7"/><rect data-figure-safe-zone="text" x="475.0" y="222.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="475.0" y="260.0" width="145.9" height="47.0"/><rect data-figure-safe-zone="text" x="475.0" y="298.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="475.0" y="361.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="170.0" width="174.3" height="53.7"/><rect data-figure-safe-zone="text" x="865.0" y="222.0" width="169.4" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="260.0" width="185.5" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="298.0" width="187.0" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="361.0" width="232.8" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="512.0" width="701.9" height="48.3"/></g></svg>
