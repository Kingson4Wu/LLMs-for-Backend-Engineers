<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">从失败到回归集的评测迭代闭环</title><desc id="desc">代表性任务被运行并产生轨迹，团队归因失败、改进系统、将失败模式写入回归集，再重新评测以防退化。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">有用的评测，把观察到的失败沉淀为耐久的回归检查</text><text x="58" y="105" font-size="18" fill="#5E7F9C">分数是入口；读 trace、定位失败模式并验证修复，才让系统持续变好。</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M250 255H305"/><path d="M500 255H555"/><path d="M750 255H805"/><path d="M1000 255V400H150V335"/></g><g stroke-width="3"><rect x="55" y="175" width="195" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="305" y="175" width="195" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="555" y="175" width="195" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="805" y="175" width="195" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="152" y="227" font-size="22" font-weight="700" fill="#17324D">运行案例</text><text x="152" y="261" font-size="16" fill="#0F4D92">代表性任务与</text><text x="152" y="287" font-size="16" fill="#0F4D92">真实约束</text><text x="402" y="227" font-size="22" font-weight="700" fill="#765800">读取轨迹</text><text x="402" y="261" font-size="16" fill="#765800">模型步骤、工具结果</text><text x="402" y="287" font-size="16" fill="#765800">环境与状态变化</text><text x="652" y="227" font-size="22" font-weight="700" fill="#B64342">归因失败</text><text x="652" y="261" font-size="16" fill="#B64342">模型、提示、工具、</text><text x="652" y="287" font-size="16" fill="#B64342">数据、环境或策略</text><text x="902" y="227" font-size="22" font-weight="700" fill="#17324D">改进系统</text><text x="902" y="261" font-size="16" fill="#0F4D92">修复契约、工具、</text><text x="902" y="287" font-size="16" fill="#0F4D92">流程或资源配置</text></g><rect x="300" y="425" width="600" height="92" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="462" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">更新回归案例并重新评测</text><text x="600" y="494" text-anchor="middle" font-size="17" fill="#765800">明确检查修复是否有效，也检查新改动没有让已知能力退化。</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">失败模式被结构化保留，才不会在下一轮改动中反复重新发现。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="688.0" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="545.1" height="48.3"/><rect data-figure-safe-zone="text" x="140.0" y="193.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="140.0" y="233.0" width="115.2" height="45.6"/><rect data-figure-safe-zone="text" x="140.0" y="259.0" width="84.8" height="45.6"/><rect data-figure-safe-zone="text" x="390.0" y="193.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="390.0" y="233.0" width="153.9" height="45.6"/><rect data-figure-safe-zone="text" x="390.0" y="259.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="640.0" y="193.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="640.0" y="233.0" width="140.2" height="45.6"/><rect data-figure-safe-zone="text" x="640.0" y="259.0" width="138.7" height="45.6"/><rect data-figure-safe-zone="text" x="890.0" y="193.0" width="107.6" height="53.7"/><rect data-figure-safe-zone="text" x="890.0" y="233.0" width="131.8" height="45.6"/><rect data-figure-safe-zone="text" x="890.0" y="259.0" width="130.4" height="45.6"/><rect data-figure-safe-zone="text" x="478.3" y="429.0" width="243.4" height="52.4"/><rect data-figure-safe-zone="text" x="377.3" y="465.0" width="445.4" height="47.0"/><rect data-figure-safe-zone="text" x="356.3" y="562.0" width="487.3" height="48.3"/></g></svg>
