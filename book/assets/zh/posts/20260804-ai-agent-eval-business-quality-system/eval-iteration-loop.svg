<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Trace driven eval iteration loop</title>
  <desc id="desc">Agent eval improves through a loop of running tasks, reading traces, classifying failures, improving tools and prompts, and rerunning evals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <rect x="70" y="60" width="1060" height="520" rx="22" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18212f">Eval-driven 的迭代闭环</text>
  <text x="600" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">真正的改进通常来自读 trace 后定位具体失败模式</text>

  <rect x="112" y="270" width="170" height="84" rx="14" fill="#e8f2ff" stroke="#6b9bd8" stroke-width="2"/>
  <text x="197" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f4f82">运行任务</text>
  <text x="197" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#365f86">task / trial</text>

  <rect x="335" y="210" width="180" height="84" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="425" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">读取 trace</text>
  <text x="425" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">过程和环境</text>

  <rect x="630" y="210" width="190" height="84" rx="14" fill="#fff4df" stroke="#d69d42" stroke-width="2"/>
  <text x="725" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#895d16">归因失败</text>
  <text x="725" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7b5a24">模型 / 工具 / 环境</text>

  <rect x="918" y="270" width="170" height="84" rx="14" fill="#e9f7ef" stroke="#5ca879" stroke-width="2"/>
  <text x="1003" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#25643d">改进系统</text>
  <text x="1003" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#3f7b54">prompt / tool</text>

  <rect x="630" y="396" width="190" height="84" rx="14" fill="#f3e8ff" stroke="#a47ad4" stroke-width="2"/>
  <text x="725" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6b3fa0">更新 case</text>
  <text x="725" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7c5aa5">失败模式沉淀</text>

  <rect x="335" y="396" width="180" height="84" rx="14" fill="#fee2e2" stroke="#e87979" stroke-width="2"/>
  <text x="425" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9f3131">回归验证</text>
  <text x="425" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9f4f4f">防止退化</text>

  <path d="M282 298 C302 268 316 256 325 252" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M515 252 H620" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 252 C872 254 900 273 910 294" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1003 354 C980 416 900 440 831 440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 440 H525" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M425 396 C362 374 300 350 288 326" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="390" y="515" width="420" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">分数只是入口，trace 才是迭代依据</text>
</svg>
