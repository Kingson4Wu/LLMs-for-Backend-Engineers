<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">业务质量系统中的多层证据</title><desc id="desc">自动化检查、离线评测、人工复核和线上反馈共同构成 Agent 的业务质量系统；没有任一层能单独替代其余层。</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle"><text x="58" y="68" text-anchor="start" font-size="31" font-weight="700" fill="#17324D">Eval 是业务质量系统中的一层证据，不是全部</text><text x="58" y="105" text-anchor="start" font-size="18" fill="#5E7F9C">自动化提供规模与速度；人工校准高风险边界；线上真实分布和事故反馈纠正离线盲区。</text><g stroke-width="3"><rect x="115" y="165" width="970" height="90" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="190" y="280" width="820" height="90" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="265" y="395" width="670" height="90" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="340" y="510" width="520" height="60" rx="18" fill="#F6CFCB" stroke="#B64342"/></g><text x="600" y="204" font-size="23" font-weight="700" fill="#17324D">自动化检查：规模、速度与确定性底线</text><text x="600" y="235" font-size="17" fill="#0F4D92">格式、约束、权限、回归指标与常见失败模式</text><text x="600" y="319" font-size="23" font-weight="700" fill="#765800">Eval suite：可运行、可复现、可比较的离线证据</text><text x="600" y="350" font-size="17" fill="#765800">任务、样例、grader、trace、成本与成功条件</text><text x="600" y="434" font-size="23" font-weight="700" fill="#17324D">人工复核：校准主观质量和低频高风险边界</text><text x="600" y="465" font-size="17" fill="#0F4D92">处理含糊目标、潜在伤害、争议案例与升级决策</text><text x="600" y="548" font-size="20" font-weight="700" fill="#B64342">线上反馈：真实分布、用户反馈、事故复盘</text><text x="600" y="612" font-size="18" fill="#5E7F9C">成熟质量系统不是“纯自动”或“纯人工”，而是让各种证据相互校验。</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="621.4" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="667.7" height="48.3"/><rect data-figure-safe-zone="text" x="588.0" y="169.0" width="375.7" height="55.0"/><rect data-figure-safe-zone="text" x="588.0" y="206.0" width="325.1" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="284.0" width="485.4" height="55.0"/><rect data-figure-safe-zone="text" x="588.0" y="321.0" width="334.2" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="399.0" width="429.3" height="55.0"/><rect data-figure-safe-zone="text" x="588.0" y="436.0" width="348.5" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="516.0" width="359.2" height="51.0"/><rect data-figure-safe-zone="text" x="588.0" y="582.0" width="524.8" height="48.3"/></g></svg>
