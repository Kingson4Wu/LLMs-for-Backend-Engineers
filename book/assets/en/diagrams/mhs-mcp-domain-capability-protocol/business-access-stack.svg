<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Business access stacks are built above shared device semantics</title><desc id="desc">Business goals connect through business-defined tools and workflows to MHS standard device capabilities and drivers, which ultimately operate physical hardware. MHS does not decide business tools, authorization, or workflow.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">Business tools sit above shared device semantics, not around them</text><text x="65" y="103" class="b" fill="#526D73">MHS supplies an interoperability boundary; the business still defines goals, workflow, authority, approval, and audit.</text><g text-anchor="middle"><rect x="150" y="145" width="800" height="70" rx="17" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="550" y="189" class="h" fill="#665F57">Business goal / experiment / production workflow</text><path d="M550 215v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="260" width="800" height="90" rx="20" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="550" y="297" class="h" fill="#586653">Business-defined access layer</text><text x="550" y="326" class="b" fill="#586653">MCP tools · CLI · code/API · authority, approval, audit, workflow</text><path d="M550 350v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="395" width="800" height="90" rx="20" fill="#E7E2D8"/><text x="550" y="432" class="h" fill="#665F57">MHS standard device representation and drivers</text><text x="550" y="461" class="b" fill="#665F57">objects · capabilities · state · limits · units · vendor adapters</text><path d="M550 485v30" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="530" width="800" height="51" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="550" y="563" class="b" fill="#806560">physical hardware: microscope · arm · liquid handler · sensor</text></g><text x="550" y="620" text-anchor="middle" font-size="16" fill="#806560">Shared device semantics reduce repeated integration; they do not automatically create correct business workflow or safety decisions.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="1105.6" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="1067.1" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="155.0" width="573.1" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="263.0" width="355.8" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="297.0" width="598.6" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="398.0" width="550.2" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="432.0" width="598.6" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="534.0" width="563.2" height="47.0"/><rect data-figure-safe-zone="text" x="-11.1" y="592.0" width="1122.2" height="45.6"/></g></svg>
