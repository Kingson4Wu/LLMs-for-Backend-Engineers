<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The capability-model pattern extends beyond hardware</title>
  <desc id="desc">Payments, game platforms, and smart homes can hide diverse implementations behind stable objects, capabilities, and constraints. Domain rules and risk boundaries must remain explicit.</desc>
  <style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:15px}</style>
  <rect width="1200" height="680" fill="#FFFDF9"/>
  <text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">The capability-model pattern extends beyond hardware</text>
  <text x="65" y="103" class="b" fill="#526D73">Stable objects, invocable capabilities, and explicit constraints enable reuse across implementations without erasing domain risk.</text>
  <rect x="65" y="155" width="330" height="345" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/>
  <text x="97" y="205" class="h" fill="#665F57">Payments</text>
  <text x="97" y="251" font-size="15" fill="#526D73">objects: payment &#xB7; refund</text><text x="97" y="273" font-size="15" fill="#526D73">settlement &#xB7; dispute</text>
  <text x="97" y="311" font-size="15" fill="#526D73">capabilities: pay &#xB7; refund</text><text x="97" y="333" font-size="15" fill="#526D73">status &#xB7; reconcile</text>
  <text x="97" y="371" font-size="15" fill="#526D73">constraints: currency &#xB7; region</text><text x="97" y="393" font-size="15" fill="#526D73">risk &#xB7; compliance</text>
  <text x="97" y="433" font-size="14" fill="#7A8F93">Alipay / WeChat Pay / Stripe</text><text x="97" y="455" font-size="14" fill="#7A8F93">Apple Pay</text>
  <rect x="435" y="155" width="330" height="345" rx="22" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/>
  <text x="467" y="205" class="h" fill="#586653">Game-platform services</text>
  <text x="467" y="251" font-size="15" fill="#586653">objects: player &#xB7; entitlement</text><text x="467" y="273" font-size="15" fill="#586653">inventory &#xB7; subscription</text>
  <text x="467" y="311" font-size="15" fill="#586653">capabilities: sign in &#xB7; grant</text><text x="467" y="333" font-size="15" fill="#586653">verify &#xB7; refund</text>
  <text x="467" y="371" font-size="15" fill="#586653">constraints: policy &#xB7; region</text><text x="467" y="393" font-size="15" fill="#586653">age &#xB7; anti-fraud</text>
  <text x="467" y="433" font-size="14" fill="#586653">Steam / PlayStation / Xbox</text><text x="467" y="455" font-size="14" fill="#586653">App Store</text>
  <rect x="805" y="155" width="330" height="345" rx="22" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/>
  <text x="837" y="205" class="h" fill="#806560">Smart homes</text>
  <text x="837" y="251" font-size="15" fill="#806560">objects: room &#xB7; person</text><text x="837" y="273" font-size="15" fill="#806560">device &#xB7; sensor</text>
  <text x="837" y="311" font-size="15" fill="#806560">capabilities: switch &#xB7; lock</text><text x="837" y="333" font-size="15" fill="#806560">set temperature &#xB7; detect</text>
  <text x="837" y="371" font-size="15" fill="#806560">constraints: authority &#xB7; safety</text><text x="837" y="393" font-size="15" fill="#806560">occupancy &#xB7; privacy</text>
  <text x="837" y="433" font-size="14" fill="#806560">HomeKit / Mi Home / Google</text><text x="837" y="455" font-size="14" fill="#806560">Home / Home Assistant</text>
  <rect x="65" y="555" width="1070" height="58" rx="16" fill="#E7E2D8"/>
  <text x="94" y="580" font-size="17" fill="#665F57">Standardize stable objects, capabilities, and constraints; keep platform variation in adapters.</text><text x="94" y="604" font-size="17" fill="#665F57">Do not abstract away domain rules.</text>
