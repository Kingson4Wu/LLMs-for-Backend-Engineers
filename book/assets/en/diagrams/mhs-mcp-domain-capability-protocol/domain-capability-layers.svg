<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Stable domain layers from concrete implementation to capability</title><desc id="desc">Business reality establishes stable semantics through a domain model and capability model, then adapters and drivers connect diverse software, hardware, services, and people. The abstraction must preserve domain invariants and constraints.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="650" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">Stable domain semantics connect diverse implementations</text><text x="65" y="103" class="b" fill="#526D73">A capability model is not a generic noun list; it expresses domain objects, actions, state, invariants, and constraints.</text><g text-anchor="middle"><rect x="150" y="145" width="800" height="65" rx="17" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="550" y="187" class="h" fill="#665F57">Business domain: goals, workflow, constraints</text><path d="M550 210v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="255" width="800" height="85" rx="20" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/><text x="550" y="291" class="h" fill="#586653">Domain model</text><text x="550" y="319" class="b" fill="#586653">objects · relationships · rules · invariants</text><path d="M550 340v30" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="385" width="800" height="85" rx="20" fill="#E7E2D8"/><text x="550" y="421" class="h" fill="#665F57">Capability model</text><text x="550" y="449" class="b" fill="#665F57">state · operations · units · limits · confirmation · recovery</text><path d="M550 470v30" fill="none" stroke="#D3AAA1" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="515" width="800" height="51" rx="16" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="550" y="548" class="b" fill="#806560">standard adapters / drivers → software · hardware · services · people</text></g><text x="550" y="615" text-anchor="middle" font-size="16" fill="#806560">Implementations can change; abstraction has not reduced integration risk if domain semantics, limits, or audit record are lost.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="939.2" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="1084.8" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="153.0" width="538.8" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="257.0" width="161.3" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="290.0" width="413.0" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="387.0" width="207.0" height="53.7"/><rect data-figure-safe-zone="text" x="538.0" y="420.0" width="563.2" height="47.0"/><rect data-figure-safe-zone="text" x="538.0" y="519.0" width="634.0" height="47.0"/><rect data-figure-safe-zone="text" x="9.7" y="587.0" width="1080.6" height="45.6"/></g></svg>
