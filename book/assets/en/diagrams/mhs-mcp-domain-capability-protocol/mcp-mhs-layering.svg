<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">The complementary layers of MCP and MHS</title><desc id="desc">An agent reaches capabilities through a business access layer such as MCP. Beneath it, MHS supplies standard device semantics and drivers that connect to vendor SDKs and physical hardware.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker><style>text{font-family:Arial,sans-serif}.t{font-size:29px;font-weight:700;fill:#665F57}.s{font-size:17px;fill:#6F8486}.h{font-size:22px;font-weight:700;fill:#665F57}.b{font-size:17px;fill:#526D73}.n{font-size:16px;fill:#806560}</style></defs><rect width="1100" height="650" fill="#FFF"/><text x="65" y="66" class="t">MCP is an access protocol; MHS is a hardware-capability semantics layer</text><text x="65" y="101" class="s">Connection, discovery, and invocation are distinct from shared device objects, state, limits, and operations.</text><g text-anchor="middle"><rect x="150" y="140" width="800" height="70" rx="18" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><circle cx="194" cy="175" r="18" fill="#6287A0"/><text x="194" y="181" font-size="16" font-weight="700" fill="#FFF">A</text><text x="565" y="182" class="h">Agent / application</text><path d="M550 210v30" fill="none" stroke="#9CBFC4" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="255" width="800" height="90" rx="20" fill="#F0ECFA" stroke="#BBAFE2" stroke-width="2"/><rect x="174" y="275" width="8" height="50" rx="4" fill="#8E7CAE"/><text x="565" y="291" class="h">Business access layer</text><text x="565" y="321" class="b">MCP tools · CLI · code/API · business API · approval flow</text><path d="M550 345v30" fill="none" stroke="#8E7CAE" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="390" width="800" height="95" rx="20" fill="#E4F5F6" stroke="#79C6CA" stroke-width="2.5"/><rect x="174" y="411" width="8" height="53" rx="4" fill="#6E9FA3"/><text x="565" y="428" class="h">MHS device capability model and drivers</text><text x="565" y="460" class="b">objects · capabilities · state · units · limits · safety rules · adapters</text><path d="M550 485v28" fill="none" stroke="#6E9FA3" stroke-width="3" marker-end="url(#a)" data-figure-connector="true"/><rect x="150" y="528" width="800" height="52" rx="16" fill="#FFF3DE" stroke="#E3BF78" stroke-width="2"/><text x="565" y="562" class="b">vendor SDKs / device interfaces / physical hardware</text></g><rect x="150" y="604" width="800" height="28" rx="14" fill="#FCE8E6"/><text x="550" y="624" text-anchor="middle" class="n">Neither layer grants authority automatically or replaces domain safety, authorization, idempotency, and audit control.</text></svg>
