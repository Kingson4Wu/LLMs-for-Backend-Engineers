<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">The basic shape of MCP</title>
  <desc id="desc">An MCP client connects to an MCP server, which exposes prompts, resources, and tools connected to external data and workflows.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#9CBFC4"/>
    </marker>
    <style>text{font-family:Arial,sans-serif}.h{font-size:23px;font-weight:700}.b{font-size:17px}</style>
  </defs>
  <rect width="1100" height="620" fill="#FFFDF9"/>
  <text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">MCP connects a client to externally available capabilities</text>
  <text x="65" y="103" class="b" fill="#526D73">The protocol defines a communication and exposure boundary; a server still governs permissions and semantics.</text>
  <text x="65" y="127" class="b" fill="#526D73">Execution of connected systems remains a separate responsibility.</text>
  <rect x="65" y="185" width="250" height="190" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/>
  <text x="97" y="237" class="h" fill="#665F57">MCP client</text>
  <text x="97" y="275" class="b" fill="#526D73">agent or application</text>
  <text x="97" y="310" class="b" fill="#526D73">discovers and invokes</text>
  <path d="M315 280h120" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
  <rect x="450" y="150" width="260" height="260" rx="24" fill="#F8F1E5" stroke="#C5BA8B" stroke-width="2"/>
  <text x="482" y="205" class="h" fill="#586653">MCP server</text>
  <text x="482" y="251" class="b" fill="#586653">prompts</text>
  <text x="482" y="286" class="b" fill="#586653">resources</text>
  <text x="482" y="321" class="b" fill="#586653">tools</text>
  <text x="482" y="354" class="b" fill="#586653">connects and exposes</text>
  <text x="482" y="378" class="b" fill="#586653">a boundary</text>
  <path d="M710 280h120" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
  <rect x="845" y="185" width="190" height="190" rx="22" fill="#FDF0ED" stroke="#F4D5CE" stroke-width="2"/>
  <text x="877" y="225" class="h" fill="#806560">External</text>
  <text x="877" y="252" class="h" fill="#806560">systems</text>
  <text x="877" y="275" class="b" fill="#806560">data</text>
  <text x="877" y="310" class="b" fill="#806560">tools and workflows</text>
  <rect x="65" y="475" width="970" height="70" rx="13" fill="#E7E2D8"/>
  <text x="94" y="504" font-size="18" fill="#665F57">MCP answers how to connect and expose.</text>
  <text x="94" y="530" font-size="18" fill="#665F57">Reliability, security, and business semantics still need modeling.</text>
