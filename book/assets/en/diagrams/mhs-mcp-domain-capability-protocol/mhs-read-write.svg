<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Read observes state; write requests a controlled change</title><desc id="desc">Read returns the device's observed current state. Write requests a constrained and confirmable state change. Names are simple, but correct behavior relies on units, capability, limits, and recovery semantics.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9CBFC4"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="620" fill="#FFFDF9"/><text x="65" y="68" font-size="32" font-weight="700" fill="#665F57">Read observes state; write requests a controlled state change</text><text x="65" y="103" class="b" fill="#526D73">Both primitives need shared device semantics, especially units, capability range, safety limits, and recovery policy.</text><rect x="65" y="165" width="430" height="280" rx="22" fill="#EFF8F8" stroke="#C8E3E5" stroke-width="2"/><text x="97" y="219" class="h" fill="#665F57">read</text><text x="97" y="256" class="b" fill="#526D73">retrieve observed device state</text><rect x="97" y="294" width="366" height="56" rx="12" fill="#F2F7EC"/><text x="120" y="329" class="b" fill="#9CBFC4">temperature → 21.4 °C</text><text x="97" y="395" class="b" fill="#7A8F93">does not change the physical world</text><path d="M495 305h105" fill="none" stroke="#9CBFC4" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="615" y="165" width="420" height="280" rx="22" fill="#F8F1E5" stroke="#F4D5CE" stroke-width="2"/><text x="647" y="219" class="h" fill="#806560">write</text><text x="647" y="256" class="b" fill="#806560">request the device attempt a state change</text><rect x="647" y="294" width="356" height="56" rx="12" fill="#FDF0ED"/><text x="670" y="329" class="b" fill="#806560">target_temperature = 25 °C</text><text x="647" y="395" class="b" fill="#806560">check limits, authority, confirmation, result</text><rect x="65" y="510" width="970" height="49" rx="14" fill="#E7E2D8"/><text x="94" y="542" font-size="18" fill="#665F57">Write does not mean guaranteed completion: report the resulting state, failures, and the required recovery path.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="1039.0" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="1058.3" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="185.0" width="69.8" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="227.0" width="289.2" height="47.0"/><rect data-figure-safe-zone="text" x="108.0" y="300.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="366.0" width="324.6" height="47.0"/><rect data-figure-safe-zone="text" x="635.0" y="185.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="635.0" y="227.0" width="386.4" height="47.0"/><rect data-figure-safe-zone="text" x="658.0" y="300.0" width="253.8" height="47.0"/><rect data-figure-safe-zone="text" x="635.0" y="366.0" width="421.8" height="47.0"/><rect data-figure-safe-zone="text" x="82.0" y="512.0" width="1072.3" height="48.3"/></g></svg>
