<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Candidate generation needs external testing and revision</title>
  <desc id="desc">A candidate is externally tested, revised from the result, and retained or rejected. Objectives, standards, and resources constrain every round.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1240" height="620" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Creation is not one output: it is a goal-and-feedback loop</text>
    <text x="60" y="105" font-size="19" fill="#5E7F9C">A candidate earns value through testing and revision; feedback determines the next round or the decision to retain it.</text>
  </g>
  <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3">
    <rect x="50" y="235" width="205" height="88" rx="23"/>
    <rect x="620" y="235" width="220" height="88" rx="23"/>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="335" y="235" width="205" height="88" rx="23"/>
  </g>
  <g fill="#F6CFCB" stroke="#B64342" stroke-width="3">
    <rect x="920" y="235" width="220" height="88" rx="23"/>
  </g>
  <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
    <path d="M255 279H325"/>
    <path d="M540 279H610"/>
    <path d="M840 279H910"/>
  </g>
  <path d="M620 323V420H25V225H152V227" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a)" data-figure-connector="true"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="21" font-weight="700">
      <text x="152" y="290" fill="#0F4D92">propose candidate</text>
      <text x="438" y="290" fill="#765800">external test</text>
      <text x="730" y="290" fill="#0F4D92">revise from results</text>
      <text x="1030" y="290" fill="#B64342">retain or reject</text>
    </g>
    <text x="740" y="382" font-size="18" fill="#765800">results feed the next round</text>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="275" y="470" width="690" height="76" rx="23"/>
  </g>
  <text x="620" y="503" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#765800" text-anchor="middle">Objectives, standards, and resources constrain every round</text>
  <text x="620" y="529" font-family="Arial, sans-serif" font-size="17" fill="#765800" text-anchor="middle">They affect the candidate, the test, and the revision.</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
    <rect data-figure-safe-zone="text" x="48.0" y="26.0" width="989.1" height="67.2"/>
    <rect data-figure-safe-zone="text" x="48.0" y="74.0" width="1189.8" height="49.7"/>
    <rect data-figure-safe-zone="text" x="140.0" y="261.0" width="174.3" height="47.0"/>
    <rect data-figure-safe-zone="text" x="426.0" y="261.0" width="138.9" height="47.0"/>
    <rect data-figure-safe-zone="text" x="718.0" y="261.0" width="192.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="1018.0" y="261.0" width="165.4" height="47.0"/>
    <rect data-figure-safe-zone="text" x="728.0" y="352.0" width="276.7" height="48.3"/>
    <rect data-figure-safe-zone="text" x="276.2" y="469.0" width="687.5" height="53.7"/>
    <rect data-figure-safe-zone="text" x="369.3" y="500.0" width="501.4" height="47.0"/>
  </g>
</svg>
