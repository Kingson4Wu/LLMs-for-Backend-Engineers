<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">A model explanation becomes reliable only after external evidence verifies a testable claim</title><desc id="desc">A model explanation becomes a testable claim, is checked with external evidence and tools, and only then informs a decision to rely on it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">A model's explanation is a claim awaiting verification</text><text x="60" y="105" font-size="19" fill="#5E7F9C">Turn a narrative into a testable question; then let external evidence and tools determine reliance.</text></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="55" y="220" width="210" height="90" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="350" y="220" width="210" height="90" rx="23"/></g><g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="645" y="205" width="265" height="120" rx="23"/><rect x="995" y="220" width="180" height="90" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M265 265H340"/><path d="M560 265H635"/><path d="M910 265H985"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700"><text x="160" y="275" font-size="23" fill="#B64342">model explanation</text><text x="455" y="275" font-size="23" fill="#765800">testable claim</text><text x="777" y="255" font-size="22" fill="#0F4D92">external evidence</text><text x="777" y="282" font-size="22" fill="#0F4D92">and tools</text><text x="1085" y="275" font-size="22" fill="#0F4D92">decide</text></g><path d="M110 405H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="455" font-family="Arial, sans-serif" font-size="20" fill="#765800" text-anchor="middle">Fluent language does not establish a real causal process.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="922.6" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="1002.1" height="49.7"/><rect data-figure-safe-zone="text" x="148.0" y="240.0" width="227.3" height="55.0"/><rect data-figure-safe-zone="text" x="443.0" y="240.0" width="191.4" height="55.0"/><rect data-figure-safe-zone="text" x="765.0" y="221.0" width="218.5" height="53.7"/><rect data-figure-safe-zone="text" x="765.0" y="248.0" width="127.0" height="53.7"/><rect data-figure-safe-zone="text" x="1073.0" y="241.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="311.6" y="423.0" width="616.8" height="51.0"/></g></svg>
