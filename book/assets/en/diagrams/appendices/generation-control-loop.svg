<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Token generation is controlled by verification and a decision to accept revise or regenerate</title>
  <desc id="desc">Context yields a next-token distribution; decoding makes a candidate. Rules, tools, or evaluators verify it before an accept, revise, or regenerate decision.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1240" height="620" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Generation proposes a candidate; verification decides delivery</text>
    <text x="60" y="105" font-size="19" fill="#5E7F9C">Decoding is not proof of correctness: a candidate needs an external rule, tool, or evaluator check.</text>
  </g>
  <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3">
    <rect x="45" y="240" width="190" height="88" rx="23"/>
    <rect x="620" y="240" width="190" height="88" rx="23"/>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="305" y="240" width="245" height="88" rx="23"/>
  </g>
  <g fill="#F6CFCB" stroke="#B64342" stroke-width="3">
    <rect x="885" y="240" width="220" height="88" rx="23"/>
  </g>
  <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
    <path d="M235 284H295"/>
    <path d="M550 284H610"/>
    <path d="M810 284H875"/>
  </g>
  <path d="M995 328V420H20V230H140V232" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a)" data-figure-connector="true"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700">
    <text x="140" y="294" font-size="22" fill="#0F4D92">context</text>
    <text x="427" y="276" font-size="21" fill="#765800">next-token distribution</text>
    <text x="427" y="303" font-size="16" fill="#765800">conditional probability</text>
    <text x="715" y="294" font-size="22" fill="#0F4D92">decode</text>
    <text x="995" y="294" font-size="22" fill="#B64342">candidate output</text>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="385" y="465" width="470" height="73" rx="22"/>
  </g>
  <text x="620" y="496" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#765800" text-anchor="middle">verify with rules, tools, or evaluators</text>
  <text x="620" y="522" font-family="Arial, sans-serif" font-size="17" fill="#765800" text-anchor="middle">accept &#xB7; revise &#xB7; regenerate</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
