    <rect data-figure-safe-zone="text" x="373.0" y="222.0" width="76.0" height="51.0"/>
    <rect data-figure-safe-zone="text" x="373.0" y="247.0" width="157.1" height="45.6"/>
    <rect data-figure-safe-zone="text" x="373.0" y="273.0" width="232.0" height="45.6"/>
    <rect data-figure-safe-zone="text" x="628.0" y="208.0" width="207.0" height="53.7"/>
    <rect data-figure-safe-zone="text" x="628.0" y="247.0" width="190.4" height="45.6"/>
    <rect data-figure-safe-zone="text" x="628.0" y="273.0" width="173.8" height="45.6"/>
    <rect data-figure-safe-zone="text" x="870.0" y="210.0" width="211.2" height="51.0"/>
