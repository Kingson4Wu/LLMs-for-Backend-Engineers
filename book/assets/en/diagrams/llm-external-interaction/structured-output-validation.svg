    <rect data-figure-safe-zone="text" x="870.0" y="273.0" width="148.8" height="45.6"/>
    <rect data-figure-safe-zone="text" x="1011.4" y="180.0" width="157.1" height="45.6"/>
    <rect data-figure-safe-zone="text" x="1030.0" y="218.0" width="164.4" height="44.2"/>
    <rect data-figure-safe-zone="text" x="1030.0" y="249.0" width="180.0" height="44.2"/>
    <rect data-figure-safe-zone="text" x="1030.0" y="280.0" width="156.6" height="44.2"/>
    <rect data-figure-safe-zone="text" x="1030.0" y="311.0" width="125.4" height="44.2"/>
    <rect data-figure-safe-zone="text" x="197.7" y="504.0" width="804.5" height="49.7"/>
    <rect data-figure-safe-zone="text" x="120.0" y="560.0" width="960.0" height="48.3"/>
  </g>
</svg>
