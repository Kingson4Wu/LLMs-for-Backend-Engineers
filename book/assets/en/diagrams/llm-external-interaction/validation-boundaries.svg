<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Four checks between a model proposal and a real business action</title><desc id="desc">A model proposal must pass structure, business meaning, authorization policy, and execution final-state checks in order. No layer substitutes for another.</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">A structured proposal still crosses four independent checks before action</text><text x="58" y="105" font-size="18" fill="#5E7F9C">“It parses” establishes form only; reasonableness, authority, and goal completion each need different later evidence.</text><rect x="70" y="175" width="220" height="330" rx="26" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/><text x="180" y="305" text-anchor="middle" font-size="28" font-weight="700" fill="#17324D">model proposal</text><text x="180" y="341" text-anchor="middle" font-size="17" fill="#0F4D92">call name, arguments,</text><text x="180" y="367" text-anchor="middle" font-size="17" fill="#0F4D92">structured candidate</text><g stroke-width="3"><rect x="375" y="150" width="735" height="78" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="375" y="245" width="735" height="78" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="375" y="340" width="735" height="78" rx="20" fill="#F6CFCB" stroke="#B64342"/><rect x="375" y="435" width="735" height="78" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g><text x="410" y="184" font-size="21" font-weight="700" fill="#765800">1 · syntax + structure</text><text x="410" y="208" font-size="17" fill="#765800">parseable? complete fields? correct types?</text><text x="410" y="279" font-size="21" font-weight="700" fill="#17324D">2 · semantics + business</text><text x="410" y="303" font-size="17" fill="#0F4D92">are order, amount, object, and state sensible?</text><text x="410" y="374" font-size="21" font-weight="700" fill="#B64342">3 · authorization + policy</text><text x="410" y="398" font-size="17" fill="#B64342">is this actor allowed? approval or extra conditions?</text><text x="410" y="469" font-size="21" font-weight="700" fill="#17324D">4 · execution + final state</text><text x="410" y="493" font-size="17" fill="#0F4D92">did the downstream action succeed? was goal state reached?</text></g><path d="M290 340H360" stroke="#0F4D92" stroke-width="5"/><text x="600" y="584" text-anchor="middle" font-size="19" font-weight="700" fill="#B64342">Valid JSON ≠ business correctness ≠ authorization ≠ completed external action.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1200.8" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1119.1" height="48.3"/><rect data-figure-safe-zone="text" x="66.1" y="265.0" width="227.8" height="61.8"/><rect data-figure-safe-zone="text" x="75.2" y="312.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="79.6" y="338.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="151.0" width="264.2" height="52.4"/><rect data-figure-safe-zone="text" x="398.0" y="179.0" width="395.3" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="246.0" width="286.1" height="52.4"/><rect data-figure-safe-zone="text" x="398.0" y="274.0" width="430.6" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="341.0" width="307.9" height="52.4"/><rect data-figure-safe-zone="text" x="398.0" y="369.0" width="483.7" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="436.0" width="318.8" height="52.4"/><rect data-figure-safe-zone="text" x="398.0" y="464.0" width="536.7" height="47.0"/><rect data-figure-safe-zone="text" x="202.7" y="553.0" width="794.6" height="49.7"/></g></svg>
