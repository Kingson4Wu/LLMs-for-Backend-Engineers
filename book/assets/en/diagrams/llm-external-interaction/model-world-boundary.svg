    <rect data-figure-safe-zone="text" x="653.0" y="235.0" width="140.5" height="45.6"/>
    <rect data-figure-safe-zone="text" x="653.0" y="261.0" width="182.1" height="45.6"/>
    <rect data-figure-safe-zone="text" x="913.0" y="197.0" width="198.7" height="52.4"/>
