<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Boundary between model generation and external-world action</title>
  <desc id="desc">Material and tool contracts form context, and a model produces text or a structured proposal. Only program validation, authorization, and execution can change external state; results return as later context.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">The model proposes a step; the execution environment changes the world</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">Text generation, proposing a call, and taking an action are different layers; authority and results require program and external-state evidence.</text>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
      <path d="M245 260H305"/>
      <path d="M505 260H565"/>
      <path d="M765 260H825"/>
      <path d="M925 340V415H150V335"/>
    </g>
    <g stroke-width="3">
      <rect x="55" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="305" y="180" width="200" height="155" rx="22" fill="#FFF8D6" stroke="#FFD700"/>
      <rect x="565" y="180" width="200" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="825" y="180" width="200" height="155" rx="22" fill="#F6CFCB" stroke="#B64342"/>
    </g>
    <g text-anchor="middle">
      <text x="150" y="230" font-size="21" font-weight="700" fill="#17324D">task + material</text>
      <text x="150" y="263" font-size="16" fill="#0F4D92">rules, history, material</text>
      <text x="150" y="289" font-size="16" fill="#0F4D92">tool contracts</text>
      <text x="405" y="230" font-size="21" font-weight="700" fill="#765800">current context</text>
      <text x="405" y="263" font-size="16" fill="#765800">application selects this</text>
      <text x="405" y="289" font-size="16" fill="#765800">turn&#x2019;s information and limits</text>
      <text x="665" y="230" font-size="21" font-weight="700" fill="#17324D">LLM decoding</text>
      <text x="665" y="263" font-size="16" fill="#0F4D92">text answer or</text>
      <text x="665" y="289" font-size="16" fill="#0F4D92">structured proposal</text>
      <text x="925" y="230" font-size="21" font-weight="700" fill="#B64342">program executor</text>
      <text x="925" y="263" font-size="16" fill="#B64342">validate, authorize, act</text>
      <text x="925" y="289" font-size="16" fill="#B64342">observe external result</text>
    </g>
    <rect x="330" y="430" width="540" height="118" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#765800">Results, errors, and external state</text>
    <text x="600" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#765800">return as later context</text>
    <text x="600" y="512" text-anchor="middle" font-size="15" fill="#765800">Text can go directly to a user; side effects pass only</text>
    <text x="600" y="532" text-anchor="middle" font-size="15" fill="#765800">through the controlled executor.</text>
    <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Model output is not authority, and a model&#x2019;s self-report is not proof that an external action finished.</text>
  </g>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
