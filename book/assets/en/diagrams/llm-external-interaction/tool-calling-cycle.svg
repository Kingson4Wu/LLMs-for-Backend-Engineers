<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Proposal, execution, and result return in tool calling</title><desc id="desc">A user question and tool contract reach the model, which proposes a call. The application validates it and accesses a tool under its own identity; the tool result returns for a user-readable answer.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Tool calling is a protocol of proposal, controlled execution, and result return</text><text x="58" y="105" font-size="18" fill="#5E7F9C">The model can organize a request; authenticated identity, authorization, network calls, and result truth remain with application and tool systems.</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 255H305"/><path d="M505 255H565"/><path d="M765 255H825"/><path d="M925 335V400H765"/><path d="M565 440H505"/><path d="M305 440H245"/></g><g stroke-width="3"><rect x="55" y="175" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="305" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="565" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="825" y="175" width="200" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="565" y="400" width="200" height="85" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="400" width="190" height="85" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="150" y="226" font-size="21" font-weight="700" fill="#17324D">user question</text><text x="150" y="259" font-size="16" fill="#0F4D92">for example, actual</text><text x="150" y="285" font-size="16" fill="#0F4D92">warehouse inventory</text><text x="405" y="226" font-size="21" font-weight="700" fill="#765800">application → model</text><text x="405" y="259" font-size="16" fill="#765800">question + tool schema</text><text x="405" y="285" font-size="16" fill="#765800">and call constraints</text><text x="665" y="226" font-size="21" font-weight="700" fill="#17324D">model → application</text><text x="665" y="259" font-size="16" fill="#0F4D92">structured call proposal</text><text x="665" y="285" font-size="16" fill="#0F4D92">and its arguments</text><text x="925" y="226" font-size="21" font-weight="700" fill="#B64342">inventory service</text><text x="925" y="259" font-size="16" fill="#B64342">app validates, authorizes,</text><text x="925" y="285" font-size="16" fill="#B64342">then calls under identity</text><text x="665" y="436" font-size="21" font-weight="700" fill="#17324D">tool result</text><text x="665" y="463" font-size="16" fill="#0F4D92">actual availability: 24</text><text x="150" y="436" font-size="21" font-weight="700" fill="#17324D">user-readable answer</text><text x="150" y="463" font-size="16" fill="#0F4D92">“24 units available”</text></g><text x="600" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">The model does not directly reach the service; a model proposal is not an authorized or successful result.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1297.5" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1390.6" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="193.0" width="166.0" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="231.0" width="182.1" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="257.0" width="182.1" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="193.0" width="231.5" height="52.4"/><rect data-figure-safe-zone="text" x="393.0" y="231.0" width="207.0" height="45.6"/><rect data-figure-safe-zone="text" x="393.0" y="257.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="193.0" width="231.5" height="52.4"/><rect data-figure-safe-zone="text" x="653.0" y="231.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="257.0" width="165.4" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="193.0" width="209.6" height="52.4"/><rect data-figure-safe-zone="text" x="913.0" y="231.0" width="240.3" height="45.6"/><rect data-figure-safe-zone="text" x="913.0" y="257.0" width="232.0" height="45.6"/><rect data-figure-safe-zone="text" x="653.0" y="403.0" width="144.1" height="52.4"/><rect data-figure-safe-zone="text" x="653.0" y="435.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="138.0" y="403.0" width="242.4" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="435.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="91.9" y="540.0" width="1016.2" height="48.3"/></g></svg>
