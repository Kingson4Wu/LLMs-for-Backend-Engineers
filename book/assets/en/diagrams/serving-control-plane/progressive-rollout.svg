<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Progressive rollout with rollback conditions</title><desc id="desc">A candidate configuration passes offline evaluation, then small and gradually larger online traffic observation. A breach in quality, errors, TTFT, or cost returns the control plane to the complete old configuration.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">A rollout expands only while its stopping conditions remain satisfied</text><text x="58" y="105" font-size="18" fill="#5E7F9C">Progressive rollout is not hoping a new version is fine: it uses comparable metrics to bound blast radius and retain a reversible path.</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 270H280"/><path d="M470 270H525"/><path d="M715 270H770"/><path d="M960 270H1015"/></g><g stroke-width="3"><rect x="55" y="190" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="280" y="190" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="190" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="770" y="190" width="190" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1015" y="190" width="130" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="140" y="241" font-size="21" font-weight="700" fill="#17324D">candidate config</text><text x="140" y="274" font-size="16" fill="#0F4D92">model, prompt, routing,</text><text x="140" y="300" font-size="16" fill="#0F4D92">or policy change</text><text x="375" y="241" font-size="21" font-weight="700" fill="#765800">offline evaluation</text><text x="375" y="274" font-size="16" fill="#765800">regression, quality,</text><text x="375" y="300" font-size="16" fill="#765800">safety, cost gates</text><text x="620" y="241" font-size="21" font-weight="700" fill="#17324D">small traffic</text><text x="620" y="274" font-size="16" fill="#0F4D92">observe real-request</text><text x="620" y="300" font-size="16" fill="#0F4D92">errors and experience</text><text x="865" y="241" font-size="21" font-weight="700" fill="#17324D">expand gradually</text><text x="865" y="274" font-size="16" fill="#0F4D92">increase traffic share</text><text x="865" y="292" font-size="16" fill="#0F4D92">within an observation</text><text x="865" y="316" font-size="16" fill="#0F4D92">window</text><text x="1080" y="241" font-size="20" font-weight="700" fill="#17324D">full</text><text x="1080" y="274" font-size="15" fill="#0F4D92">keep</text><text x="1080" y="300" font-size="15" fill="#0F4D92">monitoring</text></g><path d="M865 350V430H315V360" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="310" y="443" width="580" height="99" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="483" text-anchor="middle" font-size="21" font-weight="700" fill="#B64342">Breach → return to the complete old configuration</text><text x="600" y="501" text-anchor="middle" font-size="17" fill="#B64342">Quality, error rate, TTFT, cost, policy, or safety metrics</text><text x="600" y="525" text-anchor="middle" font-size="17" fill="#B64342">trigger predefined stopping conditions.</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Rollback must be executable by design, not improvised manually when an incident occurs.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1136.3" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1287.6" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="208.0" width="198.7" height="52.4"/><rect data-figure-safe-zone="text" x="128.0" y="246.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="272.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="208.0" width="220.6" height="52.4"/><rect data-figure-safe-zone="text" x="363.0" y="246.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="272.0" width="173.8" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="208.0" width="166.0" height="52.4"/><rect data-figure-safe-zone="text" x="608.0" y="246.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="608.0" y="272.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="208.0" width="198.7" height="52.4"/><rect data-figure-safe-zone="text" x="853.0" y="246.0" width="207.0" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="264.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="853.0" y="288.0" width="73.9" height="45.6"/><rect data-figure-safe-zone="text" x="1068.0" y="209.0" width="65.6" height="51.0"/><rect data-figure-safe-zone="text" x="1068.0" y="247.0" width="55.2" height="44.2"/><rect data-figure-safe-zone="text" x="1068.0" y="273.0" width="102.0" height="44.2"/><rect data-figure-safe-zone="text" x="320.5" y="450.0" width="559.1" height="52.4"/><rect data-figure-safe-zone="text" x="331.6" y="472.0" width="536.7" height="47.0"/><rect data-figure-safe-zone="text" x="415.6" y="496.0" width="368.8" height="47.0"/><rect data-figure-safe-zone="text" x="180.8" y="562.0" width="838.3" height="48.3"/></g></svg>
