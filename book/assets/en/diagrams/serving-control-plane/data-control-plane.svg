<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Data plane and control plane in model serving</title><desc id="desc">The data plane accepts requests, queues them, and runs model inference for streaming responses. The control plane spans those components to maintain model selection, limits, scaling, releases, and observability.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="62" font-size="29" font-weight="700" fill="#17324D">Data plane executes requests; control plane maintains</text><text x="58" y="94" font-size="29" font-weight="700" fill="#17324D">long-lived service promises</text><text x="58" y="126" font-size="18" fill="#5E7F9C">The responsibilities may run in one process or separate systems; their boundary is the decision type and time horizon they serve.</text><rect x="100" y="155" width="1000" height="122" rx="24" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="135" y="195" font-size="22" font-weight="700" fill="#765800">control plane</text><text x="310" y="195" font-size="18" fill="#765800">model / version selection</text><text x="535" y="195" font-size="18" fill="#765800">quotas and limits</text><text x="710" y="195" font-size="18" fill="#765800">scaling and capacity</text><text x="910" y="183" font-size="16" fill="#765800">release and observation</text><text x="910" y="207" font-size="16" fill="#765800">governance</text><path d="M220 235H1000" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="255" text-anchor="middle" font-size="16" fill="#765800">long-lived state and decisions that span data-plane components</text><rect x="55" y="330" width="1090" height="155" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/><text x="90" y="370" font-size="22" font-weight="700" fill="#17324D">data plane</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 420H300"/><path d="M480 420H535"/><path d="M715 420H770"/><path d="M950 420H1005"/></g><g stroke-width="3"><rect x="105" y="390" width="140" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/><rect x="300" y="390" width="180" height="65" rx="16" fill="#FFF8D6" stroke="#FFD700"/><rect x="535" y="390" width="180" height="65" rx="16" fill="#F6CFCB" stroke="#B64342"/><rect x="770" y="390" width="180" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1005" y="390" width="100" height="65" rx="16" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="175" y="430" font-size="18" font-weight="700" fill="#17324D">request</text><text x="390" y="430" font-size="18" font-weight="700" fill="#765800">gateway / router</text><text x="625" y="430" font-size="18" font-weight="700" fill="#B64342">queue + policy</text><text x="860" y="430" font-size="18" font-weight="700" fill="#17324D">engine / replica</text><text x="1055" y="430" font-size="18" font-weight="700" fill="#17324D">stream</text></g><text x="600" y="535" text-anchor="middle" font-size="18" fill="#5E7F9C">The data plane handles tokenization, Prefill, Decode, KV cache, and output; control decides how to provide them reliably over time.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="21.0" width="823.2" height="63.2"/><rect data-figure-safe-zone="text" x="46.0" y="53.0" width="431.2" height="63.2"/><rect data-figure-safe-zone="text" x="46.0" y="96.0" width="1231.4" height="48.3"/><rect data-figure-safe-zone="text" x="123.0" y="161.0" width="172.7" height="53.7"/><rect data-figure-safe-zone="text" x="298.0" y="165.0" width="258.0" height="48.3"/><rect data-figure-safe-zone="text" x="523.0" y="165.0" width="183.1" height="48.3"/><rect data-figure-safe-zone="text" x="698.0" y="165.0" width="211.2" height="48.3"/><rect data-figure-safe-zone="text" x="898.0" y="155.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="898.0" y="179.0" width="107.2" height="45.6"/><rect data-figure-safe-zone="text" x="330.1" y="227.0" width="539.8" height="45.6"/><rect data-figure-safe-zone="text" x="78.0" y="336.0" width="138.4" height="53.7"/><rect data-figure-safe-zone="text" x="163.0" y="400.0" width="89.5" height="48.3"/><rect data-figure-safe-zone="text" x="378.0" y="400.0" width="173.8" height="48.3"/><rect data-figure-safe-zone="text" x="613.0" y="400.0" width="155.0" height="48.3"/><rect data-figure-safe-zone="text" x="848.0" y="400.0" width="173.8" height="48.3"/><rect data-figure-safe-zone="text" x="1043.0" y="400.0" width="80.2" height="48.3"/><rect data-figure-safe-zone="text" x="-25.1" y="505.0" width="1250.2" height="48.3"/></g></svg>
