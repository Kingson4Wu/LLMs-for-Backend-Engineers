<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Independent feedback loop for checkpoint selection</title>
  <desc id="desc">Material and task definition pass through preparation, batches, and parameter updates into a checkpoint; independent validation, task evaluation, data review, and monitoring inform the next training decision.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Choose checkpoints with independent evidence, not training loss alone</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">A checkpoint is the complete parameter state at one moment; keeping it needs evidence separate from its training batches.</text>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
      <path d="M250 257H300"/>
      <path d="M500 257H550"/>
      <path d="M750 257H800"/>
      <path d="M1000 257V380H170V337"/>
    </g>
    <g stroke-width="3">
      <rect x="60" y="180" width="190" height="157" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="300" y="180" width="200" height="157" rx="22" fill="#FFF8D6" stroke="#FFD700"/>
      <rect x="550" y="180" width="200" height="157" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="800" y="180" width="200" height="157" rx="22" fill="#F6CFCB" stroke="#B64342"/>
    </g>
    <g text-anchor="middle">
      <text x="155" y="229" font-size="22" font-weight="700" fill="#17324D">material + task</text>
      <text x="155" y="262" font-size="16" fill="#0F4D92">coverage and objective</text>
      <text x="155" y="288" font-size="16" fill="#0F4D92">signals and constraints</text>
      <text x="400" y="229" font-size="22" font-weight="700" fill="#765800">data preparation</text>
      <text x="400" y="262" font-size="16" fill="#765800">clean, deduplicate, mix</text>
      <text x="400" y="288" font-size="16" fill="#765800">segment and sample</text>
      <text x="650" y="229" font-size="22" font-weight="700" fill="#17324D">train + save</text>
      <text x="650" y="254" font-size="16" fill="#0F4D92">batches &#x2192; parameter</text>
      <text x="650" y="276" font-size="16" fill="#0F4D92">updates</text>
      <text x="650" y="304" font-size="16" fill="#0F4D92">form a checkpoint</text>
      <text x="900" y="219" font-size="19" font-weight="700" fill="#B64342">independent</text>
      <text x="900" y="243" font-size="19" font-weight="700" fill="#B64342">feedback</text>
      <text x="900" y="270" font-size="16" fill="#B64342">validation, task evaluation</text>
      <text x="900" y="296" font-size="16" fill="#B64342">data review, monitoring</text>
    </g>
    <rect x="260" y="405" width="680" height="140" rx="22" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="441" text-anchor="middle" font-size="18" font-weight="700" fill="#765800">Use independent evidence to select a checkpoint</text>
    <text x="600" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#765800">or change the next round</text>
    <text x="600" y="495" text-anchor="middle" font-size="16" fill="#765800">When evidence reveals overfitting, leakage, or objective mismatch,</text>
    <text x="600" y="518" text-anchor="middle" font-size="16" fill="#765800">revisit task and data rather than hide the issue.</text>
    <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Training loss serves updates; independent evaluation can test generalization and task quality.</text>
  </g>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
