    <rect data-figure-safe-zone="text" x="176.2" y="422.0" width="847.7" height="53.7"/>
    <rect data-figure-safe-zone="text" x="75.3" y="461.0" width="1049.4" height="47.0"/>
    <rect data-figure-safe-zone="text" x="148.1" y="562.0" width="903.8" height="48.3"/>
  </g>
