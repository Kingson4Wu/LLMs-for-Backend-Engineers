    <rect data-figure-safe-zone="text" x="638.0" y="195.0" width="161.3" height="53.7"/>
    <rect data-figure-safe-zone="text" x="638.0" y="234.0" width="248.6" height="45.6"/>
    <rect data-figure-safe-zone="text" x="638.0" y="260.0" width="165.4" height="45.6"/>
    <rect data-figure-safe-zone="text" x="888.0" y="195.0" width="252.8" height="53.7"/>
    <rect data-figure-safe-zone="text" x="888.0" y="234.0" width="248.6" height="45.6"/>
