<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">One training parameter-update cycle</title>
  <desc id="desc">A batch is predicted using current parameters, targets form a loss, backpropagation calculates gradients, the optimizer changes parameters, and the next batch uses the new state.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">One parameter update turns this batch&#x2019;s error into the next parameter state</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">Examples supply a training signal; capability forms through many overlapping or conflicting parameter updates.</text>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
      <path d="M245 260H305"/>
      <path d="M495 260H555"/>
      <path d="M745 260H805"/>
      <path d="M995 260H1055"/>
      <path d="M1120 337V410H140V337"/>
    </g>
    <g stroke-width="3">
      <rect x="55" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="305" y="180" width="190" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="555" y="180" width="190" height="155" rx="22" fill="#F6CFCB" stroke="#B64342"/>
      <rect x="805" y="180" width="190" height="155" rx="22" fill="#FFF8D6" stroke="#FFD700"/>
      <rect x="1055" y="180" width="120" height="155" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
    </g>
    <g text-anchor="middle">
      <text x="150" y="230" font-size="22" font-weight="700" fill="#17324D">training batch</text>
      <text x="150" y="264" font-size="16" fill="#0F4D92">inputs and true targets</text>
      <text x="150" y="290" font-size="16" fill="#0F4D92">current parameters &#x3B8;</text>
      <text x="400" y="230" font-size="22" font-weight="700" fill="#17324D">forward prediction</text>
      <text x="400" y="254" font-size="16" fill="#0F4D92">&#x3B8; participates</text>
      <text x="400" y="277" font-size="16" fill="#0F4D92">in computation</text>
      <text x="400" y="300" font-size="16" fill="#0F4D92">produce vocabulary</text>
      <text x="400" y="323" font-size="16" fill="#0F4D92">probabilities</text>
      <text x="650" y="230" font-size="22" font-weight="700" fill="#B64342">loss L</text>
      <text x="650" y="264" font-size="16" fill="#B64342">the training objective judges</text>
      <text x="650" y="290" font-size="16" fill="#B64342">this prediction</text>
      <text x="900" y="230" font-size="22" font-weight="700" fill="#765800">backpropagation</text>
      <text x="900" y="264" font-size="16" fill="#765800">calculate gradient</text>
      <text x="900" y="290" font-size="16" fill="#765800">&#x2202;L / &#x2202;&#x3B8;</text>
      <text x="1115" y="230" font-size="21" font-weight="700" fill="#17324D">optimizer</text>
      <text x="1115" y="264" font-size="15" fill="#0F4D92">updates &#x3B8;</text>
      <text x="1115" y="290" font-size="15" fill="#0F4D92">&#x2192; &#x3B8;&#x2032;</text>
    </g>
    <rect x="300" y="420" width="600" height="120" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="467" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">The next batch uses &#x3B8;&#x2032; and tests it again</text>
    <text x="600" y="495" text-anchor="middle" font-size="16" fill="#765800">The optimizer also uses learning rate and its own state;</text>
    <text x="600" y="518" text-anchor="middle" font-size="16" fill="#765800">a gradient is not the update itself.</text>
    <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Inference returns generated tokens to context; training is what changes parameters &#x3B8;.</text>
  </g>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
