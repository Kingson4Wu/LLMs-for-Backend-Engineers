    <rect data-figure-safe-zone="text" x="388.0" y="249.0" width="140.5" height="45.6"/>
    <rect data-figure-safe-zone="text" x="388.0" y="272.0" width="173.8" height="45.6"/>
    <rect data-figure-safe-zone="text" x="388.0" y="295.0" width="132.2" height="45.6"/>
    <rect data-figure-safe-zone="text" x="638.0" y="196.0" width="92.6" height="53.7"/>
    <rect data-figure-safe-zone="text" x="638.0" y="236.0" width="265.3" height="45.6"/>
    <rect data-figure-safe-zone="text" x="638.0" y="262.0" width="148.8" height="45.6"/>
