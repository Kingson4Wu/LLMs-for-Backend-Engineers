<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">From maximum likelihood to cross-entropy</title>
  <desc id="desc">Maximizing likelihood becomes log likelihood and then negative log likelihood; for one-hot empirical labels under a conditional probabilistic model, the per-example objective is cross-entropy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3z" fill="#3775BA"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="30" fill="#FFFFFF"/>
  <text x="70" y="72" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D">From maximum likelihood to cross-entropy</text>
  <text x="70" y="106" font-family="Arial,sans-serif" font-size="19" fill="#5E7F9C">One training target expressed through statistics, optimization, and information theory</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#DDF3DE" stroke="#3775BA" stroke-width="3">
      <rect x="70" y="205" width="235" height="145" rx="20"/>
      <rect x="74" y="209" width="227" height="137" rx="18" fill="none" stroke="#AADCA9" stroke-width="1.5"/>
    </g>
    <text x="188" y="254" font-size="23" font-weight="700" fill="#17324D">maximum likelihood</text>
    <text x="188" y="290" font-size="18" fill="#35564E">maximize data probability</text>
    <text x="188" y="322" font-size="18" fill="#35564E">&#x220F;&#x1D62; P&#x3B8;(y&#x1D62;|x&#x1D62;)</text>
    <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
      <rect x="350" y="205" width="235" height="145" rx="20"/>
      <rect x="354" y="209" width="227" height="137" rx="18" fill="none" stroke="#E4BB86" stroke-width="1.5"/>
    </g>
    <text x="468" y="254" font-size="25" font-weight="700" fill="#765800">log likelihood</text>
    <text x="468" y="290" font-size="18" fill="#765800">products become sums</text>
    <text x="468" y="322" font-size="18" fill="#765800">&#x3A3;&#x1D62; log P&#x3B8;(y&#x1D62;|x&#x1D62;)</text>
    <g fill="#F6CFCB" stroke="#B64342" stroke-width="3">
      <rect x="630" y="205" width="235" height="145" rx="20"/>
      <rect x="634" y="209" width="227" height="137" rx="18" fill="none" stroke="#DEA19A" stroke-width="1.5"/>
    </g>
    <text x="748" y="254" font-size="20" font-weight="700" fill="#8F3635">negative log likelihood</text>
    <text x="748" y="290" font-size="17" fill="#8F3635">maximize becomes minimize</text>
    <text x="748" y="322" font-size="18" fill="#8F3635">&#x2212;&#x3A3;&#x1D62; log P&#x3B8;(y&#x1D62;|x&#x1D62;)</text>
    <g fill="#17324D" stroke="#17324D" stroke-width="3">
      <rect x="910" y="205" width="220" height="145" rx="20"/>
    </g>
    <text x="1020" y="254" font-size="25" font-weight="700" fill="#FFFFFF">cross-entropy</text>
    <text x="1020" y="290" font-size="18" fill="#FFFFFF">empirical target</text>
    <text x="1020" y="322" font-size="18" fill="#FFFFFF">H(P, Q&#x3B8;)</text>
  </g>
  <g fill="none" stroke="#3775BA" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M306 278H348"/>
    <path d="M586 278H628"/>
    <path d="M866 278H908"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#5E7F9C">
    <text x="327" y="186">take logarithms</text>
    <text x="607" y="186">negate</text>
    <text x="887" y="186">target distribution</text>
  </g>
  <rect x="168" y="424" width="864" height="96" rx="18" fill="#FDE9E7"/>
  <text x="600" y="470" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#26312E">For one-hot empirical labels under a conditional probabilistic model</text>
  <text x="600" y="507" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#B64342">per-example NLL = H(P, Q&#x3B8;) = &#x2212;log P&#x3B8;(ytrue | x)</text>
