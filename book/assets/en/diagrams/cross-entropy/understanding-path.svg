<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">A path from evaluating predictions to cross-entropy</title><desc id="desc">The diagram connects the desire to assign a high probability to the correct answer, negative log penalty, conditional log likelihood, and cross-entropy under one-hot labels with the same reduction convention.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3775BA"/></marker></defs><rect width="1100" height="670" rx="30" fill="#FFFFFF"/><text x="58" y="66" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324D">From evaluating a prediction to cross-entropy</text><text x="58" y="94" font-family="Arial, sans-serif" font-size="17" fill="#5E7F9C">One causal chain connects intuition, estimation, and information theory</text><g font-family="Arial, sans-serif" font-size="21"><g fill="#EEF0EF" stroke="#3775BA" stroke-width="3"><rect x="116" y="124" width="868" height="66" rx="16"/><rect x="120" y="128" width="860" height="58" rx="15" fill="none" stroke="#A7C4BA" stroke-width="1.5"/></g><text x="158" y="166" fill="#26312E">1 · Question: how should a prediction be evaluated?</text><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="116" y="220" width="868" height="66" rx="16"/><rect x="120" y="224" width="860" height="58" rx="15" fill="none" stroke="#E4BB86" stroke-width="1.5"/></g><text x="158" y="262" fill="#765800">2 · Intuition: the correct answer should receive high probability</text><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="116" y="316" width="868" height="66" rx="16"/><rect x="120" y="320" width="860" height="58" rx="15" fill="none" stroke="#E4BB86" stroke-width="1.5"/></g><text x="158" y="358" fill="#765800">3 · Function: −log(p) gives low probability a larger penalty</text><g fill="#DDF3DE" stroke="#3775BA" stroke-width="3"><rect x="116" y="412" width="868" height="66" rx="16"/><rect x="120" y="416" width="860" height="58" rx="15" fill="none" stroke="#AADCA9" stroke-width="1.5"/></g><text x="158" y="454" fill="#17324D">4 · Statistics: maximize conditional log likelihood</text><g fill="#DDF3DE" stroke="#3775BA" stroke-width="3"><rect x="116" y="508" width="868" height="66" rx="16"/><rect x="120" y="512" width="860" height="58" rx="15" fill="none" stroke="#AADCA9" stroke-width="1.5"/></g><text x="158" y="550" fill="#17324D">5 · Information theory: cross-entropy over empirical labels</text></g><g fill="none" stroke="#3775BA" stroke-width="2.5" marker-end="url(#arrow)"><path d="M550 196V216"/><path d="M550 292V312"/><path d="M550 388V408"/><path d="M550 484V504"/></g><rect x="116" y="603" width="868" height="48" rx="14" fill="#FDE9E7"/><text x="550" y="640" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#B64342">With one-hot labels and the same reduction: minimize cross-entropy = minimize NLL = maximize log likelihood.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="24.0" width="726.0" height="64.5"/><rect data-figure-safe-zone="text" x="46.0" y="65.0" width="651.6" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="137.0" width="474.8" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="233.0" width="598.6" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="329.0" width="554.4" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="425.0" width="474.8" height="47.0"/><rect data-figure-safe-zone="text" x="146.0" y="521.0" width="545.6" height="47.0"/><rect data-figure-safe-zone="text" x="32.6" y="610.0" width="1034.9" height="48.3"/></g></svg>
