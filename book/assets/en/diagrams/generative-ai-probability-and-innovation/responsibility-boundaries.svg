<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Prompts, structured output, validation, and failure handling have distinct responsibilities</title><desc id="desc">Prompts carry goals and context; structured output constrains shape; validators test checkable conditions; failure handling chooses revision, retry, rejection, or escalation.</desc><rect width="1200" height="590" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Different constraints belong to different mechanisms</text><text x="60" y="105" font-size="19" fill="#5E7F9C">Do not make “a better prompt” carry work that belongs to structure, verification, or external facts.</text></g><g stroke-width="3"><rect x="52" y="160" width="255" height="290" rx="25" fill="#EAF3FB" stroke="#0F4D92"/><rect x="332" y="160" width="255" height="290" rx="25" fill="#FFF8D6" stroke="#FFD700"/><rect x="612" y="160" width="255" height="290" rx="25" fill="#F4F8FC" stroke="#0F4D92"/><rect x="892" y="160" width="255" height="290" rx="25" fill="#F6CFCB" stroke="#B64342"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><g font-size="24" font-weight="700"><text x="180" y="215" fill="#0F4D92">prompt</text><text x="460" y="215" fill="#765800">structured output</text><text x="740" y="215" fill="#0F4D92">validator</text><text x="1020" y="215" fill="#B64342">failure handling</text></g><g font-size="20"><text x="180" y="275" fill="#0F4D92">goal and context</text><text x="460" y="275" fill="#765800">output shape</text><text x="740" y="275" fill="#0F4D92">checkable conditions</text><text x="1020" y="275" fill="#B64342">next action</text></g><g font-size="16" fill="#5E7F9C"><text x="180" y="330">purpose, background, examples</text><text x="460" y="330">schema / grammar</text><text x="740" y="330">programs, dictionaries, tests</text><text x="1020" y="330">revise, retry, reject, escalate</text></g></g><path d="M95 500H1105" stroke="#FFD700" stroke-width="3"/><text x="600" y="543" font-family="Arial, sans-serif" font-size="19" fill="#765800" text-anchor="middle">Reliable systems combine mechanisms with distinct responsibilities.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="889.3" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="1012.0" height="49.7"/><rect data-figure-safe-zone="text" x="168.0" y="186.0" width="77.0" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="186.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="186.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="186.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="168.0" y="246.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="246.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="246.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="246.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="168.0" y="301.0" width="280.4" height="47.0"/><rect data-figure-safe-zone="text" x="448.0" y="301.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="728.0" y="301.0" width="280.4" height="47.0"/><rect data-figure-safe-zone="text" x="1008.0" y="301.0" width="298.0" height="47.0"/><rect data-figure-safe-zone="text" x="257.0" y="512.0" width="686.0" height="49.7"/></g></svg>
