<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">ReLU breakpoints divide the input axis into regions</title><desc id="desc">ReLU(x+1), ReLU(x), and ReLU(x−1) change activation at minus one, zero, and one, dividing the input axis into four regions. The dashed lines are state-change boundaries, not output curves.</desc>
  <defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1080" height="500" rx="34" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif"><text x="66" y="70" font-size="32" font-weight="700" fill="#17324D">ReLU breakpoints divide the input into four regions</text><text x="66" y="105" font-size="19" fill="#5E7F9C">At a breakpoint the activation state changes; it is not part of the output curve.</text></g>
  <path d="M100 292H974" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#axis)" data-figure-connector="true"/><path d="M100 296H970" fill="none" stroke="#8EB6D8" stroke-width="2" opacity=".85"/>
  <g stroke="#FFD700" stroke-width="4" stroke-dasharray="11 9"><path d="M315 170V338"/><path d="M540 170V338"/><path d="M765 170V338"/></g><g fill="none" stroke="#FFD700" stroke-width="2" opacity=".7"><path d="M319 170V338"/><path d="M769 170V338"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#0F4D92" font-size="21"><text x="205" y="222">x &lt; −1</text><text x="427" y="222">−1 &lt; x &lt; 0</text><text x="652" y="222">0 &lt; x &lt; 1</text><text x="872" y="222">x &gt; 1</text></g><g fill="#765800" font-size="22" font-weight="700"><text x="315" y="376">t₁ = −1</text><text x="540" y="376">t₂ = 0</text><text x="765" y="376">t₃ = 1</text></g></g>
  <g fill="#E8F1ED" stroke="#0F4D92" stroke-width="3"><rect x="143" y="405" width="164" height="53" rx="18"/><rect x="365" y="405" width="164" height="53" rx="18"/><rect x="590" y="405" width="164" height="53" rx="18"/></g><g fill="none" stroke="#6F9A90" stroke-width="2"><rect x="147" y="408" width="156" height="47" rx="16"/><rect x="369" y="408" width="156" height="47" rx="16"/><rect x="594" y="408" width="156" height="47" rx="16"/></g><g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F4D92" text-anchor="middle"><text x="225" y="438">ReLU(x + 1)</text><text x="447" y="438">ReLU(x)</text><text x="672" y="438">ReLU(x − 1)</text></g><text x="1000" y="300" font-family="Arial, sans-serif" font-size="21" fill="#17324D">x</text>
