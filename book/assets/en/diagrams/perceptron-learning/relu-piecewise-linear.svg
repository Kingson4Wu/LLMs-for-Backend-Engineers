<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">Summed ReLU units form a piecewise-linear function</title><desc id="desc">Activation boundaries at minus one, zero, and one change the output slope. Each segment is the sum of the linear parts of the ReLU units active in that region.</desc>
  <defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1080" height="660" rx="34" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif"><text x="66" y="70" font-size="32" font-weight="700" fill="#17324D">Summed ReLUs: each breakpoint changes the linear slope</text><text x="66" y="105" font-size="19" fill="#5E7F9C">This is not three independent curves: active ReLU linear pieces accumulate by region.</text></g>
  <path d="M125 480V153" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#axis)" data-figure-connector="true"/><path d="M125 480H971" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#axis)" data-figure-connector="true"/><path d="M129 480V157M129 476H967" fill="none" stroke="#8EB6D8" stroke-width="2" opacity=".8"/>
