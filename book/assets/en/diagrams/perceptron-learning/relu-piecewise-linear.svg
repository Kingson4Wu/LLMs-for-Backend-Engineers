  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="160" y="545" width="165" height="54" rx="17"/><rect x="345" y="545" width="155" height="54" rx="17"/><rect x="515" y="545" width="160" height="54" rx="17"/><rect x="680" y="545" width="230" height="54" rx="17"/></g><g fill="none" stroke="#D8A919" stroke-width="2"><rect x="164" y="548" width="157" height="48" rx="15"/><rect x="349" y="548" width="147" height="48" rx="15"/><rect x="519" y="548" width="152" height="48" rx="15"/><rect x="684" y="548" width="222" height="48" rx="15"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g font-size="17" font-weight="700" fill="#765800"><text x="242" y="579">all ReLUs = 0</text><text x="423" y="579">ReLU₁</text><text x="595" y="579">ReLU₁ + ReLU₂</text><text x="795" y="579">ReLU₁ + ReLU₂ + ReLU₃</text></g><g font-size="21" fill="#0F4D92"><text x="340" y="522">−1</text><text x="510" y="522">0</text><text x="680" y="522">1</text></g></g><text x="88" y="151" font-family="Arial, sans-serif" font-size="23" fill="#17324D">ŷ</text><text x="985" y="488" font-family="Arial, sans-serif" font-size="23" fill="#17324D">x</text>
