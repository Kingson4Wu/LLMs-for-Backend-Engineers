<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">Cosine decreases as angle increases from zero to 180 degrees</title><desc id="desc">Cosine drops from one at zero degrees through zero at ninety degrees to minus one at one hundred eighty degrees; key angles are labelled.</desc><rect width="1080" height="620" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D">As the angle grows, cos(θ) falls</text><path d="M130 490V150M130 490H970" stroke="#0F4D92" stroke-width="4"/><path d="M134 486V154M134 486H966" stroke="#8EB6D8" stroke-width="2"/><g stroke="#D8A919" stroke-width="2" stroke-dasharray="9 8"><path d="M130 195H930"/><path d="M130 320H930"/><path d="M130 445H930"/></g><path d="M160 195C290 198 355 245 550 320S790 442 930 445" fill="none" stroke="#B64342" stroke-width="7"/><path d="M164 199C294 202 359 249 554 324S794 446 934 449" fill="none" stroke="#E9A6A1" stroke-width="2"/><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><circle cx="160" cy="195" r="10"/><circle cx="355" cy="232" r="10"/><circle cx="550" cy="320" r="10"/><circle cx="745" cy="408" r="10"/><circle cx="930" cy="445" r="10"/></g><g font-family="Arial, sans-serif" font-size="19" fill="#0F4D92" text-anchor="middle"><text x="160" y="530">0°</text><text x="355" y="530">45°</text><text x="550" y="530">90°</text><text x="745" y="530">135°</text><text x="930" y="530">180°</text></g><g font-family="Arial, sans-serif" font-size="19" fill="#5E7F9C"><text x="94" y="202">1</text><text x="94" y="327">0</text><text x="86" y="452">−1</text><text x="138" y="135">cos(θ)</text><text x="980" y="497">θ</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="556.5" height="67.2"/><rect data-figure-safe-zone="text" x="148.0" y="501.0" width="41.7" height="47.0"/><rect data