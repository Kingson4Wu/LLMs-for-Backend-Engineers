<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Argmax is a discrete boundary near a tie</title><desc id="desc">Two almost tied pairs of logits differ by only a few millionths. A small flip in the maximum makes argmax switch discretely from token 0 to token 1.</desc><rect width="1100" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="69" font-size="32" font-weight="700" fill="#17324D">Argmax is a discrete decision boundary near a tie</text><text x="60" y="104" font-size="19" fill="#5E7F9C">A tiny difference matters only when it crosses the boundary between the highest logits.</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="90" y="157" width="390" height="268" rx="28"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="620" y="157" width="390" height="268" rx="28"/></g><g fill="none" stroke="#D8A919" stroke-width="2"><rect x="95" y="162" width="380" height="258" rx="25"/></g><g fill="none" stroke="#E9A6A1" stroke-width="2"><rect x="625" y="162" width="380" height="258" rx="25"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><text x="285" y="207" font-size="25" font-weight="700" fill="#765800">logits A</text><text x="815" y="207" font-size="25" font-weight="700" fill="#B64342">logits B</text><g font-size="24"><text x="285" y="263" fill="#765800">token 0: 5.000000</text><text x="285" y="304" fill="#765800">token 1: 4.999999</text><text x="815" y="263" fill="#B64342">token 0: 4.999998</text><text x="815" y="304" fill="#B64342">token 1: 4.999999</text></g><g font-size="25" font-weight="700"><text x="285" y="371" fill="#0F4D92">argmax → token 0</text><text x="815" y="371" fill="#B64342">argmax → token 1</text></g></g><path d="M515 290H585" stroke="#B64342" stroke-width="4" stroke-dasharray="10 8"/><path d="M519 294H581" stroke="#E9A6A1" stroke-width="2"/><text x="550" y="270" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#B64342">tiny crossing</text><path d="M105 481H995" stroke="#FFD700" stroke-width="3"/><path d="M109 484H991" stroke="#D8A919" stroke-width="2"/><text x="550" y="520" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#765800">When the top-logit margin is large enough, differences at this scale do not change the choice.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="25.0" width="839.4" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="73.0" width="883.6" height="49.7"/><rect data-figure-safe-zone="text" x="273.0" y="170.0" width="128.0" height="57.8"/><rect data-figure-safe-zone="text" x="803.0" y="170.0" width="128.0" height="57.8"/><rect data-figure-safe-zone="text" x="273.0" y="234.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="273.0" y="275.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="234.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="275.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="273.0" y="342.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="803.0" y="342.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="477.2" y="240.0" width="145.7" height="48.3"/><rect data-figure-safe-zone="text" x="73.6" y="489.0" width="952.7" height="49.7"/></g></svg>
