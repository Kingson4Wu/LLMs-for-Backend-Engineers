<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc"><title id="title">Tiny numerical differences can change a near-tied token and later context</title><desc id="desc">Load or dynamic batching can change the numerical path and introduce a small logit difference. If it crosses an argmax boundary, the chosen token changes and is fed back into later autoregressive context.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="600" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="68" font-size="32" font-weight="700" fill="#17324D">A tiny difference grows only when it reaches a decision boundary</text><text x="60" y="103" font-size="19" fill="#5E7F9C">A flipped token enters later context, so autoregressive decoding can follow a different generation trajectory.</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="55" y="230" width="190" height="95" rx="23"/><rect x="530" y="230" width="200" height="95" rx="23"/><rect x="990" y="230" width="190" height="95" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="295" y="230" width="185" height="95" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="775" y="230" width="165" height="95" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M245 277H285"/><path d="M480 277H520"/><path d="M730 277H765"/><path d="M940 277H980"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700"><text x="150" y="269" fill="#0F4D92">load changes</text><text x="388" y="261" fill="#765800">dynamic batching</text><text x="388" y="288" fill="#765800">or partitioning</text><text x="630" y="261" fill="#0F4D92">finite-precision logits</text><text x="630" y="288" fill="#0F4D92">differ slightly</text><text x="858" y="261" fill="#B64342">near-tied argmax</text><text x="858" y="288" fill="#B64342">token flips</text><text x="1085" y="261" fill="#0F4D92">later context</text><text x="1085" y="288" fill="#0F4D92">diverges</text></g><path d="M90 398H1150" stroke="#FFD700" stroke-width="3"/><path d="M94 401H1146" stroke="#D8A919" stroke-width="2"/><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="264" y="447" width="712" height="76" rx="24"/></g><path d="M268 451H972" fill="none" stroke="#D8A919" stroke-width="2"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#765800"><text x="620" y="477" font-size="19" font-weight="700">Reproducibility needs a fixed complete numerical path.</text><text x="620" y="501" font-size="16">Dynamic batching can change a request's path; not every tiny difference changes an answer.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="24.0" width="1089.0" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="72.0" width="1110.8" height="49.7"/><rect data-figure-safe-zone="text" x="138.0" y="240.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="376.0" y="232.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="376.0" y="259.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="618.0" y="232.0" width="227.3" height="47.0"/><rect data-figure-safe-zone="text" x="618.0" y="259.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="846.0" y="232.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="846.0" y="259.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="1073.0" y="232.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="1073.0" y="259.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="608.0" y="446.0" width="557.5" height="49.7"/><rect data-figure-safe-zone="text" x="608.0" y="473.0" width="772.8" height="45.6"/></g></svg>
