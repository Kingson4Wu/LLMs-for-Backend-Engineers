<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Moderate and saturated Softmax scales</title><desc id="desc">The same ordering gives a distributed probability at moderate logits and almost all probability to the maximum logit at excessive scale, creating saturation.</desc><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#526B62}.n{font-size:17px;font-weight:700}</style><rect width="1200" height="670" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">The same ordering: scale controls how sharp Softmax becomes</text><text x="65" y="104" class="b">Scaling every logit preserves the winner, while concentrating probabilities and local derivatives.</text><rect x="65" y="145" width="500" height="415" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="97" y="190" class="h">Moderate: logits [2, 1, 0, −1]</text><text x="97" y="220" class="b">Several positions retain distinguishable probability</text><path d="M110 486H528" stroke="#7E9288" stroke-width="3"/><g fill="#0F4D92"><rect x="135" y="272" width="58" height="214" rx="7"/><rect x="235" y="371" width="58" height="115" rx="7"/><rect x="335" y="425" width="58" height="61" rx="7"/><rect x="435" y="459" width="58" height="27" rx="7"/></g><g text-anchor="middle"><text x="164" y="258" class="n" fill="#17324D">52%</text><text x="264" y="357" class="n" fill="#17324D">28%</text><text x="364" y="411" class="n" fill="#17324D">14%</text><text x="464" y="445" class="n" fill="#17324D">6%</text><text x="164" y="519" class="b">position 1</text><text x="264" y="519" class="b">position 2</text><text x="364" y="519" class="b">position 3</text><text x="464" y="519" class="b">position 4</text></g><rect x="635" y="145" width="500" height="415" rx="22" fill="#FDE9E7" stroke="#D49B90" stroke-width="2"/><text x="667" y="190" class="h">Excessive: logits [20, 10, 0, −10]</text><text x="667" y="220" class="b">The maximum takes almost all probability mass</text><path d="M680 486H1098" stroke="#A6928B" stroke-width="3"/><g fill="#B64342"><rect x="705" y="254" width="58" height="232" rx="7"/><rect x="805" y="483" width="58" height="3" rx="2"/><rect x="905" y="483" width="58" height="3" rx="2"/><rect x="1005" y="483" width="58" height="3" rx="2"/></g><g text-anchor="middle"><text x="734" y="240" class="n" fill="#8F3635">≈100%</text><text x="834" y="470" class="n" fill="#8F3635">≈0</text><text x="934" y="470" class="n" fill="#8F3635">≈0</text><text x="1034" y="470" class="n" fill="#8F3635">≈0</text><text x="734" y="519" class="b">position 1</text><text x="834" y="519" class="b">position 2</text><text x="934" y="519" class="b">position 3</text><text x="1034" y="519" class="b">position 4</text></g><rect x="65" y="591" width="1070" height="46" rx="13" fill="#F6CFCB"/><text x="93" y="621" font-size="17" fill="#8F3635">In saturation, most probabilities and Softmax Jacobian terms approach zero, weakening gradients that pass through them.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="1005.8" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="75.0" width="890.3" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="156.0" width="367.2" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="191.0" width="483.7" height="47.0"/><rect data-figure-safe-zone="text" x="152.0" y="229.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="252.0" y="328.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="352.0" y="382.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="452.0" y="416.0" width="41.7" height="47.0"/><rect data-figure-safe-zone="text" x="152.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="252.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="352.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="452.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="655.0" y="156.0" width="413.0" height="53.7"/><rect data-figure-safe-zone="text" x="655.0" y="191.0" width="421.8" height="47.0"/><rect data-figure-safe-zone="text" x="722.0" y="211.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="822.0" y="441.0" width="41.7" height="47.0"/><rect data-figure-safe-zone="text" x="922.0" y="441.0" width="41.7" height="47.0"/><rect data-figure-safe-zone="text" x="1022.0" y="441.0" width="41.7" height="47.0"/><rect data-figure-safe-zone="text" x="722.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="822.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="922.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="1022.0" y="490.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="592.0" width="1076.0" height="47.0"/></g></svg>
