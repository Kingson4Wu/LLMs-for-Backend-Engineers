<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The causal path from dot-product scale to gradient decay</title>
  <desc id="desc">Under a zero-mean independent approximation, high-dimensional Q,K dot products grow in variance with d_k and typical scale with square root d_k. This can saturate Softmax and weaken local gradients; division by square root d_k controls the risk.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
    <style>text{font-family:Arial,sans-serif}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#416985}.s{font-size:16px;fill:#5E7F9C}</style>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">Why divide attention dot products by &#x221A;d&#x2096;?</text>
  <text x="65" y="103" class="b">This risk chain uses a common zero-mean, approximate-independence assumption; it is a control mechanism, not an absolute law.</text>
  <g>
    <rect x="65" y="165" width="233" height="214" rx="20" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/>
    <text x="92" y="198" font-size="18" font-weight="700">High-dimensional</text>
    <text x="92" y="221" font-size="18" font-weight="700">dot product</text>
    <text x="92" y="253" class="b">Q &#xB7; K sums d&#x2096; terms</text>
    <text x="92" y="280" class="s">under the approximation:</text>
    <text x="92" y="310" font-size="21" font-weight="700" fill="#0F4D92">Var(Q &#xB7; K) &#x221D; d&#x2096;</text>
    <text x="92" y="342" class="s">typical magnitude &#x221D; &#x221A;d&#x2096;</text>
    <path d="M298 165V150H371V163" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
    <rect x="386" y="165" width="233" height="214" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/>
    <text x="413" y="209" class="h">Enter Softmax</text>
    <text x="413" y="243" class="b">when score scale</text>
    <text x="413" y="264" class="b">is excessive</text>
    <text x="413" y="298" font-size="17" font-weight="700" fill="#765800">exponentials amplify</text>
    <text x="413" y="320" font-size="17" font-weight="700" fill="#765800">gaps</text>
    <text x="413" y="345" class="s">ranking stays;</text>
    <text x="413" y="365" class="s">distribution sharpens</text>
    <path d="M619 165V150H692V163" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
    <rect x="707" y="165" width="233" height="214" rx="20" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/>
    <text x="734" y="209" font-size="18" font-weight="700">Probability saturation</text>
    <text x="734" y="243" class="b">approaches one-hot</text>
    <path d="M744 285h156" stroke="#B64342" stroke-width="17" stroke-linecap="round"/>
    <path d="M744 321h20m25 0h20m25 0h20m25 0h20" stroke="#E0AAA0" stroke-width="8" stroke-linecap="round"/>
    <text x="734" y="354" font-size="16" class="s">most positions approach zero</text>
    <path d="M940 272h73" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
    <rect x="1028" y="165" width="107" height="214" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/>
    <text x="1081" y="220" text-anchor="middle" class="h">local</text>
    <text x="1081" y="249" text-anchor="middle" class="h">gradient</text>
    <text x="1081" y="288" text-anchor="middle" class="b">shrinks</text>
    <text x="1081" y="322" text-anchor="middle" class="s">Q, K</text>
    <text x="1081" y="344" text-anchor="middle" class="s">weaken</text>
  </g>
  <path d="M600 400v60" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/>
  <rect x="320" y="475" width="560" height="110" rx="22" fill="#17324D"/>
  <text x="600" y="519" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Scaled dot product: QK&#x1D40; / &#x221A;d&#x2096;</text>
  <text x="600" y="545" text-anchor="middle" font-size="17" fill="#CFCECE">returns typical input scale to a steadier range</text>
  <text x="600" y="569" text-anchor="middle" font-size="17" fill="#CFCECE">and reduces early saturation risk</text>
  <rect x="65" y="616" width="1070" height="39" rx="12" fill="#F6CFCB"/>
  <text x="92" y="642" font-size="16" fill="#8F3635">Risk reduction is not a stability guarantee: parameter distributions, optimization, normalization, and numerics also matter.</text>
