<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc"><title id="title">Encoder-decoder Transformer data flow</title><desc id="desc">A source sequence becomes encoded representations. A target prefix uses masked self-attention, then cross-attention reads the encoded source before FFN and LM head predict the next token.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="620" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D">The encoder represents source; the decoder generates from a prefix</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="165" width="180" height="70" rx="20"/><rect x="515" y="165" width="200" height="70" rx="20"/><rect x="760" y="165" width="180" height="70" rx="20"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="285" y="165" width="170" height="70" rx="20"/><rect x="285" y="375" width="170" height="70" rx="20"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="375" width="180" height="70" rx="20"/><rect x="515" y="375" width="210" height="70" rx="20"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="790" y="350" width="205" height="120" rx="23"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="1065" y="375" width="130" height="70" rx="20"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 200H275"/><path d="M455 200H505"/><path d="M715 200H750"/><path d="M225 410H275"/><path d="M455 410H505"/><path d="M725 410H780"/><path d="M940 235V335H890"/><path d="M995 410H1055"/></g><g font-weight="700"><text x="135" y="208" font-size="21" fill="#0F4D92">source sequence</text><text x="370" y="208" font-size="18" fill="#765800">embedding + position</text><text x="615" y="208" font-size="21" fill="#0F4D92">encoder stack</text><text x="850" y="208" font-size="20" fill="#0F4D92">encoded source</text><text x="135" y="418" font-size="21" fill="#0F4D92">target prefix</text><text x="370" y="418" font-size="18" fill="#765800">embedding + position</text><text x="620" y="418" font-size="17" fill="#0F4D92">masked self-attention</text><text x="892" y="398" font-size="19" fill="#B64342">cross-attention</text><text x="892" y="426" font-size="15" fill="#B64342">read encoded source</text><text x="1130" y="404" font-size="15" fill="#0F4D92">FFN + LM head</text><text x="1130" y="428" font-size="15" fill="#0F4D92">next token</text></g></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="1122.2" height="67.2"/><rect data-figure-safe-zone="text" x="123.0" y="175.0" width="187.8" height="52.4"/><rect data-figure-safe-zone="text" x="358.0" y="178.0" width="211.2" height="48.3"/><rect data-figure-safe-zone="text" x="603.0" y="175.0" width="166.0" height="52.4"/><rect data-figure-safe-zone="text" x="838.0" y="176.0" width="169.6" height="51.0"/><rect data-figure-safe-zone="text" x="123.0" y="385.0" width="166.0" height="52.4"/><rect data-figure-safe-zone="text" x="358.0" y="388.0" width="211.2" height="48.3"/><rect data-figure-safe-zone="text" x="608.0" y="389.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="880.0" y="367.0" width="172.2" height="49.7"/><rect data-figure-safe-zone="text" x="880.0" y="399.0" width="172.2" height="44.2"/><rect data-figure-safe-zone="text" x="1118.0" y="377.0" width="125.4" height="44.2"/><rect data-figure-safe-zone="text" x="1118.0" y="401.0" width="102.0" height="44.2"/></g></svg>
