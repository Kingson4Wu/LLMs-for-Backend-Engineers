 <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="390" y="115" width="240" height="64" rx="20"/><rect x="390" y="245" width="240" height="64" rx="20"/><rect x="390" y="375" width="240" height="64" rx="20"/><rect x="390" y="505" width="240" height="64" rx="20"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-size="21" font-weight="700" fill="#17324D"><text x="510" y="155">QKᵀ / √d_k</text><text x="510" y="285">add mask (optional)</text><text x="510" y="415">Softmax weights</text><text x="510" y="545">weights × V</text></g>
