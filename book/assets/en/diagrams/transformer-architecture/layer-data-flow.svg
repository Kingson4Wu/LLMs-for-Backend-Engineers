<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Transformer layer data flow</title><desc id="desc">Input representations and position enter repeated Transformer layers. Each layer mixes accessible context with attention, stabilizes residual paths, locally transforms positions with an FFN, and produces output representations.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1120" height="760" rx="36" fill="#FFFFFF"/><text x="55" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324D">Transformer layers mix context, transform locally, and stack stably</text><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="330" y="95" width="460" height="60" rx="20"/></g><rect x="210" y="205" width="700" height="420" rx="28" fill="#F4F8FC" stroke="#0F4D92" stroke-width="4"/><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="310" y="285" width="500" height="56" rx="18"/><rect x="310" y="440" width="500" height="56" rx="18"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="360" y="365" width="400" height="46" rx="16"/><rect x="360" y="520" width="400" height="46" rx="16"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="330" y="665" width="460" height="58" rx="20"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700"><text x="560" y="133" font-size="21" fill="#0F4D92">input representations + position</text><text x="560" y="255" font-size="24" fill="#0F4D92">Transformer layer × N</text><text x="560" y="320" font-size="20" fill="#765800">Attention: aggregate accessible context</text><text x="560" y="395" font-size="19" fill="#0F4D92">Residual + LayerNorm</text><text x="560" y="475" font-size="20" fill="#765800">FFN: transform each position</text><text x="560" y="550" font-size="19" fill="#0F4D92">Residual + LayerNorm</text><text x="560" y="701" font-size="21" fill="#B64342">output representations</text></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M560 155V190M560 341V355M560 411V430M560 496V510M560 566V655"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="22.0" width="1069.2" height="64.5"/><rect data-figure-safe-zone="text" x="548.0" y="100.0" width="373.4" height="52.4"/><rect data-figure-safe-zone="text" x="548.0" y="219.0" width="286.1" height="56.4"/><rect data-figure-safe-zone="text" x="548.0" y="288.0" width="429.6" height="51.0"/><rect data-figure-safe-zone="text" x="548.0" y="364.0" width="221.6" height="49.7"/><rect data-figure-safe-zone="text" x="548.0" y="443.0" width="315.2" height="51.0"/><rect data-figure-safe-zone="text" x="548.0" y="519.0" width="221.6" height="49.7"/><rect data-figure-safe-zone="text" x="548.0" y="668.0" width="264.2" height="52.4"/></g></svg>
