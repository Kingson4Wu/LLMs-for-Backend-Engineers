<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Task completion needs external final-state validation</title><desc id="desc">A model proposal passes structure, policy, execution, and external final-state validation. The runtime uses traceable evidence to continue, stop, or escalate. Self-evaluation is not completion evidence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">A successful call does not mean the task is complete</text><text x="58" y="105" font-size="18" fill="#5E7F9C">Correctness must cross structural, authority, execution, and external-world state; each layer answers a different question.</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M215 260H265"/><path d="M455 260H505"/><path d="M695 260H745"/><path d="M935 260H985"/></g><g stroke-width="3"><rect x="45" y="180" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="265" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="505" y="180" width="190" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="745" y="180" width="190" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="985" y="180" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="130" y="230" font-size="21" font-weight="700" fill="#17324D">model proposal</text><text x="130" y="263" font-size="16" fill="#0F4D92">call name and arguments</text><text x="130" y="289" font-size="16" fill="#0F4D92">only a candidate</text><text x="360" y="230" font-size="21" font-weight="700" fill="#765800">schema check</text><text x="360" y="263" font-size="16" fill="#765800">parseable structure?</text><text x="360" y="289" font-size="16" fill="#765800">complete arguments?</text><text x="600" y="230" font-size="21" font-weight="700" fill="#765800">policy check</text><text x="600" y="263" font-size="16" fill="#765800">is this actor allowed</text><text x="600" y="289" font-size="16" fill="#765800">to execute now?</text><text x="840" y="230" font-size="21" font-weight="700" fill="#B64342">controlled execution</text><text x="840" y="263" font-size="16" fill="#B64342">tool performs action</text><text x="840" y="289" font-size="16" fill="#B64342">and returns observation</text><text x="1070" y="230" font-size="21" font-weight="700" fill="#17324D">external state</text><text x="1070" y="263" font-size="16" fill="#0F4D92">was the goal achieved?</text><text x="1070" y="289" font-size="16" fill="#0F4D92">can state be verified?</text></g><rect x="240" y="425" width="720" height="90" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="462" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">Record a trace; runtime chooses continue, stop, or escalate</text><text x="600" y="494" text-anchor="middle" font-size="17" fill="#765800">A model’s “done” claim is information, not a substitute for external final-state evidence.</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">The closer a validation layer is to the real effect, the better it can answer whether the task is complete.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="862.2" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1175.3" height="48.3"/><rect data-figure-safe-zone="text" x="118.0" y="197.0" width="176.9" height="52.4"/><rect data-figure-safe-zone="text" x="118.0" y="235.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="118.0" y="261.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="348.0" y="197.0" width="155.0" height="52.4"/><rect data-figure-safe-zone="text" x="348.0" y="235.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="348.0" y="261.0" width="182.1" height="45.6"/><rect data-figure-safe-zone="text" x="588.0" y="197.0" width="155.0" height="52.4"/><rect data-figure-safe-zone="text" x="588.0" y="235.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="588.0" y="261.0" width="148.8" height="45.6"/><rect data-figure-safe-zone="text" x="828.0" y="197.0" width="242.4" height="52.4"/><rect data-figure-safe-zone="text" x="828.0" y="235.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="828.0" y="261.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="1058.0" y="197.0" width="176.9" height="52.4"/><rect data-figure-safe-zone="text" x="1058.0" y="235.0" width="207.0" height="45.6"/><rect data-figure-safe-zone="text" x="1058.0" y="261.0" width="207.0" height="45.6"/><rect data-figure-safe-zone="text" x="265.9" y="429.0" width="668.3" height="52.4"/><rect data-figure-safe-zone="text" x="190.2" y="465.0" width="819.6" height="47.0"/><rect data-figure-safe-zone="text" x="87.2" y="562.0" width="1025.5" height="48.3"/></g></svg>
