<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Division between adaptive and assurance layers</title><desc id="desc">Stable goals and constraints frame model-selected strategy, deterministic programs execute verified paths, and external state supplies evidence for success, failure, or continuation.</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="58" y="68" text-anchor="start" font-size="31" font-weight="700" fill="#17324D">Let the model adapt; let programs carry verified stable paths</text><text x="58" y="105" text-anchor="start" font-size="18" fill="#5E7F9C">Models can propose strategy under uncertainty; assurance comes from explicit constraints and deterministic execution.</text><text x="58" y="129" text-anchor="start" font-size="18" fill="#5E7F9C">External-state validation supplies the evidence that a task actually succeeded, failed, or should continue.</text><g stroke-width="3"><rect x="150" y="155" width="900" height="78" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="150" y="260" width="900" height="105" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="150" y="392" width="900" height="105" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="150" y="524" width="900" height="58" rx="18" fill="#F6CFCB" stroke="#B64342"/></g><text x="400" y="188" font-size="17" font-weight="700" fill="#17324D">stable goals, constraints,</text><text x="400" y="214" font-size="17" font-weight="700" fill="#17324D">and acceptance conditions</text><text x="770" y="203" font-size="17" fill="#0F4D92">not replaced by “looks plausible”</text><text x="600" y="292" font-size="22" font-weight="700" fill="#765800">adaptive layer</text><text x="600" y="319" font-size="17" fill="#765800">model selects the next step from observations</text><text x="600" y="344" font-size="17" fill="#765800">exploration, explanation, planning, candidate generation</text><text x="600" y="424" font-size="22" font-weight="700" fill="#17324D">assurance layer</text><text x="600" y="451" font-size="17" fill="#17324D">deterministic programs execute stable paths</text><text x="600" y="476" font-size="17" fill="#0F4D92">queries, calculations, writes, verified scripts</text><text x="600" y="560" font-size="19" font-weight="700" fill="#B64342">External business state is the evidence for success, failure, or continuation.</text><path d="M600 233V250M600 365V382M600 497V514" stroke="#0F4D92" stroke-width="4"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1007.3" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1119.1" height="48.3"/><rect data-figure-safe-zone="text" x="46.0" y="99.0" width="1025.5" height="48.3"/><rect data-figure-safe-zone="text" x="388.0" y="159.0" width="253.8" height="47.0"/><rect data-figure-safe-zone="text" x="388.0" y="185.0" width="245.0" height="47.0"/><rect data-figure-safe-zone="text" x="758.0" y="174.0" width="315.7" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="258.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="588.0" y="290.0" width="421.8" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="315.0" width="519.0" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="390.0" width="195.6" height="53.7"/><rect data-figure-safe-zone="text" x="588.0" y="422.0" width="404.1" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="447.0" width="439.5" height="47.0"/><rect data-figure-safe-zone="text" x="588.0" y="529.0" width="794.6" height="49.7"/></g></svg>
