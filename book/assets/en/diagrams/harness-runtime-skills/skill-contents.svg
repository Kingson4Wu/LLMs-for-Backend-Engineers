<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Auditable contents of a skill</title><desc id="desc">A skill organizes goals and stopping conditions, tools and constraints, verified steps and reference resources, and acceptance, recovery, and escalation rules. It guides tasks but grants no new authority.</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">A skill is on-demand task material, not a permission package</text><text x="58" y="105" font-size="18" fill="#5E7F9C">A good skill connects reviewable task knowledge with program governance; runtime and external systems still decide execution authority.</text><rect x="80" y="170" width="250" height="335" rx="28" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/><text x="205" y="307" text-anchor="middle" font-size="34" font-weight="700" fill="#17324D">skill</text><text x="205" y="341" text-anchor="middle" font-size="18" fill="#0F4D92">reusable guidance</text><text x="205" y="367" text-anchor="middle" font-size="18" fill="#0F4D92">loaded for one task</text><g stroke-width="3"><rect x="420" y="150" width="680" height="74" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="420" y="245" width="680" height="74" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="420" y="340" width="680" height="74" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="420" y="435" width="680" height="74" rx="20" fill="#F6CFCB" stroke="#B64342"/></g><text x="455" y="181" font-size="21" font-weight="700" fill="#17324D">goals and stopping conditions</text><text x="790" y="195" font-size="17" fill="#0F4D92">when this task is complete or must stop</text><text x="455" y="276" font-size="21" font-weight="700" fill="#765800">tools and necessary constraints</text><text x="455" y="302" font-size="17" fill="#765800">available capabilities, data boundaries, risk conditions</text><text x="455" y="371" font-size="21" font-weight="700" fill="#17324D">verified steps and resources</text><text x="455" y="386" font-size="17" fill="#0F4D92">scripts, templates, references,</text><text x="455" y="406" font-size="17" fill="#0F4D92">known-good practices</text><text x="455" y="466" font-size="21" font-weight="700" fill="#B64342">acceptance, recovery, escalation</text><text x="455" y="492" font-size="17" fill="#B64342">how to confirm, and how to handle failure</text><path d="M330 337H380V187H410M380 282H410M380 377H410M380 472H410" fill="none" stroke="#0F4D92" stroke-width="4"/><text x="600" y="590" text-anchor="middle" font-size="18" fill="#5E7F9C">A skill adds repeatable task guidance; it does not replace judgment, authorization checks, or external-state validation.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="991.2" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1287.6" height="48.3"/><rect data-figure-safe-zone="text" x="148.8" y="261.0" width="112.4" height="69.9"/><rect data-figure-safe-zone="text" x="113.4" y="311.0" width="183.1" height="48.3"/><rect data-figure-safe-zone="text" x="104.1" y="337.0" width="201.8" height="48.3"/><rect data-figure-safe-zone="text" x="443.0" y="148.0" width="340.7" height="52.4"/><rect data-figure-safe-zone="text" x="778.0" y="166.0" width="368.8" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="243.0" width="362.5" height="52.4"/><rect data-figure-safe-zone="text" x="443.0" y="273.0" width="519.0" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="338.0" width="329.8" height="52.4"/><rect data-figure-safe-zone="text" x="443.0" y="357.0" width="298.0" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="377.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="443.0" y="433.0" width="373.4" height="52.4"/><rect data-figure-safe-zone="text" x="443.0" y="463.0" width="386.4" height="47.0"/><rect data-figure-safe-zone="text" x="26.4" y="560.0" width="1147.2" height="48.3"/></g></svg>
