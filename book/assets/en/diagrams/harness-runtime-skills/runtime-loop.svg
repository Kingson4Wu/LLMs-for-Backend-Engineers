<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Task loop controlled by harness and runtime</title><desc id="desc">Task and explicit state guide a harness in selecting context; the model proposes a step; a program validates, authorizes, and executes; observations become new state. The runtime enforces limits throughout.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">The model proposes a step; harness and runtime control the whole loop</text><text x="58" y="105" font-size="18" fill="#5E7F9C">Multi-turn behavior comes from program orchestration, not automatic ownership of a loop, authority, or stopping by token generation.</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M225 255H275"/><path d="M475 255H525"/><path d="M725 255H775"/><path d="M975 255V385H145V335"/></g><g stroke-width="3"><rect x="55" y="175" width="170" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="275" y="175" width="200" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="175" width="200" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="775" y="175" width="200" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/></g><g text-anchor="middle"><text x="140" y="226" font-size="22" font-weight="700" fill="#17324D">task + state</text><text x="140" y="259" font-size="16" fill="#0F4D92">goal, evidence, progress</text><text x="140" y="285" font-size="16" fill="#0F4D92">budget and boundaries</text><text x="375" y="226" font-size="22" font-weight="700" fill="#765800">harness</text><text x="375" y="259" font-size="16" fill="#765800">select this turn’s context</text><text x="375" y="285" font-size="16" fill="#765800">assemble tools and constraints</text><text x="625" y="226" font-size="22" font-weight="700" fill="#17324D">model proposal</text><text x="625" y="259" font-size="16" fill="#0F4D92">answer, call, or</text><text x="625" y="285" font-size="16" fill="#0F4D92">next-step plan</text><text x="875" y="226" font-size="22" font-weight="700" fill="#B64342">program execution</text><text x="875" y="259" font-size="16" fill="#B64342">validate, authorize, execute</text><text x="875" y="285" font-size="16" fill="#B64342">observe external result</text></g><rect x="265" y="415" width="670" height="95" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">Observe results, errors, and external state → update explicit state</text><text x="600" y="484" text-anchor="middle" font-size="17" fill="#765800">Runtime chooses continue, retry, escalate, or stop; the model is not the loop owner.</text><rect x="180" y="552" width="840" height="46" rx="14" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#B64342">Runtime guards turns, time, cost, authority, retries, and stopping conditions.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1136.3" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1259.5" height="48.3"/><rect data-figure-safe-zone="text" x="128.0" y="192.0" width="161.3" height="53.7"/><rect data-figure-safe-zone="text" x="128.0" y="231.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="128.0" y="257.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="192.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="363.0" y="231.0" width="240.3" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="257.0" width="273.6" height="45.6"/><rect data-figure-safe-zone="text" x="613.0" y="192.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="613.0" y="231.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="613.0" y="257.0" width="140.5" height="45.6"/><rect data-figure-safe-zone="text" x="863.0" y="192.0" width="218.5" height="53.7"/><rect data-figure-safe-zone="text" x="863.0" y="231.0" width="257.0" height="45.6"/><rect data-figure-safe-zone="text" x="863.0" y="257.0" width="215.4" height="45.6"/><rect data-figure-safe-zone="text" x="222.2" y="419.0" width="755.6" height="52.4"/><rect data-figure-safe-zone="text" x="216.7" y="455.0" width="766.6" height="47.0"/><rect data-figure-safe-zone="text" x="243.2" y="553.0" width="713.5" height="47.0"/></g></svg>
