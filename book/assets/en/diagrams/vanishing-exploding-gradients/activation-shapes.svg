<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Activation shape affects gradient flow</title><desc id="desc">Three coordinate cards compare sigmoid saturation, tanh saturation despite being zero-centered, and ReLU's unit-slope positive branch with an inactive negative branch. These shapes determine local gradient conditions.</desc>
  <rect width="1200" height="590" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif"><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">Activation shape determines where gradients can keep flowing</text><text x="65" y="104" font-size="19" fill="#5E7F9C">Saturation, hard cutoffs, and smooth transitions each leave a different local derivative for backpropagation.</text></g>
  <g fill="#F4F8FC" stroke="#0F4D92" stroke-width="3"><rect x="55" y="145" width="335" height="360" rx="25"/><rect x="432" y="145" width="335" height="360" rx="25"/><rect x="810" y="145" width="335" height="360" rx="25"/></g><g fill="none" stroke="#86AAA1" stroke-width="2"><rect x="59" y="149" width="327" height="352" rx="23"/><rect x="436" y="149" width="327" height="352" rx="23"/><rect x="814" y="149" width="327" height="352" rx="23"/></g>
  <g stroke="#9AB2AB" stroke-width="2"><path d="M95 365H350M222 205V390"/><path d="M472 365H727M599 205V390"/><path d="M850 365H1105M977 205V390"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M100 347C135 347 145 343 164 326C186 305 189 267 222 259C255 251 258 213 281 195C301 180 320 176 345 176" stroke="#B64342" stroke-width="6"/><path d="M477 347C507 347 523 333 541 309C559 285 566 265 599 265C632 265 639 245 657 221C675 197 691 183 722 183" stroke="#FFD700" stroke-width="6"/><path d="M855 365H977L1100 190" stroke="#4E8478" stroke-width="6"/></g><g fill="none" stroke-width="2" opacity=".85"><path d="M104 350C141 350 151 346 169 329C190 308 193 270 226 262C259 254 262 216 285 198C305 183 324 179 349 179" stroke="#E19085"/><path d="M481 350C511 350 527 336 545 312C563 288 570 268 603 268C636 268 643 248 661 224C679 200 695 186 726 186" stroke="#D8A919"/><path d="M859 368H981L1104 193" stroke="#8BB4AA"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g font-size="26" font-weight="700"><text x="222" y="190" fill="#B64342">Sigmoid</text><text x="599" y="190" fill="#765800">tanh</text><text x="977" y="190" fill="#285D53">ReLU</text></g><g font-size="18" fill="#486A61"><text x="222" y="438">saturates at both ends</text><text x="599" y="438">zero-centred, still saturates</text><text x="977" y="438">unit positive slope; inactive left side</text></g></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#5E7F9C"><text x="335" y="382">x</text><text x="712" y="382">x</text><text x="1090" y="382">x</text><text x="201" y="220">y</text><text x="578" y="220">y</text><text x="956" y="220">y</text></g><path d="M88 548H1112" stroke="#FFD700" stroke-width="3"/><path d="M92 551H1108" stroke="#D8A919" stroke-width="2"/><text x="600" y="572" font-family="Arial, sans-serif" font-size="18" fill="#765800" text-anchor="middle">The important question is how each local derivative is multiplied through a deep stack.</text>
