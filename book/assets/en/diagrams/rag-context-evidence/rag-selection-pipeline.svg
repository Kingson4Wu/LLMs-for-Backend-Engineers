<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RAG selection pipeline: each stage narrows candidates</title>
  <desc id="desc">Source material is prepared and retrieved for a question, then filtered and reranked under evidence conditions before a small, traceable context supports checked generation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">From material to answer: RAG keeps narrowing candidates</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">Every selection must retain source, revision, access scope, and business conditions.</text>
    <path d="M72 262H1120" fill="none" stroke="#D7DDD6" stroke-width="3"/>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)"><path d="M225 262H280"/><path d="M470 262H525"/><path d="M730 262H785"/><path d="M975 262H1025"/></g>
    <g stroke-width="3"><rect x="72" y="190" width="153" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="280" y="190" width="190" height="145" rx="22" fill="#FFF8D6" stroke="#FFD700"/><rect x="525" y="190" width="205" height="145" rx="22" fill="#F6CFCB" stroke="#B64342"/><rect x="785" y="190" width="190" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/><rect x="1025" y="190" width="110" height="145" rx="22" fill="#EAF3FB" stroke="#0F4D92"/></g>
    <g text-anchor="middle">
      <text x="148" y="236" font-size="20" font-weight="700" fill="#17324D">sources</text><text x="148" y="269" font-size="16" fill="#0F4D92">documents, records,</text><text x="148" y="293" font-size="16" fill="#0F4D92">business data</text>
      <text x="375" y="228" font-size="20" font-weight="700" fill="#765800">prepare + retrieve</text><text x="375" y="259" font-size="16" fill="#765800">clean · version</text><text x="375" y="284" font-size="16" fill="#765800">chunk · annotate · index</text><text x="375" y="310" font-size="16" fill="#765800">query candidates</text>
      <text x="627" y="228" font-size="20" font-weight="700" fill="#B64342">filter + rerank</text><text x="627" y="259" font-size="16" fill="#B64342">access · time · revision</text><text x="627" y="284" font-size="16" fill="#B64342">conditions · conflicts</text><text x="627" y="310" font-size="16" fill="#B64342">rerank · deduplicate</text>
      <text x="880" y="236" font-size="20" font-weight="700" fill="#17324D">evidence context</text><text x="880" y="269" font-size="16" fill="#0F4D92">small, relevant,</text><text x="880" y="293" font-size="16" fill="#0F4D92">traceable evidence</text>
      <text x="1080" y="236" font-size="20" font-weight="700" fill="#17324D">generate</text><text x="1080" y="269" font-size="16" fill="#0F4D92">+ check</text>
    </g>
    <path d="M375 350V402H627V350" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="275" y="425" width="650" height="120" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="464" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">Candidate count falls; evidence conditions must not.</text><text x="600" y="495" text-anchor="middle" font-size="17" fill="#765800">Putting top results straight into the model skips checks for authority,</text><text x="600" y="520" text-anchor="middle" font-size="17" fill="#765800">freshness, conflict, and relevance.</text>
    <path d="M925 545H1010V350" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)" data-figure-connector="true"/>
    <text x="600" y="596" text-anchor="middle" font-size="18" fill="#5E7F9C">Retrieval narrows candidates; programs still validate citations, authority, and terminal state.</text>
  </g>
<g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="910.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="810.2" height="48.3"/><rect data-figure-safe-zone="text" x="136.0" y="204.0" width="96.8" height="51.0"/><rect data-figure-safe-zone="text" x="136.0" y="241.0" width="182.1" height="45.6"/><rect data-figure-safe-zone="text" x="136.0" y="265.0" width="132.2" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="196.0" width="211.2" height="51.0"/><rect data-figure-safe-zone="text" x="363.0" y="231.0" width="148.8" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="256.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="363.0" y="282.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="196.0" width="180.0" height="51.0"/><rect data-figure-safe-zone="text" x="615.0" y="231.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="256.0" width="207.0" height="45.6"/><rect data-figure-safe-zone="text" x="615.0" y="282.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="868.0" y="204.0" width="190.4" height="51.0"/><rect data-figure-safe-zone="text" x="868.0" y="241.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="868.0" y="265.0" width="173.8" height="45.6"/><rect data-figure-safe-zone="text" x="1068.0" y="204.0" width="107.2" height="51.0"/><rect data-figure-safe-zone="text" x="1068.0" y="241.0" width="82.2" height="45.6"/><rect data-figure-safe-zone="text" x="304.1" y="431.0" width="591.8" height="52.4"/><rect data-figure-safe-zone="text" x="274.2" y="466.0" width="651.6" height="47.0"/><rect data-figure-safe-zone="text" x="433.3" y="491.0" width="333.4" height="47.0"/><rect data-figure-safe-zone="text" x="143.4" y="566.0" width="913.2" height="48.3"/></g></svg>
