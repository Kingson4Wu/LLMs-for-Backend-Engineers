<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Prefill, decode, and KV-cache state within a request</title><desc id="desc">Context tokens are processed in parallel during prefill to establish KV cache. Decode then generates one token per step, reusing and appending cache state in an autoregressive loop.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:16px}</style></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">A request first builds context state, then extends it token by token</text><text x="65" y="103" class="b" fill="#416985">Prefill processes existing context; decode is constrained by autoregressive dependency.</text><rect x="65" y="165" width="210" height="142" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="97" y="211" class="h" fill="#17324D">Context tokens</text><g fill="#0F4D92"><rect x="97" y="238" width="27" height="30" rx="6"/><rect x="133" y="238" width="27" height="30" rx="6"/><rect x="169" y="238" width="27" height="30" rx="6"/><rect x="205" y="238" width="27" height="30" rx="6"/></g><text x="97" y="282" class="s" fill="#5E7F9C">prompt and</text><text x="97" y="301" class="s" fill="#5E7F9C">conversation history</text><path d="M275 236h76" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="366" y="145" width="312" height="200" rx="22" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="398" y="194" class="h" fill="#765800">Prefill</text><text x="398" y="229" class="b" fill="#765800">process existing input tokens</text><text x="398" y="252" class="b" fill="#765800">in parallel</text><text x="398" y="279" class="b" fill="#765800">establish K / V state for each layer</text><rect x="398" y="299" width="248" height="26" rx="8" fill="#FFF1B8"/><text x="522" y="319" text-anchor="middle" font-size="14" fill="#765800">the main compute before the first token</text><path d="M678 236h76" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="769" y="145" width="366" height="182" rx="22" fill="#F6CFCB" stroke="#E9A6A1" stroke-width="2"/><text x="801" y="194" class="h" fill="#8F3635">Decode</text><text x="801" y="229" class="b" fill="#8F3635">generate 1 token → append state</text><text x="801" y="260" class="b" fill="#8F3635">then generate the next token</text><g fill="#B64342"><rect x="801" y="281" width="25" height="22" rx="5"/><rect x="835" y="281" width="25" height="22" rx="5"/><rect x="869" y="281" width="25" height="22" rx="5"/></g><text x="908" y="299" class="s" fill="#8D625A">autoregressive loop</text><path d="M952 327v56H703" fill="none" stroke="#B64342" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="405" y="400" width="395" height="134" rx="20" fill="#17324D"/><text x="438" y="435" class="h" fill="#FFFFFF">KV cache: accumulated</text><text x="438" y="460" class="h" fill="#FFFFFF">attention state</text><text x="438" y="487" class="b" fill="#CFCECE">reuse existing K / V and append entries</text><text x="438" y="509" class="b" fill="#CFCECE">for the new token</text><text x="438" y="528" class="s" fill="#CFCECE">reduces repeated work, while consuming memory</text><rect x="65" y="556" width="1070" height="43" rx="13" fill="#F6CFCB"/><text x="92" y="584" font-size="17" fill="#8F3635">Long context affects prefill work and KV-cache capacity; decode latency remains governed by its step-by-step dependency.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="1155.5" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="793.1" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="177.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="253.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="272.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="386.0" y="160.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="386.0" y="200.0" width="280.4" height="47.0"/><rect data-figure-safe-zone="text" x="386.0" y="223.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="386.0" y="250.0" width="342.2" height="47.0"/><rect data-figure-safe-zone="text" x="368.0" y="293.0" width="307.9" height="42.9"/><rect data-figure-safe-zone="text" x="789.0" y="160.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="789.0" y="200.0" width="298.0" height="47.0"/><rect data-figure-safe-zone="text" x="789.0" y="231.0" width="271.5" height="47.0"/><rect data-figure-safe-zone="text" x="896.0" y="270.0" width="192.0" height="47.0"/><rect data-figure-safe-zone="text" x="426.0" y="401.0" width="264.2" height="53.7"/><rect data-figure-safe-zone="text" x="426.0" y="426.0" width="195.6" height="53.7"/><rect data-figure-safe-zone="text" x="426.0" y="458.0" width="368.8" height="47.0"/><rect data-figure-safe-zone="text" x="426.0" y="480.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="426.0" y="499.0" width="421.8" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="555.0" width="1084.8" height="47.0"/></g></svg>
