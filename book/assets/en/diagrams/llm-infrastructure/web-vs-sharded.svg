    <rect data-figure-safe-zone="text" x="159.0" y="219.0" width="104.1" height="53.7"/>
    <rect data-figure-safe-zone="text" x="395.0" y="219.0" width="172.7" height="53.7"/>
    <rect data-figure-safe-zone="text" x="663.0" y="202.0" width="252.8" height="53.7"/>
    <rect data-figure-safe-zone="text" x="663.0" y="235.0" width="227.3" height="47.0"/>
    <rect data-figure-safe-zone="text" x="942.0" y="219.0" width="207.0" height="53.7"/>
    <rect data-figure-safe-zone="text" x="84.0" y="381.0" width="733.3" height="53.7"/>
    <rect data-figure-safe-zone="text" x="119.0" y="469.0" width="104.1" height="53.7"/>
    <rect data-figure-safe-zone="text" x="308.5" y="469.0" width="207.0" height="53.7"/>
    <rect data-figure-safe-zone="text" x="539.2" y="446.0" width="275.7" height="53.7"/>
    <rect data-figure-safe-zone="text" x="581.0" y="479.0" width="192.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="864.0" y="428.0" width="289.2" height="47.0"/>
    <rect data-figure-safe-zone="text" x="864.0" y="484.0" width="289.2" height="47.0"/>
    <rect data-figure-safe-zone="text" x="864.0" y="540.0" width="289.2" height="47.0"/>
    <rect data-figure-safe-zone="text" x="105.4" y="620.0" width="989.1" height="45.6"/>
  </g>
