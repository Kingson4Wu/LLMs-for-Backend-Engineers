<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Three allocations of inference-time compute</title><desc id="d">Panels compare extending one trajectory, selecting candidates, and using verification feedback.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0F4D92"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">How inference-time compute can be allocated</text><g font-family="Arial" fill="#17324d"><rect x="45" y="100" width="340" height="430" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="75" y="145" font-size="22" font-weight="700" fill="#0F4D92">1. One trajectory</text><rect x="90" y="195" width="250" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="215" y="229" text-anchor="middle" font-size="18">Intermediate states</text><path data-figure-connector="true" d="M215 250V305" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="330" width="250" height="55" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="215" y="364" text-anchor="middle" font-size="18">Answer</text><text x="75" y="475" font-size="14">More depth; a wrong premise can persist.</text><rect x="430" y="100" width="340" height="430" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="460" y="145" font-size="22" font-weight="700" fill="#0F4D92">2. Candidate selection</text><rect x="475" y="195" width="250" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="600" y="229" text-anchor="middle" font-size="18">Multiple candidates</text><path data-figure-connector="true" d="M600 250V305" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="475" y="330" width="250" height="55" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="600" y="364" text-anchor="middle" font-size="18">Compare or select</text><text x="460" y="475" font-size="14">A weak selector only adds candidates.</text><rect x="815" y="100" width="340" height="430" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="845" y="145" font-size="22" font-weight="700" fill="#0F4D92">3. Verify or search</text><rect x="860" y="195" width="250" height="55" rx="12" fill="#fff4d8" stroke="#c58b23"/><text x="985" y="229" text-anchor="middle" font-size="17">Verifier, search, or tool</text><path data-figure-connector="true" d="M985 250V305" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="860" y="330" width="250" height="55" rx="12" fill="#e3f3e8" stroke="#438a62"/><text x="985" y="364" text-anchor="middle" font-size="18">Continue or stop</text><text x="845" y="475" font-size="14">Feedback covers checked properties only.</text></g></svg>
