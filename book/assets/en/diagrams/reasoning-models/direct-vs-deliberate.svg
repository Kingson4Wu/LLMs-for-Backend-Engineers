<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Direct-answer and multi-step paths through the same Transformer</title><desc id="desc">The left path runs from a question through an autoregressive Transformer to an answer. The right path returns intermediate states to context and may check them before answering. Both use the same model skeleton.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0F4D92"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">One autoregressive Transformer, two solution paths</text>
  <rect x="55" y="100" width="500" height="450" rx="22" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="90" y="145" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0F4D92">Direct answer: a shorter trajectory</text>
  <rect x="145" y="190" width="320" height="66" rx="14" fill="#fff" stroke="#3775BA" stroke-width="2"/><text x="305" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Question and current context</text>
  <path data-figure-connector="true" d="M305 256 V300" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="145" y="324" width="320" height="66" rx="14" fill="#dcebf8" stroke="#3775BA" stroke-width="2"/><text x="305" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Autoregressive Transformer</text>
  <path data-figure-connector="true" d="M305 390 V434" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="145" y="458" width="320" height="56" rx="14" fill="#e3f3e8" stroke="#438a62" stroke-width="2"/><text x="305" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Answer directly</text>
  <rect x="645" y="100" width="500" height="450" rx="22" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="680" y="137" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F4D92">Reasoning model: later use of</text><text x="680" y="161" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F4D92">intermediate states</text>
  <rect x="735" y="185" width="320" height="56" rx="14" fill="#fff" stroke="#3775BA" stroke-width="2"/><text x="895" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Question and current context</text>
  <path data-figure-connector="true" d="M895 241 V270" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="735" y="294" width="320" height="60" rx="14" fill="#dcebf8" stroke="#3775BA" stroke-width="2"/><text x="895" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Generate intermediate states</text>
  <path data-figure-connector="true" d="M895 354 V381" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="735" y="405" width="320" height="60" rx="14" fill="#fff4d8" stroke="#c58b23" stroke-width="2"/><text x="895" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Condition, check, or correct</text>
  <path data-figure-connector="true" d="M895 465 V491" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="735" y="515" width="320" height="56" rx="14" fill="#e3f3e8" stroke="#438a62" stroke-width="2"/><text x="895" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#17324d">Final answer</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="70" y="110" width="420" height="52"/><rect data-figure-safe-zone="text" x="150" y="195" width="310" height="52"/><rect data-figure-safe-zone="text" x="150" y="329" width="310" height="52"/><rect data-figure-safe-zone="text" x="150" y="463" width="310" height="44"/><rect data-figure-safe-zone="text" x="660" y="110" width="455" height="52"/><rect data-figure-safe-zone="text" x="740" y="190" width="310" height="44"/><rect data-figure-safe-zone="text" x="740" y="299" width="310" height="48"/><rect data-figure-safe-zone="text" x="740" y="410" width="310" height="48"/><rect data-figure-safe-zone="text" x="740" y="520" width="310" height="44"/></g>
</svg>
