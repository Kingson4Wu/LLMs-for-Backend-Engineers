<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Training signals and verifier boundary</title><desc id="d">SFT, preference or reward training, and RLVR produce policy updates; a verifier checks only encoded conditions.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0F4D92"/></marker></defs><rect width="1200" height="590" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">How training signals shape a multi-step policy</text><g font-family="Arial" fill="#17324d"><rect x="55" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="85" y="160" font-size="24" font-weight="700" fill="#0F4D92">SFT</text><text x="85" y="200" font-size="16">Question, process, answer demo</text><path data-figure-connector="true" d="M205 235V275" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="95" y="300" width="220" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="205" y="334" text-anchor="middle" font-size="18">Learn patterns</text><text x="85" y="375" font-size="13">Does not ensure new strategies</text><rect x="450" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="480" y="160" font-size="24" font-weight="700" fill="#0F4D92">Preference or reward</text><text x="480" y="200" font-size="16">Candidates and comparison</text><path data-figure-connector="true" d="M600 235V275" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="300" width="220" height="55" rx="12" fill="#dcebf8" stroke="#3775BA"/><text x="600" y="334" text-anchor="middle" font-size="18">Shift preference</text><text x="480" y="375" font-size="13">Objective can miss human intent</text><rect x="845" y="115" width="300" height="285" rx="20" fill="#f4f8fc" stroke="#b9d1e8" stroke-width="2"/><text x="875" y="160" font-size="24" font-weight="700" fill="#0F4D92">RLVR</text><text x="875" y="200" font-size="16">Candidates and verified results</text><path data-figure-connector="true" d="M995 235V275" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"/><rect x="885" y="300" width="220" height="55" rx="12" fill="#fff4d8" stroke="#c58b23"/><text x="995" y="334" text-anchor="middle" font-size="18">Verifier outcome</text><text x="875" y="375" font-size="13">Only encoded conditions</text><path data-figure-connector="true" d="M205 425V465H600 M600 425V465 M995 425V465H600V485" stroke="#0F4D92" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="420" y="495" width="360" height="58" rx="14" fill="#e3f3e8" stroke="#438a62" stroke-width="2"/><text x="600" y="532" text-anchor="middle" font-size="21">Updated reasoning policy</text></g></svg>
