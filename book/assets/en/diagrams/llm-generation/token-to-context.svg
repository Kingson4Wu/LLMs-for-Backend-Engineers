<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">Text becomes contextual model representations</title><desc id="desc">Text becomes tokens and vocabulary IDs; an embedding lookup gives vectors, and positions plus model layers produce contextual representations.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="560" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Text, tokens, IDs, and vectors are distinct layers</text><text x="60" y="105" font-size="19" fill="#5E7F9C">An ID is an index; computable semantics comes from vectors plus position and contextual computation.</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="45" y="230" width="190" height="88" rx="23"/><rect x="620" y="230" width="210" height="88" rx="23"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="315" y="230" width="225" height="88" rx="23"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="910" y="230" width="260" height="88" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M235 274H305"/><path d="M540 274H610"/><path d="M830 274H900"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700"><text x="140" y="285" font-size="22" fill="#0F4D92">text: “check order”</text><text x="427" y="270" font-size="21" fill="#765800">tokens + IDs</text><text x="427" y="296" font-size="16" fill="#765800">Tokenizer: [31, 208]</text><text x="725" y="270" font-size="21" fill="#0F4D92">embedding lookup</text><text x="725" y="296" font-size="16" fill="#0F4D92">vectors e₃₁, e₂₀₈</text><text x="1040" y="270" font-size="21" fill="#B64342">position + model layers</text><text x="1040" y="296" font-size="16" fill="#B64342">contextual representation</text></g><path d="M110 395H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="445" font-family="Arial, sans-serif" font-size="20" fill="#765800" text-anchor="middle">IDs are indices; vectors and later context computation make meaning computable.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="856.0" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="1012.0" height="49.7"/><rect data-figure-safe-zone="text" x="128.0" y="251.0" width="241.4" height="53.7"/><rect data-figure-safe-zone="text" x="415.0" y="237.0" width="155.0" height="52.4"/><rect data-figure-safe-zone="text" x="415.0" y="268.0" width="190.4" height="45.6"/><rect data-figure-safe-zone="text" x="713.0" y="237.0" width="198.7" height="52.4"/><rect data-figure-safe-zone="text" x="713.0" y="268.0" width="165.4" height="45.6"/><rect data-figure-safe-zone="text" x="1028.0" y="237.0" width="275.2" height="52.4"/><rect data-figure-safe-zone="text" x="1028.0" y="268.0" width="232.0" height="45.6"/><rect data-figure-safe-zone="text" x="197.2" y="413.0" width="845.6" height="51.0"/></g></svg>
