<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Training compares known next-token targets in parallel</title><desc id="desc">A known sequence lets several positions predict the next token in parallel; causal masking still limits each position to its own prefix.</desc><rect width="1200" height="560" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D">Training: known targets make several positions parallel</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="75" y="140" width="180" height="65" rx="18"/><rect x="275" y="140" width="180" height="65" rx="18"/><rect x="475" y="140" width="180" height="65" rx="18"/><rect x="675" y="140" width="180" height="65" rx="18"/></g><g font-size="22" font-weight="700" fill="#0F4D92"><text x="165" y="181">I</text><text x="365" y="181">love</text><text x="565" y="181">coding</text><text x="765" y="181">EOS</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="75" y="300" width="220" height="75" rx="21"/><rect x="335" y="300" width="220" height="75" rx="21"/><rect x="595" y="300" width="220" height="75" rx="21"/></g><g font-size="20" font-weight="700" fill="#765800"><text x="185" y="345">I → love</text><text x="445" y="345">I love → coding</text><text x="705" y="345">I love coding → EOS</text></g></g><g stroke="#0F4D92" stroke-width="4"><path d="M165 205V285M365 205V285M565 205V285"/></g><text x="940" y="255" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F4D92">one forward pass</text><text x="940" y="288" font-family="Arial, sans-serif" font-size="18" fill="#5E7F9C">compares positions together</text><path d="M90 445H1110" stroke="#FFD700" stroke-width="3"/><text x="600" y="495" font-family="Arial, sans-serif" font-size="19" fill="#765800" text-anchor="middle">Causal masking lets each position read its prefix, never a future answer.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="939.2" height="67.2"/><rect data-figure-safe-zone="text" x="153.0" y="152.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="353.0" y="152.0" width="59.4" height="47.0"/><rect data-figure-safe-zone="text" x="553.0" y="152.0" width="77.0" height="47.0"/><rect data-figure-safe-zone="text" x="753.0" y="152.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="173.0" y="316.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="433.0" y="316.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="693.0" y="316.0" width="192.0" height="47.0"/><rect data-figure-safe-zone="text" x="928.0" y="221.0" width="207.0" height="53.7"/><rect data-figure-safe-zone="text" x="928.0" y="258.0" width="276.7" height="48.3"/><rect data-figure-safe-zone="text" x="227.4" y="464.0" width="745.2" height="49.7"/></g></svg>
