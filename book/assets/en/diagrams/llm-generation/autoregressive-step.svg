<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">An autoregressive next-token step</title>
  <desc id="desc">Existing input enters the Transformer. The last-position representation produces vocabulary logits; decoding selects one token, appends it, and changes the next condition.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1240" height="600" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">One generation step selects a token and changes the next condition</text>
    <text x="60" y="105" font-size="19" fill="#5E7F9C">Each step scores the vocabulary; its chosen token is appended, so the next step sees a different context.</text>
  </g>
  <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3">
    <rect x="40" y="240" width="190" height="88" rx="23"/>
    <rect x="610" y="240" width="210" height="88" rx="23"/>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="300" y="240" width="190" height="88" rx="23"/>
  </g>
  <g fill="#F6CFCB" stroke="#B64342" stroke-width="3">
    <rect x="890" y="240" width="245" height="88" rx="23"/>
  </g>
  <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
    <path d="M230 284H290"/>
    <path d="M490 284H600"/>
    <path d="M820 284H880"/>
  </g>
  <path d="M1012 328V410H25V230H135V232" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a)" data-figure-connector="true"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700">
    <text x="135" y="294" font-size="22" fill="#0F4D92">existing input</text>
    <text x="395" y="294" font-size="22" fill="#765800">Transformer</text>
    <text x="715" y="260" font-size="18" fill="#0F4D92">last-position</text>
    <text x="715" y="283" font-size="18" fill="#0F4D92">representation</text>
    <text x="715" y="307" font-size="16" fill="#0F4D92">output projection</text>
    <text x="1012" y="270" font-size="21" fill="#B64342">vocabulary logits</text>
    <text x="1012" y="296" font-size="16" fill="#B64342">decode one token</text>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="390" y="465" width="460" height="72" rx="22"/>
  </g>
  <text x="620" y="508" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#765800" text-anchor="middle">append token, then take the next step</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
    <rect data-figure-safe-zone="text" x="48.0" y="26.0" width="1122.2" height="67.2"/>
