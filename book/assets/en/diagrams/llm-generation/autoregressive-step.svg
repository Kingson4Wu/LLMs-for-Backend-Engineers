    <rect data-figure-safe-zone="text" x="123.0" y="260.0" width="184.2" height="53.7"/>
    <rect data-figure-safe-zone="text" x="383.0" y="260.0" width="149.8" height="53.7"/>
    <rect data-figure-safe-zone="text" x="703.0" y="237.0" width="329.8" height="52.4"/>
    <rect data-figure-safe-zone="text" x="703.0" y="268.0" width="165.4" height="45.6"/>
    <rect data-figure-safe-zone="text" x="1000.0" y="237.0" width="209.6" height="52.4"/>
    <rect data-figure-safe-zone="text" x="1000.0" y="268.0" width="157.1" height="45.6"/>
    <rect data-figure-safe-zone="text" x="406.0" y="475.0" width="428.0" height="52.4"/>
