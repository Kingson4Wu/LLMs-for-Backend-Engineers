<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc"><title id="title">Prefill processes known input; decode extends it one token at a time</title><desc id="desc">Prefill processes known A, B, C to predict D. D is selected and appended before decode can use it to predict E and repeat.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1240" height="590" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="60" y="70" font-size="32" font-weight="700" fill="#17324D">Prefill processes known input; decode extends the sequence</text><text x="60" y="105" font-size="19" fill="#5E7F9C">A selected token becomes the next input, so decode advances serially in time.</text></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="55" y="230" width="285" height="100" rx="23"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="440" y="230" width="245" height="100" rx="23"/><rect x="785" y="230" width="330" height="100" rx="23"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M340 280H430"/><path d="M685 280H775"/></g><g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700"><text x="197" y="267" font-size="22" fill="#765800">prefill: A, B, C</text><text x="197" y="295" font-size="16" fill="#765800">known context</text><text x="562" y="267" font-size="21" fill="#0F4D92">C predicts D</text><text x="562" y="295" font-size="16" fill="#0F4D92">select and append D</text><text x="950" y="267" font-size="21" fill="#0F4D92">decode: D predicts E</text><text x="950" y="295" font-size="16" fill="#0F4D92">then E predicts the next</text></g><path d="M110 400H1130" stroke="#FFD700" stroke-width="3"/><text x="620" y="455" font-family="Arial, sans-serif" font-size="19" fill="#765800" text-anchor="middle">D has no representation before selection; only then can it enter the next decode step.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="989.1" height="67.2"/><rect data-figure-safe-zone="text" x="48.0" y="74.0" width="784.8" height="49.7"/><rect data-figure-safe-zone="text" x="185.0" y="233.0" width="207.0" height="53.7"/><rect data-figure-safe-zone="text" x="185.0" y="267.0" width="132.2" height="45.6"/><rect data-figure-safe-zone="text" x="550.0" y="234.0" width="155.0" height="52.4"/><rect data-figure-safe-zone="text" x="550.0" y="267.0" width="182.1" height="45.6"/><rect data-figure-safe-zone="text" x="938.0" y="234.0" width="242.4" height="52.4"/><rect data-figure-safe-zone="text" x="938.0" y="267.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="183.2" y="424.0" width="873.7" height="49.7"/></g></svg>
