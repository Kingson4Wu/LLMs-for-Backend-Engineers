<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Interleaved multimodal representations enter one context</title><desc id="desc">Text tokens plus image, audio, and video representations are interleaved in input order, and a later question enters one Transformer context. Encoders can differ; later computation is what is unified.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Representations from different modalities can interleave in one turn’s context</text><text x="58" y="105" font-size="18" fill="#5E7F9C">Position and neighborhood in the sequence help the model compute how text, an image, and a question relate in the current turn.</text><path d="M85 270H1110" stroke="#CFCECE" stroke-width="7"/><g stroke-width="3"><rect x="85" y="210" width="165" height="120" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="285" y="210" width="185" height="120" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="505" y="210" width="185" height="120" rx="20" fill="#F6CFCB" stroke="#B64342"/><rect x="725" y="210" width="185" height="120" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="945" y="210" width="170" height="120" rx="20" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="167" y="258" font-size="21" font-weight="700" fill="#17324D">text tokens</text><text x="167" y="289" font-size="16" fill="#0F4D92">“look below”</text><text x="377" y="258" font-size="21" font-weight="700" fill="#765800">image features</text><text x="377" y="289" font-size="16" fill="#765800">many visual positions</text><text x="597" y="258" font-size="21" font-weight="700" fill="#B64342">audio features</text><text x="597" y="289" font-size="16" fill="#B64342">time-segment features</text><text x="817" y="258" font-size="21" font-weight="700" fill="#765800">video-frame features</text><text x="817" y="289" font-size="16" fill="#765800">spatiotemporal positions</text><text x="1030" y="258" font-size="21" font-weight="700" fill="#17324D">question tokens</text><text x="1030" y="289" font-size="16" fill="#0F4D92">“what happened?”</text></g><path d="M600 330V405" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="310" y="430" width="580" height="100" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><text x="600" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">one Transformer context</text><text x="600" y="503" text-anchor="middle" font-size="17" fill="#0F4D92">self-attention or cross-attention interfaces let current representations interact</text><text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">The later computation is unified; text, image, audio, and video need not start from one identical encoder.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1281.4" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1212.7" height="48.3"/><rect data-figure-safe-zone="text" x="155.0" y="225.0" width="144.1" height="52.4"/><rect data-figure-safe-zone="text" x="155.0" y="261.0" width="123.8" height="45.6"/><rect data-figure-safe-zone="text" x="365.0" y="225.0" width="176.9" height="52.4"/><rect data-figure-safe-zone="text" x="365.0" y="261.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="585.0" y="225.0" width="176.9" height="52.4"/><rect data-figure-safe-zone="text" x="585.0" y="261.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="805.0" y="225.0" width="242.4" height="52.4"/><rect data-figure-safe-zone="text" x="805.0" y="261.0" width="223.7" height="45.6"/><rect data-figure-safe-zone="text" x="1018.0" y="225.0" width="187.8" height="52.4"/><rect data-figure-safe-zone="text" x="1018.0" y="261.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="450.5" y="435.0" width="299.1" height="55.0"/><rect data-figure-safe-zone="text" x="230.0" y="474.0" width="740.0" height="47.0"/><rect data-figure-safe-zone="text" x="91.9" y="562.0" width="1016.2" height="48.3"/></g></svg>
