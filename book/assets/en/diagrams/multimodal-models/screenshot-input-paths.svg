<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Two paths from a screenshot into a model</title>
  <desc id="desc">A screenshot can be transcribed with OCR or represented visually for a multimodal model. The routes retain different evidence, and both require validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
    <style>text{font-family:Arial,sans-serif}.label{font-size:18px;fill:#0F4D92}.cardTitle{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:17px;fill:#456159}.small{font-size:16px;fill:#64766F}</style>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="68" y="70" font-size="32" font-weight="700" fill="#17324D">One screenshot, two input paths, different evidence boundaries</text>
  <text x="68" y="104" class="body">Choose the route by the evidence the task must preserve: transcription or direct visual understanding.</text>
  <rect x="68" y="146" width="220" height="338" rx="20" fill="#F4F8FC" stroke="#AAC0B6" stroke-width="2"/>
  <rect x="91" y="177" width="174" height="186" rx="12" fill="#17324D"/>
  <rect x="104" y="191" width="148" height="158" rx="8" fill="#EAF0ED"/>
  <path d="M119 318h118M119 291h84M119 264h102" stroke="#8BA89B" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 236c20-25 33 14 51-10s33 20 62-14" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <text x="178" y="405" text-anchor="middle" font-size="18" font-weight="700" fill="#17324D">monitoring screenshot</text>
  <text x="178" y="434" text-anchor="middle" class="small">curves &#xB7; colour &#xB7; layout &#xB7; text</text>
  <path d="M288 258H352M288 372H352" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)" data-figure-connector="true"/>
  <rect x="366" y="146" width="354" height="180" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/>
  <rect x="391" y="170" width="94" height="34" rx="17" fill="#FFF1B8"/>
  <text x="438" y="193" text-anchor="middle" class="label" fill="#765800">PATH A</text>
  <text x="391" y="239" class="cardTitle">Transcribe to text</text>
  <text x="391" y="271" class="body">OCR / image description &#x2192; text LLM</text>
  <text x="391" y="295" class="small">Produces a record that can be</text>
  <text x="391" y="315" class="small">cited and searched</text>
  <rect x="366" y="358" width="354" height="180" rx="20" fill="#EAF3FB" stroke="#88AD9B" stroke-width="2"/>
  <rect x="391" y="382" width="94" height="34" rx="17" fill="#CCE2D3"/>
  <text x="438" y="405" text-anchor="middle" class="label">PATH B</text>
  <text x="391" y="451" class="cardTitle">Keep visual features</text>
  <text x="391" y="483" class="body">Visual encoder &#x2192; multimodal model</text>
  <text x="391" y="507" class="small">Lets later computation see</text>
  <text x="391" y="527" class="small">layout and visual relations</text>
  <path d="M720 236H792M720 448H792" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#arrow)" data-figure-connector="true"/>
  <rect x="806" y="206" width="326" height="278" rx="22" fill="#17324D"/>
  <text x="969" y="251" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Reason with the question</text>
  <rect x="838" y="278" width="262" height="63" rx="12" fill="#0F4D92"/>
  <text x="969" y="306" text-anchor="middle" font-size="18" fill="#FFFFFF">text evidence or visual features</text>
  <text x="969" y="329" text-anchor="middle" font-size="16" fill="#CFCECE">combined with the user's question</text>
  <path d="M969 350v31" fill="none" stroke="#CFCECE" stroke-width="3" marker-end="url(#arrow)" data-figure-connector="true"/>
  <rect x="838" y="395" width="262" height="53" rx="12" fill="#F6CFCB"/>
  <text x="969" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#8F3635">answer + needed checks</text>
  <rect x="68" y="582" width="1064" height="55" rx="14" fill="#F6CFCB"/>
  <circle cx="101" cy="610" r="12" fill="#B64342"/>
  <text x="101" y="616" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">!</text>
  <text x="130" y="616" font-size="17" fill="#8F3635">OCR is auditable but can lose curves, colour, and spatial relations. Direct vision retains more, not guaranteed recognition.</text>
