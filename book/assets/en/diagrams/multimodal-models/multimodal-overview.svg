<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Multimodal inputs fuse in a shared context</title><desc id="desc">Text, images, audio, and video each pass through suitable encoders or projections into a shared Transformer context, then applicable heads or decoders produce output modalities.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Multimodal: encode separately, fuse in one computational context</text><text x="58" y="105" font-size="18" fill="#5E7F9C">Each modality becomes a representation the model can consume; accepting input</text><text x="58" y="129" font-size="18" fill="#5E7F9C">does not imply generating that modality or fully understanding reality.</text><g stroke-width="3"><rect x="55" y="165" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="260" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="355" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="55" y="450" width="190" height="74" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="325" y="165" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="260" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="355" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="325" y="450" width="205" height="74" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="610" y="245" width="250" height="190" rx="28" fill="#EAF3FB" stroke="#0F4D92" stroke-width="4"/></g><g text-anchor="middle"><text x="150" y="210" font-size="21" font-weight="700" fill="#17324D">text</text><text x="150" y="305" font-size="21" font-weight="700" fill="#17324D">image</text><text x="150" y="400" font-size="21" font-weight="700" fill="#17324D">audio</text><text x="150" y="495" font-size="21" font-weight="700" fill="#17324D">video</text><text x="427" y="210" font-size="18" fill="#765800">tokenizer / embedding</text><text x="427" y="285" font-size="17" fill="#765800">vision encoder</text><text x="427" y="322" font-size="17" fill="#765800">+ projection</text><text x="427" y="380" font-size="17" fill="#765800">audio encoder</text><text x="427" y="417" font-size="17" fill="#765800">+ projection</text><text x="427" y="475" font-size="17" fill="#765800">video encoder</text><text x="427" y="512" font-size="17" fill="#765800">+ projection</text><text x="735" y="310" font-size="25" font-weight="700" fill="#17324D">core Transformer</text><text x="735" y="342" font-size="17" fill="#0F4D92">interleaved representations</text><text x="735" y="370" font-size="17" fill="#0F4D92">share one context</text></g><g fill="none" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"><path d="M245 202H315"/><path d="M245 297H315"/><path d="M245 392H315"/><path d="M245 487H315"/><path d="M530 202H570V290H600"/><path d="M530 297H600"/><path d="M530 392H570V390H600"/><path d="M530 487H570V410H600"/><path d="M870 330H905"/></g><g stroke-width="3" fill="#F6CFCB"><rect x="910" y="190" width="230" height="74" rx="18" stroke="#B64342"/><rect x="910" y="290" width="230" height="74" rx="18" stroke="#B64342"/><rect x="910" y="380" width="230" height="100" rx="18" stroke="#B64342"/></g><g text-anchor="middle"><text x="1025" y="236" font-size="20" font-weight="700" fill="#B64342">text tokens → text</text><text x="1025" y="326" font-size="18" font-weight="700" fill="#B64342">audio tokens / decoder</text><text x="1025" y="350" font-size="18" font-weight="700" fill="#B64342">→ sound</text><text x="1025" y="414" font-size="17" font-weight="700" fill="#B64342">image / video</text><text x="1025" y="438" font-size="17" font-weight="700" fill="#B64342">representation</text><text x="1025" y="462" font-size="17" font-weight="700" fill="#B64342">+ decoder</text></g><text x="600" y="585" text-anchor="middle" font-size="18" fill="#5E7F9C">Modules are responsibility boundaries: a product’s modalities, encoders, projectors, and output capabilities vary.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1055.7" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="744.7" height="48.3"/><rect data-figure-safe-zone="text" x="46.0" y="99.0" width="688.6" height="48.3"/><rect data-figure-safe-zone="text" x="138.0" y="177.0" width="67.7" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="272.0" width="78.6" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="367.0" width="78.6" height="52.4"/><rect data-figure-safe-zone="text" x="138.0" y="462.0" width="78.6" height="52.4"/><rect data-figure-safe-zone="text" x="415.0" y="180.0" width="220.6" height="48.3"/><rect data-figure-safe-zone="text" x="415.0" y="256.0" width="147.8" height="47.0"/><rect data-figure-safe-zone="text" x="415.0" y="293.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="415.0" y="351.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="415.0" y="388.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="415.0" y="446.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="415.0" y="483.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="723.0" y="273.0" width="232.0" height="57.8"/><rect data-figure-safe-zone="text" x="723.0" y="313.0" width="262.7" height="47.0"/><rect data-figure-safe-zone="text" x="723.0" y="341.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="1013.0" y="204.0" width="211.2" height="51.0"/><rect data-figure-safe-zone="text" x="1013.0" y="296.0" width="229.9" height="48.3"/><rect data-figure-safe-zone="text" x="1013.0" y="320.0" width="89.5" height="48.3"/><rect data-figure-safe-zone="text" x="1013.0" y="385.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="1013.0" y="409.0" width="147.8" height="47.0"/><rect data-figure-safe-zone="text" x="1013.0" y="433.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="54.5" y="555.0" width="1091.0" height="48.3"/></g></svg>
