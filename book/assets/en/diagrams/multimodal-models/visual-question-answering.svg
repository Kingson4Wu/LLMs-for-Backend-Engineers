<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Visual question answering puts image evidence and the question in one context</title><desc id="desc">A screenshot becomes visual features and the question becomes text features. A Transformer computes over both before generating an answer token by token.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#506960}.s{font-size:16px;fill:#687972}</style></defs><rect width="1200" height="650" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">Visual Q&amp;A: image evidence and the question meet in one context</text><text x="65" y="103" class="b">The model does not first understand an image in isolation; generation uses visual features and the question together.</text><rect x="65" y="155" width="260" height="160" rx="20" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="93" y="197" class="h">Visual input</text><rect x="93" y="218" width="84" height="60" rx="8" fill="#17324D"/><path d="M105 263l18-18 13 11 20-24 12 31" fill="none" stroke="#E4B76E" stroke-width="5"/><path d="M198 230h91m-91 18h70m-70 18h81" stroke="#94AA9F" stroke-width="7" stroke-linecap="round"/><text x="93" y="299" class="s">screenshot → patches → features</text><rect x="65" y="375" width="260" height="160" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="93" y="417" class="h">Question text</text><rect x="93" y="438" width="48" height="35" rx="8" fill="#FFF1B8"/><rect x="150" y="438" width="61" height="35" rx="8" fill="#FFF1B8"/><rect x="220" y="438" width="74" height="35" rx="8" fill="#FFF1B8"/><text x="93" y="519" class="s">question → tokens → text features</text><path d="M325 235h110M325 455h110" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/><rect x="450" y="190" width="395" height="310" rx="25" fill="#17324D"/><text x="647" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Shared Transformer context</text><rect x="483" y="273" width="329" height="58" rx="12" fill="#0F4D92"/><text x="647" y="309" text-anchor="middle" font-size="18" fill="#FFFFFF">visual tokens  +  question tokens</text><path d="M647 342v42" stroke="#CFCECE" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="483" y="398" width="329" height="64" rx="12" fill="#2C5149"/><text x="647" y="426" text-anchor="middle" font-size="18" fill="#FFFFFF">attention over the context</text><text x="647" y="449" text-anchor="middle" font-size="16" fill="#CFCECE">which image evidence supports this question?</text><path d="M845 345h112" stroke="#0F4D92" stroke-width="4" fill="none" marker-end="url(#a)" data-figure-connector="true"/><rect x="972" y="264" width="162" height="162" rx="20" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/><text x="1053" y="309" text-anchor="middle" class="h">Text output</text><text x="1053" y="342" text-anchor="middle" class="b">token by token</text><path d="M1006 370h94" stroke="#E9A6A1" stroke-width="7" stroke-linecap="round"/><path d="M1006 390h63" stroke="#E9A6A1" stroke-width="7" stroke-linecap="round"/><rect x="65" y="570" width="1069" height="48" rx="14" fill="#F6CFCB"/><text x="92" y="601" font-size="17" fill="#8F3635">Visual encoders supply clues, not facts. Small legends, occlusion, and timelines can still be misread; verify critical claims against evidence.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="1072.3" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="1058.3" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="163.0" width="161.3" height="53.7"/><rect data-figure-safe-zone="text" x="81.0" y="270.0" width="298.0" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="383.0" width="172.7" height="53.7"/><rect data-figure-safe-zone="text" x="81.0" y="490.0" width="315.7" height="47.0"/><rect data-figure-safe-zone="text" x="472.8" y="204.0" width="348.5" height="56.4"/><rect data-figure-safe-zone="text" x="480.6" y="279.0" width="332.9" height="48.3"/><rect data-figure-safe-zone="text" x="513.3" y="396.0" width="267.4" height="48.3"/><rect data-figure-safe-zone="text" x="452.0" y="421.0" width="390.1" height="45.6"/><rect data-figure-safe-zone="text" x="978.1" y="275.0" width="149.8" height="53.7"/><rect data-figure-safe-zone="text" x="979.1" y="313.0" width="147.8" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="572.0" width="1288.1" height="47.0"/></g></svg>
