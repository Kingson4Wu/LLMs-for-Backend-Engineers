<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">A branching computational graph</title><desc id="desc">Input x becomes h1, branches to h2 and h3, then merges at y before loss L; backward gradients from both branches accumulate at h1.</desc><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#3775BA"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#B64342"/></marker></defs><rect width="1200" height="520" rx="30" fill="#FFFFFF"/><text x="66" y="67" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17324D">Forward values and backward gradient accumulation</text><text x="66" y="100" font-family="Arial,sans-serif" font-size="18" fill="#5E7F9C">Solid arrows carry values; dashed red arrows carry gradients. Backward signals add at a branch.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="60" y="230" width="120" height="68" rx="17" fill="#EEF0EF" stroke="#3775BA"/><rect x="64" y="234" width="112" height="60" rx="15" fill="none" stroke="#A7C4BA"/><rect x="270" y="230" width="180" height="68" rx="17" fill="#DDF3DE" stroke="#3775BA"/><rect x="274" y="234" width="172" height="60" rx="15" fill="none" stroke="#AADCA9"/><rect x="560" y="125" width="190" height="68" rx="17" fill="#FFF8D6" stroke="#FFD700"/><rect x="560" y="335" width="190" height="68" rx="17" fill="#FFF8D6" stroke="#FFD700"/><rect x="850" y="230" width="190" height="68" rx="17" fill="#F6CFCB" stroke="#B64342"/><rect x="1080" y="230" width="72" height="68" rx="17" fill="#17324D" stroke="#17324D"/></g><text x="120" y="272" font-size="28" font-weight="700" fill="#17324D">x</text><text x="360" y="269" font-size="24" font-weight="700" fill="#17324D">h₁ = w₁x</text><text x="360" y="289" font-size="15" fill="#5E7F9C">branch point</text><text x="655" y="167" font-size="23" font-weight="700" fill="#765800">h₂ = w₂h₁</text><text x="655" y="377" font-size="23" font-weight="700" fill="#765800">h₃ = w₃h₁</text><text x="945" y="272" font-size="23" font-weight="700" fill="#8F3635">y = h₂ + h₃</text><text x="1116" y="272" font-size="28" font-weight="700" fill="#FFFFFF">L</text></g><g fill="none" stroke="#3775BA" stroke-width="4" marker-end="url(#f)"><path d="M181 264H260"/><path d="M451 246C500 225 510 170 550 160"/><path d="M451 282C500 303 510 358 550 368"/><path d="M751 160C800 165 810 230 840 248"/><path d="M751 368C800 363 810 298 840 280"/><path d="M1041 264H1070"/></g><g fill="none" stroke="#B64342" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#b)"><path d="M840 241C800 220 790 179 751 173"/><path d="M840 287C800 308 790 349 751 355"/><path d="M550 173C500 192 490 238 451 249"/><path d="M550 355C500 336 490 290 451 279"/></g><rect x="270" y="443" width="620" height="58" rx="16" fill="#FDE9E7"/><text x="600" y="486" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="700" fill="#B64342">∂L/∂h₁ = (∂L/∂h₂)w₂ + (∂L/∂h₃)w₃</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="54.0" y="24.0" width="813.9" height="65.8"/><rect data-figure-safe-zone="text" x="54.0" y="70.0" width="913.2" height="48.3"/><rect data-figure-safe-zone="text" x="108.0" y="232.0" width="40.0" height="61.8"/><rect data-figure-safe-zone="text" x="348.0" y="233.0" width="123.8" height="56.4"/><rect data-figure-safe-zone="text" x="348.0" y="262.0" width="117.6" height="44.2"/><rect data-figure-safe-zone="text" x="643.0" y="132.0" width="131.6" height="55.0"/><rect data-figure-safe-zone="text" x="643.0" y="342.0" width="131.6" height="55.0"/><rect data-figure-safe-zone="text" x="933.0" y="237.0" width="155.6" height="55.0"/><rect data-figure-safe-zone="text" x="1104.0" y="232.0" width="40.0" height="61.8"/><rect data-figure-safe-zone="text" x="413.3" y="453.0" width="373.4" height="52.4"/></g></svg>
