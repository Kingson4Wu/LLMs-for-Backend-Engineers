    <rect data-figure-safe-zone="text" x="588.0" y="321.0" width="545.6" height="47.0"/>
    <rect data-figure-safe-zone="text" x="588.0" y="399.0" width="885.1" height="55.0"/>
    <rect data-figure-safe-zone="text" x="588.0" y="436.0" width="634.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="588.0" y="516.0" width="710.4" height="51.0"/>
    <rect data-figure-safe-zone="text" x="588.0" y="582.0" width="1081.7" height="48.3"/>
  </g>
