<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation iteration loop from failure to regression suite</title>
  <desc id="desc">Representative tasks run and generate traces; teams attribute failures, improve the system, add failure patterns to a regression suite, and evaluate again to prevent regressions.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Useful evaluation turns observed failures into durable regression checks</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">A score is an entry point; trace reading, failure attribution, and verified repair make the system improve over time.</text>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)">
      <path d="M250 255H305"/>
      <path d="M500 255H555"/>
      <path d="M750 255H805"/>
      <path d="M1000 255V400H150V335"/>
    </g>
    <g stroke-width="3">
      <rect x="55" y="175" width="195" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
      <rect x="305" y="175" width="195" height="160" rx="22" fill="#FFF8D6" stroke="#FFD700"/>
      <rect x="555" y="175" width="195" height="160" rx="22" fill="#F6CFCB" stroke="#B64342"/>
      <rect x="805" y="175" width="195" height="160" rx="22" fill="#EAF3FB" stroke="#0F4D92"/>
    </g>
    <g text-anchor="middle">
      <text x="152" y="227" font-size="22" font-weight="700" fill="#17324D">run cases</text>
      <text x="152" y="261" font-size="16" fill="#0F4D92">representative tasks</text>
      <text x="152" y="287" font-size="16" fill="#0F4D92">under real constraints</text>
      <text x="402" y="227" font-size="22" font-weight="700" fill="#765800">read traces</text>
      <text x="402" y="261" font-size="16" fill="#765800">model steps, tool results,</text>
      <text x="402" y="287" font-size="16" fill="#765800">environment and state changes</text>
      <text x="652" y="227" font-size="22" font-weight="700" fill="#B64342">attribute failure</text>
      <text x="652" y="261" font-size="16" fill="#B64342">model, prompt, tool, data,</text>
      <text x="652" y="287" font-size="16" fill="#B64342">environment, or policy</text>
      <text x="902" y="227" font-size="22" font-weight="700" fill="#17324D">improve system</text>
      <text x="902" y="261" font-size="16" fill="#0F4D92">repair contract, tools,</text>
      <text x="902" y="287" font-size="16" fill="#0F4D92">flow, or resource setup</text>
    </g>
    <rect x="300" y="415" width="600" height="120" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="462" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">Add a regression case and evaluate again</text>
    <text x="600" y="490" text-anchor="middle" font-size="16" fill="#765800">Check that the repair works and that a new change</text>
    <text x="600" y="513" text-anchor="middle" font-size="16" fill="#765800">did not degrade known capabilities.</text>
    <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Only structured failure patterns prevent the same issue from being rediscovered after each later change.</text>
  </g>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
