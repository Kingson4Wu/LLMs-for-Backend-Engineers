    <rect data-figure-safe-zone="text" x="890.0" y="193.0" width="184.2" height="53.7"/>
    <rect data-figure-safe-zone="text" x="890.0" y="233.0" width="215.4" height="45.6"/>
    <rect data-figure-safe-zone="text" x="890.0" y="259.0" width="215.4" height="45.6"/>
