<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">An LLM system connects training, context, action, and serving</title><desc id="desc">Training produces parameters. A request assembles context, the model generates a proposal, an application validates or executes it, and serving delivers each model call.</desc><rect width="1040" height="480" rx="28" fill="#FFFFFF"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="520" y="52" font-size="28" font-weight="700" fill="#17324D">An LLM system connects training, context, action, and serving</text><g font-size="18" fill="#17324D"><rect x="55" y="105" width="200" height="74" rx="15" fill="#F4F8FC" stroke="#3775BA" stroke-width="2"/><text x="155" y="136" font-weight="700">training material</text><text x="155" y="161">+ learning objective</text><rect x="55" y="235" width="200" height="100" rx="15" fill="#DDF3DE" stroke="#3775BA" stroke-width="2"/><text x="155" y="260" font-weight="700">trained parameters</text><text x="155" y="285">patterns learned</text><text x="155" y="310">over time</text><rect x="330" y="235" width="200" height="74" rx="15" fill="#FFF8D6" stroke="#FFD700" stroke-width="2"/><text x="430" y="266" font-weight="700">current context</text><text x="430" y="291">request + evidence</text><rect x="605" y="235" width="200" height="74" rx="15" fill="#F6CFCB" stroke="#B64342" stroke-width="2"/><text x="705" y="266" font-weight="700">model proposal</text><text x="705" y="291">answer or tool call</text><rect x="880" y="235" width="110" height="74" rx="15" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="935" y="266" font-weight="700">action</text><text x="935" y="291">+ result</text></g><path d="M155 179V225M255 272H320M530 272H595M805 272H870" fill="none" stroke="#3775BA" stroke-width="3"/><rect x="155" y="365" width="730" height="54" rx="15" fill="#F7FAF8" stroke="#8EB6D8" stroke-width="2"/><text x="520" y="399" font-size="18" fill="#5E7F9C">Serving runtime schedules each model call, retains KV cache, and returns output.</text><path d="M520 309V355" stroke="#3775BA" stroke-width="3"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="508.0" y="12.0" width="912.2" height="61.8"/><rect data-figure-safe-zone="text" x="143.0" y="107.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="143.0" y="132.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="143.0" y="231.0" width="183.1" height="47.0"/><rect data-figure-safe-zone="text" x="143.0" y="256.0" width="165.4" height="47.0"/><rect data-figure-safe-zone="text" x="143.0" y="281.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="418.0" y="237.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="418.0" y="262.0" width="183.1" height="47.0"/><rect data-figure-safe-zone="text" x="693.0" y="237.0" width="147.8" height="47.0"/><rect data-figure-safe-zone="text" x="693.0" y="262.0" width="192.0" height="47.0"/><rect data-figure-safe-zone="text" x="923.0" y="237.0" width="77.0" height="47.0"/><rect data-figure-safe-zone="text" x="923.0" y="262.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="508.0" y="369.0" width="772.8" height="48.3"/></g></svg>
