<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A Discovery Loop from Existing to New Knowledge</title>
  <desc id="desc">Three kinds of unknown: missing data answer, human unknown, and unformed question;A loop from knowledge through hypotheses, experiments, data, verification, and new knowledge.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1f7a57"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">Unknowns have different depths</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">Existing knowledge can yield new results through reasoning, search, experiments, and feedback</text>

  <text x="70" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#173f63">Three kinds of unknown</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="70" y="182" width="390" height="112" rx="14" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>
    <circle cx="112" cy="238" r="23" fill="#e8f0f5"/><text x="112" y="246" text-anchor="middle" font-size="22" font-weight="700" fill="#173f63">1</text>
    <text x="155" y="226" font-size="19" font-weight="700" fill="#173f63">No answer in training data</text>
    <text x="155" y="261" font-size="18" fill="#6f7f8d">May still be derived</text>

    <rect x="70" y="314" width="390" height="112" rx="14" fill="#fffdf8" stroke="#6c91ad" stroke-width="1.5"/>
    <circle cx="112" cy="370" r="23" fill="#dce9f1"/><text x="112" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#173f63">2</text>
    <text x="155" y="358" font-size="23" font-weight="700" fill="#173f63">People do not yet know</text>
    <text x="155" y="393" font-size="18" fill="#6f7f8d">Theory and tools exist</text>

    <rect x="70" y="446" width="390" height="112" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.5"/>
    <circle cx="112" cy="502" r="23" fill="#d2e2ed"/><text x="112" y="510" text-anchor="middle" font-size="22" font-weight="700" fill="#173f63">3</text>
    <text x="155" y="490" font-size="20" font-weight="700" fill="#173f63">No question or concepts yet</text>
    <text x="155" y="525" font-size="18" fill="#6f7f8d">A deeper unknown</text>
  </g>

  <text x="530" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#173f63">Knowledge-discovery loop</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="718" y="172" width="190" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="813" y="214" fill="#1f7a57">Existing knowledge</text>
    <rect x="952" y="254" width="180" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="1042" y="296" fill="#1f7a57">Propose hypothesis</text>
    <rect x="952" y="390" width="180" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="1042" y="432" fill="#1f7a57">Design experiment</text>
    <rect x="718" y="482" width="190" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="813" y="524" fill="#1f7a57">Obtain new data</text>
    <rect x="510" y="390" width="180" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="600" y="432" fill="#1f7a57">Analyse and verify</text>
    <rect x="510" y="254" width="180" height="66" rx="12" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="600" y="296" fill="#1f7a57">Form new knowledge</text>
  </g>
  <g fill="none" stroke="#1f7a57" stroke-width="2.5" marker-end="url(#arrow-green)">
    <path d="M904 212C944 218 973 232 997 253"/>
    <path d="M1042 321V380"/>
    <path d="M998 458C970 486 943 502 916 510"/>
    <path d="M710 515C666 503 637 486 614 458"/>
    <path d="M600 389V331"/>
    <path d="M692 278C720 248 745 233 766 235"/>
  </g>
  <circle cx="813" cy="360" r="76" fill="#f1f6f2" stroke="#b7d4c5" stroke-width="1.5"/>
  <text x="813" y="351" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#173f63">Reasoning · search</text>
  <text x="813" y="385" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#173f63">Experiment · feedback</text>

  <rect x="470" y="596" width="662" height="54" rx="27" fill="#f3e8e4"/>
  <text x="801" y="630" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#9a3b2f">New result needs independent verification</text>
</svg>
