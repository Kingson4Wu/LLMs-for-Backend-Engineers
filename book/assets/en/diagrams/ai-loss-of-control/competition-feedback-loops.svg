<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Feedback Loops in Authority and Competition</title>
  <desc id="desc">Upper loop: capability, authority, completed work, reliance, and competitive pressure reinforce one another;Lower loop: capability can improve discovery of unsafe paths.Locally reasonable choices can accumulate into system risk.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1f7a57"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9a3b2f"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="70" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#173f63">Locally sound, globally unsafe</text>
  <text x="70" y="108" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">Efficiency and competition can reinforce without anyone seeking loss of control</text>

  <rect x="58" y="136" width="1084" height="470" rx="22" fill="#fffdf8" stroke="#89a6bd" stroke-width="1.5"/>

  <text x="90" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1f7a57">Efficiency and reliance loop</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#173f63">
    <rect x="88" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="178" y="270">Capability improves</text>
    <rect x="296" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="386" y="258">Grant more authority</text><text x="386" y="283">Authority</text>
    <rect x="504" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="594" y="258">Complete more tasks</text><text x="594" y="283">Tasks</text>
    <rect x="712" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="802" y="270">Reliance grows</text>
    <rect x="920" y="226" width="180" height="74" rx="13" fill="#fffdf8" stroke="#1f7a57" stroke-width="2"/><text x="1010" y="270">Competitive pressure</text>
  </g>
  <g fill="none" stroke="#1f7a57" stroke-width="2.5" marker-end="url(#arrow-green)">
    <path d="M268 263H286"/><path d="M476 263H494"/><path d="M684 263H702"/><path d="M892 263H910"/>
    <path d="M1010 220C995 136 206 136 178 216"/>
  </g>

  <line x1="88" y1="344" x2="1110" y2="344" stroke="#d9e2e8" stroke-width="1.5"/>
  <text x="90" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#9a3b2f">Safety-boundary loop</text>
  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#173f63">
    <rect x="88" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="193" y="470">Capability improves</text>
    <rect x="356" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="461" y="456">Discover more</text><text x="461" y="482">Paths</text>
    <rect x="624" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="729" y="456">Extend existing</text><text x="729" y="482">boundaries</text>
    <rect x="892" y="424" width="210" height="78" rx="13" fill="#fffdf8" stroke="#9a3b2f" stroke-width="2"/><text x="997" y="456">Action space</text><text x="997" y="482">expands further</text>
  </g>
  <g fill="none" stroke="#9a3b2f" stroke-width="2.5" marker-end="url(#arrow-red)">
    <path d="M298 463H346"/><path d="M566 463H614"/><path d="M834 463H882"/>
  </g>
  <path d="M997 414C960 350 684 344 612 312" fill="none" stroke="#9a3b2f" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="871" y="376" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#9a3b2f">Extra action space strengthens task capability</text>

  <rect x="258" y="540" width="684" height="46" rx="23" fill="#f3e8e4"/>
  <text x="600" y="570" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#9a3b2f">Each step may be reasonable; risk can still accumulate</text>
  <text x="600" y="644" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#6f7f8d">For long-running tool-using agents, authority is not a static setting</text>
</svg>
