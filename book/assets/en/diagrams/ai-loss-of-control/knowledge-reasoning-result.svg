<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge can yield new results through reasoning, search, and computation</title>
  <desc id="desc">Knowledge, reasoning, search, and computation can solve beyond ready-made answers;A new result is not necessarily correct.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#173f63"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#fbf7ef"/>
  <text x="70" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#173f63">Training data is not the knowledge boundary</text>
  <text x="70" y="106" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#6f7f8d">Models and tools can continue solving from available information</text>

  <g font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="70" y="162" width="170" height="112" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.7"/>
    <text x="155" y="211" font-size="23" font-weight="700" fill="#173f63">Knowledge</text>
    <text x="155" y="246" font-size="17" fill="#6f7f8d">Rules · structure</text>

    <text x="265" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#89a6bd">+</text>
    <rect x="290" y="162" width="150" height="112" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.7"/>
    <text x="365" y="211" font-size="25" font-weight="700" fill="#173f63">Reason</text>
    <text x="365" y="246" font-size="17" fill="#6f7f8d">Combine and derive</text>

    <text x="465" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#89a6bd">+</text>
    <rect x="490" y="162" width="150" height="112" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.7"/>
    <text x="565" y="211" font-size="25" font-weight="700" fill="#173f63">Search</text>
    <text x="565" y="246" font-size="17" fill="#6f7f8d">Explore paths</text>

    <text x="665" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#89a6bd">+</text>
    <rect x="690" y="162" width="150" height="112" rx="14" fill="#fffdf8" stroke="#173f63" stroke-width="1.7"/>
    <text x="765" y="211" font-size="25" font-weight="700" fill="#173f63">Compute</text>
    <text x="765" y="246" font-size="17" fill="#6f7f8d">Execute and solve</text>
  </g>

  <line x1="868" y1="218" x2="928" y2="218" stroke="#173f63" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="950" y="148" width="200" height="140" rx="18" fill="#eef5f1" stroke="#1f7a57" stroke-width="2"/>
  <text x="1050" y="194" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#1f7a57">in training data</text>
  <text x="1050" y="228" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#1f7a57">not directly present</text>
  <text x="1050" y="262" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#173f63">New result</text>

  <rect x="316" y="326" width="568" height="50" rx="25" fill="#f3e8e4"/>
  <text x="600" y="359" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#9a3b2f">New result ≠ verified result</text>
</svg>
