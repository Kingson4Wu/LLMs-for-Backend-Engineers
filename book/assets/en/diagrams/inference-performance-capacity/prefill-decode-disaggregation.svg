<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Disaggregated prefill and Decode resource pools</title>
  <desc id="desc">A request builds key-value state in a prefill pool, then transfers it to a Decode pool for token output. Separate pools tune resources independently but state transfer and coordination are real costs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Split pools by phase: exchange state for independent capacity tuning</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">Long-input processing and token-by-token output have different compute, memory, and scheduling shapes.</text>
    <text x="58" y="129" font-size="18" fill="#5E7F9C">They can therefore use distinct serving pools.</text>
    <rect x="85" y="190" width="230" height="170" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/>
    <rect x="410" y="165" width="270" height="220" rx="24" fill="#FFF8D6" stroke="#FFD700" stroke-width="3"/>
    <rect x="795" y="165" width="270" height="220" rx="24" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/>
    <g fill="none" stroke="#0F4D92" stroke-width="5" marker-end="url(#a)">
      <path d="M315 275H395"/>
      <path d="M680 275H780"/>
    </g>
    <g text-anchor="middle">
      <text x="200" y="250" font-size="23" font-weight="700" fill="#17324D">request router</text>
      <text x="200" y="285" font-size="17" fill="#0F4D92">long-context input</text>
      <text x="200" y="311" font-size="17" fill="#0F4D92">selects a suitable pool</text>
      <text x="545" y="231" font-size="25" font-weight="700" fill="#765800">prefill pool</text>
      <text x="545" y="269" font-size="18" fill="#765800">read input; compute prefix</text>
      <text x="545" y="298" font-size="18" fill="#765800">build K/V inference state</text>
      <text x="930" y="231" font-size="25" font-weight="700" fill="#17324D">Decode pool</text>
      <text x="930" y="269" font-size="18" fill="#0F4D92">receive K/V state</text>
      <text x="930" y="298" font-size="18" fill="#0F4D92">stream tokens step by step</text>
    </g>
    <rect x="695" y="235" width="85" height="80" rx="15" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/>
    <text x="737" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#B64342">K/V</text>
    <text x="737" y="290" text-anchor="middle" font-size="15" fill="#B64342">handoff</text>
    <rect x="210" y="450" width="780" height="92" rx="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="486" text-anchor="middle" font-size="21" font-weight="700" fill="#765800">Gain: scale prefill and Decode around their own bottlenecks</text>
    <text x="600" y="518" text-anchor="middle" font-size="17" fill="#765800">Cost: manage routing, K/V transfer, consistency, recovery, and end-to-end latency.</text>
    <text x="600" y="592" text-anchor="middle" font-size="18" fill="#5E7F9C">Disaggregation is a systems choice; it does not remove all attention-state reads or inference cost.</text>
  </g>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
