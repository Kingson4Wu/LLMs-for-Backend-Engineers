    <rect data-figure-safe-zone="text" x="533.0" y="268.0" width="258.0" height="48.3"/>
    <rect data-figure-safe-zone="text" x="918.0" y="194.0" width="167.0" height="57.8"/>
    <rect data-figure-safe-zone="text" x="918.0" y="239.0" width="183.1" height="48.3"/>
