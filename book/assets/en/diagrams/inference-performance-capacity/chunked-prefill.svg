<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Scheduling difference between full and chunked prefill</title><desc id="desc">A full long prefill creates one long pause for existing Decode requests. Chunked prefill splits input work into bounded pieces and interleaves them with Decode, improving output cadence without eliminating total work.</desc><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Chunked prefill reshapes waiting; it does not make total work disappear</text><text x="58" y="105" font-size="18" fill="#5E7F9C">It is a scheduling strategy: divide long input work into bounded units and interleave it with requests already generating.</text><text x="75" y="195" font-size="23" font-weight="700" fill="#B64342">full long prefill: existing Decode sees one long pause</text><path d="M100 260H1090" stroke="#CFCECE" stroke-width="6"/><rect x="155" y="220" width="170" height="80" rx="18" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><rect x="325" y="220" width="520" height="80" rx="18" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><rect x="845" y="220" width="170" height="80" rx="18" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/><g text-anchor="middle"><text x="240" y="268" font-size="20" font-weight="700" fill="#17324D">Decode</text><text x="585" y="257" font-size="21" font-weight="700" fill="#B64342">full long prefill</text><text x="585" y="282" font-size="16" fill="#B64342">occupies the scheduling window</text><text x="930" y="268" font-size="20" font-weight="700" fill="#17324D">Decode</text></g><text x="75" y="390" font-size="23" font-weight="700" fill="#17324D">chunked interleaving: each Decode gap is bounded by a smaller work unit</text><path d="M100 455H1090" stroke="#CFCECE" stroke-width="6"/><g stroke-width="3"><rect x="155" y="415" width="130" height="80" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="285" y="415" width="160" height="80" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="445" y="415" width="130" height="80" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="575" y="415" width="160" height="80" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="735" y="415" width="130" height="80" rx="18" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="220" y="463" font-size="19" font-weight="700" fill="#17324D">Decode</text><text x="365" y="463" font-size="18" font-weight="700" fill="#765800">prefill chunk</text><text x="510" y="463" font-size="19" font-weight="700" fill="#17324D">Decode</text><text x="655" y="463" font-size="18" font-weight="700" fill="#765800">prefill chunk</text><text x="800" y="463" font-size="19" font-weight="700" fill="#17324D">Decode</text></g><rect x="185" y="545" width="830" height="54" rx="16" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="600" y="580" text-anchor="middle" font-size="18" fill="#765800">Choose block size by balancing cadence, scheduling overhead, memory, fairness, and total throughput.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1168.5" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1165.9" height="48.3"/><rect data-figure-safe-zone="text" x="63.0" y="160.0" width="669.8" height="55.0"/><rect data-figure-safe-zone="text" x="228.0" y="236.0" width="86.4" height="51.0"/><rect data-figure-safe-zone="text" x="573.0" y="224.0" width="209.6" height="52.4"/><rect data-figure-safe-zone="text" x="573.0" y="254.0" width="273.6" height="45.6"/><rect data-figure-safe-zone="text" x="918.0" y="236.0" width="86.4" height="51.0"/><rect data-figure-safe-zone="text" x="63.0" y="355.0" width="873.2" height="55.0"/><rect data-figure-safe-zone="text" x="208.0" y="432.0" width="83.3" height="49.7"/><rect data-figure-safe-zone="text" x="353.0" y="433.0" width="145.7" height="48.3"/><rect data-figure-safe-zone="text" x="498.0" y="432.0" width="83.3" height="49.7"/><rect data-figure-safe-zone="text" x="643.0" y="433.0" width="145.7" height="48.3"/><rect data-figure-safe-zone="text" x="788.0" y="432.0" width="83.3" height="49.7"/><rect data-figure-safe-zone="text" x="120.0" y="550.0" width="960.0" height="48.3"/></g></svg>
