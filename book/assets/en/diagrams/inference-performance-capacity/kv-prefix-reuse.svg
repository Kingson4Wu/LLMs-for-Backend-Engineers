<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Boundaries of KV cache and prefix reuse</title><desc id="desc">Within one request, processed token key-value state is reused. Across requests, only actually matching prefixes and relevant state can safely share a prefix cache and skip repeated prefill.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">K/V reuse saves repeat computation, not free reads or application memory</text><text x="58" y="105" font-size="18" fill="#5E7F9C">The cache holds model inference state; it consumes memory, and a hit requires relevant state to match safely.</text><rect x="55" y="155" width="520" height="330" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/><rect x="625" y="155" width="520" height="330" rx="25" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/><text x="315" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">K/V cache within one request</text><text x="885" y="204" text-anchor="middle" font-size="23" font-weight="700" fill="#765800">prefix cache across requests</text><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M160 300H260"/><path d="M390 300H470"/><path d="M730 300H830"/><path d="M960 300H1050"/></g><g stroke-width="3"><rect x="90" y="250" width="150" height="120" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="260" y="250" width="130" height="120" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="410" y="250" width="130" height="120" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="660" y="250" width="150" height="100" rx="18" fill="#EAF3FB" stroke="#0F4D92"/><rect x="830" y="250" width="130" height="100" rx="18" fill="#FFF8D6" stroke="#FFD700"/><rect x="980" y="250" width="130" height="120" rx="18" fill="#EAF3FB" stroke="#0F4D92"/></g><g text-anchor="middle"><text x="165" y="282" font-size="19" font-weight="700" fill="#17324D">processed</text><text x="165" y="305" font-size="19" font-weight="700" fill="#17324D">tokens</text><text x="165" y="339" font-size="16" fill="#0F4D92">this turn’s prefix</text><text x="325" y="290" font-size="19" font-weight="700" fill="#765800">K/V state</text><text x="325" y="339" font-size="16" fill="#765800">kept in memory</text><text x="475" y="282" font-size="19" font-weight="700" fill="#17324D">next attention</text><text x="475" y="305" font-size="19" font-weight="700" fill="#17324D">step</text><text x="475" y="331" font-size="16" fill="#0F4D92">reads existing</text><text x="475" y="352" font-size="16" fill="#0F4D92">K/V</text><text x="735" y="290" font-size="19" font-weight="700" fill="#17324D">identical prefix</text><text x="735" y="320" font-size="16" fill="#0F4D92">request A / B</text><text x="895" y="290" font-size="19" font-weight="700" fill="#765800">shared K/V</text><text x="895" y="320" font-size="16" fill="#765800">prefix-cache hit</text><text x="1045" y="290" font-size="19" font-weight="700" fill="#17324D">skip prefill</text><text x="1045" y="315" font-size="16" fill="#0F4D92">compute new</text><text x="1045" y="339" font-size="16" fill="#0F4D92">suffix only</text></g><text x="315" y="415" text-anchor="middle" font-size="17" fill="#5E7F9C">New tokens still read accessible K/V during attention.</text><text x="885" y="405" text-anchor="middle" font-size="17" fill="#765800">Similar text does not guarantee a hit.</text><text x="885" y="430" text-anchor="middle" font-size="17" fill="#765800">Authority boundaries cannot be shared.</text><rect x="220" y="535" width="760" height="58" rx="16" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="572" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">KV cache is inference-compute reuse, not durable application memory or a fact store.</text></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1184.6" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1044.2" height="48.3"/><rect data-figure-safe-zone="text" x="135.6" y="169.0" width="358.9" height="55.0"/><rect data-figure-safe-zone="text" x="705.6" y="169.0" width="358.9" height="55.0"/><rect data-figure-safe-zone="text" x="153.0" y="251.0" width="112.9" height="49.7"/><rect data-figure-safe-zone="text" x="153.0" y="274.0" width="83.3" height="49.7"/><rect data-figure-safe-zone="text" x="153.0" y="311.0" width="173.8" height="45.6"/><rect data-figure-safe-zone="text" x="313.0" y="259.0" width="112.9" height="49.7"/><rect data-figure-safe-zone="text" x="313.0" y="311.0" width="140.5" height="45.6"/><rect data-figure-safe-zone="text" x="463.0" y="251.0" width="162.3" height="49.7"/><rect data-figure-safe-zone="text" x="463.0" y="274.0" width="63.5" height="49.7"/><rect data-figure-safe-zone="text" x="463.0" y="303.0" width="140.5" height="45.6"/><rect data-figure-safe-zone="text" x="463.0" y="324.0" width="49.0" height="45.6"/><rect data-figure-safe-zone="text" x="723.0" y="259.0" width="182.1" height="49.7"/><rect data-figure-safe-zone="text" x="723.0" y="292.0" width="132.2" height="45.6"/><rect data-figure-safe-zone="text" x="883.0" y="259.0" width="122.8" height="49.7"/><rect data-figure-safe-zone="text" x="883.0" y="292.0" width="157.1" height="45.6"/><rect data-figure-safe-zone="text" x="1033.0" y="259.0" width="142.6" height="49.7"/><rect data-figure-safe-zone="text" x="1033.0" y="287.0" width="115.5" height="45.6"/><rect data-figure-safe-zone="text" x="1033.0" y="311.0" width="115.5" height="45.6"/><rect data-figure-safe-zone="text" x="64.3" y="386.0" width="501.4" height="47.0"/><rect data-figure-safe-zone="text" x="705.0" y="376.0" width="359.9" height="47.0"/><rect data-figure-safe-zone="text" x="705.0" y="401.0" width="359.9" height="47.0"/><rect data-figure-safe-zone="text" x="194.9" y="542.0" width="810.2" height="48.3"/></g></svg>
