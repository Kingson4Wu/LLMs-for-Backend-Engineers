<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Drafting and verification in speculative decoding</title>
  <desc id="desc">A draft model proposes several tokens, the target model verifies those positions, accepts the continuous matching prefix, and decides output again from the first mismatch.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial,sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">Speculative decoding: draft in parallel; let the target model decide</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">Benefit depends on draft quality, target verification cost, and accepted-prefix length; it is not unconditional acceleration.</text>
    <text x="75" y="213" font-size="22" font-weight="700" fill="#765800">draft model</text>
    <text x="75" y="246" font-size="17" fill="#765800">proposes a block</text>
    <text x="75" y="393" font-size="22" font-weight="700" fill="#17324D">target model</text>
    <text x="75" y="426" font-size="17" fill="#0F4D92">verifies positions</text>
    <g font-family="Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="700">
      <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
        <rect x="280" y="165" width="110" height="85" rx="18"/>
        <rect x="430" y="165" width="110" height="85" rx="18"/>
        <rect x="580" y="165" width="110" height="85" rx="18"/>
        <rect x="730" y="165" width="110" height="85" rx="18"/>
      </g>
      <text x="335" y="219" fill="#765800">a</text>
      <text x="485" y="219" fill="#765800">b</text>
      <text x="635" y="219" fill="#765800">c</text>
      <text x="785" y="219" fill="#765800">d</text>
      <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3">
        <rect x="280" y="345" width="110" height="85" rx="18"/>
        <rect x="430" y="345" width="110" height="85" rx="18"/>
        <rect x="580" y="345" width="110" height="85" rx="18"/>
      </g>
      <rect x="730" y="345" width="110" height="85" rx="18" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/>
      <text x="335" y="399" fill="#17324D">&#x2713; a</text>
      <text x="485" y="399" fill="#17324D">&#x2713; b</text>
      <text x="635" y="399" fill="#17324D">&#x2713; c</text>
      <text x="785" y="399" fill="#B64342">&#xD7; d</text>
    </g>
    <g stroke="#0F4D92" stroke-width="3" stroke-dasharray="7 7">
      <path d="M335 250V335"/>
      <path d="M485 250V335"/>
      <path d="M635 250V335"/>
      <path d="M785 250V335"/>
    </g>
    <path d="M850 387H925" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
    <rect x="945" y="330" width="185" height="115" rx="20" fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"/>
    <text x="1037" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">accept prefix</text>
    <text x="1037" y="401" text-anchor="middle" font-size="17" fill="#0F4D92">a &#xB7; b &#xB7; c</text>
    <text x="1037" y="425" text-anchor="middle" font-size="15" fill="#0F4D92">continue at d</text>
    <rect x="215" y="510" width="770" height="82" rx="16" fill="#FFFFFF" stroke="#FFD700" stroke-width="3"/>
    <text x="600" y="545" text-anchor="middle" font-size="17" fill="#765800">One target pass can verify several positions.</text>
    <text x="600" y="570" text-anchor="middle" font-size="17" fill="#765800">Low acceptance can erase or exceed saved sequential steps.</text>
  </g>
