<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Optimizer progression from global scaling to adaptive updates and controlled startup</title><desc id="desc">SGD uses global steps; momentum smooths direction; Adam adapts per parameter; AdamW decouples weight decay; warmup limits unstable startup updates.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1200" height="640" rx="36" fill="#FFFFFF"/><text x="55" y="68" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#17324D">Optimizer progression addresses distinct update-control problems</text><g font-family="Arial, sans-serif"><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="70" y="115" width="1060" height="76" rx="21"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="70" y="215" width="1060" height="76" rx="21"/><rect x="70" y="515" width="1060" height="76" rx="21"/></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="70" y="315" width="1060" height="76" rx="21"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="70" y="415" width="1060" height="76" rx="21"/></g><g font-size="21"><text x="105" y="160" font-weight="700" fill="#0F4D92">SGD</text><text x="270" y="160" fill="#5E7F9C">global step → steep directions can oscillate</text><text x="105" y="260" font-weight="700" fill="#765800">Momentum</text><text x="300" y="260" fill="#765800">smooth consistent direction → still global scale</text><text x="105" y="360" font-weight="700" fill="#0F4D92">Adam</text><text x="270" y="360" fill="#5E7F9C">per-parameter adaptation → decay coupled to scaling</text><text x="105" y="460" font-weight="700" fill="#B64342">AdamW</text><text x="290" y="460" fill="#B64342">decoupled weight decay → startup can remain unstable</text><text x="105" y="560" font-weight="700" fill="#765800">Warmup</text><text x="290" y="560" fill="#765800">gradual startup → limits aggressive early updates</text></g></g><g fill="none" stroke="#0F4D92" stroke-width="3" marker-end="url(#a)"><path d="M600 191V205M600 291V305M600 391V405M600 491V505"/></g><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="25.0" width="1055.7" height="65.8"/><rect data-figure-safe-zone="text" x="93.0" y="131.0" width="50.5" height="47.0"/><rect data-figure-safe-zone="text" x="258.0" y="131.0" width="413.0" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="231.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="288.0" y="231.0" width="448.3" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="331.0" width="59.4" height="47.0"/><rect data-figure-safe-zone="text" x="258.0" y="331.0" width="474.8" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="431.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="278.0" y="431.0" width="483.7" height="47.0"/><rect data-figure-safe-zone="text" x="93.0" y="531.0" width="77.0" height="47.0"/><rect data-figure-safe-zone="text" x="278.0" y="531.0" width="457.2" height="47.0"/></g></svg>
