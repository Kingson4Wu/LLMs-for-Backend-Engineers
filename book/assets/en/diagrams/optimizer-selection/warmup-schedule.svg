<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">A warmup schedule raises learning rate gradually before the main schedule</title><desc id="desc">During warmup the learning rate rises from a low value to the planned level, then follows the main schedule. Warmup limits early updates under unstable gradient statistics.</desc><rect width="1080" height="600" rx="36" fill="#FFFFFF"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D">Warmup gradually enables the planned learning rate</text><path d="M150 470V145M150 470H955" stroke="#0F4D92" stroke-width="4"/><path d="M154 466V149M154 466H951" stroke="#8EB6D8" stroke-width="2"/><path d="M150 445L435 220L885 280" fill="none" stroke="#B64342" stroke-width="7" stroke-linejoin="round"/><path d="M154 449L439 224L889 284" fill="none" stroke="#E9A6A1" stroke-width="2"/><path d="M150 470L435 220V470Z" fill="#FFF8D6" opacity=".85"/><path d="M435 470V220L885 280V470Z" fill="#EAF3FB" opacity=".65"/><path d="M435 200V475" stroke="#FFD700" stroke-width="3" stroke-dasharray="10 8"/><g font-family="Arial, sans-serif"><text x="74" y="160" font-size="21" fill="#0F4D92">learning rate</text><text x="875" y="505" font-size="21" fill="#0F4D92">training steps</text><text x="250" y="390" font-size="22" font-weight="700" fill="#765800">warmup</text><text x="505" y="205" font-size="21" font-weight="700" fill="#B64342">planned rate</text><text x="480" y="505" font-size="18" fill="#765800">main training schedule</text></g><path d="M110 535H970" stroke="#FFD700" stroke-width="3"/><text x="540" y="575" font-family="Arial, sans-serif" font-size="18" fill="#765800" text-anchor="middle">Limit early update magnitude while gradient statistics are still unstable.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="48.0" y="26.0" width="856.0" height="67.2"/><rect data-figure-safe-zone="text" x="62.0" y="127.0" width="166.0" height="52.4"/><rect data-figure-safe-zone="text" x="863.0" y="472.0" width="176.9" height="52.4"/><rect data-figure-safe-zone="text" x="238.0" y="356.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="493.0" y="172.0" width="155.0" height="52.4"/><rect data-figure-safe-zone="text" x="468.0" y="475.0" width="229.9" height="48.3"/><rect data-figure-safe-zone="text" x="181.7" y="545.0" width="716.6" height="48.3"/></g></svg>
