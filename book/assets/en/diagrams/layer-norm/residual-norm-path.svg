    <path d="M232 269H616"/>
    <path d="M722 269H798"/>
    <path d="M998 269H1060"/>
  </g>
  <path d="M236 273H612" fill="none" stroke="#8EB6D8" stroke-width="2" opacity=".8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="152" y="278" font-size="23" font-weight="700" fill="#0F4D92">input x</text>
    <text x="445" y="202" font-size="23" font-weight="700" fill="#765800">Attention</text>
    <text x="445" y="226" font-size="16" fill="#765800">transform information</text>
    <text x="674" y="281" font-size="39" font-weight="700" fill="#B64342">+</text>
    <text x="903" y="278" font-size="22" font-weight="700" fill="#0F4D92">LayerNorm</text>
    <text x="1080" y="278" font-size="17" fill="#5E7F9C">next layer</text>
  </g>
  <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3">
    <rect x="355" y="365" width="410" height="66" rx="21"/>
  </g>
  <path d="M359 369H761" fill="none" stroke="#D8A919" stroke-width="2"/>
  <text x="560" y="395" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#765800" text-anchor="middle">Residual shortcut carries x directly to addition</text>
  <text x="560" y="418" font-family="Arial, sans-serif" font-size="16" fill="#765800" text-anchor="middle">The attention branch contributes f(x).</text>
