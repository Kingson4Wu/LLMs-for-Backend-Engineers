<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Attention, residual addition, and LayerNorm have distinct roles</title>
  <desc id="desc">Input x splits into an attention transformation and a residual shortcut. The branches are added, then LayerNorm controls representation scale before the next layer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="36" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="67" font-size="32" font-weight="700" fill="#17324D">Attention, residual addition, and LayerNorm have distinct roles</text>
    <text x="60" y="102" font-size="19" fill="#5E7F9C">Transform information, preserve a direct path, then control scale before the next layer.</text>
  </g>
  <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3">
