<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">LayerNorm counters accumulated scale drift across depth</title><desc id="desc">Repeated transformations can progressively increase or decrease representation scale. LayerNorm recenters and rescales each token's feature vector before later computation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs><rect width="1120" height="530" rx="36" fill="#FFFFFF"/><g font-family="Arial, sans-serif"><text x="66" y="70" font-size="32" font-weight="700" fill="#17324D">Deep transformations can accumulate representation-scale drift</text><text x="66" y="105" font-size="19" fill="#5E7F9C">Small expansion or contraction at each layer changes the conditions faced by later computation.</text></g><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="80" y="205" width="150" height="88" rx="22"/><rect x="335" y="205" width="150" height="88" rx="22"/></g><g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="590" y="195" width="165" height="108" rx="22"/></g><g fill="#F6CFCB" stroke="#B64342" stroke-width="3"><rect x="860" y="180" width="175" height="138" rx="22"/></g><g fill="none" stroke="#8EB6D8" stroke-width="2"><rect x="84" y="209" width="142" height="80" rx="19"/><rect x="339" y="209" width="142" height="80" rx="19"/></g><g fill="none" stroke="#D8A919" stroke-width="2"><rect x="594" y="199" width="157" height="100" rx="19"/></g><g fill="none" stroke="#E9A6A1" stroke-width="2"><rect x="864" y="184" width="167" height="130" rx="19"/></g><g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M230 249H325"/><path d="M485 249H580"/><path d="M755 249H850"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><g font-size="22" font-weight="700" fill="#0F4D92"><text x="155" y="258">input x</text><text x="410" y="251">layer</text><text x="410" y="276">transform</text></g><g fill="#765800"><text x="672" y="236" font-size="18" font-weight="700">scale begins</text><text x="672" y="260" font-size="18" font-weight="700">to drift</text><text x="672" y="285" font-size="16">expand or contract</text></g><g fill="#B64342"><text x="947" y="230" font-size="18" font-weight="700">accumulates</text><text x="947" y="254" font-size="18" font-weight="700">with depth</text><text x="947" y="282" font-size="16">too large / too small</text></g></g><path d="M115 378H1005" stroke="#FFD700" stroke-width="3"/><path d="M119 381H1001" stroke="#D8A919" stroke-width="2"/><g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="270" y="410" width="580" height="72" rx="23"/></g><path d="M274 414H846" fill="none" stroke="#8EB6D8" stroke-width="2"/><text x="560" y="440" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F4D92" text-anchor="middle">LayerNorm: recenter and rescale each token vector</text><text x="560" y="468" font-family="Arial, sans-serif" font-size="17" fill="#5E7F9C" text-anchor="middle">Then pass a controlled scale to the next layer.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="54.0" y="26.0" width="1055.7" height="67.2"/><rect data-figure-safe-zone="text" x="54.0" y="74.0" width="962.6" height="49.7"/><rect data-figure-safe-zone="text" x="143.0" y="229.0" width="85.9" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="222.0" width="68.2" height="47.0"/><rect data-figure-safe-zone="text" x="398.0" y="247.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="660.0" y="206.0" width="136.3" height="48.3"/><rect data-figure-safe-zone="text" x="660.0" y="230.0" width="98.9" height="48.3"/><rect data-figure-safe-zone="text" x="660.0" y="257.0" width="173.8" height="45.6"/><rect data-figure-safe-zone="text" x="935.0" y="200.0" width="127.0" height="48.3"/><rect data-figure-safe-zone="text" x="935.0" y="224.0" width="117.6" height="48.3"/><rect data-figure-safe-zone="text" x="935.0" y="254.0" width="198.7" height="45.6"/><rect data-figure-safe-zone="text" x="255.0" y="405.0" width="610.0" height="55.0"/><rect data-figure-safe-zone="text" x="340.3" y="439.0" width="439.5" height="47.0"/></g></svg>
