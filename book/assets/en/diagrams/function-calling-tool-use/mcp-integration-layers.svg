<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Where MCP sits between product, calling capability, and model</title>
  <desc id="desc">In a four-layer stack from product to base model, MCP is a tool-and-context integration protocol; the application and executor still own authority and business responsibility.</desc>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">MCP is an integration protocol, not a permission system</text>
    <text x="58" y="105" font-size="18" fill="#5E7F9C">It makes capabilities easier to discover and connect; it does not decide whether their effects are acceptable.</text>
    <g stroke-width="3"><rect x="75" y="165" width="620" height="82" rx="20" fill="#EAF3FB" stroke="#0F4D92"/><rect x="75" y="262" width="620" height="82" rx="20" fill="#FFF8D6" stroke="#FFD700"/><rect x="75" y="359" width="620" height="82" rx="20" fill="#F6CFCB" stroke="#B64342"/><rect x="75" y="456" width="620" height="82" rx="20" fill="#E9EEEA" stroke="#71827B"/></g>
    <g text-anchor="middle">
      <text x="138" y="216" font-size="30" font-weight="700" fill="#17324D">1</text><text x="365" y="204" font-size="22" font-weight="700" fill="#17324D">application product</text><text x="365" y="230" font-size="16" fill="#0F4D92">user experience, business flow, presentation, execution boundary</text>
      <text x="138" y="313" font-size="30" font-weight="700" fill="#765800">2</text><text x="365" y="301" font-size="22" font-weight="700" fill="#765800">MCP integration protocol</text><text x="365" y="327" font-size="16" fill="#765800">describes, discovers, and exchanges prompts, resources, and tools</text>
      <text x="138" y="410" font-size="30" font-weight="700" fill="#B64342">3</text><text x="365" y="398" font-size="22" font-weight="700" fill="#B64342">function calling</text><text x="365" y="424" font-size="16" fill="#B64342">the model proposes a schema-conformant structured call</text>
      <text x="138" y="507" font-size="30" font-weight="700" fill="#40534C">4</text><text x="365" y="495" font-size="22" font-weight="700" fill="#40534C">base language model</text><text x="365" y="521" font-size="16" fill="#60716A">predicts later tokens from the current context</text>
    </g>
    <path d="M735 175V528M735 175h28M735 528h28" fill="none" stroke="#FFD700" stroke-width="4"/>
    <text x="805" y="212" font-size="20" font-weight="700" fill="#765800">MCP does not automatically provide</text>
    <g font-size="18" fill="#7D5621"><text x="805" y="260">• identity and authorization</text><text x="805" y="299">• argument and state validation</text><text x="805" y="338">• idempotency, audit, and limits</text><text x="805" y="377">• domain meaning and side effects</text><text x="805" y="416">• verification of external results</text></g>
    <rect x="790" y="448" width="330" height="98" rx="18" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/>
    <text x="955" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">Execution stays with</text><text x="955" y="502" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">app and tool owners</text><text x="955" y="527" text-anchor="middle" font-size="15" fill="#B64342">Interoperability does not transfer responsibility.</text>
    <text x="600" y="593" text-anchor="middle" font-size="18" fill="#5E7F9C">A structured proposal is neither authorization nor proof that an action succeeded.</text>
  </g>
