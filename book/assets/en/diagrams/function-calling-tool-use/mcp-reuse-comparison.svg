<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How MCP reduces repeated integration</title><desc id="desc">On the left, three projects each adapt a file capability without a shared contract. On the right, compatible clients reuse one MCP server, but every deployment remains independently reviewed.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker></defs>
  <rect width="1200" height="650" rx="30" fill="#FFFFFF"/><g font-family="Arial, sans-serif">
    <text x="58" y="68" font-size="31" font-weight="700" fill="#17324D">A shared protocol reduces repeat integration, not per-use review</text><text x="58" y="105" font-size="18" fill="#5E7F9C">MCP exchanges capability definitions between compatible clients and servers; it does not automatically trust code or grant data access.</text>
    <rect x="54" y="148" width="510" height="354" rx="25" fill="#FFFFFF" stroke="#B64342" stroke-width="3"/><rect x="636" y="148" width="510" height="354" rx="25" fill="#F4FBF5" stroke="#0F4D92" stroke-width="3"/>
    <text x="309" y="193" text-anchor="middle" font-size="23" font-weight="700" fill="#B64342">without a shared contract</text><text x="891" y="193" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">with an MCP-compatible contract</text>
    <g stroke="#B64342" stroke-width="3" fill="#F6CFCB"><rect x="95" y="225" width="190" height="65" rx="15"/><rect x="95" y="316" width="190" height="65" rx="15"/><rect x="95" y="407" width="190" height="65" rx="15"/></g>
    <g text-anchor="middle"><text x="190" y="258" font-size="19" font-weight="700" fill="#B64342">project A</text><text x="190" y="280" font-size="15" fill="#B64342">writes file integration</text><text x="190" y="349" font-size="19" font-weight="700" fill="#B64342">project B</text><text x="190" y="371" font-size="15" fill="#B64342">writes another one</text><text x="190" y="440" font-size="19" font-weight="700" fill="#B64342">project C</text><text x="190" y="462" font-size="15" fill="#B64342">repeats adaptation</text></g>
    <g fill="none" stroke="#B64342" stroke-width="3" marker-end="url(#a)"><path d="M285 257H425"/><path d="M285 348H425"/><path d="M285 439H425"/></g>
    <g fill="#FFF8D6" stroke="#FFD700" stroke-width="3"><rect x="425" y="225" width="100" height="65" rx="15"/><rect x="425" y="316" width="100" height="65" rx="15"/><rect x="425" y="407" width="100" height="65" rx="15"/></g><g text-anchor="middle" font-size="16" font-weight="700" fill="#765800"><text x="475" y="263">repeat work</text><text x="475" y="354">repeat work</text><text x="475" y="445">repeat work</text></g>
    <rect x="805" y="232" width="175" height="85" rx="18" fill="#FFF8D6" stroke="#FFD700" stroke-width="3"/><text x="892" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#765800">filesystem</text><text x="892" y="294" text-anchor="middle" font-size="17" fill="#765800">MCP server</text>
    <g fill="#EAF3FB" stroke="#0F4D92" stroke-width="3"><rect x="676" y="373" width="120" height="65" rx="15"/><rect x="832" y="373" width="120" height="65" rx="15"/><rect x="988" y="373" width="120" height="65" rx="15"/></g><g text-anchor="middle" font-size="18" font-weight="700" fill="#17324D"><text x="736" y="413">project A</text><text x="892" y="413">project B</text><text x="1048" y="413">project C</text></g>
    <g fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)"><path d="M850 317L756 363"/><path d="M892 317V363"/><path d="M935 317L1028 363"/></g>
    <text x="891" y="468" text-anchor="middle" font-size="15" fill="#5E7F9C">One described capability can be discovered</text><text x="891" y="489" text-anchor="middle" font-size="15" fill="#5E7F9C">and reused by compatible clients.</text>
    <rect x="195" y="544" width="810" height="55" rx="16" fill="#F6CFCB" stroke="#B64342" stroke-width="3"/><text x="600" y="578" text-anchor="middle" font-size="18" font-weight="700" fill="#B64342">Each project still reviews code provenance, identity, accessible data, and side effects.</text>
  </g>
<g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="46.0" y="25.0" width="1055.7" height="65.8"/><rect data-figure-safe-zone="text" x="46.0" y="75.0" width="1287.6" height="48.3"/><rect data-figure-safe-zone="text" x="147.5" y="158.0" width="323.0" height="55.0"/><rect data-figure-safe-zone="text" x="693.6" y="158.0" width="394.8" height="55.0"/><rect data-figure-safe-zone="text" x="178.0" y="227.0" width="112.9" height="49.7"/><rect data-figure-safe-zone="text" x="178.0" y="253.0" width="203.4" height="44.2"/><rect data-figure-safe-zone="text" x="178.0" y="318.0" width="112.9" height="49.7"/><rect data-figure-safe-zone="text" x="178.0" y="344.0" width="164.4" height="44.2"/><rect data-figure-safe-zone="text" x="178.0" y="409.0" width="112.9" height="49.7"/><rect data-figure-safe-zone="text" x="178.0" y="435.0" width="164.4" height="44.2"/><rect data-figure-safe-zone="text" x="463.0" y="234.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="463.0" y="325.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="463.0" y="416.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="828.0" y="236.0" width="128.0" height="51.0"/><rect data-figure-safe-zone="text" x="835.8" y="265.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="724.0" y="384.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="880.0" y="384.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="1036.0" y="384.0" width="103.6" height="47.0"/><rect data-figure-safe-zone="text" x="715.2" y="441.0" width="351.6" height="44.2"/><rect data-figure-safe-zone="text" x="750.3" y="462.0" width="281.4" height="44.2"/><rect data-figure-safe-zone="text" x="176.2" y="548.0" width="847.7" height="48.3"/></g></svg>
