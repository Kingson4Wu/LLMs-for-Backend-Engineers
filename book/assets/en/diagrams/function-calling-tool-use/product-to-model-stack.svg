    <rect data-figure-safe-zone="text" x="433.0" y="381.0" width="342.2" height="47.0"/>
    <rect data-figure-safe-zone="text" x="608.0" y="244.0" width="58.3" height="53.7"/>
    <rect data-figure-safe-zone="text" x="608.0" y="274.0" width="245.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="608.0" y="299.0" width="209.6" height="47.0"/>
    <rect data-figure-safe-zone="text" x="783.0" y="144.0" width="241.4" height="53.7"/>
