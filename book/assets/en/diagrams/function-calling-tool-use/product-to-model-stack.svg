    <rect data-figure-safe-zone="text" x="46.0" y="537.0" width="501.4" height="47.0"/>
    <rect data-figure-safe-zone="text" x="782.8" y="368.0" width="294.4" height="51.0"/>
    <rect data-figure-safe-zone="text" x="697.5" y="404.0" width="465.0" height="45.6"/>
    <rect data-figure-safe-zone="text" x="668.4" y="429.0" width="523.2" height="45.6"/>
