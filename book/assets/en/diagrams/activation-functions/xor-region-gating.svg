    <rect data-figure-safe-zone="text" x="636.0" y="446.0" width="46.9" height="53.7"/>
    <rect data-figure-safe-zone="text" x="100.0" y="160.0" width="46.9" height="53.7"/>
    <rect data-figure-safe-zone="text" x="473.0" y="374.0" width="229.9" height="53.7"/>
    <rect data-figure-safe-zone="text" x="208.0" y="222.0" width="229.9" height="53.7"/>
    <rect data-figure-safe-zone="text" x="468.0" y="185.0" width="85.9" height="47.0"/>
    <rect data-figure-safe-zone="text" x="789.0" y="182.0" width="161.3" height="53.7"/>
    <rect data-figure-safe-zone="text" x="789.0" y="221.0" width="85.9" height="47.0"/>
    <rect data-figure-safe-zone="text" x="789.0" y="250.0" width="209.6" height="47.0"/>
    <rect data-figure-safe-zone="text" x="789.0" y="347.0" width="138.4" height="53.7"/>
    <rect data-figure-safe-zone="text" x="789.0" y="386.0" width="85.9" height="47.0"/>
    <rect data-figure-safe-zone="text" x="789.0" y="415.0" width="209.6" height="47.0"/>
    <rect data-figure-safe-zone="text" x="53.0" y="553.0" width="1102.5" height="47.0"/>
  </g>
</svg>
