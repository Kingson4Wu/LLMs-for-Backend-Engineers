<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">One line cannot separate XOR classes</title>
  <desc id="desc">For any candidate linear boundary in XOR, each side contains samples with both output zero and output one, so complete classification is impossible.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
    <style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style>
  </defs>
  <rect width="1100" height="620" fill="#FFFFFF"/>
  <text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">One linear boundary cannot separate XOR</text>
  <text x="65" y="103" class="b" fill="#416985">For this candidate line, both sides contain samples with output 0 and output 1.</text>
  <rect x="65" y="145" width="650" height="395" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/>
  <path d="M170 465V200M170 465H625" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
  <text x="650" y="480" class="h" fill="#17324D">x&#x2081;</text>
  <text x="112" y="194" class="h" fill="#17324D">x&#x2082;</text>
  <path d="M270 450L506 202" stroke="#FFD700" stroke-width="7"/>
  <text x="504" y="194" class="b" fill="#765800">candidate line</text>
  <circle cx="205" cy="414" r="25" fill="#FFFFFF" stroke="#B64342" stroke-width="6"/>
  <circle cx="570" cy="246" r="25" fill="#FFFFFF" stroke="#B64342" stroke-width="6"/>
  <circle cx="205" cy="246" r="25" fill="#0F4D92"/>
  <circle cx="570" cy="414" r="25" fill="#0F4D92"/>
  <text x="205" y="422" text-anchor="middle" class="b" fill="#8F3635">0</text>
  <text x="570" y="254" text-anchor="middle" class="b" fill="#8F3635">0</text>
  <text x="205" y="254" text-anchor="middle" class="b" fill="#FFFFFF">1</text>
  <text x="570" y="422" text-anchor="middle" class="b" fill="#FFFFFF">1</text>
  <rect x="770" y="170" width="270" height="135" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/>
  <text x="801" y="216" class="h" fill="#765800">One side of the line</text>
  <text x="801" y="250" class="b" fill="#765800">contains both 0 and 1</text>
  <text x="801" y="279" class="b" fill="#765800">so it cannot get one class</text>
  <rect x="770" y="335" width="270" height="135" rx="20" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/>
  <text x="801" y="381" class="h" fill="#8F3635">The other side</text>
  <text x="801" y="415" class="b" fill="#8F3635">also contains 0 and 1</text>
  <text x="801" y="444" class="b" fill="#8F3635">so it also cannot get one class</text>
  <text x="65" y="582" font-size="17" fill="#8F3635">This shows only that one linear boundary is insufficient; hidden layers and nonlinearities can combine regions to express XOR.</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
