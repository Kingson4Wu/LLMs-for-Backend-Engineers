    <rect data-figure-safe-zone="text" x="185.0" y="393.0" width="40.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="550.0" y="225.0" width="40.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="185.0" y="225.0" width="40.0" height="47.0"/>
    <rect data-figure-safe-zone="text" x="550.0" y="393.0" width="40.0" height="47.0"/>
