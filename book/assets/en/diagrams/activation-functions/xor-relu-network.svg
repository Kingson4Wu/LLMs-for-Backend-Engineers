<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">A two-layer ReLU network represents XOR</title><desc id="desc">Two ReLU units compute the positive parts of x1 minus x2 and x2 minus x1. Their sum is the absolute difference, equal to XOR for binary input.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="620" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">Two ReLU condition paths can compose XOR</text><text x="65" y="103" class="b" fill="#416985">For binary input, the units separately capture x₁ greater than x₂ and x₂ greater than x₁.</text><rect x="65" y="220" width="180" height="125" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="97" y="267" class="h" fill="#17324D">Input</text><text x="97" y="304" class="b" fill="#416985">x₁, x₂ ∈ {0, 1}</text><path d="M245 260C300 240 320 194 375 188M245 305C300 325 320 410 375 420" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="390" y="135" width="310" height="110" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="422" y="178" class="h" fill="#765800">Hidden unit h₁</text><text x="422" y="215" class="b" fill="#765800">ReLU(x₁ − x₂)</text><rect x="390" y="365" width="310" height="110" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="422" y="408" class="h" fill="#17324D">Hidden unit h₂</text><text x="422" y="445" class="b" fill="#416985">ReLU(x₂ − x₁)</text><path d="M700 190C755 198 777 260 830 278M700 420C755 412 777 350 830 322" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="845" y="220" width="190" height="125" rx="20" fill="#F6CFCB" stroke="#E9A6A1" stroke-width="2"/><text x="877" y="267" class="h" fill="#8F3635">Output</text><text x="877" y="304" class="b" fill="#8F3635">y = h₁ + h₂</text><text x="877" y="328" class="b" fill="#8F3635">= |x₁ − x₂|</text><rect x="65" y="520" width="970" height="70" rx="13" fill="#F6CFCB"/><text x="92" y="548" font-size="17" fill="#8F3635">This is an explicit illustrative construction: nonlinearity partitions the plane into composable regions.</text><text x="92" y="573" font-size="17" fill="#8F3635">Training need not find these exact weights.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="689.6" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="810.8" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="233.0" width="81.2" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="275.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="410.0" y="144.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="410.0" y="186.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="410.0" y="374.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="410.0" y="416.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="233.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="865.0" y="275.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="865.0" y="299.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="519.0" width="952.2" height="47.0"/><rect data-figure-safe-zone="text" x="80.0" y="544.0" width="404.1" height="47.0"/></g></svg>
