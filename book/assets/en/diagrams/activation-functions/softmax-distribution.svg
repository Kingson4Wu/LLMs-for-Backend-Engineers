<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Softmax turns logits into a competitive probability distribution</title><desc id="desc">Softmax normalizes logits two, one, and zero point one into probabilities zero point six five nine, zero point two four two, and zero point zero nine nine. All are nonnegative and sum to one; raising one changes the others' relative probability.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F4D92"/></marker><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style></defs><rect width="1100" height="620" fill="#FFFFFF"/><text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">Softmax: scores become competing probabilities</text><text x="65" y="103" class="b" fill="#416985">It does not process each candidate independently; raising one score lowers the others' relative probability.</text><rect x="65" y="165" width="275" height="300" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><text x="97" y="216" class="h" fill="#17324D">Input logits z</text><text x="97" y="267" class="b" fill="#416985">z₁ = 2.0</text><text x="97" y="311" class="b" fill="#416985">z₂ = 1.0</text><text x="97" y="355" class="b" fill="#416985">z₃ = 0.1</text><text x="97" y="420" class="b" fill="#5E7F9C">can be any real value</text><path d="M340 315h115" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="470" y="245" width="180" height="140" rx="22" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="560" y="299" text-anchor="middle" class="h" fill="#765800">Softmax</text><text x="560" y="327" text-anchor="middle" class="b" fill="#765800">exponentiate</text><text x="560" y="355" text-anchor="middle" class="b" fill="#765800">+ normalize</text><path d="M650 315h115" fill="none" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/><rect x="780" y="165" width="255" height="300" rx="22" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="812" y="205" class="h" fill="#17324D">Output</text><text x="812" y="232" class="h" fill="#17324D">probabilities p</text><g><rect x="812" y="246" width="148" height="31" rx="8" fill="#0F4D92"/><rect x="812" y="298" width="55" height="31" rx="8" fill="#6E9A8A"/><rect x="812" y="350" width="23" height="31" rx="8" fill="#A8C8BB"/><text x="950" y="285" class="b" fill="#17324D">p₁ = 0.659</text><text x="884" y="321" class="b" fill="#17324D">p₂ = 0.242</text><text x="850" y="373" class="b" fill="#17324D">p₃ = 0.099</text></g><text x="812" y="423" class="b" fill="#0F4D92">pᵢ ≥ 0, Σpᵢ = 1</text><rect x="65" y="520" width="970" height="45" rx="13" fill="#F6CFCB"/><text x="93" y="549" font-size="17" fill="#8F3635">The largest logit gets the largest probability, not exclusive selection; sharpness depends on score gaps and scale.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="53.0" y="24.0" width="789.4" height="67.2"/><rect data-figure-safe-zone="text" x="53.0" y="74.0" width="978.7" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="182.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="85.0" y="238.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="282.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="326.0" width="94.7" height="47.0"/><rect data-figure-safe-zone="text" x="85.0" y="391.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="508.0" y="265.0" width="104.1" height="53.7"/><rect data-figure-safe-zone="text" x="495.0" y="298.0" width="130.1" height="47.0"/><rect data-figure-safe-zone="text" x="499.4" y="326.0" width="121.2" height="47.0"/><rect data-figure-safe-zone="text" x="800.0" y="171.0" width="92.6" height="53.7"/><rect data-figure-safe-zone="text" x="800.0" y="198.0" width="195.6" height="53.7"/><rect data-figure-safe-zone="text" x="938.0" y="256.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="872.0" y="292.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="838.0" y="344.0" width="112.4" height="47.0"/><rect data-figure-safe-zone="text" x="800.0" y="394.0" width="156.6" height="47.0"/><rect data-figure-safe-zone="text" x="81.0" y="520.0" width="1040.6" height="47.0"/></g></svg>
