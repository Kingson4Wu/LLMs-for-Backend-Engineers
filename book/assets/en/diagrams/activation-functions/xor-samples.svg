<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">XOR samples alternate across diagonals in two dimensions</title>
  <desc id="desc">XOR outputs one at the two corners with different inputs and zero at corners with equal inputs, interleaving classes diagonally.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0F4D92"/>
    </marker>
    <style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style>
  </defs>
  <rect width="1100" height="620" fill="#FFFFFF"/>
  <text x="65" y="68" font-size="32" font-weight="700" fill="#17324D">XOR: the two classes alternate across diagonals</text>
  <text x="65" y="103" class="b" fill="#416985">Different inputs produce 1; equal inputs produce 0. This interleaving motivates a nonlinear boundary.</text>
  <rect x="65" y="145" width="650" height="395" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/>
  <path d="M170 465V200M170 465H625" stroke="#0F4D92" stroke-width="4" marker-end="url(#a)" data-figure-connector="true"/>
  <text x="650" y="480" class="h" fill="#17324D">x&#x2081;</text>
  <text x="112" y="194" class="h" fill="#17324D">x&#x2082;</text>
  <text x="133" y="497" class="b" fill="#416985">0</text>
  <text x="567" y="497" class="b" fill="#416985">1</text>
  <text x="112" y="476" class="b" fill="#416985">0</text>
  <text x="112" y="230" class="b" fill="#416985">1</text>
  <circle cx="205" cy="414" r="25" fill="#FFFFFF" stroke="#B64342" stroke-width="6"/>
  <circle cx="570" cy="246" r="25" fill="#FFFFFF" stroke="#B64342" stroke-width="6"/>
  <circle cx="205" cy="246" r="25" fill="#0F4D92"/>
  <circle cx="570" cy="414" r="25" fill="#0F4D92"/>
  <text x="205" y="422" text-anchor="middle" class="b" fill="#8F3635">0</text>
  <text x="570" y="254" text-anchor="middle" class="b" fill="#8F3635">0</text>
  <text x="205" y="254" text-anchor="middle" class="b" fill="#FFFFFF">1</text>
  <text x="570" y="422" text-anchor="middle" class="b" fill="#FFFFFF">1</text>
  <path d="M252 414L523 246M252 246L523 414" stroke="#B8C8C0" stroke-width="3" stroke-dasharray="9 8"/>
  <rect x="770" y="170" width="270" height="135" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/>
  <text x="801" y="216" class="h" fill="#17324D">Output 1</text>
  <text x="801" y="249" class="b" fill="#416985">x&#x2081; &#x2260; x&#x2082;</text>
  <text x="801" y="278" class="b" fill="#416985">on the other diagonal</text>
  <rect x="770" y="335" width="270" height="135" rx="20" fill="#FFF8D6" stroke="#E9A6A1" stroke-width="2"/>
  <text x="801" y="381" class="h" fill="#8F3635">Output 0</text>
  <text x="801" y="414" class="b" fill="#8F3635">x&#x2081; = x&#x2082;</text>
  <text x="801" y="443" class="b" fill="#8F3635">on the main diagonal</text>
  <text x="65" y="582" font-size="17" fill="#8F3635">The spatial arrangement&#x2014;not any individual point&#x2014;prevents a single linear boundary from classifying every sample correctly.</text>
  <g aria-hidden="true" fill="none" opacity="0" pointer-events="none">
