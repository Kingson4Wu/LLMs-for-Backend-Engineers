<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Tanh zero-centered saturation curve</title><desc id="desc">Tanh maps input between negative one and one, passes through the origin, and is symmetric about it.</desc><style>text{font-family:Arial,sans-serif}.h{font-size:22px;font-weight:700}.b{font-size:17px}</style><rect width="1000" height="560" fill="#FFFFFF"/><text x="55" y="62" font-size="31" font-weight="700" fill="#17324D">tanh: zero-centered, with range (−1, 1)</text><rect x="55" y="112" width="610" height="370" rx="22" fill="#F4F8FC" stroke="#8EB6D8" stroke-width="2"/><path d="M125 292H615M365 440V155M125 120H615M125 402H615" stroke="#5E7F9C" stroke-width="3"/><path d="M128 397C225 397 272 390 320 348C350 324 350 303 365 292C380 281 380 260 410 236C458 194 510 120 612 120" fill="none" stroke="#0F4D92" stroke-width="8" stroke-linecap="round"/><text x="592" y="317" class="b" fill="#416985">x</text><text x="338" y="172" class="b" fill="#416985">y</text><text x="337" y="130" class="b" fill="#765800">1</text><text x="330" y="410" class="b" fill="#765800">−1</text><text x="374" y="319" class="b" fill="#765800">0</text><rect x="710" y="112" width="235" height="170" rx="20" fill="#EAF3FB" stroke="#8EB6D8" stroke-width="2"/><text x="738" y="158" class="h" fill="#17324D">Zero-centered</text><text x="738" y="193" class="b" fill="#416985">x = 0 gives y = 0</text><text x="738" y="214" class="b" fill="#416985">positive and negative</text><text x="738" y="238" class="b" fill="#416985">are symmetric</text><rect x="710" y="312" width="235" height="170" rx="20" fill="#FFF8D6" stroke="#D8A919" stroke-width="2"/><text x="738" y="358" class="h" fill="#765800">Saturated ends</text><text x="738" y="393" class="b" fill="#765800">output nears −1 or 1</text><text x="738" y="424" class="b" fill="#765800">derivative diminishes</text><text x="55" y="525" font-size="17" fill="#8F3635">Unlike Sigmoid, tanh is centered at zero; it still has the gradient limitation of saturation at both ends.</text><g aria-hidden="true" fill="none" opacity="0" pointer-events="none"><rect data-figure-safe-zone="text" x="43.0" y="19.0" width="652.7" height="65.8"/><rect data-figure-safe-zone="text" x="580.0" y="288.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="326.0" y="143.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="325.0" y="101.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="318.0" y="381.0" width="41.7" height="47.0"/><rect data-figure-safe-zone="text" x="362.0" y="290.0" width="40.0" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="124.0" width="172.7" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="164.0" width="174.3" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="185.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="209.0" width="138.9" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="324.0" width="184.2" height="53.7"/><rect data-figure-safe-zone="text" x="726.0" y="364.0" width="200.8" height="47.0"/><rect data-figure-safe-zone="text" x="726.0" y="395.0" width="209.6" height="47.0"/><rect data-figure-safe-zone="text" x="43.0" y="496.0" width="961.0" height="47.0"/></g></svg>
