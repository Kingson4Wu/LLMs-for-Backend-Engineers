<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">从训练到服务：LLM 系统的四个层次</title>
  <desc id="desc">数学与机器学习基础、LLM 内部原理、LLM 与外部系统和 LLM 基础设施依次连接，说明离散信息如何经过训练和推理成为可交付服务。</desc>
  <rect width="1200" height="620" rx="28" fill="#f6f4ed"/>
  <text x="72" y="86" fill="#23332f" font-family="Inter, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700">从训练到服务：LLM 系统的四个层次</text>
  <text x="72" y="124" fill="#64736c" font-family="Inter, Noto Sans CJK SC, sans-serif" font-size="18">每一层回答不同的问题；它们共同决定一次请求能够知道什么、产生什么和交付什么。</text>
  <path d="M196 295H336M496 295H636M796 295H936" fill="none" stroke="#9baa9c" stroke-linecap="round" stroke-width="5"/>
  <path d="m322 283 18 12-18 12m156-24 18 12-18 12m156-24 18 12-18 12" fill="none" stroke="#9baa9c" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <g font-family="Inter, Noto Sans CJK SC, sans-serif">
    <g transform="translate(72 204)">
      <rect width="250" height="184" rx="18" fill="#fffdf8" stroke="#cbd2c8" stroke-width="2"/>
      <text x="26" y="48" fill="#bd775b" font-size="15" font-weight="700">第一部分</text>
      <text x="26" y="82" fill="#23332f" font-size="22" font-weight="700">数学与机器学习基础</text>
      <text x="26" y="118" fill="#64736c" font-size="16">表示、概率、损失、梯度</text>
      <text x="26" y="150" fill="#64736c" font-size="14">离散信息怎样进入可学习计算</text>
    </g>
    <g transform="translate(372 204)">
      <rect width="250" height="184" rx="18" fill="#fffdf8" stroke="#cbd2c8" stroke-width="2"/>
      <text x="26" y="48" fill="#bd775b" font-size="15" font-weight="700">第二部分</text>
      <text x="26" y="82" fill="#23332f" font-size="22" font-weight="700">LLM 内部原理</text>
      <text x="26" y="118" fill="#64736c" font-size="16">训练、Transformer、生成</text>
      <text x="26" y="150" fill="#64736c" font-size="14">参数与当前上下文怎样产生输出</text>
    </g>
    <g transform="translate(672 204)">
      <rect width="250" height="184" rx="18" fill="#fffdf8" stroke="#cbd2c8" stroke-width="2"/>
      <text x="26" y="48" fill="#bd775b" font-size="15" font-weight="700">第三部分</text>
      <text x="26" y="82" fill="#23332f" font-size="22" font-weight="700">LLM 与外部系统</text>
      <text x="26" y="118" fill="#64736c" font-size="16">上下文、证据、工具、验证</text>
      <text x="26" y="150" fill="#64736c" font-size="14">模型提议怎样成为外部行动</text>
    </g>
    <g transform="translate(972 204)">
      <rect width="156" height="184" rx="18" fill="#23332f"/>
      <text x="24" y="48" fill="#eac7b4" font-size="15" font-weight="700">第四部分</text>
      <text x="24" y="82" fill="#f6f4ed" font-size="22" font-weight="700">LLM</text>
      <text x="24" y="112" fill="#f6f4ed" font-size="22" font-weight="700">基础设施</text>
      <text x="24" y="146" fill="#d4ddd4" font-size="14">请求、状态、调度、交付</text>
    </g>
  </g>
  <rect x="72" y="466" width="1056" height="86" rx="16" fill="#e7ece4"/>
  <text x="104" y="502" fill="#23332f" font-family="Inter, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700">读一条请求时，持续区分四件事：</text>
  <text x="104" y="532" fill="#52635a" font-family="Inter, Noto Sans CJK SC, sans-serif" font-size="16">参数中学到的规律　·　本轮上下文带来的证据　·　外部程序执行的动作　·　服务系统承担的容量与可靠性约束</text>
</svg>
